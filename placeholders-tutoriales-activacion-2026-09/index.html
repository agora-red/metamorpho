<title>Bocetos de activación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Layout: barra de control (nuestra, de revisión) arriba de un lienzo con dos vistas —
     la página real (placeholder, patrón EmptyState) y el modal del tutorial real (Riel +
     Titulo + mock + pie pegajoso), calcado del kit de Novedades de Flash (ofertas,
     datos-de-clientes) que Isabella ya envió a producción. */
  :root {
    --frost-primary: #0072FB; --frost-primary-hover: #005CD4; --frost-primary-soft: #EEF6FF; --frost-primary-wash: rgba(0,114,251,.08);
    --frost-success: #10B981; --frost-success-soft: #D8FCEF;
    --frost-warning: #F59E0B; --frost-warning-soft: #FFF3D9;
    --frost-ink: #0F172A; --frost-ink-soft: #3A3A3A; --frost-muted: #6B7280; --frost-faint: #9CA3AF;
    --frost-surface: #FFFFFF; --frost-surface-muted: #EFF3F9; --frost-border: #E2E8F0; --frost-border-soft: #EEF1F6;
    --r-sm: 6px; --r-item: 10px; --r-btn: 12px; --r-card: 24px; --r-chip: 999px;
    --sh-md: 0 20px 50px -20px rgba(15,23,42,.30);
    --sans: 'Montserrat', system-ui, -apple-system, sans-serif;
  }
  /* Sólo modo claro: el producto real no tiene tema oscuro y uno acá daría una referencia
     visual falsa de lo que este boceto describe. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--frost-surface-muted); color: var(--frost-ink); font-family: var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }
  img { max-width: 100%; }

  /* ---------- Barra de revisión (no es parte del producto) ---------- */
  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: #0F172A; color: #fff; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 7px 16px; align-items: center; }
  .toolbar .brand { font-weight: 800; font-size: 12px; letter-spacing: .02em; margin-right: 2px; }
  .toolbar .brand small { display: block; font-weight: 500; font-size: 9.5px; color: #94A3B8; letter-spacing: 0; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > label { font-size: 8.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: #94A3B8; }
  .seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: #CBD5E1; font-size: 11px; font-weight: 600; padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--frost-ink); }

  .stage { padding: 26px 14px 50px; min-height: calc(100vh - 46px); display: flex; align-items: flex-start; justify-content: center; }

  /* ---------- Placeholder: calco del componente real EmptyState (kicker+headline+hint+cta,
     sin mockup — así son Offers/GiftCards/DynamicPricing reales) ---------- */
  .ph-page { width: 100%; max-width: 640px; }
  .crumb { display: flex; gap: 7px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .kicker { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--frost-faint); }
  .kicker.blue { color: var(--frost-primary); }
  .empty { background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: var(--r-card); box-shadow: 0 10px 28px -18px rgba(15,23,42,.18); padding: 44px 36px; text-align: center; }
  .empty .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--frost-primary-wash); color: var(--frost-primary); display: grid; place-items: center; margin: 0 auto 18px; }
  .empty .ic svg { width: 24px; height: 24px; }
  .empty .k { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 10px; }
  .empty h1 { font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
  .empty h1 strong { font-weight: 700; }
  .empty p.hint { font-size: 13.5px; line-height: 1.6; color: var(--frost-muted); max-width: 48ch; margin: 0 auto 22px; }
  .empty .extra { font-size: 12px; color: var(--frost-muted); max-width: 46ch; margin: -10px auto 20px; line-height: 1.5; }
  .cta { border: 0; color: #fff; font-weight: 700; font-size: 13.5px; padding: 13px 24px; border-radius: var(--r-btn); background: var(--frost-primary); box-shadow: 0 4px 16px -4px rgba(0,114,251,.4); }
  .cta:hover { background: var(--frost-primary-hover); }
  .flags { margin-top: 14px; display: grid; gap: 6px; }
  .flag { display: inline-flex; align-items: flex-start; gap: 5px; background: var(--frost-warning-soft); color: #92610A; border: 1px dashed var(--frost-warning); border-radius: 8px; font-size: 10.5px; font-weight: 600; padding: 5px 8px; line-height: 1.4; text-align: left; }
  body.hide-flags .flags { display: none !important; }

  /* ---------- Placeholder rico: hero de 2 columnas (versión anterior, preferida) ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 30px; padding: 36px; background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: var(--r-card); box-shadow: 0 10px 28px -18px rgba(15,23,42,.18); }
  .status-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .hero .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--frost-surface-muted); color: var(--frost-muted); }
  .hero .chip.ok { background: var(--frost-success-soft); color: #0A7A54; }
  .lede { font-size: 13.5px; line-height: 1.6; color: var(--frost-muted); margin: 0 0 18px; max-width: 46ch; }
  ul.checks { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 9px; }
  ul.checks li { display: flex; gap: 9px; font-size: 13px; line-height: 1.45; color: var(--frost-muted); }
  ul.checks li svg { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--frost-primary); }
  .costbox { border: 1px solid var(--frost-border); border-radius: 14px; padding: 11px 13px; margin-bottom: 20px; background: var(--frost-surface-muted); display: grid; gap: 7px; max-width: 440px; }
  .costbox .cost-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--frost-muted); }
  .costbox .chip { flex: none; }
  .costbox b { color: var(--frost-ink); font-weight: 700; }
  .hero-visual { display: flex; align-items: center; justify-content: center; min-width: 0; }

  .stack { position: relative; width: 100%; max-width: 340px; }
  .req-card { background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: 20px; padding: 18px 19px 20px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); }
  .req-card .biz { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .req-card .biz b { font-size: 12.5px; }
  .req-card h4 { font-size: 17px; font-weight: 700; margin: 13px 0 4px; letter-spacing: -.01em; }
  .req-card p { margin: 0 0 12px; font-size: 11.5px; color: var(--frost-ink-soft); line-height: 1.5; }
  .stars-row { display: flex; gap: 7px; margin-bottom: 14px; }
  .star-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--frost-surface-muted); border: 1px solid var(--frost-border-soft); display: grid; place-items: center; }
  .star-btn svg { width: 16px; height: 16px; color: var(--frost-warning); fill: var(--frost-warning); }
  .mini-cta { display: inline-block; background: var(--frost-primary); color: #fff; font-weight: 700; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 10px 14px; border-radius: 8px; }
  .rev-card { background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); margin: -20px 0 0 28px; position: relative; }
  .rev-head { display: flex; gap: 9px; align-items: center; margin-bottom: 7px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--frost-primary-wash); color: var(--frost-primary-hover); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .rev-head b { font-size: 12px; display: block; }
  .rev-head small { font-size: 10px; color: var(--frost-faint); }
  .mini-stars { display: inline-flex; gap: 1px; margin-left: 5px; vertical-align: -2px; }
  .mini-stars svg { width: 11px; height: 11px; color: var(--frost-warning); fill: var(--frost-warning); }
  .rev-card p { margin: 0 0 7px; font-size: 11.5px; line-height: 1.5; color: var(--frost-ink); }
  .verified { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--frost-primary-hover); display: inline-flex; gap: 5px; align-items: center; }
  .verified svg { width: 10px; height: 10px; }

  .gcard { border-radius: 20px; padding: 20px; color: #fff; position: relative; overflow: hidden; background: linear-gradient(135deg, #0A5FD9 0%, #0072FB 55%, #4FA0FF 100%); box-shadow: 0 10px 24px -14px rgba(15,23,42,.3); aspect-ratio: 1.62; display: flex; flex-direction: column; justify-content: space-between; max-width: 340px; }
  .gcard::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .gcard::before { content: ''; position: absolute; right: 30px; bottom: -80px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .gcard .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .gcard .top svg { width: 20px; height: 20px; }
  .gcard .mid { position: relative; z-index: 1; }
  .gcard .mid small { display: block; font-size: 10px; opacity: .8; font-weight: 500; margin-bottom: 3px; }
  .gcard .mid b { font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: block; }
  .gcard .amount { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 3px; }
  .gcard .bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; font-size: 9.5px; opacity: .9; font-weight: 600; }
  .mail-snip { background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); margin: -22px 0 0 34px; position: relative; font-size: 11px; color: var(--frost-muted); line-height: 1.5; max-width: 340px; }
  .mail-snip .from { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--frost-faint); margin-bottom: 5px; display: flex; gap: 5px; align-items: center; }
  .mail-snip .from svg { width: 12px; height: 12px; }
  .mail-snip b { color: var(--frost-ink); }
  .mail-snip .code { font-family: ui-monospace, Menlo, monospace; background: var(--frost-primary-wash); color: var(--frost-primary-hover); padding: 2px 6px; border-radius: 5px; font-weight: 700; font-size: 10.5px; }

  .slots { background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: 20px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); padding: 17px; width: 100%; max-width: 360px; }
  .slots .sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .slots .sh b { font-size: 13px; }
  .slots .sub { font-size: 11px; color: var(--frost-ink-soft); margin-bottom: 13px; }
  .slot { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border: 1px solid var(--frost-border); border-radius: 11px; margin-bottom: 7px; background: var(--frost-surface); }
  .slot .t { font-weight: 700; font-size: 13px; }
  .slot .p { text-align: right; font-size: 12px; font-weight: 700; }
  .slot .p s { color: var(--frost-faint); font-weight: 500; font-size: 11px; margin-right: 5px; }
  .slot.disc { border-color: rgba(0,114,251,.35); background: linear-gradient(90deg, var(--frost-primary-wash), var(--frost-surface) 70%); }
  .off { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .03em; padding: 3px 6px; border-radius: 6px; background: var(--frost-primary); color: #fff; margin-left: 7px; vertical-align: 1px; }

  /* ---------- Modal del tutorial: calco 1:1 del kit real ---------- */
  .stagewrap-modal { width: 100%; max-width: 560px; background: var(--frost-surface); border-radius: var(--r-card); box-shadow: var(--sh-md); padding: 30px 32px 26px; position: relative; }
  .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--frost-faint); }
  .step-dot .circle { width: 19px; height: 19px; border-radius: 50%; background: var(--frost-border-soft); color: var(--frost-faint); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .step-dot.done .circle, .step-dot.active .circle { background: var(--frost-primary); color: #fff; }
  .step-dot.active, .step-dot.done { color: var(--frost-ink); }
  .step-sep { width: 20px; height: 1.5px; background: var(--frost-border); }
  .step-sep.done { background: var(--frost-primary); }
  .modal-tag { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--frost-faint); }

  h1.headline { font-size: 26px; font-weight: 700; line-height: 1.22; margin: 0 0 9px; letter-spacing: -.01em; text-wrap: balance; }
  h1.headline em { font-style: italic; font-weight: 600; color: var(--frost-primary); }
  p.dek { font-size: 13.5px; color: var(--frost-muted); line-height: 1.55; margin: 0 0 22px; max-width: 50ch; }

  .mock-kicker { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 12px; text-align: center; }
  .mock { max-width: 360px; margin: 0 auto; background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: var(--r-item); padding: 19px 20px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); }
  .mock .m-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
  .mock .m-sub { font-size: 11.5px; color: var(--frost-muted); margin-bottom: 14px; }
  .mock .m-sep { height: 1px; background: var(--frost-border-soft); margin-bottom: 15px; }
  .mock .m-note { font-size: 10px; font-weight: 700; color: var(--frost-primary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .mock .m-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--frost-primary-soft); border: 1.5px solid var(--frost-primary); border-radius: var(--r-sm); padding: 11px 13px; }
  .mock .m-row-name { font-size: 12.5px; font-weight: 600; }
  .mock .m-row-nums { display: flex; align-items: baseline; gap: 7px; flex-shrink: 0; }
  .mock .m-old { font-size: 11.5px; color: var(--frost-faint); text-decoration: line-through; }
  .mock .m-new { font-size: 16px; font-weight: 700; color: var(--frost-primary); }
  .mock .m-row.plain { background: var(--frost-surface-muted); border: 1px solid var(--frost-border-soft); }
  .mock .m-row.plain .m-row-name { color: var(--frost-ink); }
  .mock .m-total { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--frost-muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--frost-border); }
  .mock-caption { text-align: center; font-size: 12.5px; color: var(--frost-muted); line-height: 1.6; max-width: 44ch; margin: 18px auto 0; }
  .mock-caption b { color: var(--frost-ink); font-weight: 700; }

  .format-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 11px; }
  .format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 18px; }
  .format-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 520px) { .format-grid { grid-template-columns: repeat(2, 1fr); } }
  .format-item { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 6px; background: var(--frost-surface-muted); border-radius: var(--r-item); text-align: center; }
  .format-item.accent { background: var(--frost-primary-wash); border: 1.5px solid var(--frost-primary); }
  .format-item .fi-icon { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; }
  .format-item .fi-icon svg { width: 15px; height: 15px; }
  .format-item .fi-label { font-size: 11px; font-weight: 600; color: var(--frost-ink); line-height: 1.25; }
  .format-item .fi-note { font-size: 9.5px; color: var(--frost-faint); margin-top: -2px; }

  .diff-note { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: var(--frost-ink-soft); line-height: 1.5; background: var(--frost-surface-muted); border-radius: var(--r-item); padding: 12px 14px; margin-bottom: 6px; }
  .diff-note svg { width: 15px; height: 15px; color: var(--frost-primary); flex-shrink: 0; margin-top: 1px; }
  .diff-note b { color: var(--frost-ink); }

  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  @media (max-width: 520px) { .type-grid { grid-template-columns: 1fr; } }
  .type-card { padding: 16px; border-radius: var(--r-item); border: 1.5px solid var(--frost-border); background: var(--frost-surface); }
  .type-card.accent { border-color: var(--frost-primary); background: var(--frost-primary-wash); }
  .type-card .t-icon { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .type-card .t-icon svg { width: 15px; height: 15px; }
  .type-card .t-title { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .type-card .t-desc { font-size: 11.5px; color: var(--frost-muted); line-height: 1.5; }
  .type-card .t-example { font-size: 11px; color: var(--frost-ink-soft); font-style: italic; margin-top: 7px; }

  .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; flex-wrap: wrap; }
  .btn-back { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--frost-muted); background: none; border: none; cursor: pointer; padding: 8px 4px; }
  .btn-next { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #fff; background: var(--frost-primary); border: none; border-radius: var(--r-btn); padding: 11px 20px; cursor: pointer; box-shadow: 0 4px 16px -4px rgba(0,114,251,.4); }
  .btn-next:hover { background: var(--frost-primary-hover); }
  .btn-next svg, .btn-back svg { width: 13px; height: 13px; }

  .done-wrap { text-align: center; padding: 16px 6px 4px; }
  .done-icon { width: 62px; height: 62px; border-radius: 50%; background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .done-icon svg { width: 27px; height: 27px; }
  .done-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--frost-primary); margin-bottom: 9px; }
  .done-title { font-size: 22px; font-weight: 700; margin: 0 0 9px; }
  .done-title em { font-style: italic; font-weight: 600; color: var(--frost-primary); }
  .done-dek { font-size: 13.5px; color: var(--frost-muted); line-height: 1.55; max-width: 40ch; margin: 0 auto 22px; }
  .done-cta { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: #fff; background: var(--frost-primary); border: none; border-radius: var(--r-btn); padding: 12px 24px; cursor: pointer; box-shadow: 0 4px 16px -4px rgba(0,114,251,.4); margin-bottom: 12px; }
  .done-secondary { font-size: 12px; color: var(--frost-muted); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .dn-box { margin-top: 16px; padding: 11px 13px; border-radius: 12px; background: #FFFBEB; border: 1px dashed var(--frost-warning); display: grid; gap: 6px; max-width: 560px; }
  .dn-box .ttl { font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #92610A; }
  .dn-box p { margin: 0 !important; font-size: 11px !important; line-height: 1.45 !important; color: #78350F !important; }
  .dn-box p b { color: #451A03; }
  body.hide-flags .dn { display: none !important; }
  .rubro-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--frost-muted); background: var(--frost-surface-muted); padding: 4px 8px; border-radius: 999px; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding: 22px 20px; gap: 22px; }
  }
  @media (max-width: 640px) {
    .toolbar { padding: 8px 10px; }

/* ---------- Estado + render ---------- */
const state = { feature: 'ofertas', rubro: 'none', view: 'placeholder', step: 0 };

function renderPlaceholder() {
  const F = FEATURES[state.feature], p = F.placeholder(state.rubro);
  return `
    <div class="ph-page" style="max-width:900px">
      <div class="crumb"><span class="kicker">${p.kicker}</span><span class="kicker">/</span><span class="kicker blue">${F.tag}</span></div>
      <section class="hero">
        <div class="hero-copy">
          <div class="status-row"><span class="chip">${p.chip}</span></div>
          <h1 class="headline">${p.headline}</h1>
          <p class="lede">${p.lede}</p>
          ${checksList(p.bullets)}
          <div class="costbox">${p.cost.map(c => `<div class="cost-row">${c.chip.length ? `<span class="chip ${c.chip[0]}">${c.chip[1]}</span>` : ''}<span><b>${c.b}</b> ${c.t}</span></div>`).join('')}</div>
          <button class="cta" data-open>${p.cta}</button>
        </div>
        <div class="hero-visual">${p.visual}</div>
      </section>
      <div class="dn-box dn"><span class="ttl">Notas de diseño</span>
        ${(p.notes || []).map(n => `<p>${n}</p>`).join('')}
        ${(p.flags || []).map(f => `<p><span class="flag">⚑ ${f}</span></p>`).join('')}
      </div>
    </div>`;
}

const PASOS = ['Intro', 'Cómo funciona', 'Listo'];
function riel(paso) {
  return `<div class="stepper">${PASOS.map((nombre, i) => `${i > 0 ? `<span class="step-sep${i <= paso ? ' done' : ''}"></span>` : ''}<span class="step-dot${i < paso ? ' done' : i === paso ? ' active' : ''}"><span class="circle">${i < paso ? I.check.replace('<svg', '<svg width="10" height="10"') : i + 1}</span>${nombre}</span>`).join('')}</div>`;
}

function renderModal() {
  const F = FEATURES[state.feature], r = state.rubro, paso = state.step, ultimo = paso === 2;
  const c = F.conoce(r), cf = F.comoFunciona, l = F.listo;
  let body, srcLine, flagLines = [];
  if (paso === 0) {
    body = `${titulo(c.titulo[0], c.titulo[1])}<p class="dek">${c.dek}</p>${c.mock}${c.caption}`;
    srcLine = c.src; flagLines = c.flags || [];
  } else if (paso === 1) {
    body = `${titulo(cf.titulo[0], cf.titulo[1])}<p class="dek">${cf.dek}</p>${cf.body}`;
    srcLine = cf.src; flagLines = cf.flags || [];
  } else {
    body = `<div class="done-wrap"><div class="done-icon">${I.check}</div><p class="done-eyebrow">★ Todo listo ★</p>${tituloDone(l.titulo[0], l.titulo[1])}<p class="done-dek">${l.dek}</p><button class="done-cta" data-close>${l.cta}${I.arrow.replace('<svg', '<svg width="13" height="13"')}</button>${l.secondary ? `<div><button class="done-secondary" data-close>${l.secondary}</button></div>` : ''}</div>`;
    srcLine = null; flagLines = l.flag ? [l.flag] : [];
  }
  return `<div class="stagewrap-modal">
    <div class="modal-top">${riel(paso)}<span class="modal-tag">${F.tag}</span></div>
    <div>${body}</div>
    ${!ultimo ? `<div class="modal-footer">
      ${paso === 0 ? '<span></span>' : `<button class="btn-back" data-back>${I.back}Anterior</button>`}
      <button class="btn-next" data-next>${paso === 0 ? 'Ver cómo funciona' : 'Empezar'}${I.arrow}</button>
    </div>` : ''}
    <div class="dn-box dn"><span class="ttl">Notas de diseño</span>
      ${srcLine ? `<p><b>Fuente:</b> ${srcLine}</p>` : ''}
      ${flagLines.map(f => `<p><span style="color:#92610A">⚑ ${f}</span></p>`).join('')}
      <p><span class="rubro-tag">${RUBRO[r].tag}</span></p>
    </div>
  </div>`;
}

function render() {
  $('#stage').innerHTML = state.view === 'placeholder' ? renderPlaceholder() : renderModal();
  ['feature', 'rubro', 'view'].forEach(k => document.querySelectorAll(`#seg-${k} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[k]))));
}
const $ = s => document.querySelector(s);

['feature', 'rubro', 'view'].forEach(k => $('#seg-' + k).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state[k] = b.dataset.v;
  if (k === 'feature' || k === 'rubro') state.step = 0;
  if (k === 'view' && b.dataset.v === 'tutorial') state.step = 0;
  render();
}));
$('#chk-flags').addEventListener('change', e => document.body.classList.toggle('hide-flags', !e.target.checked));
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-open]')) { state.view = 'tutorial'; state.step = 0; render(); }
  else if (t.closest('[data-close]')) { state.view = 'placeholder'; render(); }
  else if (t.closest('[data-next]')) { state.step = Math.min(2, state.step + 1); render(); }
  else if (t.closest('[data-back]')) { state.step = Math.max(0, state.step - 1); render(); }
});
render();
</script>
