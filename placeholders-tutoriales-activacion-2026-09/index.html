<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bocetos · Placeholders y tutoriales de activación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0072FB; --brand-deep: #005CD4; --brand-bright: #3D8BFB;
    --brand-wash: rgba(0, 114, 251, .08); --brand-wash-strong: rgba(0, 114, 251, .12);
    --ink: #0F172A; --ink-mid: #475569; --ink-soft: #64748B; --ink-faint: #94A3B8;
    --paper: #EFF3F9; --card: #FFFFFF;
    --hair: rgba(15, 23, 42, .08); --hair-strong: rgba(15, 23, 42, .15);
    --ok: #0E9F6E; --ok-wash: rgba(14, 159, 110, .10); --bad: #DC2626; --bad-wash: rgba(220, 38, 38, .08);
    --star: #F59E0B; --flag: #B45309; --flag-wash: #FEF3C7;
    --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04);
    --shadow-md: 0 10px 30px -12px rgba(15, 23, 42, .15);
    --shadow-lg: 0 20px 50px -20px rgba(15, 23, 42, .25);
    --r-card: 20px; --r-btn: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Montserrat', system-ui, sans-serif; background: #DDE3EC; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- Toolbar del boceto ---------- */
  .toolbar { position: sticky; top: 0; z-index: 50; background: #0F172A; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .toolbar .brand { font-weight: 800; font-size: 13px; letter-spacing: .02em; margin-right: 6px; }
  .toolbar .brand small { display: block; font-weight: 500; font-size: 10.5px; color: #94A3B8; letter-spacing: 0; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > label { font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #94A3B8; }
  .seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: #CBD5E1; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .toolbar .switch { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #CBD5E1; cursor: pointer; user-select: none; }

  .wrap { padding: 22px 20px 60px; }
  .wrap-frame { position: relative; margin: 0 auto; max-width: 1180px; transition: max-width .25s ease; }
  .wrap-frame.mobile { max-width: 390px; }
  .frame { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow-lg); height: min(82vh, 900px); overflow: auto; container-type: inline-size; container-name: stage; }
  .page { padding: 26px 28px 40px; }

  /* ---------- Componentes Flash ---------- */
  .crumb { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); }
  .kicker.blue { color: var(--brand); }
  .panel { background: var(--card); border: 1px solid var(--hair-strong); border-radius: var(--r-card); box-shadow: var(--shadow-xs); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(100,116,139,.14); color: var(--ink-soft); white-space: nowrap; }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
  .chip.ok { background: var(--ok-wash); color: var(--ok); }
  .chip.blue { background: var(--brand-wash); color: var(--brand-deep); }
  .chip.warn { background: var(--flag-wash); color: var(--flag); }
  .chip.plain::before { display: none; }

  .cta { border: 0; color: #fff; font-weight: 700; font-size: 13.5px; letter-spacing: .01em; padding: 14px 22px; border-radius: var(--r-btn); background: linear-gradient(180deg, var(--brand-bright), var(--brand)); box-shadow: 0 8px 20px -8px rgba(0, 114, 251, .6); transition: transform .12s ease, box-shadow .12s ease, opacity .12s; }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(0, 114, 251, .65); }
  .cta[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-ghost { border: 1px solid var(--hair-strong); background: #fff; color: var(--ink); font-weight: 600; font-size: 13px; padding: 13px 18px; border-radius: var(--r-btn); }
  .btn-ghost:hover { background: #F8FAFC; }
  .link { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 13px; padding: 0; }
  .link:hover { text-decoration: underline; }

  /* ---------- Placeholder ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px; padding: 40px 40px 36px; background: radial-gradient(800px 320px at 85% 0%, rgba(0,114,251,.06), transparent 60%), var(--card); }
  .hero .status-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  h1.headline { font-size: 38px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; margin: 0 0 16px; }
  h1.headline em { font-style: italic; font-weight: 600; background: linear-gradient(135deg, var(--brand), var(--brand-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .05em; }
  .lede { font-size: 14.5px; line-height: 1.6; color: var(--ink-mid); margin: 0 0 20px; max-width: 48ch; }
  ul.checks { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 10px; }
  ul.checks li { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; color: var(--ink-mid); }
  ul.checks li svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--brand); }
  .cost { border: 1px solid var(--hair-strong); border-radius: 14px; padding: 12px 14px; margin-bottom: 22px; background: #FBFCFE; display: grid; gap: 8px; max-width: 470px; }
  .cost-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-mid); line-height: 1.4; }
  .cost-row .chip { flex: none; min-width: 92px; justify-content: center; }
  .cost-row b { color: var(--ink); font-weight: 700; }
  .actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .hero-visual { position: relative; display: flex; align-items: center; justify-content: center; min-height: 340px; }

  /* Visuales del cliente */
  .stack { position: relative; width: 100%; max-width: 400px; }
  .ejemplo { position: absolute; top: -12px; right: 6px; z-index: 3; font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); background: #fff; border: 1px solid var(--hair-strong); padding: 3px 8px; border-radius: 999px; }
  .req-card { background: #fff; border: 1px solid var(--hair-strong); border-radius: 24px; padding: 22px 22px 24px; box-shadow: var(--shadow-md); }
  .req-card .biz { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .req-card .biz b { font-size: 13.5px; }
  .req-card h4 { font-size: 20px; font-weight: 700; margin: 16px 0 4px; letter-spacing: -.01em; }
  .req-card p { margin: 0 0 14px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .stars { display: flex; gap: 8px; margin-bottom: 16px; }
  .star-btn { width: 40px; height: 40px; border-radius: 10px; background: #F1F4F9; border: 1px solid var(--hair); display: grid; place-items: center; }
  .star-btn svg { width: 20px; height: 20px; color: var(--star); fill: var(--star); }
  .mini-cta { display: inline-block; background: var(--brand); color: #fff; font-weight: 700; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 11px 16px; border-radius: 8px; }
  .rev-card { background: #fff; border: 1px solid var(--hair-strong); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow-md); margin: -22px 0 0 34px; position: relative; }
  .rev-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-wash); color: var(--brand-deep); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .rev-head b { font-size: 13px; display: block; }
  .rev-head small { font-size: 11px; color: var(--ink-faint); }
  .mini-stars { display: inline-flex; gap: 1px; margin-left: 6px; vertical-align: -2px; }
  .mini-stars svg { width: 12px; height: 12px; color: var(--star); fill: var(--star); }
  .rev-card p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .verified { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-deep); display: inline-flex; gap: 6px; align-items: center; }
  .verified svg { width: 11px; height: 11px; }

  .gcard { border-radius: 22px; padding: 22px; color: #fff; position: relative; overflow: hidden; background: linear-gradient(135deg, #0A5FD9 0%, #0072FB 55%, #4FA0FF 100%); box-shadow: var(--shadow-md); aspect-ratio: 1.62; display: flex; flex-direction: column; justify-content: space-between; }
  .gcard::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .gcard::before { content: ''; position: absolute; right: 30px; bottom: -80px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .gcard .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .gcard .top svg { width: 24px; height: 24px; }
  .gcard .mid { position: relative; z-index: 1; }
  .gcard .mid small { display: block; font-size: 11px; opacity: .8; font-weight: 500; margin-bottom: 4px; }
  .gcard .mid b { font-size: 21px; font-weight: 700; letter-spacing: -.01em; display: block; }
  .gcard .amount { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .gcard .bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; font-size: 10.5px; opacity: .9; font-weight: 600; }
  .mail-snip { background: #fff; border: 1px solid var(--hair-strong); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-md); margin: -26px 0 0 40px; position: relative; font-size: 12px; color: var(--ink-mid); line-height: 1.5; }
  .mail-snip .from { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-faint); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .mail-snip .from svg { width: 13px; height: 13px; }
  .mail-snip b { color: var(--ink); }
  .mail-snip .code { font-family: ui-monospace, Menlo, monospace; background: var(--brand-wash); color: var(--brand-deep); padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 11.5px; }

  .slots { background: #fff; border: 1px solid var(--hair-strong); border-radius: 22px; box-shadow: var(--shadow-md); padding: 18px; width: 100%; max-width: 400px; position: relative; }
  .slots .sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .slots .sh b { font-size: 14px; }
  .slots .sub { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .slot { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--hair-strong); border-radius: 12px; margin-bottom: 8px; background: #fff; }
  .slot .t { font-weight: 700; font-size: 14px; }
  .slot .p { text-align: right; font-size: 13px; font-weight: 700; }
  .slot .p s { color: var(--ink-faint); font-weight: 500; font-size: 11.5px; margin-right: 6px; }
  .slot.disc { border-color: rgba(0,114,251,.35); background: linear-gradient(90deg, var(--brand-wash), #fff 70%); }
  .off { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; background: var(--brand); color: #fff; margin-left: 8px; vertical-align: 1px; }
  .week { background: #fff; border: 1px solid var(--hair-strong); border-radius: 20px; box-shadow: var(--shadow-md); padding: 16px 16px 12px; width: 100%; max-width: 400px; position: relative; }
  .week .grid { display: grid; grid-template-columns: 34px repeat(7, 1fr); gap: 4px; align-items: center; }
  .week .dl { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-align: center; color: var(--ink-soft); text-transform: uppercase; padding-bottom: 4px; }
  .week .hl { font-size: 10px; color: var(--ink-faint); font-weight: 600; text-align: right; padding-right: 4px; }
  .week .c { height: 20px; border-radius: 5px; background: #F1F4F9; }
  .week .c.on { background: var(--brand); box-shadow: 0 2px 6px -2px rgba(0,114,251,.6); }
  .week .legend { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink-mid); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); flex-wrap: wrap; }
  .rule-chip { display: inline-flex; gap: 6px; align-items: center; background: var(--brand-wash); color: var(--brand-deep); font-weight: 700; font-size: 11.5px; padding: 5px 9px; border-radius: 8px; }

  ol.moments { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; width: 100%; max-width: 420px; }
  ol.moments li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; position: relative; padding-bottom: 20px; }
  ol.moments li:last-child { padding-bottom: 0; }
  ol.moments li:not(:last-child)::before { content: ''; position: absolute; left: 16px; top: 34px; bottom: 2px; width: 2px; background: var(--brand-wash-strong); }
  ol.moments .dot { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid var(--brand); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  ol.moments .k { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); margin-bottom: 3px; }
  ol.moments .t { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
  ol.moments .d { font-size: 12.5px; color: var(--ink-mid); line-height: 1.5; }

  .rows { background: #fff; border: 1px solid var(--hair-strong); border-radius: 18px; box-shadow: var(--shadow-md); width: 100%; max-width: 420px; overflow: hidden; }
  .row { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--brand-wash); color: var(--brand); display: grid; place-items: center; }
  .row .ic svg { width: 17px; height: 17px; }
  .row .ic.wa { background: rgba(37, 211, 102, .14); color: #16A34A; }
  .row b { font-size: 13.5px; }
  .row .desc { font-size: 12px; color: var(--ink-mid); line-height: 1.45; margin-top: 3px; }
  .row .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .price-tag { margin: 10px 16px 16px; border: 1px dashed rgba(0,114,251,.45); border-radius: 12px; padding: 12px 14px; background: var(--brand-wash); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .price-tag b { font-size: 18px; letter-spacing: -.01em; }
  .price-tag small { display: block; font-size: 11.5px; color: var(--ink-mid); font-weight: 500; margin-top: 2px; }

  .picker { display: grid; gap: 10px; width: 100%; }
  .opt { text-align: left; border: 1px solid var(--hair-strong); background: #fff; border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
  .opt:hover:not(.locked) { border-color: var(--brand); }
  .opt.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash-strong); }
  .opt.locked { cursor: default; }
  .opt .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-wash); display: grid; place-items: center; font-weight: 800; color: var(--brand); font-size: 17px; }
  .opt .ic svg { width: 18px; height: 18px; color: var(--star); fill: var(--star); }
  .opt b { font-size: 13.5px; display: block; margin-bottom: 3px; }
  .opt span { font-size: 12px; color: var(--ink-mid); line-height: 1.45; display: block; }
  .opt .need { color: var(--brand); font-weight: 600; margin-top: 4px; }
  .picker-foot { font-size: 11.5px; color: var(--ink-soft); }

  .todo { display: grid; gap: 10px; width: 100%; max-width: 430px; }
  .todo .it { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--hair-strong); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-xs); }
  .todo .n { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-wash); color: var(--brand-deep); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
  .todo b { font-size: 13.5px; display: block; }
  .todo span.d { font-size: 12px; color: var(--ink-mid); line-height: 1.4; display: block; margin-top: 2px; }
  .note-box { border-radius: 12px; padding: 11px 13px; font-size: 12px; line-height: 1.5; color: var(--ink-mid); background: #fff; border: 1px solid var(--hair-strong); }

  /* ---------- Modal tutorial ---------- */
  .overlay { position: absolute; inset: 0; border-radius: 22px; background: rgba(15, 23, 42, .5); display: none; align-items: center; justify-content: center; padding: 22px; z-index: 20; backdrop-filter: blur(3px); }
  .overlay.open { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 920px; max-height: 100%; border-radius: 26px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
  .sheet-head { padding: 20px 26px 0; display: flex; align-items: center; gap: 16px; }
  .progress { flex: 1; display: flex; gap: 6px; }
  .progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--hair-strong); }
  .progress i.done { background: var(--brand); }
  .x { border: 0; background: #F1F4F9; width: 34px; height: 34px; border-radius: 50%; color: var(--ink-mid); font-size: 16px; font-weight: 700; }
  .x:hover { background: #E2E8F0; }
  .sheet-body { padding: 26px 30px 8px; overflow: auto; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 30px; align-items: center; }
  .sheet-body .copy h2 { font-size: 27px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; margin: 8px 0 12px; }
  .sheet-body .copy p { font-size: 14px; line-height: 1.6; color: var(--ink-mid); margin: 0 0 12px; }
  .sheet-body .copy .story { border-left: 3px solid var(--brand); padding: 2px 0 2px 14px; color: var(--ink); font-size: 14px; }
  .sheet-body .copy .micro { font-size: 12.5px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
  .vis { background: linear-gradient(180deg, #F5F8FC, #EEF3FA); border-radius: 20px; padding: 30px 20px 26px; display: flex; justify-content: center; align-items: center; min-height: 300px; position: relative; }
  .sheet-foot { padding: 16px 26px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--hair); margin-top: 18px; }
  .sheet-foot .left, .sheet-foot .right { display: flex; gap: 12px; align-items: center; }
  .rubro-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); background: #F1F4F9; padding: 5px 9px; border-radius: 999px; }

  /* ---------- Notas de diseño ---------- */
  .flag { display: inline-flex; align-items: center; gap: 5px; background: var(--flag-wash); color: var(--flag); border: 1px dashed #F59E0B; border-radius: 8px; font-size: 10.5px; font-weight: 700; padding: 3px 7px; line-height: 1.3; }
  .dn-box { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #FFFBEB; border: 1px dashed #F59E0B; display: grid; gap: 7px; }
  .dn-box .ttl { font-size: 9.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--flag); }
  .dn-box p { margin: 0 !important; font-size: 11.5px !important; line-height: 1.45 !important; color: #78350F !important; }
  .dn-box p b { color: #451A03; }
  .buds { display: flex; flex-wrap: wrap; gap: 5px; }
  .bud { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--ok-wash); color: var(--ok); }
  .bud.over { background: var(--bad-wash); color: var(--bad); }
  body.hide-flags .dn { display: none !important; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0F172A; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 100; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ---------- Vista Criterios ---------- */
  .crit h2 { font-size: 26px; letter-spacing: -.02em; margin: 6px 0 6px; }
  .crit h3 { font-size: 15px; margin: 0 0 10px; letter-spacing: -.01em; }
  .crit .panel { padding: 22px 24px; margin-bottom: 16px; }
  .crit p { font-size: 13.5px; line-height: 1.6; color: var(--ink-mid); margin: 0 0 10px; }
  .crit .formula { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #0F172A; color: #E2E8F0; padding: 14px 16px; border-radius: 12px; line-height: 1.7; margin: 10px 0 14px; overflow-x: auto; }
  .crit table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

function stepTexts(s) {
  const out = [['título', s.title], ['bajada', s.lede], ['historia', s.story], ['microcopy', s.micro]];
  const v = s.visual || {};
  (v.items || []).forEach((m, i) => { out.push([`ítem ${i + 1}`, [m.k, m.t, m.b, m.d].filter(Boolean).join(' ')]); });
  (v.rows || []).forEach((m, i) => out.push([`fila ${i + 1}`, m.d]));
  if (v.note) out.push(['nota', v.note]);
  return out.filter(([, t]) => t);
}
function stepBudget(s) {
  const B = BUDGET[s.role], v = s.visual || {}, res = [];
  const add = (label, n, max) => res.push({ label, n, max, over: n > max });
  add('título', words(s.title), B.title);
  if (B.lede && s.lede) add('bajada', words(s.lede), B.lede);
  if (B.story && s.story) add('historia', words(s.story), B.story);
  if (s.role === 'R1') { add('momentos', (v.items || []).length, B.moments); (v.items || []).forEach((m, i) => add(`momento ${i + 1}`, words(m.d), B.moment)); }
  if (s.role === 'R3') (v.rows || []).forEach((m, i) => add(`fila ${i + 1}`, words(m.d), B.row));
  if (s.role === 'R4') { add('ítems', (v.items || []).length || (v.type === 'picker' ? 3 : 0), B.items); (v.items || []).forEach((m, i) => add(`ítem ${i + 1}`, words(m.d), B.item)); }
  return res;
}
function placeholderBudget(p) {
  const B = BUDGET.PH, res = [];
  const add = (label, n, max) => res.push({ label, n, max, over: n > max });
  add('titular', words(p.headline), B.headline); add('bajada', words(p.lede), B.lede);
  add('viñetas', p.bullets.length, B.bullets); p.bullets.forEach((b, i) => add(`viñeta ${i + 1}`, words(b), B.bullet));
  return res;
}
function fullLint() {
  const lines = []; let texts = 0, viol = 0, over = 0;
  Object.entries(FEATURES).forEach(([fk, F]) => Object.keys(RUBRO).forEach(rk => {
    const p = F.placeholder(rk);
    const ptexts = [['titular', p.headline], ['bajada', p.lede], ...p.bullets.map((b, i) => ['viñeta ' + (i + 1), b]), ...p.cost.map((c, i) => ['costo ' + (i + 1), c.b + ' ' + c.t])];
    ptexts.forEach(([w, t]) => { texts++; lintText(t).forEach(m => { viol++; lines.push(`${F.name} · ${RUBRO[rk].label} · placeholder · ${w}: ${m}`); }); });
    placeholderBudget(p).forEach(b => { if (b.over) { over++; lines.push(`${F.name} · ${RUBRO[rk].label} · placeholder · ${b.label}: ${b.n}/${b.max} palabras`); } });
    [F.cta, ...F.steps(rk).flatMap(s => s.final ? [s.final.cta, s.final.ctaPending].filter(Boolean) : [])].forEach(c => {
      if (c.length > 25) { over++; lines.push(`${F.name} · ${RUBRO[rk].label} · CTA «${c}»: ${c.length}/25 caracteres`); }
    });
    F.steps(rk).forEach((s, i) => {
      stepTexts(s).forEach(([w, t]) => { texts++; lintText(t).forEach(m => { viol++; lines.push(`${F.name} · ${RUBRO[rk].label} · paso ${i + 1} · ${w}: ${m}`); }); });
      stepBudget(s).forEach(b => { if (b.over) { over++; lines.push(`${F.name} · ${RUBRO[rk].label} · paso ${i + 1} · ${b.label}: ${b.n}/${b.max}`); } });
    });
  }));
  return { lines, texts, viol, over };
}

    </div>
    <div class="sheet-foot">
      <div class="left">
        <button class="btn-ghost" data-back ${state.step === 0 ? 'style="visibility:hidden"' : ''}>Atrás</button>
        <span class="rubro-tag">${RUBRO[state.rubro].tag}</span>
      </div>
      <div class="right">
        ${last ? '' : '<button class="link" data-close style="color:var(--ink-soft)">Saltar</button>'}
        ${last ? `<button class="cta" data-activate ${canActivate ? '' : 'disabled'}>${s.final.cta}</button>` : '<button class="cta" data-next>Siguiente</button>'}
      </div>
    </div>
  </div>`;
}

function renderCriterios() {
  const L = fullLint();
  const feats = Object.values(FEATURES).map(F => `<tr><td><b>${F.name}</b></td><td>${F.formula.split('→')[0].trim()}</td><td><b>${F.steps('none').length}</b></td></tr>`).join('');
  return `<div class="crit">
    <div class="crumb"><span class="kicker">Boceto</span><span class="kicker">/</span><span class="kicker blue">Criterios</span></div>
    <h2>Qué va en cada paso, y por qué</h2>
    <p>Contrato completo en <b>CRITERIOS.md</b>. Cada texto de este boceto se valida contra estos criterios con un lint automático.</p>

    <div class="panel"><h3>1 · Cuántos pasos tiene el tutorial</h3>
      <div class="formula">pasos = 2<br>      + 1  si hay costo, o consume un recurso medido → «Costo y consumo»<br>      + 1  si hay algo que decidir o tener antes de activar → «Para activar»<br>rango 2–4 · ninguna otra cosa agrega pasos</div>
      <div class="tscroll"><table><tr><th>Feature</th><th>Condiciones</th><th>Pasos</th></tr>${feats}</table></div>
      <p style="margin-top:12px">Orden fijo: <b>Cómo funciona → Caso práctico → Costo y consumo → Para activar</b>. El costo y el consumo van antes de activar. El CTA principal vive en el último paso que exista.</p>
    </div>

    <div class="panel"><h3>2 · Contrato por paso</h3>
      <div class="tscroll"><table class="wide">
        <tr><th>Paso</th><th>Existe si</th><th>Va</th><th>No va</th><th>Presupuesto</th></tr>
        <tr><td><b>Cómo funciona</b></td><td class="yes">Siempre · primero</td><td>El mecanismo de punta a punta en 3 momentos (un actor + una acción cada uno) y el resultado que el negocio ve.</td><td class="no">Costos, requisitos, excepciones, límites, configuración, ejemplos con datos.</td><td>Título ≤8 · bajada ≤25 · 3 momentos ≤20</td></tr>
        <tr><td><b>Caso práctico</b></td><td class="yes">Siempre · segundo</td><td>Un caso que recorre los mismos momentos con datos concretos (persona, servicio, hora o monto).</td><td class="no">Conceptos nuevos, promesas o métricas de resultado, testimonios inventados, cifras sin marcar «Ejemplo».</td><td>Título ≤10 · historia ≤45</td></tr>
        <tr><td><b>Costo y consumo</b></td><td>Solo si hay costo, o si consume un recurso medido (ej.: mensajes del pack)</td><td>Qué no tiene costo · qué se paga o se consume · unidad (y monto, solo si es plata). Plan B por falta del recurso solo si cambia la decisión. CTA a contratar solo si hay algo que contratar.</td><td class="no">Beneficios y persuasión. Comisiones de terceros que ya se asumen en todo cobro (van como nota en «Para activar»).</td><td>Título ≤8 · bajada ≤25 · filas ≤20</td></tr>
        <tr><td><b>Para activar</b></td><td>Solo si hay algo que decidir o tener</td><td>Requisitos que bloquean y decisiones que definen el resultado. Restricciones solo si son irreversibles de verdad (sin salida). Con estado.</td><td class="no">Cómo funciona (es el paso 1). Ajustes que se pueden cambiar después. Restricciones con salida (ej.: pausar la tarjeta y crear otra). <b>CTA:</b> es el de activar. Solo se reemplaza si el requisito impide activar (ej.: Reseñas en Google exige perfil conectado → «Conectar Google»). Si no impide activar (Mercado Pago en Gift Cards), el CTA sigue siendo el de activar y el requisito lleva una acción secundaria.</td><td>Título ≤8 · bajada ≤25 · ≤3 ítems ≤25</td></tr>
      </table></div>
      <p style="margin-top:12px"><b>Pruebas de calidad:</b> (1) el paso 1 se entiende sin el 2; (2) cambiar el rubro cambia solo datos, nunca la mecánica; (3) cada dato vive en un solo paso; (4) cada acción descripta existe hoy en el producto.</p>
    </div>

    <div class="panel"><h3>3 · Placeholder vs. tutorial</h3>
      <p><b>Placeholder = por qué</b> (valor). <b>Tutorial = cómo</b> (mecanismo y decisión). Ninguna frase se repite entre los dos.</p>
      <div class="tscroll"><table class="wide"><tr><th>Placeholder</th><th>Regla</th><th>Presupuesto</th></tr>
        <tr><td>Titular</td><td>El resultado para el negocio, con una frase enfatizada. Nunca solo el nombre de la feature.</td><td>≤12 palabras</td></tr>
        <tr><td>Bajada</td><td>El mecanismo en una oración + qué hace el cliente.</td><td>≤40</td></tr>
        <tr><td>Viñetas</td><td>2–3. Un beneficio distinto o un hecho de control cada una.</td><td>≤15 c/u</td></tr>
        <tr><td>Costo</td><td>Una línea por costo con chip (Incluido / Con pack / Sin costo). Sin detalle: el detalle va en «Costo y consumo».</td><td>1 línea</td></tr>
        <tr><td>CTA</td><td>Verbo + objeto, idéntico al CTA del último paso del tutorial.</td><td>≤25 caracteres</td></tr>
      </table></div>
    </div>

    <div class="panel"><h3>4 · Limitaciones («Qué NO hace»)</h3>
      <p>Entran al tutorial solo si (a) <b>bloquean la activación</b> → «Para activar», o (b) <b>corrigen una expectativa que el paso 1 crearía</b> → se dicen en positivo dentro del paso 1 («La usa al reservar online», no «no se puede usar en el mostrador»). Todo lo demás va al Centro de Ayuda.</p>
    </div>

    <div class="panel"><h3>5 · Qué caso se muestra en «Caso práctico»</h3>
      <p><b>Sin rubro</b> → caso neutro (un cliente, un servicio). Es el default. <b>Con rubro</b> → caso del rubro con más servicios cargados en el negocio; si hay empate, el primero cargado. Se escribe un caso por grupo (Salón: Peluquería, Uñas, Pestañas, Cejas…; Barbería). Rubro sin caso escrito → neutro. Nunca se genera un caso en el momento.</p>
    </div>

    <div class="panel"><h3>6 · Wording (de launch-copy)</h3>
      <div class="tscroll"><table class="wide"><tr><th>Regla</th><th>Sí</th><th>No</th></tr>
        <tr><td>Voseo argentino</td><td class="yes">Elegís, subí</td><td class="no">Eliges, sube</td></tr>
        <tr><td>Ágora con tilde</td><td class="yes">Ágora</td><td class="no">Agora (salvo URLs)</td></tr>
        <tr><td>Tu página</td><td class="yes">aparece en tu página</td><td class="no">storefront, tienda</td></tr>
        <tr><td>Planes mensuales</td><td class="yes">planes mensuales</td><td class="no">membresías</td></tr>
        <tr><td>Concreto</td><td class="yes">Elegís qué servicios, qué franja y cuánto descuento</td><td class="no">Aprovechá las nuevas opciones</td></tr>
        <tr><td>Sin jerga</td><td class="yes">turno, reserva, horario</td><td class="no">checkout, slot, canje, onboarding, dashboard, feature, usuario</td></tr>
        <tr><td>Sin relleno</td><td class="yes">—</td><td class="no">fácil, simple, potente, «Ojo:», «Tené en cuenta», exclamaciones</td></tr>
        <tr><td>Sujeto explícito</td><td class="yes">El cliente toca una calificación y deja su reseña</td><td class="no">«Tocá una estrella» (se lee como orden al negocio)</td></tr>
        <tr><td>Sin negaciones de relleno</td><td class="yes">Sale a todo cliente con correo.</td><td class="no">«…No consume nada.» · «Es gratis; …»</td></tr>
        <tr><td>Sin planes B innecesarios</td><td class="yes">(se omite)</td><td class="no">«Sin pack, sale por correo.» salvo que cambie la decisión</td></tr>
      </table></div>
      <p style="margin-top:12px"><b>Copy existente primero:</b> se reutiliza el de Flash (ReviewsLanding, novedad in-app, empty states, texto de JP). Lo nuevo se marca en las notas de cada paso.</p>
    </div>

    <div class="panel"><h3>7 · Lint automático</h3>
      <p>${L.texts} textos revisados en 3 features × 3 rubros (placeholder y todos los pasos).</p>
      ${L.lines.length ? L.lines.map(l => `<div class="lintline bad">✕ ${l}</div>`).join('') : '<div class="lintline"><span class="bud">0 palabras prohibidas · 0 presupuestos excedidos</span></div>'}
    </div>
  </div>`;
}

function render() {
  $('#page').innerHTML = state.view === 'criterios' ? renderCriterios() : renderPlaceholder();
  const ov = $('#overlay');
  if (state.view === 'tutorial') { ov.innerHTML = renderSheet(); ov.classList.add('open'); ov.setAttribute('aria-hidden', 'false'); }
  else { ov.classList.remove('open'); ov.setAttribute('aria-hidden', 'true'); ov.innerHTML = ''; }
  $('#wrapframe').classList.toggle('mobile', state.width === 'mobile');
  ['feature', 'rubro', 'view', 'width'].forEach(k =>
    document.querySelectorAll(`#seg-${k} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[k]))));
  writeHash();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

['feature', 'rubro', 'view', 'width'].forEach(k =>
  $('#seg-' + k).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[k] = b.dataset.v;
    if (k === 'feature' || k === 'rubro') { state.step = 0; if (k === 'feature') state.pick = null; }
    if (k === 'view' && b.dataset.v === 'tutorial') state.step = 0;
    render();
  }));
$('#chk-flags').addEventListener('change', e => document.body.classList.toggle('hide-flags', !e.target.checked));

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-open]')) { state.view = 'tutorial'; state.step = 0; render(); return; }
  if (t.closest('[data-close]')) { state.view = 'placeholder'; render(); return; }
  if (t.closest('[data-next]')) { state.step++; render(); return; }
  if (t.closest('[data-back]')) { state.step = Math.max(0, state.step - 1); render(); return; }
  const pk = t.closest('[data-pick]');
  if (pk) { if (pk.dataset.pick) { state.pick = pk.dataset.pick; render(); } return; }
  const mpb = t.closest('[data-mp]');
  if (mpb) { state.mp = mpb.dataset.mp; render(); return; }
  if (t.closest('[data-connect]')) { toast('Boceto: abre Ajustes > Medios de cobro para conectar Mercado Pago'); return; }
  if (t.closest('[data-activate]')) { toast('Boceto: acá se activaría la feature y se cerraría el tutorial'); return; }
  if (t.id === 'overlay') { state.view = 'placeholder'; render(); }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'tutorial') return;
  const n = FEATURES[state.feature].steps(state.rubro).length;
  if (e.key === 'Escape') { state.view = 'placeholder'; render(); }
  if (e.key === 'ArrowRight' && state.step < n - 1) { state.step++; render(); }
  if (e.key === 'ArrowLeft' && state.step > 0) { state.step--; render(); }
});

readHash();
render();
</script>
</body>
</html>
