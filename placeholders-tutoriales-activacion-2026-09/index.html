<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bocetos de activación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Layout: barra de control (nuestra, de revisión) arriba de una página de 1 sola tarjeta
     (placeholder) con un modal de 3 pasos superpuesto (tutorial) — calco de los dos bocetos
     de referencia que el usuario aprobó (Ofertas, Fichas y preguntas), que a su vez calcan el
     kit real de Novedades de Flash. El mismo mock ("Así lo ve tu cliente") se reutiliza sin
     cambios entre el placeholder y el primer paso del tutorial: un solo visual por feature. */
  :root {
    --frost-primary: #0072FB; --frost-primary-hover: #005CD4; --frost-primary-soft: #EEF6FF; --frost-primary-wash: rgba(0,114,251,.08);
    --frost-success: #10B981; --frost-success-soft: #D8FCEF;
    --frost-warning: #F59E0B; --frost-warning-soft: #FFF3D9;
    --frost-ink: #0F172A; --frost-ink-soft: #3A3A3A; --frost-muted: #6B7280; --frost-faint: #9CA3AF;
    --frost-surface: #FFFFFF; --frost-surface-muted: #EFF3F9; --frost-border: #E2E8F0; --frost-border-soft: #EEF1F6;
    --r-sm: 6px; --r-item: 10px; --r-btn: 12px; --r-card: 24px; --r-chip: 999px;
    --sh-md: 0 20px 50px -20px rgba(15,23,42,.30);
    --sans: 'Montserrat', system-ui, -apple-system, sans-serif;
  }
  /* Sólo modo claro: el producto real no tiene tema oscuro y uno acá daría una referencia
     visual falsa de lo que este boceto describe. */
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg,#EEF3FB 0%,#E4ECFA 100%); color: var(--frost-ink); font-family: var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }
  img { max-width: 100%; }

  /* ---------- Barra de revisión (no es parte del producto) ---------- */
  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: #0F172A; color: #fff; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 7px 16px; align-items: center; }
  .toolbar .brand { font-weight: 800; font-size: 12px; letter-spacing: .02em; margin-right: 2px; }
  .toolbar .brand small { display: block; font-weight: 500; font-size: 9.5px; color: #94A3B8; letter-spacing: 0; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > label { font-size: 8.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: #94A3B8; }
  .seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: #CBD5E1; font-size: 11px; font-weight: 600; padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--frost-ink); }

  .stage { padding: 26px 14px 50px; min-height: calc(100vh - 46px); display: flex; align-items: flex-start; justify-content: center; }

  h1.headline { font-size: 28px; font-weight: 700; line-height: 1.2; margin: 0 0 10px; letter-spacing: -.01em; text-wrap: balance; }
  h1.headline em { font-style: italic; font-weight: 600; color: var(--frost-primary); }
  p.dek { font-size: 13.5px; color: var(--frost-muted); line-height: 1.55; margin: 0 0 22px; max-width: 50ch; }

  /* ---------- Placeholder: una tarjeta, dos columnas (1.55fr texto / 1fr ejemplo) ---------- */
  .page-card { width: 100%; max-width: 900px; background: var(--frost-surface); border-radius: var(--r-card); box-shadow: var(--sh-md); padding: 38px 42px; }
  .tag-pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--frost-muted); background: var(--frost-surface-muted); padding: 5px 12px; border-radius: var(--r-chip); margin-bottom: 16px; }
  .ph-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 720px) { .ph-grid { grid-template-columns: 1fr; } .ph-right { order: 2; } }

  .check-list { list-style: none; margin: 0 0 20px; padding: 0; }
  .check-list li { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; color: var(--frost-ink-soft); line-height: 1.5; margin-bottom: 9px; }
  .check-list svg { width: 15px; height: 15px; color: var(--frost-primary); flex-shrink: 0; margin-top: 2px; }

  .cost-bar { display: flex; align-items: center; gap: 11px; background: var(--frost-surface-muted); border-radius: var(--r-item); padding: 13px 16px; margin-bottom: 10px; }
  .cost-bar:last-of-type { margin-bottom: 24px; }
  .cost-pill { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: var(--r-chip); flex-shrink: 0; }
  .cost-pill.ok { color: var(--frost-success); background: var(--frost-success-soft); }
  .cost-pill.warn { color: #92610A; background: var(--frost-warning-soft); }
  .cost-bar .cost-text { font-size: 12.5px; font-weight: 600; color: var(--frost-ink); }

  .ph-right { padding-top: 4px; }
  .example-tag { display: block; text-align: right; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 10px; }

  .btn-next, .cta { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #fff; background: var(--frost-primary); border: none; border-radius: var(--r-btn); padding: 12px 22px; cursor: pointer; box-shadow: 0 4px 16px -4px rgba(0,114,251,.4); transition: background .15s ease; }
  .btn-next:hover, .cta:hover { background: var(--frost-primary-hover); }
  .btn-next svg, .cta svg { width: 14px; height: 14px; }

  /* ---------- Mock compartido: "Así lo ve tu cliente" (igual en placeholder y en Intro) ---------- */
  .mock-kicker { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 12px; text-align: center; }
  .mock { max-width: 360px; margin: 0 auto; background: var(--frost-surface); border: 1px solid var(--frost-border); border-radius: var(--r-item); padding: 19px 20px; box-shadow: 0 10px 24px -14px rgba(15,23,42,.18); }
  .mock .m-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
  .mock .m-sub { font-size: 11.5px; color: var(--frost-muted); margin-bottom: 14px; }
  .mock .m-sep { height: 1px; background: var(--frost-border-soft); margin-bottom: 15px; }
  .mock .m-note { font-size: 10px; font-weight: 700; color: var(--frost-primary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .mock .m-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--frost-primary-soft); border: 1.5px solid var(--frost-primary); border-radius: var(--r-sm); padding: 11px 13px; }
  .mock .m-row-name { font-size: 12.5px; font-weight: 600; }
  .mock .m-row-nums { display: flex; align-items: baseline; gap: 7px; flex-shrink: 0; }
  .mock .m-old { font-size: 11.5px; color: var(--frost-faint); text-decoration: line-through; }
  .mock .m-new { font-size: 16px; font-weight: 700; color: var(--frost-primary); }
  .mock .m-row.plain { background: var(--frost-surface-muted); border: 1px solid var(--frost-border-soft); }
  .mock .m-row.plain .m-row-name { color: var(--frost-ink); }
  .mock .m-total { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--frost-muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--frost-border); }
  .mock-caption { text-align: center; font-size: 12.5px; color: var(--frost-muted); line-height: 1.6; max-width: 44ch; margin: 18px auto 0; }
  .mock-caption b { color: var(--frost-ink); font-weight: 700; }

  .format-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--frost-faint); margin-bottom: 11px; }
  .format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 18px; }
  .format-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 520px) { .format-grid { grid-template-columns: repeat(2, 1fr); } }
  .format-item { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 6px; background: var(--frost-surface-muted); border-radius: var(--r-item); text-align: center; }
  .format-item.accent { background: var(--frost-primary-wash); border: 1.5px solid var(--frost-primary); }
  .format-item .fi-icon { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; }
  .format-item .fi-icon svg { width: 15px; height: 15px; }
  .format-item .fi-label { font-size: 11px; font-weight: 600; color: var(--frost-ink); line-height: 1.25; }

  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  @media (max-width: 520px) { .type-grid { grid-template-columns: 1fr; } }
  .type-card { padding: 16px; border-radius: var(--r-item); border: 1.5px solid var(--frost-border); background: var(--frost-surface); }
  .type-card.accent { border-color: var(--frost-primary); background: var(--frost-primary-wash); }
  .type-card .t-icon { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .type-card .t-icon svg { width: 15px; height: 15px; }
  .type-card .t-title { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .type-card .t-desc { font-size: 11.5px; color: var(--frost-muted); line-height: 1.5; }
  .type-card .t-example { font-size: 11px; color: var(--frost-ink-soft); font-style: italic; margin-top: 7px; }

  /* ---------- Modal del tutorial ---------- */
  .stagewrap-modal { width: 100%; max-width: 560px; background: var(--frost-surface); border-radius: var(--r-card); box-shadow: var(--sh-md); padding: 30px 32px 26px; position: relative; }
  .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--frost-faint); }
  .step-dot .circle { width: 19px; height: 19px; border-radius: 50%; background: var(--frost-border-soft); color: var(--frost-faint); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .step-dot.done .circle, .step-dot.active .circle { background: var(--frost-primary); color: #fff; }
  .step-dot.active, .step-dot.done { color: var(--frost-ink); }
  .step-sep { width: 20px; height: 1.5px; background: var(--frost-border); }
  .step-sep.done { background: var(--frost-primary); }
  .modal-tag { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--frost-faint); }

  .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; flex-wrap: wrap; }
  .btn-back { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--frost-muted); background: none; border: none; cursor: pointer; padding: 8px 4px; }
  .btn-back svg { width: 13px; height: 13px; }

  .done-wrap { text-align: center; padding: 16px 6px 4px; }
  .done-icon { width: 62px; height: 62px; border-radius: 50%; background: var(--frost-primary-soft); color: var(--frost-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .done-icon svg { width: 27px; height: 27px; }
  .done-title { font-size: 22px; font-weight: 700; margin: 0 0 9px; }
  .done-title em { font-style: italic; font-weight: 600; color: var(--frost-primary); }
  .done-dek { font-size: 13.5px; color: var(--frost-muted); line-height: 1.55; max-width: 40ch; margin: 0 auto 22px; }
  .done-cta { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: #fff; background: var(--frost-primary); border: none; border-radius: var(--r-btn); padding: 12px 24px; cursor: pointer; box-shadow: 0 4px 16px -4px rgba(0,114,251,.4); margin-bottom: 12px; }
  .done-secondary { font-size: 12px; color: var(--frost-muted); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* ---------- Notas de diseño (nuestras, no son parte del producto) ---------- */
  .dn-box { margin-top: 16px; padding: 11px 13px; border-radius: 12px; background: #FFFBEB; border: 1px dashed var(--frost-warning); display: grid; gap: 6px; max-width: 560px; }
  .dn-box.wide { max-width: 100%; }
  .dn-box .ttl { font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #92610A; }
  .dn-box p { margin: 0 !important; font-size: 11px !important; line-height: 1.45 !important; color: #78350F !important; }
  .dn-box p b { color: #451A03; }
  body.hide-flags .dn { display: none !important; }
  .rubro-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--frost-muted); background: var(--frost-surface-muted); padding: 4px 8px; border-radius: 999px; }

  @media (max-width: 640px) {
    .toolbar { padding: 8px 10px; }
    .stage { padding: 16px 10px 40px; }
    .stagewrap-modal { padding: 22px 18px 20px; }
    .page-card { padding: 26px 20px; }
    h1.headline { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">Bocetos de activación<small>Placeholder + tutorial · calco de los bocetos aprobados</small></div>
  <div class="grp"><label>Feature</label>
    <div class="seg" id="seg-feature">
      <button data-v="resenas">Reseñas</button>
      <button data-v="gift">Gift Cards</button>
      <button data-v="dinamicos">Precios din.</button>
      <button data-v="catalogo">Catálogo</button>
      <button data-v="fichas">Fichas y preg.</button>
      <button data-v="ofertas">Ofertas</button>
    </div>
  </div>
  <div class="grp"><label>Rubro</label>
    <div class="seg" id="seg-rubro">
      <button data-v="none">Sin rubro</button>
      <button data-v="salon">Salón</button>
      <button data-v="barber">Barbería</button>
    </div>
  </div>
  <div class="grp"><label>Vista</label>
    <div class="seg" id="seg-view">
      <button data-v="placeholder">Placeholder</button>
      <button data-v="tutorial">Tutorial</button>
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#CBD5E1;cursor:pointer;user-select:none"><input type="checkbox" id="chk-flags" checked> Notas</label>
</div>

<div class="stage" id="stage"></div>

<script>
const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 6.9-1z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8S10.5 3 8 3.5 6 7 8.5 8M12 8s1.5-5 4-4.5S18 7 15.5 8"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>',
  font: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20L10 4h4l4 16M7.5 14h9"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>',
  toggle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3" fill="currentColor" stroke="none"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7" fill="currentColor" stroke="none"/><path d="M4 17l5-5 3.5 3.5L16 12l4.5 5"/></svg>',
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 12v-2a4 4 0 014-4h14M7 22l-4-4 4-4M21 12v2a4 4 0 01-4 4H3"/></svg>'
};
const RUBRO = { none: { label: 'Sin rubro', noun: 'tu negocio', tag: 'Ejemplo neutro' }, salon: { label: 'Salón', noun: 'tu salón', tag: 'Ejemplo: salón de belleza' }, barber: { label: 'Barbería', noun: 'tu barbería', tag: 'Ejemplo: barbería' } };
const fmt = n => '$' + n.toLocaleString('es-AR');

/* ---------- Piezas compartidas ---------- */
const titulo = (antes, resaltado, despues = '.') => `<h1 class="headline">${antes} <em>${resaltado}</em>${despues}</h1>`;
const tituloDone = (antes, resaltado) => `<div class="done-title">${antes} <em>${resaltado}</em>.</div>`;
const checksList = arr => `<ul class="check-list">${arr.map(t => `<li>${I.check}<span>${t}</span></li>`).join('')}</ul>`;
const costBars = arr => arr.map(c => `<div class="cost-bar"><span class="cost-pill ${c.ok ? 'ok' : 'warn'}">${c.pill}</span><span class="cost-text">${c.text}</span></div>`).join('');

const mockPrice = ({ title, sub, note, name, old, price }) => `
  <div class="mock">
    <div class="m-title">${title}</div>
    <div class="m-sub">${sub}</div>
    <div class="m-sep"></div>
    <div class="m-note">${note}</div>
    <div class="m-row"><span class="m-row-name">${name}</span><span class="m-row-nums"><span class="m-old">${fmt(old)}</span><span class="m-new">${fmt(price)}</span></span></div>
  </div>`;

const mockPlain = ({ title, sub, note, name, value }) => `
  <div class="mock">
    <div class="m-title">${title}</div>
    <div class="m-sub">${sub}</div>
    <div class="m-sep"></div>
    <div class="m-note">${note}</div>
    <div class="m-row plain"><span class="m-row-name">${name}</span><span class="m-row-nums"><span class="m-new" style="font-size:13px">${value}</span></span></div>
  </div>`;

const mockCart = ({ title, sub, note, name, price, extra, extraPrice, total }) => `
  <div class="mock">
    <div class="m-title">${title}</div>
    <div class="m-sub">${sub}</div>
    <div class="m-sep"></div>
    <div class="m-note">${note}</div>
    <div class="m-row plain"><span class="m-row-name">${name}</span><span class="m-row-nums"><span class="m-new" style="font-size:13px">${fmt(price)}</span></span></div>
    <div class="m-total"><span>+ ${extra}</span><span>${fmt(extraPrice)}</span></div>
    <div class="m-total" style="border-top:none;padding-top:0;font-weight:700;color:var(--frost-ink)"><span>Total</span><span>${fmt(total)}</span></div>
  </div>`;

const caption = html => `<p class="mock-caption">${html}</p>`;
const grid = (items, cols3) => `<div class="format-grid${cols3 ? ' cols-3' : ''}">${items.map(it =>
  `<div class="format-item${it.accent ? ' accent' : ''}"><span class="fi-icon">${it.icon}</span><span class="fi-label">${it.label}</span></div>`).join('')}</div>`;
const typeGrid = cards => `<div class="type-grid">${cards.map(c => `<div class="type-card${c.accent ? ' accent' : ''}"><span class="t-icon">${c.icon}</span><p class="t-title">${c.title}</p><p class="t-desc">${c.desc}</p><p class="t-example">${c.example}</p></div>`).join('')}</div>`;

/* ---------- Contenido por feature ----------

     feature desde el negocio; «Intro» se pone del lado del cliente («Tu cliente ve…», «Lo usa…»).

     descripción narrada.

     se nota mostrando el mecanismo propio, no explicándolo contra el de al lado.

*/

/* ---------- Estado + render ---------- */
const state = { feature: 'ofertas', rubro: 'none', view: 'placeholder', step: 0 };

function renderPlaceholder() {
  const F = FEATURES[state.feature], p = F.placeholder(state.rubro);
  const visual = p.visual || F.conoce(state.rubro).mock;
  return `
    <div class="page-card" style="width:100%;max-width:900px">
      ${p.chip ? `<span class="tag-pill">${p.chip}</span>` : ''}
      <div class="ph-grid">
        <div class="ph-left">
          <h1 class="headline">${p.headline}</h1>
          <p class="dek">${p.dek}</p>
          ${checksList(p.bullets)}
          ${costBars(p.costBars || [])}
          <button class="btn-next" data-open>${p.cta}${I.arrow}</button>
        </div>
        <div class="ph-right">
          <span class="example-tag">Ejemplo</span>
          ${visual}
        </div>
      </div>
      <div class="dn-box dn"><span class="ttl">Notas de diseño</span>
        ${(p.notes || []).map(n => `<p>${n}</p>`).join('')}
        ${(p.flags || []).map(f => `<p><span style="color:#92610A">⚑ ${f}</span></p>`).join('')}
      </div>
    </div>`;
}

const PASOS = ['Intro', 'Cómo funciona', 'Listo'];
function riel(paso) {
  return `<div class="stepper">${PASOS.map((nombre, i) => `${i > 0 ? `<span class="step-sep${i <= paso ? ' done' : ''}"></span>` : ''}<span class="step-dot${i < paso ? ' done' : i === paso ? ' active' : ''}"><span class="circle">${i < paso ? I.check.replace('<svg', '<svg width="10" height="10"') : i + 1}</span>${nombre}</span>`).join('')}</div>`;
}

function renderModal() {
  const F = FEATURES[state.feature], r = state.rubro, paso = state.step, ultimo = paso === 2;
  const c = F.conoce(r), cf = F.comoFunciona, l = F.listo;
  let body, srcLine, flagLines = [];
  if (paso === 0) {
    body = `${titulo(c.titulo[0], c.titulo[1])}<p class="dek">${c.dek}</p><p class="mock-kicker">Así lo ve tu cliente</p>${c.mock}${c.caption || ''}`;
    srcLine = c.src; flagLines = c.flags || [];
  } else if (paso === 1) {
    body = `${titulo(cf.titulo[0], cf.titulo[1])}<p class="dek">${cf.dek}</p>${cf.body}`;
    srcLine = cf.src; flagLines = cf.flags || [];
  } else {
    body = `<div class="done-wrap"><div class="done-icon">${I.check}</div>${tituloDone(l.titulo[0], l.titulo[1])}${l.dek ? `<p class="done-dek">${l.dek}</p>` : ''}<button class="done-cta" data-close>${l.cta}${I.arrow.replace('<svg', '<svg width="13" height="13"')}</button>${l.secondary ? `<div><button class="done-secondary" data-close>${l.secondary}</button></div>` : ''}</div>`;
    srcLine = null; flagLines = l.flag ? [l.flag] : [];
  }
  return `<div class="stagewrap-modal">
    <div class="modal-top">${riel(paso)}<span class="modal-tag">${F.tag}</span></div>
    <div>${body}</div>
    ${!ultimo ? `<div class="modal-footer">
      ${paso === 0 ? '<span></span>' : `<button class="btn-back" data-back>${I.back}Anterior</button>`}
      <button class="btn-next" data-next>${paso === 0 ? 'Ver cómo funciona' : 'Empezar'}${I.arrow}</button>
    </div>` : ''}
    <div class="dn-box dn wide"><span class="ttl">Notas de diseño</span>
      ${srcLine ? `<p><b>Fuente:</b> ${srcLine}</p>` : ''}
      ${flagLines.map(f => `<p><span style="color:#92610A">⚑ ${f}</span></p>`).join('')}
      <p><span class="rubro-tag">${RUBRO[r].tag}</span></p>
    </div>
  </div>`;
}

function render() {
  const el = state.view === 'placeholder' ? renderPlaceholder() : `<div style="width:100%;display:flex;justify-content:center"><div id="ov-wrap" style="width:100%;max-width:560px">${renderModal()}</div></div>`;
  $('#stage').innerHTML = el;
  ['feature', 'rubro', 'view'].forEach(k => document.querySelectorAll(`#seg-${k} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[k]))));
}
const $ = s => document.querySelector(s);

['feature', 'rubro', 'view'].forEach(k => $('#seg-' + k).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state[k] = b.dataset.v;
  if (k === 'feature' || k === 'rubro') state.step = 0;
  if (k === 'view' && b.dataset.v === 'tutorial') state.step = 0;
  render();
}));
$('#chk-flags').addEventListener('change', e => document.body.classList.toggle('hide-flags', !e.target.checked));
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-open]')) { state.view = 'tutorial'; state.step = 0; render(); }
  else if (t.closest('[data-close]')) { state.view = 'placeholder'; render(); }
  else if (t.closest('[data-next]')) { state.step = Math.min(2, state.step + 1); render(); }
  else if (t.closest('[data-back]')) { state.step = Math.max(0, state.step - 1); render(); }
});
render();
</script>
