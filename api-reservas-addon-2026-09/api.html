<style>
:root{
  --frost-primary:#0072FB;--frost-primary-hover:#005CD4;--frost-primary-soft:#EEF6FF;
  --frost-accent:#FF4658;--frost-accent-soft:#FFE3E6;--frost-accent-ink:#B4232F;
  --frost-success:#10B981;--frost-success-soft:#DDFBF1;--frost-success-ink:#047857;
  --frost-warning-soft:#FFF4CC;--frost-warning-ink:#92400E;
  --frost-ink:#0F172A;--frost-ink-soft:#3A3A3A;--frost-ink-mid:#64748B;--frost-muted:#868686;
  --frost-surface:#FFFFFF;--frost-surface-muted:#EFF3F9;--frost-border:#E2E8F0;--frost-border-soft:#F2F2F2;
  --code-bg:#0B1220;--code-panel:#111A2E;--code-line:rgba(255,255,255,0.08);--code-text:#E2E8F0;--code-dim:#7C8BA5;--code-key:#7CB6FF;--code-str:#6EE7B7;--code-num:#FBBF77;--code-bool:#F9A8D4;
  --r-sm:6px;--r-btn:10px;--r-card:16px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-weight:500;font-size:14px;line-height:1.55;color:var(--frost-ink);background:var(--frost-surface);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--frost-primary);outline-offset:2px;border-radius:var(--r-sm)}

.top{height:58px;border-bottom:1px solid var(--frost-border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:#fff;z-index:5}
.top .l{display:flex;align-items:center;gap:14px}
.top .sep{width:1px;height:22px;background:var(--frost-border)}
.top .t{font-size:13px;font-weight:600}
.top .t span{color:var(--frost-muted);font-weight:500}
.top a.back{font-size:12.5px;font-weight:600;color:var(--frost-ink-mid);text-decoration:none}
.top a.back:hover{color:var(--frost-primary)}
.base{font-size:12px;color:var(--frost-ink-mid);background:var(--frost-surface-muted);border-radius:999px;padding:4px 12px;font-weight:600}

.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--frost-border);padding:18px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:#FBFCFE}
.grp{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--frost-muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:var(--r-btn);font-size:13px;font-weight:500;color:var(--frost-ink-soft)}
.nav:hover{background:var(--frost-surface-muted)}
.nav.on{background:var(--frost-primary-soft);color:var(--frost-primary-hover);font-weight:600}
.mt{font-size:9.5px;font-weight:700;letter-spacing:.06em;width:38px;text-align:center;padding:3px 0;border-radius:5px;flex:none}
.mt.GET{background:#E0EDFF;color:var(--frost-primary-hover)}
.mt.POST{background:var(--frost-ink);color:#fff}
.mt.EVT{background:var(--frost-success-soft);color:var(--frost-success-ink)}
.mt.DOC{background:var(--frost-surface-muted);color:var(--frost-ink-mid)}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.doc{padding:34px 36px 60px}
.code{background:var(--code-bg);padding:28px 26px 60px;color:var(--code-text)}
.code-sticky{position:sticky;top:86px;display:grid;gap:16px}

.ep{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ep .mt{width:auto;padding:4px 10px;font-size:11px}
.ep .path{font-size:15px;font-weight:600;word-break:break-all}
.ep .path i{font-style:normal;color:var(--frost-primary)}
h1{font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1.15}
h1 b{font-weight:700}
.desc{font-size:14px;color:var(--frost-ink-soft);margin-top:10px;max-width:560px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--frost-surface-muted);color:var(--frost-ink-mid)}
.chip.w{background:var(--frost-ink);color:#fff}
.chip.lim{background:var(--frost-warning-soft);color:var(--frost-warning-ink)}
h3{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--frost-muted);margin:30px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--frost-border)}
.prm{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--frost-border-soft)}
.prm .n{font-size:13px;font-weight:600;word-break:break-all}
.prm .n small{display:block;font-size:11px;font-weight:500;color:var(--frost-muted);margin-top:2px}
.prm .n em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--frost-accent-ink);margin-top:3px}
.prm .d{font-size:13px;color:var(--frost-ink-soft)}
.prm .d code,.desc code,.note code{font-family:var(--sans);font-size:12px;font-weight:600;background:var(--frost-surface-muted);padding:1px 6px;border-radius:5px;color:var(--frost-ink)}
.err{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--frost-border-soft);align-items:baseline}
.err .c{font-size:12px;font-weight:700;color:var(--frost-accent-ink);background:var(--frost-accent-soft);border-radius:5px;text-align:center;padding:2px 0}
.err b{font-size:13px;font-weight:600}
.err span{display:block;font-size:12.5px;color:var(--frost-ink-mid)}
.note{margin-top:18px;display:block;background:var(--frost-primary-soft);color:var(--frost-primary-hover);border-radius:var(--r-card);padding:12px 14px;font-size:12.5px;font-weight:500}

.pane{background:var(--code-panel);border:1px solid var(--code-line);border-radius:var(--r-card);overflow:hidden}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--code-line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--code-dim);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px}
.tab:hover{color:var(--code-text)}
.tab.on{background:rgba(255,255,255,0.08);color:#fff}
.tab .st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.copy{border:1px solid var(--code-line);background:none;color:var(--code-dim);font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px}
.copy:hover{color:#fff}
pre{margin:0;padding:16px 18px;font-family:var(--sans);font-size:12.5px;line-height:1.7;white-space:pre;overflow:auto;max-height:560px;color:var(--code-text)}
.tk{color:var(--code-key)}.ts{color:var(--code-str)}.tn{color:var(--code-num)}.tb{color:var(--code-bool)}.td{color:var(--code-dim)}.tm{color:#fff;font-weight:700}.th{color:#C4B5FD}

.hide-lg{display:none}
@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .code{padding:22px 16px 40px}
  .code-sticky{position:static}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--frost-border);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;white-space:nowrap}
  .grp{display:none}
  .nav{width:auto;flex:none;padding:7px 10px}
  .doc{padding:24px 16px 36px}
  .prm{grid-template-columns:1fr;gap:4px}
  .top .t span,.base{display:none}
  h1{font-size:25px}
}
</style>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(obj){
  var j=JSON.stringify(obj,null,2),out='',last=0,re=/("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?)|\b(true|false|null)\b/g,m;
  while((m=re.exec(j))){
    out+=esc(j.slice(last,m.index));
    if(m[1])out+=m[2]?'<span class="tk">'+esc(m[1])+'</span>'+m[2]:'<span class="ts">'+esc(m[1])+'</span>';
    else if(m[3])out+='<span class="tn">'+m[3]+'</span>';
    else out+='<span class="tb">'+m[4]+'</span>';
    last=re.lastIndex;
  }
  return out+esc(j.slice(last));
}
function hlCurl(s){
  var out='',last=0,re=/("[^"]*")|^(curl|POST)\b|(-X POST|-G|-H|-d)(?= )|^([a-z-]+:)/gm,m;
  while((m=re.exec(s))){
    out+=esc(s.slice(last,m.index));
    if(m[1])out+='<span class="ts">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tm">'+m[2]+'</span>';
    else if(m[3])out+='<span class="td">'+m[3]+'</span>';
    else out+='<span class="th">'+esc(m[4])+'</span>';
    last=re.lastIndex;
  }
  return out+esc(s.slice(last));
}
function stColor(s){return s<300?'var(--frost-success)':s<500&&s!==429?'#F59E0B':'var(--frost-accent)'}

var side=document.getElementById('side'),doc=document.getElementById('doc'),code=document.getElementById('code');
var lastG='';
EP.forEach(function(e,i){
  if(e.g!==lastG){var g=document.createElement('div');g.className='grp';g.textContent=e.g;side.appendChild(g);lastG=e.g}
  var b=document.createElement('button');b.className='nav';b.dataset.i=i;
  b.innerHTML='<span class="mt '+e.m+'">'+(e.m==='EVT'?'AVISO':e.m==='DOC'?'INFO':e.m)+'</span>'+e.name;
  b.onclick=function(){show(i,true)};side.appendChild(b);
});

function pane(title,tabs){
  var id='p'+Math.random().toString(36).slice(2,7);
  var h='<div class="pane"><div class="pane-h"><div class="tabs">';
  tabs.forEach(function(t,k){h+='<button class="tab'+(k?'':' on')+'" data-p="'+id+'" data-k="'+k+'">'+(t.dot?'<span class="st" style="background:'+t.dot+'"></span>':'')+t.label+'</button>'});
  h+='</div><button class="copy" data-p="'+id+'">Copiar</button></div>';
  tabs.forEach(function(t,k){h+='<pre data-p="'+id+'" data-k="'+k+'"'+(k?' hidden':'')+'>'+t.html+'</pre>'});
  return h+'</div>';
}

function show(i,push){
  var e=EP[i];
  [].forEach.call(side.querySelectorAll('.nav'),function(n){n.classList.toggle('on',+n.dataset.i===i)});
  var h='';
  if(e.path){h+='<div class="ep"><span class="mt '+e.m+'">'+(e.m==='EVT'?'AVISO':e.m)+'</span><span class="path">'+esc(e.path).replace(/\{id\}/g,'<i>{id}</i>')+'</span></div>'}
  h+='<h1>'+e.title+'</h1><p class="desc">'+e.desc+'</p><div class="chips">';
  if(e.write)h+='<span class="chip w">Requiere clave de lectura y escritura</span>';
  else if(e.m==='GET')h+='<span class="chip">Cualquier clave</span>';
  if(e.id==='create')h+='<span class="chip lim">10 por minuto · 100 por día</span>';
  else if(e.m==='GET'||e.m==='POST')h+='<span class="chip lim">Cuenta para 60 / min · 5.000 / día</span>';
  h+='</div>';
  if(e.params.length){
    h+='<h3>'+(e.m==='EVT'?'Eventos':'Parámetros')+'</h3>';
    e.params.forEach(function(p){h+='<div class="prm"><div class="n">'+p[0]+(p[2]==='Obligatorio'?'<em>OBLIGATORIO</em>':'')+'<small>'+p[1]+(p[2]&&p[2]!=='Obligatorio'?' · '+p[2].charAt(0).toLowerCase()+p[2].slice(1):'')+'</small></div><div class="d">'+p[3]+'</div></div>'});
  }
  if(e.extra)h+=e.extra;
  var er=errs(e.errors);
  if(er.length){h+='<h3>Errores posibles</h3>';er.forEach(function(x){h+='<div class="err"><span class="c">'+x.code+'</span><div><b>'+x.id+'</b><span>'+x.text+'</span></div></div>'})}
  doc.innerHTML=h;

  var c='';
  if(e.req){
    var t=[{label:e.m==='EVT'?'Request de Ágora':'Request',html:hlCurl(e.req)}];
    if(e.body)t.push({label:e.bodyLabel||'Body',html:hl(e.body)});
    c+=pane('req',t);
    if(e.body){ /* show body tab first for POSTs */ }
  }
  var rt=e.res.map(function(r){return {label:r.label||String(r.s),dot:stColor(r.s),html:(r.h?'<span class="td">'+esc(r.h)+'</span>\n\n':'')+(r.body?hl(r.body):'')+(r.note?'<span class="td">'+esc(r.note)+'</span>':'')}});
  c+=pane('res',rt);
  code.innerHTML=c;
  if(e.body){var tb=code.querySelectorAll('.pane')[0].querySelectorAll('.tab');if(tb[1])tb[1].click()}
  if(push)history.replaceState(null,'','#'+e.id);
  if(push&&window.innerWidth<=1100)doc.scrollIntoView({behavior:'smooth'});
}
code.addEventListener('click',function(ev){
  var t=ev.target.closest('.tab');
  if(t){var p=t.dataset.p;[].forEach.call(code.querySelectorAll('.tab[data-p="'+p+'"]'),function(x){x.classList.toggle('on',x===t)});[].forEach.call(code.querySelectorAll('pre[data-p="'+p+'"]'),function(x){x.hidden=x.dataset.k!==t.dataset.k});return}
  var cp=ev.target.closest('.copy');
  if(cp){var pre=code.querySelector('pre[data-p="'+cp.dataset.p+'"]:not([hidden])');try{navigator.clipboard.writeText(pre.innerText);cp.textContent='Copiado';setTimeout(function(){cp.textContent='Copiar'},1200)}catch(e){}}
});
var start=Math.max(0,EP.findIndex(function(e){return '#'+e.id===location.hash}));
show(start===0&&!location.hash?EP.findIndex(function(e){return e.id==='create'}):start,false);
