        while (dDiff(d, r.to) >= 0) {
          const dt = parse(d), y = dt.getFullYear(), mo = dt.getMonth();
          const mStart = `${y}-${String(mo + 1).padStart(2, '0')}-01`;
          const last = new Date(y, mo + 1, 0).getDate();
          const mEnd = `${y}-${String(mo + 1).padStart(2, '0')}-${String(last).padStart(2, '0')}`;
          const from = mStart < r.from ? r.from : mStart;
          const to = mEnd > r.to ? r.to : mEnd;
          const full = from === mStart && to === mEnd;
          const l = from === to ? fD(from) : full ? MESL[mo] : `${MESL[mo]} (${parse(from).getDate()}–${parse(to).getDate()})`;
          out.push({ from, to, full, l });
          d = addD(mEnd, 1);
        }
        return out;
      }

      /* =====================================================================
         4 · CHARTS
      ===================================================================== */
      function groupedBars(days, opts) {
        // viewBox escalado uniformemente (nada de preserveAspectRatio="none": deformaba los
        // labels de los ejes). Unidades pensadas para renderizar ~1:1.4 respecto del ancho real.
        // opts.single = una sola serie (sin comparación ni neto). opts.fmt = formateador de valor:
        // el chart también lo usa Analítica, donde el eje son reservas, no pesos.
        const fmt = opts.fmt || $$;
        const fmtAx = opts.fmtAx || $k;
        const W = 1000, H = 300, PL = opts.single ? 52 : 74, PR = 10, PT = 14, PB = 34;
        const max = Math.max(1, ...days.map((d) => Math.max(d.a, d.b)));
        const step = Math.pow(10, Math.floor(Math.log10(max)));
        const top = Math.ceil(max / (step / 2)) * (step / 2);
        const iw = W - PL - PR, ih = H - PT - PB;
        const bw = iw / days.length;
        const gap = Math.min(3, bw * 0.12);
        const barW = opts.single ? Math.max(2, bw - gap * 2) : Math.max(2, (bw - gap * 3) / 2);
        let g = '';
        for (let i = 0; i <= 4; i++) {
          const y = PT + ih - (ih * i) / 4;
          g += `<line class="gl" x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}"/><text class="ax" x="${PL - 12}" y="${y + 6}" text-anchor="end">${fmtAx((top * i) / 4)}</text>`;
        }
        let b = '';
        days.forEach((d, i) => {
          const x = PL + i * bw + gap;
          const ha = (d.a / top) * ih, hb = (d.b / top) * ih;
          const tip = opts.single
            ? `<b>${fDL(d.date)}</b><div class="l"><i style="background:${opts.ca}"></i>${opts.la}<em>${fmt(d.a)}</em></div>`
            : `<b>${fDL(d.date)}</b><div class="l"><i style="background:${opts.ca}"></i>${opts.la}<em>${fmt(d.a)}</em></div><div class="l"><i style="background:${opts.cb}"></i>${opts.lb}<em>${fmt(d.b)}</em></div><div class="l" style="border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:6px">Neto<em>${fmt(d.a - d.b)}</em></div>`;
          const t = esc(tip);
          if (d.a > 0) b += `<rect class="bar" x="${x}" y="${PT + ih - ha}" width="${barW}" height="${Math.max(1.5, ha)}" rx="${Math.min(3, barW / 2)}" fill="${opts.ca}" data-t="${t}"/>`;
          if (d.b > 0) b += `<rect class="bar" x="${x + barW + gap}" y="${PT + ih - hb}" width="${barW}" height="${Math.max(1.5, hb)}" rx="${Math.min(3, barW / 2)}" fill="${opts.cb}" data-t="${t}"/>`;
          const dt = parse(d.date);
          const showLbl = days.length <= 10 || dt.getDate() === 1 || dt.getDate() % (days.length > 40 ? 10 : 5) === 0;
          if (showLbl) b += `<text class="ax" x="${x + bw / 2 - gap}" y="${H - 8}" text-anchor="middle">${dt.getDate()} ${MES[dt.getMonth()]}</text>`;
        });
        return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${b}</svg></div>`;
      }


      /* =====================================================================
         5 · COMPONENTES REUTILIZABLES
      ===================================================================== */
      const avatarFor = (name, hex) => `<div class="av" style="background:color-mix(in srgb, ${hex} 16%, #fff);color:color-mix(in srgb, ${hex} 78%, #0F172A)">${esc((name || '—').trim()[0] || '—')}</div>`;
      // Avatar del profesional: sin fotos en el prototipo, pero cada uno con su tono propio
      // dentro de la rampa del sistema (azules + slate), iniciales y anillo — como producción.
      const AV_RAMP = [
        ['#e3efff', '#00306E'], ['#dbeafe', '#005cd4'], ['#e2e8f0', '#334155'],
        ['#d7e9ff', '#0057C7'], ['#eef2f7', '#475569'],
      ];
      const iniciales = (n) => (n || '—').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      function avatarPro(name) {
        let h = 0; for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        const [bg, fg] = AV_RAMP[h % AV_RAMP.length];
        return `<div class="avp" style="background:${bg};color:${fg}">${esc(iniciales(name))}</div>`;
      }

      function statTile(o) {
        return `<div class="card tight stat clickable" ${o.go ? `onclick="${o.go}"` : ''}>
          <div class="k"><span class="ico" style="background:${o.bg}${o.ic ? '' : ''};color:${o.fg}">${o.ic}</span>${o.k}</div>
          <div class="v">${o.v}</div><div class="s">${o.s}</div></div>`;
      }


      function methodTag(k) {
        const m = METHODS[k];
        if (k === 'mp') return `<span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;color:var(--f-ink)">${MP_LOGO}Mercado Pago</span>`;
        return `<span style="display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;color:var(--f-ink)"><i style="width:8px;height:8px;border-radius:3px;background:${m.color};display:block;flex:0 0 8px"></i>${m.short}</span>`;
      }

      // Barra segmentada de proporción + filas rankeadas. La barra de arriba muestra el reparto
      // completo de un vistazo; las filas, el detalle ordenado.
      function propBar(rows, colorOf) {
        const tot = rows.reduce((s2, r) => s2 + r[1], 0) || 1;
        return `<div class="propbar">${rows.map((r) => {
          const w = (r[1] / tot) * 100;
          return w < 0.6 ? '' : `<span style="width:${w}%;background:${colorOf ? colorOf(r[0]) : 'var(--f-brand)'}" title="${esc(String(r[0]))}"></span>`;
        }).join('')}</div>`;
      }

      // Ranking completo por concepto. El corte por tipo de venta dice "Servicios 63%"; este
      // dice CUÁL servicio, que es lo que se puede accionar (precio, agenda, promo). No se
      // recorta: la card scrollea, así que los adicionales quedan alcanzables.
      function concentracion(inc) {
        const by = {};
        inc.filter((m) => m.asset !== 'manual').forEach((m) => { by[m.concept] = (by[m.concept] || 0) + m.amount; });
        return Object.entries(by).sort((a, b) => b[1] - a[1]);
      }

      function barsList(rows, opts) {
        const tot = rows.reduce((s2, r) => s2 + r[1], 0) || 1;
        const colorOf = opts.colorOf || (() => 'var(--f-brand)');
        return `${opts.prop ? propBar(rows, opts.colorOf) : ''}<div class="barsbox"><div class="bars" onscroll="marcarScroll(this)">${rows.map((r) => {
          const color = colorOf(r[0]);
          const pct = (r[1] / tot) * 100;
          return `<div class="row" onclick="${opts.go ? opts.go(r[0]) : ''}">
            <div class="meter">
              <div class="name">${opts.dot ? `<i style="background:${color}"></i>` : ''}${esc(opts.labelOf ? opts.labelOf(r[0]) : r[0])}</div>
              <div class="track"><div class="fill" style="width:${Math.max(1.5, pct)}%;background:${color}"></div></div>
            </div>
            <div class="val">${$$(r[1])}<em>${pc(r[1], tot)}%</em></div></div>`;
        }).join('')}</div><span class="fade"></span><span class="more"></span></div>`;
      }

      // El degradado y el contador solo aparecen si de verdad quedó contenido abajo.
      function marcarScroll(bars) {
        const box = bars.parentElement;
        const oculto = bars.scrollHeight - bars.clientHeight - bars.scrollTop;
        box.classList.toggle('hay-mas', oculto > 8);
        const more = box.querySelector('.more');
        if (!more) return;
        const alto = bars.firstElementChild ? bars.firstElementChild.offsetHeight : 1;
        const faltan = Math.round(oculto / alto);
        more.textContent = faltan > 0 ? `${faltan} más` : '';
      }
      function marcarScrolls() { document.querySelectorAll('.barsbox .bars').forEach(marcarScroll); }

      /* =====================================================================
         6 · VISTAS
      ===================================================================== */
      const TABS = [
        { k: 'resumen', l: 'Resumen' },
        { k: 'movimientos', l: 'Ventas' },
        { k: 'cobranzas', l: 'Por cobrar' },
        { k: 'cobros', l: 'Cobros' },
        { k: 'gastos', l: 'Gastos' },
        { k: 'comisiones', l: 'Comisiones' },
        { k: 'resultado', l: 'Resultado' },
        { k: 'arqueo', l: 'Caja' },
      ];
      // Comisiones solo existe si hay equipo. Un profesional independiente no liquida a nadie.
      const tabsVisibles = () => TABS.filter((t) => t.k !== 'comisiones' || S.persona === 'venue');
      // Tabs de los otros dos containers tocados por la propuesta (mockups, no navegables por dentro).
      const TABS_ACT = [
        { k: 'reservas', l: 'Reservas' },
        { k: 'entradas', l: 'Entradas' },
        { k: 'cursos', l: 'Cursos online' },
        { k: 'productos', l: 'Productos' },
      ];

      /* ---------------- CURVA DEL SALDO DE COMISIONES ----------------
         Un solo trazo: el saldo pendiente día a día. Sube con lo que se devenga y cae de
         golpe en cada liquidación, que es justo el impacto que se quiere ver. Una sola
         serie ⇒ sin caja de leyenda para la línea; los puntos de liquidación sí se rotulan.
         Nada de doble eje: todo está en pesos. */
      function curvaComisiones(r, sel) {
        const quienes = sel === 'all' ? STAFF : STAFF.filter((st) => inSel(sel, st));
        if (!quienes.length) return null;

        // Saldo al arrancar el período: todo lo devengado antes menos todo lo pagado antes.
        let saldo = quienes.reduce((acc, st) => acc
          + devengado(st, FROM, addD(r.from, -1)) + ajustes(st, FROM, addD(r.from, -1))
          - sum(MOVS.filter((m) => m.staffPay === st && m.date < r.from)), 0);

        const dias = [];
        let d = r.from;
        while (dDiff(d, r.to) >= 0) { dias.push(d); d = addD(d, 1); }
        if (dias.length < 2) return null;

        const pts = dias.map((day) => {
          const dev = quienes.reduce((acc, st) => acc + devengado(st, day, day) + ajustes(st, day, day), 0);
          const pag = sum(MOVS.filter((m) => m.date === day && quienes.includes(m.staffPay)));
          saldo = saldo + dev - pag;
          return { day, v: Math.max(0, Math.round(saldo)), pag };
        });

        // Sin columna de valores a la izquierda: el número que importa está rotulado sobre
        // el último punto y el resto sale del tooltip. Las guías solas ya dan la escala.
        const W = 960, H = 300, PL = 10, PR = 16, PT = 30, PB = 30;
        const max = Math.max(...pts.map((p) => p.v)) || 1;
        const tope = Math.ceil(max / 1e6) * 1e6 || max;
        const x = (i) => PL + (i / (pts.length - 1)) * (W - PL - PR);
        const y = (v) => PT + (1 - v / tope) * (H - PT - PB);

        const linea = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
        const area = `${linea} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;

        // Ejes: 4 líneas de referencia, recesivas, con el valor a la izquierda.
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => {
          const v = tope * f;
          return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" stroke="var(--f-hair)" stroke-width="1"/>`;
        }).join('');

        const cadaX = Math.max(1, Math.round(pts.length / 7));
        // El último siempre se rotula, pero si el anterior le queda encima, ese se saltea.
        const ultimoRot = pts.length - 1;
        const chocan = ultimoRot % cadaX !== 0 && (ultimoRot - Math.floor(ultimoRot / cadaX) * cadaX) < cadaX * 0.55;
        const xlab = pts.map((p, i) => ((i % cadaX === 0 && !(chocan && i === Math.floor(ultimoRot / cadaX) * cadaX)) || i === ultimoRot)
          ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}" class="ax">${fD(p.day)}</text>` : '').join('');

        const liqs = pts.map((p, i) => p.pag > 0
          ? `<g><line x1="${x(i).toFixed(1)}" y1="${PT}" x2="${x(i).toFixed(1)}" y2="${y(0)}" stroke="var(--f-coral)" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
             <circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="5" fill="var(--f-coral)" stroke="var(--f-card)" stroke-width="2"/></g>` : '').join('');

        const hover = pts.map((p, i) => {
          const w = (W - PL - PR) / (pts.length - 1);
          const txt = `${fDL(p.day)} · saldo ${$$(p.v)}${p.pag ? ` · liquidaste ${$$(p.pag)}` : ''}`;
          return `<rect x="${(x(i) - w / 2).toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${(y(0) - PT).toFixed(1)}" fill="transparent" class="hz"
            onmouseenter="tipOn(event, ${jsStr(txt)})" onmousemove="tipMove(event)" onmouseleave="tipOff()"></rect>`;
        }).join('');

        const ult = pts[pts.length - 1];
        return {
          pagos: pts.filter((p) => p.pag > 0).length,
          totalPagado: pts.reduce((a2, p) => a2 + p.pag, 0),
          svg: `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Evolución del saldo de comisiones sin liquidar">
            <defs><linearGradient id="gcom" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--f-brand)" stop-opacity=".18"/>
              <stop offset="100%" stop-color="var(--f-brand)" stop-opacity="0"/></linearGradient></defs>
            ${ticks}
            <path d="${area}" fill="url(#gcom)"/>
            <path d="${linea}" fill="none" stroke="var(--f-brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${liqs}
            <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(ult.v).toFixed(1)}" r="4" fill="var(--f-brand)" stroke="var(--f-card)" stroke-width="2"/>
            <text x="${(W - PR).toFixed(1)}" y="${(PT - 12).toFixed(1)}" text-anchor="end" class="axv">${$$(ult.v)}</text>
            ${xlab}${hover}
          </svg></div>`,
        };
      }

      /* ---------------- FILTROS EN LA CABECERA DE LA TABLA ----------------
         Las dimensiones categóricas (tipo, medio, profesional, origen) se filtran donde se
         leen: en la columna. El popover es uno solo, `position:fixed` y colgado del body,
         porque la tabla vive dentro de un contenedor con overflow que lo recortaría.
         Ordenar queda para las columnas donde ordenar sirve (fecha, cliente, monto). */
      let COLF = null;

      function thF(k, label) {
        const d = fieldDefs()[k];
        if (!d) return '';
        const n = d.v === 'all' || !Array.isArray(d.v) ? 0 : d.v.length;
        return `<th class="colf ${n ? 'on' : ''}" data-colf="${k}" onclick="toggleColF('${k}')" title="Filtrar por ${esc(d.l.toLowerCase())}">
          <span class="cf">
            <svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.4V19l-3.6-2v-4.6z"/></svg>
            ${esc(label)}${n ? `<em>${n}</em>` : ''}
            <svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </th>`;
      }

      function toggleColF(k) { COLF = COLF === k ? null : k; pintarColF(); }

      function pickColF(k, v) {
        const d = fieldDefs()[k];
        if (!d.multi) { d.set(v); COLF = null; render(); pintarColF(); return; }
        if (v === 'all') { d.set('all'); render(); pintarColF(); return; }
        const cur = d.v === 'all' ? [] : d.v.slice();
        const i = cur.indexOf(v);
        if (i >= 0) cur.splice(i, 1); else cur.push(v);
        d.set(cur.length ? cur : 'all');
        render(); pintarColF();
      }

      function pintarColF() {
        const box = el('colpop');
        const anchor = COLF && document.querySelector(`[data-colf="${COLF}"]`);
        if (!COLF || !anchor) { box.classList.remove('on'); COLF = null; return; }
        const d = fieldDefs()[COLF];
        const activo = d.v !== 'all' && Array.isArray(d.v) && d.v.length;
        box.innerHTML = `
          <div class="cp-h">${esc(d.l)}${activo ? `<button class="cp-x" onclick="event.stopPropagation();pickColF('${COLF}','all')">Limpiar</button>` : ''}</div>
          <div class="cp-b">${(d.multi ? [['all', d.allLabel]] : []).concat(d.o).map(([v, l]) => {
            const on = d.multi ? (v === 'all' ? d.v === 'all' : inSel(d.v, v) && d.v !== 'all') : d.v === v;
            return `<button class="fopt ${on ? 'on' : ''}" onclick="event.stopPropagation();pickColF('${COLF}', ${jsStr(v)})"><span>${l}</span>${on ? ICO.check : ''}</button>`;
          }).join('')}</div>
          ${d.multi ? `<div class="cp-f"><button class="btn pri sm" onclick="event.stopPropagation();COLF=null;pintarColF()">Listo</button></div>` : ''}`;
        box.classList.add('on');
        const r = anchor.getBoundingClientRect();
        const w = Math.max(210, Math.min(280, box.offsetWidth || 240));
        box.style.width = w + 'px';
        box.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)) + 'px';
        const abajo = window.innerHeight - r.bottom;
        const h = box.offsetHeight;
        box.style.top = (abajo > h + 16 || r.top < h + 16 ? r.bottom + 6 : r.top - h - 6) + 'px';
      }
      window.addEventListener('scroll', () => { if (COLF) pintarColF(); }, true);
      window.addEventListener('resize', () => { if (COLF) pintarColF(); });
      document.addEventListener('click', (e) => {
        if (DP && !e.target.closest('.dpwrap')) { DP = false; render(); }
        if (!COLF) return;
        if (e.target.closest('#colpop') || e.target.closest('[data-colf]')) return;
        COLF = null; pintarColF();
      });

      /* ---------------- SELECTOR DE FECHAS ----------------
         Espeja el CalendarDatePicker de producción: barra ancha con el rango elegido y,
         al abrirla, atajos a la izquierda y calendario a la derecha. El rango a medida se
         arma con dos clicks (desde / hasta) y queda guardado en RANGES.custom. */
      let DP = false, DPMES = TODAY.slice(0, 7), DPINI = null;

      function toggleDP() { DP = !DP; if (DP) { DPMES = mesMas(RANGES[S.range].to.slice(0, 7), -1); DPINI = null; } render(); }
      function pickPreset(k) { S.range = k; S.movPage = 1; S.cobPage = 1; DP = false; render(); }
      function mesDP(n) {
        const [y, m] = DPMES.split('-').map(Number);
        const d = new Date(Date.UTC(y, m - 1 + n, 1));
        DPMES = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
        render();
      }
      function pickDia(day) {
        if (!DPINI || day < DPINI) { DPINI = day; render(); return; }
        RANGES.custom = { label: 'Personalizado', from: DPINI, to: day };
        S.range = 'custom'; S.movPage = 1; S.cobPage = 1; DPINI = null; DP = false; render();
      }

      // Dos meses juntos: armar un rango que cruza el cambio de mes no debería obligar
      // a navegar en el medio de la selección.
      const mesMas = (mes, n) => {
        const [y2, m2] = mes.split('-').map(Number);
        const d = new Date(Date.UTC(y2, m2 - 1 + n, 1));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
      };
      function calendarioDP() {
        return `<div class="dpcals">
          ${mesDPHTML(DPMES, 'izq')}${mesDPHTML(mesMas(DPMES, 1), 'der')}
          <p class="dphint">${DPINI ? `Desde el <b>${fDL(DPINI)}</b> — elegí el día de cierre.` : 'Clickeá el primer día y después el último para armar un rango a medida.'}</p>
        </div>`;
      }
      function mesDPHTML(DPMES, lado) {
        const [y, m] = DPMES.split('-').map(Number);
        const primero = new Date(Date.UTC(y, m - 1, 1));
        const dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const offset = (primero.getUTCDay() + 6) % 7; // lunes primero
        const r = RANGES[S.range];
        const celdas = [];
        for (let i = 0; i < offset; i++) celdas.push('<span></span>');
        for (let d = 1; d <= dias; d++) {
          const day = `${DPMES}-${String(d).padStart(2, '0')}`;
          const futuro = day > TODAY;
          const enRango = !DPINI && day >= r.from && day <= r.to;
          const esIni = DPINI === day;
          celdas.push(`<button class="dpd ${enRango ? 'in' : ''} ${esIni ? 'ini' : ''} ${day === r.from || day === r.to ? 'bd' : ''}"
            ${futuro ? 'disabled' : `onclick="event.stopPropagation();pickDia('${day}')"`}>${d}</button>`);
        }
        const mesRaw = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        const nombreMes = mesRaw[0].toUpperCase() + mesRaw.slice(1);
        const flecha = (n, dis, lbl) => `<button ${dis ? 'disabled' : `onclick="event.stopPropagation();mesDP(${n})"`} aria-label="${lbl}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${n < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6 6-6'}"/></svg></button>`;
        return `<div class="dpcal">
          <div class="dpnav">
            ${lado === 'izq' ? flecha(-1, false, 'Mes anterior') : '<span></span>'}
            <b>${nombreMes}</b>
            ${lado === 'der' ? flecha(1, DPMES >= TODAY.slice(0, 7), 'Mes siguiente') : '<span></span>'}
          </div>
          <div class="dpdow">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div>
          <div class="dpgrid">${celdas.join('')}</div>
        </div>`;
      }

      function dateBar() {
        const r = RANGES[S.range];
        const nombre = PRESETS.includes(S.range) ? r.label : 'Rango a medida';
        return `<div class="dpwrap ${DP ? 'open' : ''}">
          <button class="dpbar" onclick="event.stopPropagation();toggleDP()">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span class="lb">${esc(nombre)}</span>
            <span class="rg">${fD(r.from)} <i>→</i> ${fD(r.to)}</span>
            <svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          ${DP ? `<div class="dppop" onclick="event.stopPropagation()">
            <div class="dppresets">
              <p class="k">Atajos</p>
              ${PRESETS.map((k) => `<button class="${S.range === k ? 'on' : ''}" onclick="pickPreset('${k}')">${RANGES[k].label}</button>`).join('')}
            </div>
            ${calendarioDP()}
          </div>` : ''}
        </div>`;
      }

      /* ---------------- ACCIONABLES DEL RESUMEN ----------------
         El Resumen cuenta qué pasó; esto dice qué hacer. Cada línea es un hecho derivado
         del ledger o del estado de la caja: si no es cierta, la línea no existe. Nada de
         alertas de relleno, y nada de antigüedad de deuda (decisión JP, 6/ago). */
      // String seguro para meter dentro de un onclick="..." del HTML.
      const jsStr = (v) => esc("'" + String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'");
      const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
      const rangoPrevio = (r) => {
        const dias = dDiff(r.from, r.to) + 1;
        return { from: addD(r.from, -dias), to: addD(r.from, -1) };
      };
      function accionables() {
        const r = RANGES[S.range], ms = scope();
        const out = [];

        // 1 · Ventas entregadas que todavía no se cobraron.
        const ab = activeRecv();
        if (ab.length) {
          const tot = ab.reduce((s2, x) => s2 + saldoOf(x), 0);
          const sinSena = ab.filter((x) => !x.paid).length;
          out.push({ t: 'cobro', ic: ICO.alert, k: $$(tot),
            d: `en ${ab.length} venta${ab.length === 1 ? '' : 's'} entregada${ab.length === 1 ? '' : 's'} que todavía no cobraste${sinSena ? ` · ${sinSena} sin ninguna seña` : ''}`,
            a: 'Ver por cobrar', go: `go('cobranzas')` });
        }

        // 2 · Lo que le debés al equipo.
        if (S.persona === 'venue') {
          const con = STAFF.filter((st) => saldoComision(st) > 0);
          const tot = con.reduce((s2, st) => s2 + saldoComision(st), 0);
          if (tot > 0) out.push({ t: 'equipo', ic: ICO.up, k: $$(tot),
            d: `de comisiones sin liquidar · ${con.length} profesional${con.length === 1 ? '' : 'es'} con saldo abierto`,
            a: 'Liquidar', go: `go('comisiones')` });
        }

        // 3 · La caja quedó abierta.
        if (CAJA_ABIERTA) out.push({ t: 'caja', ic: ICO.wallet, k: 'Caja abierta',
          d: `desde las ${APERTURA.hora}. Al terminar el día contás el efectivo y la cerrás.`,
          a: 'Ir a Caja', go: `go('arqueo')` });

        // 4 · El último arqueo no coincidió.
        const cierres = sessionsIn({ from: '2026-01-01', to: TODAY });
        const ult = cierres[0];
        if (ult && ult.cnt !== ult.exp) {
          const d = ult.cnt - ult.exp;
          out.push({ t: 'caja', ic: ICO.alert, k: `${d > 0 ? 'Sobró' : 'Faltó'} ${$$(Math.abs(d))}`,
            d: `en el cierre del ${fDL(ult.date)}${ult.why ? ` · ${ult.why.toLowerCase()}` : ''}`,
            a: 'Ver cierres', go: `go('arqueo')` });
        }

        // 5 · Gastaste más de lo que entró.
        const neto = sum(income(ms)) - sum(refunds(ms)) - sum(expenses(ms));
        if (neto < 0) out.push({ t: 'rojo', ic: ICO.up, k: $$(Math.abs(neto)),
          d: `de resultado negativo: en ${RANGES[S.range].label.toLowerCase()} salió más plata de la que entró.`,
          a: 'Ver resultado', go: `go('resultado')` });

        // 6 · Una categoría de gasto que se disparó contra el período anterior de igual largo.
        const prev = rangoPrevio(r);
        const gAhora = byKey(expenses(ms), 'cat');
        const msPrev = MOVS.filter((m) => inRange(m, prev) && inSel(S.staff, m.staff));
        const gAntes = Object.fromEntries(byKey(expenses(msPrev), 'cat'));
        const totG = gAhora.reduce((s2, x) => s2 + x[1], 0) || 1;
        gAhora.forEach(([k, v]) => {
          const antes = gAntes[k] || 0;
          if (antes > 0 && v >= antes * 1.5 && v / totG >= 0.08) {
            out.push({ t: 'gasto', ic: ICO.up, k: `+${Math.round(((v - antes) / antes) * 100)}%`,
              d: `en <b>${(ECATS.find((c) => c.k === k) || { label: k }).label}</b> contra el período anterior · ${$$(antes)} → ${$$(v)}`,
              a: 'Ver gastos', go: `go('gastos')` });
          }
        });

        // 7 · Un gasto fijo cuyo día habitual ya pasó y este mes no se registró.
        const mes = TODAY.slice(0, 7), dia = Number(TODAY.slice(8));
        [['alquiler', 5], ['servicios', 12], ['impuestos', 20]].forEach(([cat, d]) => {
          if (dia <= d) return;
          const hay = MOVS.some((m) => m.dir === 'out' && m.cat === cat && m.date.slice(0, 7) === mes);
          if (!hay) out.push({ t: 'gasto', ic: ICO.alert, k: 'Falta un gasto fijo',
            d: `<b>${(ECATS.find((c) => c.k === cat) || { label: cat }).label}</b> se registra todos los meses cerca del ${d} y este mes no está. Sin él, el resultado se ve mejor de lo que es.`,
            a: 'Registrar gasto', go: `openGasto()` });
        });

        // 8 · Efectivo cargado con la caja cerrada: entra recién en el próximo arqueo.
        if (!CAJA_ABIERTA) {
          const ef = MOVS.filter((m) => m.date === TODAY && m.method === 'ef' && m.src === 'local');
          if (ef.length) out.push({ t: 'caja', ic: ICO.wallet, k: $$(sum(ef)),
            d: `en efectivo registrado hoy con la caja cerrada · entra en el próximo arqueo`,
            a: 'Abrir caja', go: `go('arqueo')` });
        }
        return out;
      }

      /* ---------------- RESUMEN ---------------- */
      function vResumen() {
        const ms = scope(), r = RANGES[S.range];
        const inc = income(ms), exp = expenses(ms), ref = refunds(ms);
        const bruto = sum(inc), gast = sum(exp), dev = sum(ref);
        const neto = bruto - dev - gast;
        // "Por cobrar" es el saldo abierto TOTAL (un balance, no un flujo), mientras que el
        // "sin cobrar" de Ventas totales es solo el de las ventas hechas EN el período. Los dos
        // números son correctos y distintos: acá se explicita la relación para que se vea la resta.
        const abiertos = activeRecv();
        const porCobrar = abiertos.reduce((s2, x) => s2 + saldoOf(x), 0);
        const pcAntes = abiertos.filter((x) => !inRange(x, r)).reduce((s2, x) => s2 + saldoOf(x), 0);

        // Ventas del período: lo que entró + lo que quedó abierto de esas mismas ventas.
        const pend = pendRows();
        const pendTot = sum(pend);
        const vendido = bruto + pendTot;

        // Las 3 tablas de distribución miran el mismo universo, elegido con el toggle.
        const vend = S.dist === 'vendido';
        const dist = vend ? inc.concat(pend) : inc;
        const dl = vend ? 'Ventas' : 'Cobros';
        const byMethod = byKey(dist, 'method');
        const byAsset = byKey(dist, 'asset');
        const byStaff = byKey(dist.filter((m) => m.staff), 'staff');
        const top = concentracion(dist);

        const acts = accionables();
        return `
        ${acts.length ? `<div class="sec"><div class="card actbox">
          <div class="adhead bare"><h4>Necesita tu <strong>atención</strong></h4>
            <span class="cap">${acts.length} item${acts.length === 1 ? '' : 's'} para revisar</span></div>
          ${acts.map((a) => `<button class="actrow" onclick="${a.go}">
            <span class="ai t-${a.t}">${a.ic}</span>
            <span class="at"><b>${a.k}</b><span>${a.d}</span></span>
            <span class="aa">${a.a}${CHEV_R}</span>
          </button>`).join('')}
        </div></div>` : ''}

        <div class="grid g5 statrow sec">
          ${statTile({ k: 'Ventas totales', v: $$(vendido), s: pendTot ? `<b>${$$(pendTot)}</b> todavía sin cobrar` : 'Todo cobrado', ic: ICO.bag, bg: '#eef0ff', fg: '#4338ca', go: `go('movimientos')` })}
          ${statTile({ k: 'Cobrado', v: $$(bruto), s: `<b>${inc.length}</b> cobro${inc.length === 1 ? '' : 's'} en el período`, ic: ICO.down, bg: '#e8fbf5', fg: '#07806a', go: `go('cobros')` })}
          ${statTile({ k: 'Por cobrar', v: $$(porCobrar), s: pcAntes
            ? `<b>${$$(pendTot)}</b> de este período`
            : `${abiertos.length} cobrable${abiertos.length === 1 ? '' : 's'} abierto${abiertos.length === 1 ? '' : 's'}`, ic: ICO.alert, bg: '#fff2f3', fg: '#b3162a', go: `go('cobranzas')` })}
          ${statTile({ k: 'Gastos', v: $$(gast), s: `<b>${exp.length}</b> gasto${exp.length === 1 ? '' : 's'} registrado${exp.length === 1 ? '' : 's'}`, ic: ICO.up, bg: '#fff2f3', fg: '#b3162a', go: `go('gastos')` })}
          ${statTile({ k: 'Neto del período', v: $$(neto), s: 'Cobrado menos gastos', ic: ICO.wallet, bg: '#eef6ff', fg: '#005cd4', go: `go('resultado')` })}
        </div>

        <div class="dhead">
          <div class="dh-t">Distribución de <b>${vend ? 'todo lo vendido' : 'solo lo cobrado'}</b>${vend && pendTot ? ` — incluye ${$$(pendTot)} que todavía no entraron` : ''}</div>
          <div class="lseg">
            <button class="${vend ? 'on' : ''}" onclick="setDist('vendido')">Todo lo vendido</button>
            <button class="${vend ? '' : 'on'}" onclick="setDist('cobrado')">Solo lo cobrado</button>
          </div>
        </div>

        <div class="grid g2 top sec">
          <div class="card">
            <h3>${dl} por medio</h3>
            <p class="cap">${vend ? 'Con qué te paga la gente. Lo que todavía no entró no tiene medio: va en <b>Sin cobrar</b>.' : 'Con qué te paga la gente. Clickeá una fila para ver esos movimientos.'}</p>
            ${barsList(byMethod, { prop: true, colorOf: (k) => (METHODS[k] ? METHODS[k].color : 'var(--f-ink-whisper)'), labelOf: (k) => (METHODS[k] ? METHODS[k].label : 'Sin cobrar'), go: (k) => (METHODS[k] ? `goMov({method:['${k}']})` : `go('cobranzas')`) })}
          </div>
          <div class="card">
            <h3>${dl} por tipo de venta</h3>
            <p class="cap">${vend ? 'Qué vendiste en el período, esté cobrado o no.' : 'De qué tipo de venta vino la plata que entró. Solo lo cobrado.'}</p>
            ${barsList(byAsset, { labelOf: (k) => (ASSETS[k] ? ASSETS[k].label : k), go: (k) => `goMov({asset:['${k}']})` })}
          </div>
        </div>

        <div class="grid g2 top sec">
          ${top.length ? `<div class="card">
            <h3>${dl} por concepto</h3>
            <p class="cap">${vend ? 'Todo lo vendido' : 'Solo lo cobrado'} del período por concepto, no por categoría. Clickeá una fila para ver esas ventas.</p>
            ${barsList(top, { labelOf: (k) => k, go: (k) => `goMov({q:${jsStr(k)}})` })}
          </div>` : ''}
          ${S.persona === 'venue' && byStaff.length ? `<div class="card">
            <h3>${dl} por profesional</h3>
            <p class="cap">Solo lo que tiene profesional asignado. Cursos, capacitaciones, descargables y gift cards no cuentan acá.</p>
            ${barsList(byStaff, { go: (k) => `goMovStaff('${k}')` })}
          </div>` : ''}
        </div>


`;
      }

      /* ---------------- POR COBRAR ----------------
         Sin fechas de vencimiento ni seguimiento: una lista de lo que falta entrar, nada más. */
      function vCobranzas() {
        const act = activeRecv();
        const total = act.reduce((s, r) => s + saldoOf(r), 0);
        const conSena = act.filter((r) => r.paid > 0);
        const filtered = filterRecv();
        return `
        <div class="grid g2 sec">
          ${statTile({ k: 'Total por cobrar', v: $$(total), s: `${act.length} cobrable${act.length === 1 ? '' : 's'} abierto${act.length === 1 ? '' : 's'} · todo el historial`, ic: ICO.doc, bg: '#eef6ff', fg: '#005cd4' })}
          ${statTile({ k: 'Ya tienen seña', v: $$(conSena.reduce((s, r) => s + r.paid, 0)), s: `<b>${conSena.length} de ${act.length}</b> pagaron una parte`, ic: ICO.check, bg: '#e8fbf5', fg: '#07806a' })}
        </div>

        <div class="sec">
          <div class="card tcard">
            ${tbar('buscarRecv', `${filtered.length} de ${act.length} cobrable${act.length === 1 ? '' : 's'}`)}
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                <th style="padding-left:18px">${Z().Cliente}</th>
                ${thF('origin', 'Origen')}
                <th class="cw">Concepto</th>
                ${S.persona === 'venue' ? thF('staff', 'Profesional') : ''}
                <th class="r">Total</th><th class="r">Cobrado</th><th class="r">Falta cobrar</th>
                <th style="padding-right:18px"></th>
              </tr></thead>
              <tbody>${filtered.length ? filtered.map(rowRecv).join('') : `<tr><td colspan="${S.persona === 'venue' ? 8 : 7}"><div class="empty"><b>Nada por acá</b>No hay cobrables que cumplan con este filtro.</div></td></tr>`}</tbody>
              ${filtered.length ? `<tfoot><tr><td colspan="${S.persona === 'venue' ? 6 : 5}" style="padding-left:18px">${filtered.length} cobrable${filtered.length === 1 ? '' : 's'} en pantalla</td><td class="r">${$$(filtered.reduce((s, r) => s + saldoOf(r), 0))}</td><td></td></tr></tfoot>` : ''}
            </table></div>
          </div>
        </div>

        <div class="sec"><div class="note">
          <b>Es una foto, no una agenda.</b> Muestra cuánto falta entrar y de quién, pero todavía no persigue el cobro:
          sin recordatorios automáticos ni estados de seguimiento. Cuando te paguen, registrás el cobro y la fila se cierra.
        </div></div>
`;
      }

      // Sin recorte por período: el saldo abierto es un balance, no un flujo del rango.
      function filterRecv() {
        let rows = activeRecv();
        rows = rows.filter((r) => inSel(S.cobF.origin, r.origin));
        if (S.persona === 'venue') rows = rows.filter((r) => inSel(S.staff, r.staff));
        const q = S.cobF.q.trim().toLowerCase();
        if (q) rows = rows.filter((r) => (r.client + ' ' + r.concept + ' ' + r.id).toLowerCase().includes(q));
        return rows.sort((a, b) => saldoOf(b) - saldoOf(a));
      }

      function rowRecv(r) {
        const hue = r.paid > 0 ? '#0072FB' : '#475569';
        return `<tr class="hoverable" onclick="openRecv('${r.id}')">
          <td style="padding-left:18px"><div class="who">${avatarFor(r.client, hue)}<div class="t"><b>${esc(r.client)}</b><span class="mono">${r.phone}</span></div></div></td>
          <td><span class="chip mute">${ORIGIN_LABEL[r.origin]}</span></td>
          <td class="cw" style="font-weight:600">${esc(r.concept)}</td>
          ${S.persona === 'venue' ? `<td style="font-size:12.5px;color:${r.staff ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${r.staff || '—'}</td>` : ''}
          <td class="r amt" style="font-weight:600;color:var(--f-ink-mid)">${$$(r.total)}</td>
          <td class="r amt" style="font-weight:600;color:var(--f-ink-mid)">${r.paid ? $$(r.paid) : '—'}</td>
          <td class="r amt">${$$(saldoOf(r))}</td>
          <td style="padding-right:18px" onclick="event.stopPropagation()">
            <div style="display:flex;gap:6px;justify-content:flex-end">
              <button class="btn sm" onclick="toast('Cobro registrado · ${$$(saldoOf(r))}')">Registrar cobro</button>
            </div></td></tr>`;
      }

      /* ---------------- MOVIMIENTOS ---------------- */
      function filterMovs() {
        const f = S.movF;
        // Ventas es la lista de lo que se vendió y cobró, más lo que se ató a esas ventas
        // (devoluciones). Los gastos y las liquidaciones al equipo NO entran acá: viven en
        // la sección Gastos, que es su lugar (decisión JP, 20/ago).
        // Un ingreso manual entra al resultado pero no es una venta: no va en esta lista.
        let rows = scope().filter((m) => (m.dir === 'in' || m.asset === 'refund') && m.asset !== 'manual');
        rows = rows.filter((m) => inSel(f.method, m.method));
        rows = rows.filter((m) => inSel(f.asset, m.asset));
        const q = f.q.trim().toLowerCase();
        if (q) rows = rows.filter((m) => (m.concept + ' ' + (m.client || '') + ' ' + (m.staff || '') + ' ' + m.id).toLowerCase().includes(q));
        const k = S.movSort.k, dir = S.movSort.dir;
        rows.sort((a, b) => {
          let va = a[k], vb = b[k];
          if (k === 'date') { va = a.date + a.time; vb = b.date + b.time; }
          if (k === 'asset') { va = (ASSETS[a.asset] || {}).label || a.asset; vb = (ASSETS[b.asset] || {}).label || b.asset; }
          if (k === 'client') { va = a.client || 'zzz'; vb = b.client || 'zzz'; }
          if (k === 'amount') return (va - vb) * dir;
          return String(va || '').localeCompare(String(vb || '')) * dir;
        });
        return rows;
      }

      function vMovimientos() {
        const rows = filterMovs();
        const shown = rows.slice(0, S.movPage * 25);
        const tin = sum(rows.filter((m) => m.dir === 'in' && m.st === 'ok'));
        const tout = sum(rows.filter((m) => m.dir === 'out'));
        const th = (k, l, cls) => `<th class="sortable ${cls || ''} ${S.movSort.k === k ? 'act' : ''}" onclick="sortMov('${k}')">${l} <span class="ar">${S.movSort.k === k ? (S.movSort.dir === 1 ? '↑' : '↓') : '↕'}</span></th>`;

        return `
        <div class="sec">
          <p class="lede">Cada venta cobrada, una por una — las que entran solas y las que registrás a mano.</p>
          <div class="card tcard">
            ${tbar('buscarMov', `${rows.length} venta${rows.length === 1 ? '' : 's'}`)}
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                ${th('date', 'Fecha', '')}
                ${thF('asset', 'Tipo')}
                <th class="cw">Concepto</th>
                ${th('client', Z().Cliente)}
                ${S.persona === 'venue' ? thF('staff', 'Profesional') : ''}
                ${thF('method', 'Medio')}
                <th>Cuenta</th>
                ${th('amount', 'Monto', 'r')}
                <th class="r" style="padding-right:18px">Cobro pendiente</th>
              </tr></thead>
              <tbody>${shown.length ? shown.map(rowMov).join('') : `<tr><td colspan="${S.persona === 'venue' ? 9 : 8}"><div class="empty"><b>Sin ventas</b>Probá ampliar el rango o limpiar los filtros.</div></td></tr>`}</tbody>
              <tfoot><tr>
                <td colspan="${S.persona === 'venue' ? 7 : 6}">
                  ${rows.length} venta${rows.length === 1 ? '' : 's'} · mostrando ${shown.length}
                  <span style="font-weight:500;color:var(--f-ink-mid);margin-left:14px">
                    <span style="color:var(--f-success-text)">+${$$(tin)}</span> cobrado${tout ? ` · <span style="color:var(--f-coral-text)">−${$$(tout)}</span> devueltos` : ''}</span>
                </td>
                <td class="r amt" style="font-size:15px">${$$(tin - tout)}</td>
                <td class="r amt" style="padding-right:18px;color:var(--f-warning-text)">${(() => { const t = shown.reduce((s2, m) => s2 + pendDe(m), 0); return t ? $$(t) : '—'; })()}</td>
              </tr></tfoot>
            </table></div>
          </div>
          ${shown.length < rows.length ? `<div style="text-align:center;margin-top:22px"><button class="btn" onclick="S.movPage++;render()">Mostrar ${Math.min(25, rows.length - shown.length)} más</button></div>` : ''}
        </div>`;
      }

      function rowMov(m) {
        const meth = METHODS[m.method];
        const label = m.dir === 'out' ? (m.asset === 'gasto' ? (ECATS.find((c) => c.k === m.cat) || {}).label : 'Devolución') : ASSETS[m.asset] ? ASSETS[m.asset].label : m.asset;
        const acc = { caja: 'Caja', banco: 'Banco', mp: mpTag() }[m.account];
        const pend = pendDe(m);
        return `<tr class="hoverable" onclick="openMov(${m.id})">
          <td><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
          <td><span class="chip ${m.dir === 'out' ? 'bad' : 'mute'}">${esc(label || '—')}</span></td>
          <td class="cw" style="font-weight:600;font-size:13px;color:var(--f-ink)">${esc(m.concept)}</td>
          <td style="font-size:12.5px;color:${m.client ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.client ? esc(m.client) : '—'}</td>
          ${S.persona === 'venue' ? `<td style="font-weight:600;color:${m.staff || m.staffPay ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.staff || m.staffPay || '—'}</td>` : ''}
          <td>${methodTag(m.method)}</td>
          <td style="font-size:12.5px;white-space:nowrap">${m.dir === 'out' ? 'Sale de ' + acc : acc}</td>
          <td class="r amt ${m.dir === 'out' ? 'out' : ''}">${m.dir === 'out' ? '−' : '+'}${$$(m.amount)}</td>
          <td class="r amt" style="padding-right:18px;color:${pend ? 'var(--f-warning-text)' : 'var(--f-ink-mid)'}">${pend ? $$(pend) : '—'}</td></tr>`;
      }

      /* ---------------- COBROS ---------------- */
      function vCobros() {
        let body = '';

          const q = S.cobQ.trim().toLowerCase();
          const ms = income(scope())
            .filter((m) => !q || (m.concept + ' ' + (m.client || '') + ' ' + (m.staff || '')).toLowerCase().includes(q))
            .slice().sort((a, b) => (a.date === b.date ? b.id - a.id : a.date < b.date ? 1 : -1));
          const refs = refunds(scope());
          const manual = ms.filter((m) => m.asset === 'manual');
          const shown = ms.slice(0, S.cobPage * 25);
          const venue = S.persona === 'venue';
          const cols = venue ? 8 : 7;
          const ACC = { caja: 'Caja', banco: 'Banco', mp: mpTag('Billetera') };
          body = `
          <div class="hero">
            <span class="n">${$$(sum(ms))}</span>
            <span class="d">en <b>${ms.length}</b> cobro${ms.length === 1 ? '' : 's'}${refs.length ? ` · <b>${$$(sum(refs))}</b> devueltos` : ''}</span>
          </div>
          ${manual.length ? `<div class="note" style="margin-bottom:20px">
            <b>${manual.length} cobro${manual.length === 1 ? '' : 's'} que no ${manual.length === 1 ? 'viene' : 'vienen'} de una venta</b> — ${$$(sum(manual))} en el período.
            Suman al resultado y a la caja, pero no aparecen en <a href="#" onclick="go('movimientos');return false">Ventas</a> ni generan comisión.
          </div>` : ''}
          <div class="card tcard">
            ${tbar('buscarCob', `${ms.length} cobro${ms.length === 1 ? '' : 's'}`)}
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                <th class="nw" style="padding-left:18px">Fecha</th><th class="cw">Concepto</th><th>Tipo</th>
                ${venue ? thF('staff', 'Profesional') : ''}
                <th>Medio</th><th>Entra a</th><th title="Automático: lo capturó Ágora. A mano: lo cargaste vos.">Cómo se registró</th>
                <th class="r" style="padding-right:18px">Monto</th>
              </tr></thead>
              <tbody>${shown.map((m) => `<tr class="hoverable" onclick="openMov(${m.id})">
                <td style="padding-left:18px"><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
                <td class="cw" style="font-weight:600">${esc(m.concept)}${m.client ? `<div style="font-size:11.5px;color:var(--f-ink-mid);font-weight:500">${esc(m.client)}</div>` : ''}</td>
                <td><span class="chip mute">${(ASSETS[m.asset] || { label: '—' }).label}</span></td>
                ${venue ? `<td style="font-size:12.5px;color:${m.staff ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.staff || '—'}</td>` : ''}
                <td style="font-size:12.5px">${METHODS[m.method] ? (m.method === 'mp' ? mpTag() : METHODS[m.method].label) : '—'}</td>
                <td style="font-size:12.5px">${ACC[m.account] || '—'}</td>
                <td><span class="chip ${m.src === 'online' || m.method === 'mp' ? 'ok' : 'mute'}">${m.src === 'online' || m.method === 'mp' ? 'Automático' : 'A mano'}</span></td>
                <td class="r amt" style="padding-right:18px">${$$(m.amount)}</td></tr>`).join('') || `<tr><td colspan="${cols}"><div class="empty"><b>Sin cobros</b>No entró plata en este período.</div></td></tr>`}</tbody>
              ${shown.length ? `<tfoot><tr><td colspan="${cols - 1}" style="padding-left:18px">${shown.length < ms.length ? `${shown.length} de ${ms.length} cobros` : `${ms.length} cobro${ms.length === 1 ? '' : 's'}`}</td><td class="r">${$$(sum(shown))}</td></tr></tfoot>` : ''}
            </table></div>
          </div>
          ${shown.length < ms.length ? `<div style="text-align:center;margin-top:22px"><button class="btn" onclick="S.cobPage++;render()">Mostrar ${Math.min(25, ms.length - shown.length)} más</button></div>` : ''}`;
        return `<div class="sec">
          <p class="lede">Cada vez que entró plata. Una venta cobrada parcialmente suma la parte cobrada, y lo pendiente vive en <a href="#" onclick="go('cobranzas');return false">Por cobrar</a>.</p>
          ${body}</div>`;
      }

      /* ---------------- GASTOS ---------------- */
      function vGastos() {
        let body = '';

          const ms = expenses(scope());
          const byCat = byKey(ms, 'cat');
          const mayor = byCat[0];
          body = `
          <div class="hero">
            <span class="q">¿Cuánto gasté en este período?</span>
            <span class="n">${$$(sum(ms))}</span>
            <span class="d">en <b>${ms.length}</b> gasto${ms.length === 1 ? '' : 's'}${mayor ? ` · el más pesado, <b>${(ECATS.find((c) => c.k === mayor[0]) || { label: mayor[0] }).label}</b> con ${$$(mayor[1])}` : ''}</span>
          </div>
          <div class="grid g2 top" style="margin-bottom:24px">
            <div class="card"><h3>Gastos por categoría</h3>
              <p class="cap">${RANGES[S.range].label} · total ${$$(sum(ms))} · <a href="#" onclick="openCats();return false">administrar categorías</a></p>
              ${byCat.length ? barsList(byCat, { labelOf: (k) => (ECATS.find((c) => c.k === k) || { label: k }).label, go: () => '' }) : '<div class="empty">Sin gastos en el período</div>'}</div>
            <div class="card"><h3>De dónde sale la plata</h3><p class="cap">Cada gasto declara su origen — es lo que mantiene la caja y los saldos consistentes.</p>
              ${barsList(byKey(ms, 'account'), { dot: true, colorOf: (k) => ({ caja: 'var(--m-ef)', banco: 'var(--m-tr)', mp: 'var(--m-mp)' }[k]), labelOf: (k) => ({ caja: 'Caja (efectivo)', banco: 'Banco', mp: 'Billetera Mercado Pago' }[k] || k), go: () => '' })}</div>
          </div>
          <div class="card tcard pt">
            <div class="tblwrap"><table class="tbl">
              <thead><tr><th class="nw" style="padding-left:18px">Fecha</th><th class="cw">Concepto</th><th>Categoría</th><th class="nw">Sale de</th><th class="r" style="padding-right:18px">Monto</th></tr></thead>
              <tbody>${ms.slice(0, 40).map((m) => `<tr class="hoverable" onclick="openMov(${m.id})">
                <td style="padding-left:18px"><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
                <td class="cw" style="font-weight:600">${esc(m.concept)}</td>
                <td><span class="chip mute">${(ECATS.find((c) => c.k === m.cat) || { label: '—' }).label}</span></td>
                <td style="font-size:12.5px">${{ caja: 'Caja (efectivo)', banco: 'Banco', mp: mpTag('Billetera') }[m.account]}</td>
                <td class="r amt out" style="padding-right:18px">−${$$(m.amount)}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty"><b>Sin gastos</b>No hay gastos registrados en este período.</div></td></tr>`}</tbody>
            </table></div>
          </div>`;
        return `<div class="sec">
          <p class="lede">Cada salida de plata, con su categoría y de qué cuenta salió. Las liquidaciones al equipo entran acá como gasto de <b>Sueldos y comisiones</b>.</p>
          ${body}</div>`;
      }

      /* ---------------- RESULTADO ---------------- */
      function vResultado() {
        // Un solo período, el elegido arriba: la aritmética se hace sobre el rango, sin
        // columnas por mes. Los egresos se abren en gastos y comisiones liquidadas, que son
        // las dos formas en que sale plata (las comisiones ya son un gasto de "sueldos":
        // acá se separan para verlas, no se suman dos veces).
        const ms = scope();
        const inc = income(ms), exp = expenses(ms), ref = refunds(ms);
        const cobrado = sum(inc), dev = sum(ref);
        const comis = sum(exp.filter((m) => m.staffPay));
        const otros = sum(exp.filter((m) => !m.staffPay));
        const egresos = comis + otros;
        const neto = cobrado - dev - egresos;
        const sinLiquidar = STAFF.reduce((s2, st) => s2 + Math.max(0, saldoComision(st)), 0);
        const fila = (lbl, val, o) => `<div class="r ${(o && o.cls) || ''}">
          <span class="lbl" style="${o && o.sub ? 'padding-left:18px;font-size:12.5px' : ''}">${lbl}</span>
          <span class="amt" style="${o && o.sub ? 'font-size:13px' : ''}">${o && o.neg && val ? '−' : ''}${$$(val)}</span></div>`;

        const body = `
          <div class="grid sec gmain" style="margin-bottom:24px">
            <div class="card">
              <h3>Cómo se compone tu <strong>neto</strong></h3>
              <p class="cap">${RANGES[S.range].label} · ${fD(RANGES[S.range].from)} — ${fD(RANGES[S.range].to)}. Lo que entró menos lo que salió.</p>
              <div class="cascade">
                ${fila('Cobrado', cobrado)}
                ${dev ? fila('Devoluciones', dev, { cls: 'neg', neg: true }) : ''}
                ${fila('Egresos', egresos, { cls: 'neg', neg: true })}
                ${fila('Gastos', otros, { sub: true, neg: true })}
                ${fila('Comisiones liquidadas', comis, { sub: true, neg: true })}
                <div class="r total"><span class="lbl">Neto del período</span><span class="amt">${neto < 0 ? '−' : ''}${$$(Math.abs(neto))}</span></div>
              </div>
            </div>
            <div class="card">
              <h3>Comisiones <strong>sin liquidar</strong></h3>
              <p class="cap">Devengado por el equipo que todavía no pagaste.</p>
              <div class="stat"><div class="v" style="color:${sinLiquidar ? 'var(--f-coral-text)' : 'var(--f-ink)'}">${$$(sinLiquidar)}</div></div>
              <div class="note" style="margin-top:14px">
                <b>No entra al neto de arriba.</b> Este resultado es base caja: una comisión pesa el día que la
                liquidás, no el día que se devenga. ${S.persona === 'venue' ? `Se gestiona en <a href="#" onclick="go('comisiones');return false">Comisiones</a>.` : ''}
              </div>
            </div>
          </div>

          <div class="grid g2 top sec">
            <div class="card">
              <h3>De dónde vino</h3>
              <p class="cap">Lo cobrado del período por tipo de venta.</p>
              ${barsList(byKey(inc, 'asset'), { labelOf: (k) => (ASSETS[k] ? ASSETS[k].label : k) })}
            </div>
            <div class="card">
              <h3>En qué se fue</h3>
              <p class="cap">Los egresos del período por categoría. Las comisiones liquidadas entran como <b>Sueldos y comisiones</b>.</p>
              ${exp.length ? barsList(byKey(exp, 'cat'), { labelOf: (k) => (ECATS.find((c) => c.k === k) || { label: k }).label }) : '<div class="empty">Sin egresos en el período</div>'}
            </div>
          </div>`;

        return `<div class="sec">
          <div class="hero">
            <span class="q">¿Cuál fue mi resultado en este período?</span>
            <span class="n ${neto < 0 ? 'neg' : ''}">${neto < 0 ? '−' : ''}${$$(Math.abs(neto))}</span>
            <span class="d"><b>${$$(cobrado)}</b> cobrado − <b>${$$(egresos + dev)}</b> entre egresos y devoluciones</span>
          </div>
          <p class="lede"><b>Solo cuenta lo que efectivamente entró y salió</b> — no las ventas totales.</p>
          ${body}</div>`;
      }

      // isCost invierte el semáforo: en una fila de gasto o devolución, subir es malo.
      function deltaOf(vals, isCost) {
        if (vals.length < 2) return '';
        const a = vals[vals.length - 2], b = vals[vals.length - 1];
        if (!a) return '—';
        const d = Math.round(((b - a) / Math.abs(a)) * 100);
        const good = isCost ? d <= 0 : d >= 0;
        return `<span style="font-weight:700;color:${good ? 'var(--success-ink)' : 'var(--accent)'}">${d >= 0 ? '+' : ''}${d}%</span>`;
      }

      /* ---------------- ARQUEO ---------------- */
      // El total contado se carga a mano, como en producción. Se siembra la primera vez que
      // alguien lo necesita (Conceptos también lo usa para su ejemplo).
      let CONTADO = null;
      function countTotal() {
        if (CONTADO === null) CONTADO = arqueo().esperado - 3200;
        return CONTADO;
      }

      const UMBRAL = 2000; // diferencia máxima que se acepta sin motivo escrito

      // El panel de veredicto se re-renderiza solo (sin tocar el resto de la vista) mientras contás:
      // si re-renderizáramos todo en cada tecla, el input perdería el foco.
      function arqSideHTML() {
        const a = arqueo();
        const contado = countTotal();
        const dif = contado - a.esperado;
        const verdict = dif === 0 ? 'ok' : Math.abs(dif) <= UMBRAL ? 'warn' : 'bad';
        const prev = el('difWhy') ? el('difWhy').value : '';
        return `<div class="verdict ${verdict}">
            <div class="n">${dif === 0 ? 'Coincide' : dif > 0 ? 'Sobra' : 'Falta'}</div>
            <div class="v">${dif === 0 ? '$0' : (dif > 0 ? '+' : '−') + $$(Math.abs(dif))}</div>
            <div class="s">${dif === 0 ? 'La caja cierra exacta'
              : Math.abs(dif) <= UMBRAL ? 'Dentro del margen de $' + nf.format(UMBRAL)
              : dif > 0 ? 'Hay más de lo esperado' : 'Hay menos de lo esperado'}</div>
          </div>
          <div style="margin-top:18px">
            <div class="kv"><span class="k">Esperado</span><span class="v">${$$(a.esperado)}</span></div>
            <div class="kv"><span class="k">Contado</span><span class="v">${$$(contado)}</span></div>
          </div>
          ${Math.abs(dif) > UMBRAL ? `<div class="fld" style="margin-top:18px"><label>Motivo de la diferencia · obligatorio</label>
            <textarea rows="3" id="difWhy" placeholder="Ej: vuelto mal dado en el turno de las 17hs">${esc(prev)}</textarea></div>` : ''}
          <button class="btn pri" style="width:100%;justify-content:center;margin-top:18px" onclick="cerrarCaja(${dif})">Cerrar caja del día</button>
          <p style="font-size:11.5px;color:var(--f-ink-mid);text-align:center;margin:12px 0 0">El cierre guarda su propio snapshot. Si después corregís un movimiento, los totales del día se reacomodan pero este registro queda intacto.</p>`;
      }

      function histTabla(HIST) {
        return `<div class="card tcard pt">
          <div class="tblwrap"><table class="tbl">
            <thead><tr><th class="nw" style="padding-left:18px">Día</th><th class="nw">Horario</th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Diferencia</th><th style="padding-right:18px">Estado</th></tr></thead>
            <tbody>${HIST.length ? HIST.map((x) => {
              const d = x.cnt - x.exp;
              return `<tr>
                <td class="nw" style="padding-left:18px;font-weight:600;color:var(--f-ink)">${fDL(x.date)}</td>
                <td class="mono nw" style="font-size:11.5px;color:var(--f-ink-mid)">${x.from} – ${x.to}</td>
                <td class="r amt" style="font-weight:500;color:var(--f-ink-mid)">${$$(x.exp)}</td>
                <td class="r amt">${$$(x.cnt)}</td>
                <td class="r amt" style="color:${d === 0 ? 'var(--f-ink-mid)' : d > 0 ? 'var(--f-warning-text)' : 'var(--f-coral-text)'}">${d === 0 ? '—' : (d > 0 ? '+' : '−') + $$(Math.abs(d))}</td>
                <td style="padding-right:18px">${d === 0 ? `<span class="chip ok">${ICO.check} Coincide</span>` : `<span class="chip ${d > 0 ? 'pend' : 'bad'}" title="${esc(x.why || '')}">${d > 0 ? 'Sobró' : 'Faltó'} · con motivo</span>`}</td></tr>`;
            }).join('') : `<tr><td colspan="6"><div class="empty"><b>Sin cierres en el período</b>Todavía no cerraste ninguna caja.</div></td></tr>`}</tbody>
          </table></div>
        </div>`;
      }

      function vArqueo() {
        const a = arqueo();
        const contado = countTotal();
        const HIST = sessionsIn({ from: '2026-01-01', to: TODAY });

        if (!CAJA_ABIERTA) return `
        <div class="sec">
          <p class="lede">Abrís la caja al empezar el día, se van registrando los cobros en efectivo, y al cerrar contás lo que hay. Solo se arquea el efectivo: lo demás no pasa por la caja.</p>
        </div>

        <div class="sec"><div class="card" style="text-align:center;padding:40px 26px">
          <div class="ico" style="background:var(--f-paper);color:var(--f-ink-mid);width:52px;height:52px;margin:0 auto 16px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px"><path d="M3 10 5.5 4h13L21 10"/><rect x="3" y="10" width="18" height="10" rx="2"/><path d="M10 14h4"/></svg>
          </div>
          <h2 style="font-size:22px;font-weight:300;margin:0 0 8px">La caja está <strong>cerrada</strong></h2>
          <p style="margin:0 auto 24px;max-width:52ch;color:var(--f-ink-mid);font-size:13.5px">
            Hasta que la abras, los cobros en efectivo se siguen registrando pero <b>no hay un total que contar al final del día</b>.
          </p>
          <div class="grid g3" style="text-align:left;max-width:760px;margin:0 auto 26px">
            ${[
              ['1', 'Declarás con cuánto arrancás', 'El fondo inicial: la plata que dejás en la caja para dar vuelto.'],
              ['2', 'Se registra todo el día', 'Cada cobro en efectivo suma, cada gasto pagado de la caja resta.'],
              ['3', 'Contás y cerrás', 'Cargás el total contado; si no coincide con lo esperado, explicás por qué.'],
            ].map(([n, t, d]) => `<div class="col" style="border:1px solid var(--f-hair);border-radius:var(--f-r-card);padding:18px">
              <div style="font-size:9.5px;font-weight:600;letter-spacing:.2em;color:var(--f-ink-mid);margin-bottom:8px">PASO ${n}</div>
              <b style="display:block;font-size:14px;margin-bottom:5px">${t}</b>
              <span style="font-size:12.5px;color:var(--f-ink-mid)">${d}</span></div>`).join('')}
          </div>
          <button class="btn pri" onclick="openAbrirCaja()">Abrir la caja del día</button>
          <p style="margin:14px auto 0;max-width:52ch;font-size:12px;color:var(--f-ink-mid)">
            Abrir la caja no mueve plata: solo deja registrado con cuánto empezás y desde qué momento se cuenta.
          </p>
        </div></div>

        ${HIST.length ? `<div class="sec">
          <h3 style="font-size:16px;font-weight:300;margin:0 0 4px">Cierres <strong>anteriores</strong></h3>
          <p class="cap" style="margin-bottom:14px">Todos los cierres, del más reciente al más viejo.</p>
          ${histTabla(HIST)}
        </div>` : ''}`;

        return `
        <div class="sec">
          <p class="lede">Abrís, contás y cerrás la caja del día. Solo se arquea el efectivo.</p>
        </div>

        <div class="arq sec">
          <div>
            <div class="card" style="margin-bottom:20px">
              <h3>1 · Lo que debería haber</h3>
              <div class="cascade">
                <div class="r"><span class="lbl">Fondo de apertura · ${fDL(TODAY)} ${APERTURA.hora}</span><span class="amt">${$$(OPENING)}</span></div>
                <div class="r"><span class="lbl">Cobros en efectivo <span class="chip mute">${a.today.filter((m) => m.dir === 'in' && m.method === 'ef' && m.st === 'ok').length}</span></span><span class="amt">+${$$(a.cobrosEf)}</span></div>
                ${extraIn() ? `<div class="r"><span class="lbl">Ingresos de efectivo cargados hoy</span><span class="amt">+${$$(extraIn())}</span></div>` : ''}
                <div class="r neg"><span class="lbl">Gastos pagados de la caja</span><span class="amt">−${$$(a.gastosEf)}</span></div>
                ${extraOut() ? `<div class="r neg"><span class="lbl">Retiros de efectivo</span><span class="amt">−${$$(extraOut())}</span></div>` : ''}
                <div class="r total"><span class="lbl">Efectivo esperado</span><span class="amt">${$$(a.esperado)}</span></div>
              </div>
              <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
                <span class="cap">¿Sacaste o ingresaste efectivo? Usá <b>Ingreso</b> o <b>Retiro de efectivo</b> arriba, sin tocar el resultado.</span>
                <button class="btn ghost sm" onclick="goMov({method:['ef']})">Ver los movimientos del día</button>
              </div>
            </div>

            <div class="card">
              <h3>2 · Contá el <strong>efectivo</strong></h3>
              <p class="cap">Contá lo que hay y cargá el total. La diferencia se calcula sola.</p>
              <div class="contado">
                <label for="contadoInput">Total contado</label>
                <div class="cwrap"><span>$</span><input id="contadoInput" type="text" inputmode="numeric" value="${nf.format(contado)}" oninput="setContado(this.value)" /></div>
              </div>
            </div>
          </div>

          <div class="side">
            <div class="card" style="margin-bottom:16px" id="arqSide">${arqSideHTML()}</div>

          </div>
        </div>

        <div class="sec">
          ${histTabla(HIST)}
        </div>`;
      }

      /* ---------------- COMISIONES ----------------
         Sección propia, con el patrón de producción: una tarjeta clickeable por profesional que
         filtra el listado de ventas que generan comisión. */
      function vComisiones() {
        const r = RANGES[S.range];
        const sel = S.staff;
        // scope() ya recorta por el profesional elegido, así que las tres cifras siguen el
        // filtro solas. Solo cuenta lo que tiene profesional asignado: el resto no devenga.
        const conPro = income(scope()).filter((m) => m.staff);
        const pendPro = pendRows().filter((m) => m.staff);
        const cobrado = sum(conPro);
        const vendido = cobrado + sum(pendPro);
        const devPeriodo = Math.round(conPro.reduce((s2, m) => s2 + comisionDe(m), 0));
        const nPro = sel === 'all' ? STAFF.length : sel.length;
        const curva = curvaComisiones(r, sel);
        const mov = filterComis();
        const shown = mov.slice(0, S.movPage * 25);
        const devTotal = mov.filter((x) => x.tipo === 'venta').reduce((s2, x) => s2 + x.comision, 0);
        const pagTotal = mov.filter((x) => x.tipo !== 'venta').reduce((s2, x) => s2 + x.comision, 0);

        return `
        <div class="colside sec">
          <aside class="cstats">
            ${dateBar()}
            ${statTile({ k: 'Ventas totales', v: $$(vendido), s: vendido - cobrado ? `<b>${$$(vendido - cobrado)}</b> todavía sin cobrar` : 'Todo cobrado', ic: ICO.bag, bg: '#eef0ff', fg: '#4338ca' })}
            ${statTile({ k: 'Total cobrado', v: $$(cobrado), s: `${conPro.length} cobro${conPro.length === 1 ? '' : 's'} con profesional asignado`, ic: ICO.down, bg: '#e8fbf5', fg: '#07806a' })}
            ${statTile({ k: 'Comisiones del período', v: $$(devPeriodo), s: `${sel === 'all' ? 'Todo el equipo' : nPro === 1 ? esc(sel[0]) : nPro + ' profesionales'} · lo que les corresponde`, ic: ICO.up, bg: '#eef6ff', fg: '#005cd4' })}
          </aside>
          <div class="cmain">

            ${curva ? `<div class="sec"><div class="card">
              <h3>Comisiones <strong>pendientes de liquidar</strong></h3>
              <p class="cap">${sel === 'all' ? 'De todo el equipo' : Array.isArray(sel) && sel.length === 1 ? `De ${esc(sel[0])}` : `De ${sel.length} profesionales`} · ${RANGES[S.range].label.toLowerCase()}. La curva sube con cada venta que devenga y baja de golpe cada vez que liquidás.</p>
              ${curva.svg}
              <div class="chartlegend">
                <span><i style="background:var(--f-brand)"></i>Saldo pendiente</span>
                <span><i class="dot" style="background:var(--f-coral)"></i>Liquidación</span>
                <span class="last">${curva.pagos ? `${curva.pagos} ${curva.pagos === 1 ? 'liquidación' : 'liquidaciones'} por ${$$(curva.totalPagado)} en el período` : 'Sin liquidaciones en el período'}</span>
              </div>
            </div></div>` : ''}

            <div class="sec">
              <h3 style="font-size:16px;font-weight:300;margin:0 0 4px">Todo el <strong>movimiento</strong></h3>
              <p class="cap" style="margin-bottom:14px">Las ventas que devengan y los pagos que las cancelan, en una sola lista.</p>
              <div class="card tcard">
                ${tbar('buscarCom', `${mov.length} movimiento${mov.length === 1 ? '' : 's'}`)}
                <div class="tblwrap"><table class="tbl">
                  <thead><tr>
                    <th class="nw" style="padding-left:18px">Fecha</th>
                    ${thF('comTipo', 'Tipo')}
                    ${thF('staff', 'Profesional')}
                    <th class="cw">Concepto</th>
                    ${thF('comEstado', 'Estado')}
                    <th class="r">Cobro</th>
                    <th class="r" style="padding-right:18px">Comisión</th>
                  </tr></thead>
                  <tbody>${shown.length ? shown.map((x) => `<tr class="hoverable" onclick="openMov(${x.m.id})">
                    <td class="nw" style="padding-left:18px"><div style="font-weight:600;color:var(--f-ink)">${fD(x.m.date)}</div><div class="mono" style="font-size:11px">${x.m.time}</div></td>
                    <td><span class="chip ${x.tipo === 'venta' ? 'mute' : x.tipo === 'ajuste' ? 'pend' : 'brand'}">${TIPO_COM[x.tipo]}</span></td>
                    <td class="nw" style="font-weight:600">${esc(x.quien)}</td>
                    <td class="cw" style="font-weight:600">${esc(x.m.concept)}</td>
                    <td><span class="adstat ${x.estado === 'Liquidada' ? 'ok' : x.estado === 'Pendiente' ? 'warn' : 'mute'}"><i></i>${x.estado}</span></td>
                    <td class="r amt" style="color:var(--f-ink-mid)">${x.tipo === 'venta' ? $$(x.m.amount) : '—'}</td>
                    <td class="r amt" style="padding-right:18px;color:${x.tipo === 'venta' ? 'var(--f-ink)' : 'var(--f-coral-text)'}">${x.tipo === 'venta' ? '' : '−'}${$$(x.comision)}</td></tr>`).join('')
                    : `<tr><td colspan="7"><div class="empty"><b>Sin movimientos</b>Probá ampliar el período o quitar los filtros.</div></td></tr>`}</tbody>
                  ${shown.length ? `<tfoot><tr><td colspan="5" style="padding-left:18px">${mov.length} movimiento${mov.length === 1 ? '' : 's'} · mostrando ${shown.length}</td>
                    <td class="r">${$$(devTotal)} devengado</td>
                    <td class="r amt" style="padding-right:18px;font-size:15px">${pagTotal ? '−' + $$(pagTotal) : '—'}</td></tr></tfoot>` : ''}
                </table></div>
              </div>
              ${shown.length < mov.length ? `<div style="text-align:center;margin-top:18px"><button class="btn" onclick="S.movPage++;render()">Mostrar ${Math.min(25, mov.length - shown.length)} más</button></div>` : ''}
            </div>

            <div class="sec"><div class="note">
              La comisión se <b>devenga</b> cuando la venta se cobra, y se <b>liquida</b> cuando le pagás al profesional.
              Al resultado del negocio entra recién el día de la liquidación. Los porcentajes de cada uno se configuran en
              <a href="#" onclick="toast('Se abriría la configuración de comisiones del equipo');return false">Equipo</a>.
            </div></div>

          </div>
        </div>`;
      }

      const TIPO_COM = { venta: 'Venta', pago: 'Pago', ajuste: 'Ajuste' };

      // Una sola lista: las ventas que devengan, los pagos que las cancelan y los ajustes
      // manuales. El estado de una venta se resuelve por antigüedad contra la última
      // liquidación de ese profesional (FIFO): no llevamos el detalle de qué venta cerró cada pago.
      function filterComis() {
        const r = RANGES[S.range];
        const ultPago = {};
        MOVS.filter((m) => m.staffPay).forEach((m) => {
          if (!ultPago[m.staffPay] || m.date > ultPago[m.staffPay]) ultPago[m.staffPay] = m.date;
        });
        const out = [];
        MOVS.filter((m) => m.date >= r.from && m.date <= r.to).forEach((m) => {
          if (comisionDe(m) > 0) {
            out.push({ m, tipo: 'venta', quien: m.staff, comision: Math.round(comisionDe(m)),
              estado: ultPago[m.staff] && m.date <= ultPago[m.staff] ? 'Liquidada' : 'Pendiente' });
          } else if (m.staffPay) {
            out.push({ m, tipo: 'pago', quien: m.staffPay, comision: m.amount, estado: 'Pagado' });
          }
        });
        AJUSTES.filter((a) => a.date >= r.from && a.date <= r.to).forEach((a) => {
          out.push({ m: { id: 0, date: a.date, time: '12:00', concept: a.motivo, amount: Math.abs(a.amount) },
            tipo: 'ajuste', quien: a.staff, comision: Math.abs(a.amount), estado: a.amount > 0 ? 'Extra' : 'Descuento' });
        });
        const f = S.comF;
        let rows = out
          .filter((x) => inSel(S.staff, x.quien))
          .filter((x) => inSel(f.tipo, x.tipo))
          .filter((x) => inSel(f.estado, x.estado));
        const q = f.q.trim().toLowerCase();
        if (q) rows = rows.filter((x) => ((x.m.concept || '') + ' ' + (x.quien || '')).toLowerCase().includes(q));
        return rows.sort((a, b) => (a.m.date === b.m.date ? (b.m.time || '').localeCompare(a.m.time || '') : b.m.date.localeCompare(a.m.date)));
      }

        const abiertos = activeRecv();
        const r = COB_SEL ? abiertos.find((x) => x.id === COB_SEL) : null;
        if (!r) {
          sheet({
            title: 'Ventas por cobrar',

                <div class="t"><b>${esc(x.client)}</b><span>${esc(x.concept)} · ${fD(x.date)}</span></div>
                <div class="a"><b>${$$(saldoOf(x))}</b><span>${x.paid ? 'de ' + $$(x.total) : 'sin seña'}</span></div>

            ok: null,
          });
          return;

      const CHEV = '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';

      function fieldDefs() {
        const r = RANGES[S.range];
        const venue = S.persona === 'venue';
        return {
          rango: {
            l: 'Período', v: S.range, hint: `${fD(r.from)} — ${fD(r.to)}`,
            o: Object.entries(RANGES).map(([k, x]) => [k, x.label]),
            set: (v) => { S.range = v; S.movPage = 1; S.cobPage = 1; }, act: S.range !== 'd30',
          },
          staff: !venue ? null : {
            l: 'Profesional', v: S.staff, multi: true, allLabel: 'Todos',
            o: STAFF.map((x) => [x, x]),
            set: (v) => { S.staff = v; }, act: S.staff !== 'all',
          },
          sucursal: {
            l: 'Sucursal', v: 'all', o: [['all', 'Todas'], ['palermo', 'Palermo']],
            set: () => {}, act: false,
          },
          buscarMov: {
            l: 'Buscar', type: 'text', v: S.movF.q, ph: 'Concepto, cliente o N°',
            set: (v) => { S.movF.q = v; S.movPage = 1; }, act: !!S.movF.q,
          },
          method: {
            l: 'Medio', v: S.movF.method, multi: true, allLabel: 'Todos',
            o: Object.entries(METHODS).map(([k, m]) => [k, m.label]),
            set: (v) => { S.movF.method = v; S.movPage = 1; }, act: S.movF.method !== 'all',
          },
          asset: {
            l: 'Tipo de venta', v: S.movF.asset, multi: true, allLabel: 'Todas',
            // 'manual' no entra: los ingresos manuales no son ventas y no viven en esta lista.
            o: [...Object.entries(ASSETS).filter(([k]) => k !== 'manual').map(([k, a]) => [k, a.label]), ['refund', 'Devoluciones']],
            set: (v) => { S.movF.asset = v; S.movPage = 1; }, act: S.movF.asset !== 'all',
          },
          buscarCom: {
            l: 'Buscar', type: 'text', v: S.comF.q, ph: 'Concepto o profesional',
            set: (v) => { S.comF.q = v; S.movPage = 1; }, act: !!S.comF.q,
          },
          comTipo: {
            l: 'Tipo', v: S.comF.tipo, multi: true, allLabel: 'Todos',

            set: (v) => { S.comF.tipo = v; S.movPage = 1; }, act: S.comF.tipo !== 'all',
          },
          comEstado: {
            l: 'Estado', v: S.comF.estado, multi: true, allLabel: 'Todos',
            o: [['Pendiente', 'Pendiente'], ['Liquidada', 'Liquidada'], ['Pagado', 'Pagado'], ['Extra', 'Extra'], ['Descuento', 'Descuento']],
            set: (v) => { S.comF.estado = v; S.movPage = 1; }, act: S.comF.estado !== 'all',
          },
          buscarCob: {
            l: 'Buscar', type: 'text', v: S.cobQ, ph: `${Z().Cliente} o concepto`,
            set: (v) => { S.cobQ = v; S.cobPage = 1; }, act: !!S.cobQ,
          },
          buscarRecv: {
            l: 'Buscar', type: 'text', v: S.cobF.q, ph: `${Z().Cliente} o concepto`,
            set: (v) => { S.cobF.q = v; }, act: !!S.cobF.q,
          },
          origin: {
            l: 'Origen', v: S.cobF.origin, multi: true, allLabel: 'Todos',
            o: Object.entries(ORIGIN_LABEL),
            set: (v) => { S.cobF.origin = v; }, act: S.cobF.origin !== 'all',
          },
        };
