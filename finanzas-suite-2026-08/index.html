<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finanzas · Prototipo funcional v3 — Ágora</title>
    <link rel="icon" href="assets/agora-iso.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==========================================================================
         FROST — el sistema de identidad de Flash. Tokens, tipografía, superficies y
         radios salen de flash/src/styles/_tailwind.css y flash/design.md, no de un
         lenguaje inventado para el prototipo.
         ========================================================================== */
      :root {
        --f-paper: #EFF3F9;
        --f-paper-deep: #DCE3EE;
        --f-card: #FFFFFF;
        --f-glass: rgba(255, 255, 255, 0.92);
        --f-glass-strong: rgba(255, 255, 255, 0.97);

        --f-ink: #0F172A;
        --f-ink-soft: #475569;   /* 7.6:1 blanco · 6.8:1 paper */
        --f-ink-mid: #5B6B82;    /* 5.4:1 blanco · 4.9:1 paper — piso de TEXTO */
        --f-ink-whisper: #94A3B8;/* 2.6:1 — SOLO decoración: íconos, guías, bordes, disabled */

        --f-hair: rgba(15, 23, 42, 0.06);
        --f-hair-strong: rgba(15, 23, 42, 0.10);
        --f-hair-stronger: rgba(15, 23, 42, 0.15);

        --f-brand: #0072FB;
        --f-brand-deep: #005CD4;
        --f-brand-wash: rgba(0, 114, 251, 0.08);
        --f-brand-wash-strong: rgba(0, 114, 251, 0.12);

        --f-coral: #FF4658;
        --f-coral-wash: rgba(255, 70, 88, 0.10);
        --f-coral-text: #991B1B;
        --f-success: #10B981;
        --f-success-wash: rgba(16, 185, 129, 0.10);
        --f-success-text: #047857;
        --f-warning: #F59E0B;
        --f-warning-wash: rgba(245, 158, 11, 0.10);
        --f-warning-text: #B45309;

        --f-r-chip: 999px; --f-r-item: 10px; --f-r-button: 12px; --f-r-input: 12px;
        /* Frost recupera volumen sin perder precisión: el radio crece con la superficie. */
        --f-r-card: 20px; --f-r-shell: 28px;

        --f-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
        --f-shadow-sm: 0 4px 12px -4px rgba(15, 23, 42, 0.10);
        --f-shadow-md: 0 10px 30px -12px rgba(15, 23, 42, 0.15);
        --f-shadow-lg: 0 20px 50px -20px rgba(15, 23, 42, 0.25);
        --f-shadow-glow: 0 1px 2px rgba(0,0,0,.06), 0 4px 10px -2px rgba(0, 114, 251, 0.35);

        --f-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --sans: 'Montserrat', system-ui, -apple-system, sans-serif;
        --mono: 'Space Mono', ui-monospace, Menlo, monospace;

        /* Medios de cobro. Con la paleta de marca acotada a blanco/gris/negro/azul/verde/rojo no
           existe una paleta CATEGÓRICA de 5 tonos que separe (verificado con dataviz: cualquier
           quinteto falla el piso de separación entre pares). Así que el color deja de cargar la
           identidad y pasa a ser una RAMPA DE UN SOLO TONO, con paso fijo por medio —la etiqueta,
           que está siempre al lado, es la que identifica. El efectivo queda en verde porque no es
           una categoría más: es el único que se cuenta a mano y el único que entra al arqueo. */
        --m-ef: #059669;   /* efectivo — verde, con significado */
        --m-tr: #00306E;   /* transferencia */
        --m-mp: #0072FB;   /* Mercado Pago — azul de marca */
        --m-cr: #3D8BFB;   /* tarjeta crédito */
        --m-de: #7FB4FD;   /* tarjeta débito */
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--f-paper); color: var(--f-ink); font-family: var(--sans);
        font-size: 14px; font-weight: 500; line-height: 1.55; -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      button, input, select, textarea { font-family: inherit; }
      button { cursor: pointer; }
      svg { display: block; }
      .mono { font-family: var(--mono); }
      .num { font-variant-numeric: tabular-nums; }
      .hide { display: none !important; }
      :focus-visible { outline: 2px solid var(--f-brand); outline-offset: 2px; border-radius: 8px; }

      /* ---------- Tipografía Frost ---------- */
      .frost-kicker {
        font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--f-ink-mid);
      }
      .frost-h1 { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; margin: 6px 0 0; line-height: 1.15; }
      .frost-h1 strong { font-weight: 600; }
      .frost-h1 .dot { color: var(--f-brand); }
      .frost-h2 { font-size: 19px; font-weight: 300; letter-spacing: -0.015em; margin: 0; }
      .frost-h2 strong { font-weight: 600; }
      .frost-num {
        font-weight: 200; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; color: var(--f-ink);
      }


      /* ---------- Shell ---------- */
      .app { display: flex; align-items: stretch; }
      .rail {
        width: 236px; flex: 0 0 236px; background: var(--f-glass); backdrop-filter: blur(14px);
        border-right: 1px solid var(--f-hair);
      }
      .railin { position: sticky; top: 0; padding: 20px 12px; max-height: 100vh; overflow-y: auto; }
      .rail .brand { display: flex; align-items: center; padding: 4px 12px 22px; }
      .rail .brand img { height: 20px; }
      .rail .lbl {
        font-size: 9.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--f-ink-mid); padding: 16px 12px 6px;
      }
      .rail a {
        display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--f-r-item);
        font-size: 13.5px; font-weight: 500; color: var(--f-ink-soft); text-decoration: none;
        margin-bottom: 1px; transition: background 150ms var(--f-ease), color 150ms var(--f-ease);
      }
      .rail a:hover { background: var(--f-brand-wash); color: var(--f-ink); }
      .rail a.on { background: var(--f-brand-wash-strong); color: var(--f-brand-deep); font-weight: 600; }
      .rail a svg { width: 18px; height: 18px; flex: 0 0 18px; }
      .rail .car { margin-left: auto; font-size: 10px; color: var(--f-ink-mid); }
      .rail .kids { padding: 2px 0 8px; margin: 2px 0 4px 22px; border-left: 1px solid var(--f-hair-strong); }
      .rail .kids a { font-size: 12.5px; padding: 7px 12px; gap: 9px; }
      .rail .kids a i { width: 5px; height: 5px; border-radius: 50%; background: var(--f-hair-stronger); flex: 0 0 5px; }
      .rail .kids a.on { background: var(--f-brand-wash); }
      .rail .kids a.on i { background: var(--f-brand); }
      .rail .moved {
        margin-left: auto; font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .06em;
        color: var(--f-brand-deep); background: var(--f-brand-wash); padding: 1px 6px; border-radius: var(--f-r-chip);
      }

      main { flex: 1; min-width: 0; padding: 0 0 80px; }
      .wrap { max-width: 1280px; padding: 0 32px; margin: 0 auto; }

      /* ---------- Header ---------- */
      /* Sin bajada en ninguna sección: el header mide lo mismo en las 8 y no deja aire
         muerto debajo del título. */
      .mhead { padding: 22px 0 18px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      .mhead .acts { margin-left: auto; min-height: 46px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      /* Las acciones principales piden más peso que un botón de tabla. */
      .mhead .acts .btn { height: 46px; padding: 0 20px; font-size: 13.5px; }
      .openpill {
        display: inline-flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600;
        letter-spacing: .14em; text-transform: uppercase; color: var(--f-success-text);
        background: var(--f-success-wash); border: 1px solid rgba(16,185,129,.25);
        padding: 4px 11px 4px 9px; border-radius: var(--f-r-chip);
      }
      .openpill i { width: 6px; height: 6px; border-radius: 50%; background: var(--f-success); display: block; }

      .btn {
        display: inline-flex; align-items: center; gap: 8px; border-radius: var(--f-r-button);
        font-weight: 600; font-size: 13px; padding: 10px 16px; border: 1px solid var(--f-hair-strong);
        background: var(--f-card); color: var(--f-ink-soft); box-shadow: var(--f-shadow-xs);
        transition: all 160ms var(--f-ease); white-space: nowrap;
      }
      .btn:hover { color: var(--f-ink); box-shadow: var(--f-shadow-sm); }
      .btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
      .btn.pri {
        background: var(--f-brand); border-color: var(--f-brand); color: #fff; box-shadow: var(--f-shadow-glow);
      }
      .btn.pri:hover { background: var(--f-brand-deep); color: #fff; }
      .btn.neg { color: var(--f-coral-text); border-color: color-mix(in srgb, var(--f-coral) 32%, var(--f-hair-strong)); }
      .btn.pri.neg { background: #E03145; border-color: #E03145; color: #fff; box-shadow: none; }
      .btn.pri.neg:hover { background: #C42638; color: #fff; }
      /* Botón de WhatsApp de la tabla de Por cobrar. Antes era un outline blanco de 34px
         fijo: no se leía como una acción de WhatsApp y además quedaba más alto que el
         "Registrar cobro" de al lado (.btn.sm mide ~32px). Ahora va sobre un tinte verde
         —visible en una lista sin gritar como un sólido saturado en cada fila—, el glifo
         en verde oscuro (AA sobre el tinte) y se estira a la altura de su hermano. */
      .btn.wa {
        padding: 0; width: 36px; height: auto; align-self: stretch; min-height: 32px;
        justify-content: center; background: #E7F9EF; color: #0F7A3D;
        border-color: rgba(18,140,74,.28); box-shadow: none;
      }
      .btn.wa svg { width: 21px; height: 21px; }
      .btn.wa:hover {
        background: #25D366; border-color: #1FB855; color: #fff;
        box-shadow: 0 4px 12px -4px rgba(37,211,102,.7);
      }
      .btn.wa:active { transform: translateY(1px); }
      .btn.wa:focus-visible { outline: 2px solid #0F7A3D; outline-offset: 2px; }
      .btn.ghost { background: transparent; box-shadow: none; }
      .btn.sm { padding: 7px 12px; font-size: 12px; border-radius: var(--f-r-item); }

      /* ---------- Tabs (solo cuando el rail no está) ---------- */
      /* Las secciones no entran a lo ancho en mobile: se scrollea de costado. Sin una
         señal, la fila se lee como si terminara ahí — el degradado y la flecha dicen que
         sigue, y aparecen solo del lado que de verdad tiene algo más. */
      .tabswrap { display: none; position: relative; margin-bottom: 18px; }
      .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tabswrap .tarrow {
        position: absolute; top: 0; bottom: 2px; width: 40px; border: 0; cursor: pointer; padding: 0;
        display: none; align-items: center; color: var(--f-ink); opacity: 0; transition: opacity 160ms var(--f-ease);
      }
      .tabswrap .tarrow.l { left: 0; justify-content: flex-start; background: linear-gradient(to right, var(--f-paper) 55%, rgba(239,243,249,0)); }
      .tabswrap .tarrow.r { right: 0; justify-content: flex-end; background: linear-gradient(to left, var(--f-paper) 55%, rgba(239,243,249,0)); }
      .tabswrap.mas-izq .tarrow.l, .tabswrap.mas-der .tarrow.r { display: flex; opacity: 1; }
      .tabswrap .tarrow svg { width: 16px; height: 16px; }
      .tabs button {
        border: 1px solid transparent; background: transparent; padding: 8px 14px; font-size: 13px;
        font-weight: 500; color: var(--f-ink-mid); border-radius: var(--f-r-chip); white-space: nowrap;
      }
      .tabs button.on { background: var(--f-card); color: var(--f-brand-deep); font-weight: 600; box-shadow: var(--f-shadow-xs); }
      @media (max-width: 1100px) { .tabswrap { display: block; } }

      /* ==========================================================================
         LAYOUT — panel de filtros a la izquierda + contenido
         ========================================================================== */
      .fbar { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
      /* Vacío no ocupa: si no, las secciones sin barra arrancaban 20px más abajo. */
      .fbar:empty { display: none; }
      .fbar .dpwrap { flex: 1; min-width: 0; }
      .fbar .fbx { display: flex; gap: 10px; flex: 0 0 auto; }
      /* Alto fijo: abrir un campo no puede cambiar el alto de la barra. */
      .fbar .ffield { margin: 0; min-width: 168px; height: 62px; background: var(--f-card); border-color: var(--f-hair); }

      .fbox {
        background: var(--f-card); border: 1px solid var(--f-hair); border-radius: var(--f-r-card);
        box-shadow: var(--f-shadow-sm); padding: 16px;
      }
      .fbox-h {
        font-size: 9.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--f-ink-mid); margin-bottom: 12px;
      }
      .ffield {
        position: relative; background: var(--f-paper); border: 1px solid transparent;
        border-radius: var(--f-r-input); padding: 9px 12px; margin-bottom: 8px;
        transition: border-color 150ms var(--f-ease);
      }
      .ffield:hover, .ffield:focus-within { border-color: var(--f-brand-wash-strong); }
      .ffield label {
        display: flex; cursor: inherit; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 600;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--f-ink-mid); margin-bottom: 2px;
      }
      .ffield label i { width: 5px; height: 5px; border-radius: 50%; background: var(--f-brand); display: block; }
      /* Campo de filtro con selección múltiple. El popover se expande debajo del campo en vez de
         flotar: así funciona igual en el panel sticky y adentro del modal full screen, que scrollea. */
      .ffield.open { border-color: var(--f-brand); background: var(--f-card); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .ffield .fhead { display: block; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; }
      .ffield .fval { font-size: 14px; font-weight: 600; color: var(--f-ink); padding-right: 20px; }
      /* Flota: se renderizaba inline porque antes vivía dentro del modal de mobile, que
         scrollea. Ese modal ya no existe y, en una fila de campos, expandir hacia adentro
         estiraba la barra entera y descolocaba lo de al lado. */
      .ffield .fdrop {
        position: absolute; z-index: 85; top: calc(100% + 6px); left: 0; min-width: 100%; width: max-content; max-width: 280px;
        max-height: 330px; overflow-y: auto; padding: 8px;
        background: var(--f-card); border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-card);
        box-shadow: var(--f-shadow-lg);
      }
      .fopt {
        display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
        padding: 9px 10px; border-radius: var(--f-r-item); font-size: 13.5px; font-weight: 500;
        color: var(--f-ink-mid); text-align: left;
      }
      .fopt:hover { background: var(--f-brand-wash); color: var(--f-ink); }
      .fopt span { flex: 1; }
      .fopt svg { width: 14px; height: 14px; flex: 0 0 14px; color: var(--f-brand); }
      .fopt.on { background: var(--f-brand-wash); color: var(--f-ink); font-weight: 600; }
      .fdrop-f { display: flex; justify-content: flex-end; padding: 8px 6px 2px; margin-top: 4px; border-top: 1px solid var(--f-hair); }

      .ffield select, .ffield input {
        appearance: none; width: 100%; border: 0; background: transparent; padding: 0 18px 0 0;
        font-size: 14px; font-weight: 600; color: var(--f-ink); outline: 0; cursor: pointer;
      }
      .ffield input { cursor: text; font-weight: 500; }
      .ffield input::placeholder { color: var(--f-ink-mid); font-weight: 500; }
      .ffield .chev {
        position: absolute; right: 12px; bottom: 11px; pointer-events: none; color: var(--f-ink-mid);
      }
      .ffield .chev svg { width: 13px; height: 13px; transition: transform 180ms var(--f-ease); }
      .ffield.open .chev svg { transform: rotate(180deg); }
      .ffield .hintline { font-size: 11px; color: var(--f-ink-mid); margin-top: 1px; }
      .fclear {
        border: 0; background: transparent; color: var(--f-brand-deep); font-size: 12.5px; font-weight: 600;
        padding: 8px 4px 2px; width: 100%; text-align: left;
      }
      .fclear:hover:not(:disabled) { text-decoration: underline; }
      .fclear:disabled { color: var(--f-ink-whisper); cursor: default; }

      /* ---------- Side menu de la transacción (espeja ActionDialog de Flash) ----------
         Reglas de `ActionDialog/ui.tsx`: el estado es un StatusLabel (punto + texto de
         color, sin cápsula) porque las pills están reservadas para acciones; cada bloque
         es una card con SectionTitle (título fuerte + hairline) y las sub-secciones
         llevan un kicker uppercase. */
      .adcard { background: var(--f-card); border: 1px solid var(--f-hair); border-radius: var(--f-r-card); box-shadow: var(--f-shadow-xs); padding: 18px; margin-bottom: 12px; }
      .adhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--f-hair); }
      .adhead.bare { margin-bottom: 12px; padding-bottom: 0; border-bottom: 0; }
      .adhead h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--f-ink); margin: 0; }
      .adkick { display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.22em; color: var(--f-ink-mid); }
      .adstat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
      .adstat i { width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: .9; }
      .adstat.ok { color: var(--f-success-text); }
      .adstat.warn { color: var(--f-warning-text); }
      .adstat.bad { color: var(--f-coral-text); }
      .adstat.info { color: var(--f-brand-deep); }
      .adstat.mute { color: var(--f-ink-mid); }
      .adrow { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--f-ink-soft); padding: 4px 0; }
      .adrow svg { width: 15px; height: 15px; flex: 0 0 15px; color: var(--f-ink-whisper); }
      .adtr { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 8px 0; font-size: 13px; color: var(--f-ink-soft); }
      .adtr + .adtr { border-top: 1px solid var(--f-hair); }
      .adtr .v { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--f-ink); white-space: nowrap; }
      .adtr.tot { border-top: 1px solid var(--f-hair-strong); margin-top: 2px; padding-top: 12px; }
      .adtr.tot .k { font-weight: 600; color: var(--f-ink); }
      .adtr.tot .v { font-size: 17px; }
      .adsub + .adsub { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--f-hair); }
      .adnote { font-size: 12.5px; color: var(--f-ink-mid); line-height: 1.55; margin: 10px 0 0; }
      /* ---------- Selector de fechas ---------- */
      .dpwrap { position: relative; }
      .dpbar {
        display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer;
        background: var(--f-card); border: 1px solid var(--f-hair); border-radius: var(--f-r-card);
        box-shadow: var(--f-shadow-xs); padding: 0 16px; height: 62px; text-align: left;
        transition: all 150ms var(--f-ease);
      }
      .dpbar:hover { border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .dpwrap.open .dpbar { border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .dpbar .ic { width: 17px; height: 17px; flex: 0 0 17px; color: var(--f-brand); }
      .dpbar .lb { font-size: 14px; font-weight: 600; color: var(--f-ink); }
      .dpbar .rg { font-size: 13px; color: var(--f-ink-mid); font-variant-numeric: tabular-nums; }
      .dpbar .rg i { font-style: normal; color: var(--f-ink-mid); margin: 0 3px; }
      .dpbar .ch { width: 14px; height: 14px; margin-left: auto; color: var(--f-ink-mid); flex: 0 0 14px; }
      .dppop {
        position: absolute; z-index: 85; top: calc(100% + 8px); left: 0; display: flex; cursor: default;
        width: 786px; max-width: 100%;
        background: var(--f-card); border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-card);
        box-shadow: var(--f-shadow-lg); overflow: hidden;
      }
      .dppresets { width: 190px; flex: 0 0 190px; border-right: 1px solid var(--f-hair); padding: 12px 10px; background: var(--f-paper); }
      .dppresets .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--f-ink-mid); margin: 2px 0 8px 10px; }
      .dppresets button {
        display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
        padding: 8px 10px; border-radius: var(--f-r-item); font-size: 13px; font-weight: 500; color: var(--f-ink-soft);
      }
      .dppresets button:hover { background: var(--f-card); color: var(--f-ink); }
      .dppresets button.on { background: var(--f-brand-wash); color: var(--f-brand-deep); font-weight: 600; }
      .dpcals { display: flex; flex-wrap: wrap; width: 596px; max-width: 100%; box-sizing: border-box; padding: 14px 16px 12px; }
      .dpcal { width: 262px; }
      .dpcal + .dpcal { margin-left: 20px; padding-left: 20px; border-left: 1px solid var(--f-hair); }
      .dpcals .dphint { width: 100%; }
      .dpnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .dpnav b { font-size: 13.5px; font-weight: 600; color: var(--f-ink); }
      .dpnav button { border: 0; background: transparent; cursor: pointer; color: var(--f-ink-mid); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
      .dpnav button:hover:not(:disabled) { background: var(--f-paper); color: var(--f-ink); }
      .dpnav button:disabled { opacity: .25; cursor: default; }
      .dpnav svg { width: 15px; height: 15px; }
      .dpdow, .dpgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
      .dpdow span { text-align: center; font-size: 9.5px; font-weight: 600; letter-spacing: .1em; color: var(--f-ink-mid); padding-bottom: 6px; }
      .dpd {
        border: 0; background: transparent; cursor: pointer; height: 34px; border-radius: 9px;
        font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--f-ink-soft); font-variant-numeric: tabular-nums;
      }
      .dpd:hover:not(:disabled) { background: var(--f-brand-wash); color: var(--f-brand-deep); }
      .dpd:disabled { color: var(--f-ink-whisper); opacity: .4; cursor: default; }
      .dpd.in { background: var(--f-brand-wash); color: var(--f-brand-deep); border-radius: 0; }
      .dpd.bd, .dpd.ini { background: var(--f-brand); color: #fff; font-weight: 600; border-radius: 9px; }
      /* ---------- Picker full screen (mobile) ---------- */
      .dpfull {
        position: fixed; inset: 0; z-index: 90; background: var(--f-card);
        display: flex; flex-direction: column; cursor: default;
      }
      .dpf-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--f-hair); }
      .dpf-h h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--f-ink); }
      .dpf-h .x { border: 0; background: var(--f-paper); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--f-ink-mid); cursor: pointer; }
      .dpf-h .x svg { width: 15px; height: 15px; }
      .dpf-rango { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px; }
      .dpf-rango > svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--f-ink-mid); }
      .dpf-campo {
        flex: 1; min-width: 0; border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-input);
        padding: 8px 12px; background: var(--f-card);
      }
      .dpf-campo.on { border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .dpf-campo span { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--f-ink-mid); }
      .dpf-campo b { display: block; font-size: 14px; font-weight: 600; color: var(--f-ink); margin-top: 2px; }
      .dpf-presets { display: flex; gap: 7px; overflow-x: auto; padding: 4px 20px 14px; scrollbar-width: none; }
      .dpf-presets::-webkit-scrollbar { display: none; }
      .dpf-presets button {
        white-space: nowrap; border: 1px solid var(--f-hair-strong); background: var(--f-card);
        border-radius: 999px; padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600;
        color: var(--f-ink-soft); cursor: pointer;
      }
      .dpf-presets button.on { background: var(--f-brand-wash); border-color: var(--f-brand); color: var(--f-brand-deep); }
      .dpf-cals { flex: 1; overflow-y: auto; padding: 0 20px 12px; }
      .dpf-cals .dpcal { width: auto; }
      .dpf-cals .dpcal + .dpcal { margin: 18px 0 0; padding: 18px 0 0; border-top: 1px solid var(--f-hair); border-left: 0; }
      .dpf-cals .dpd { height: 42px; font-size: 14px; }
      .dpf-f { border-top: 1px solid var(--f-hair); padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--f-card); }
      .dpf-res { margin: 0 0 10px; font-size: 12.5px; color: var(--f-ink-mid); }
      .dpf-res b { color: var(--f-ink); font-weight: 600; }
      .dpf-btns { display: flex; gap: 10px; }
      .dpf-btns .btn { flex: 1; justify-content: center; height: 48px; font-size: 14px; }

      .dphint { font-size: 11.5px; color: var(--f-ink-mid); margin: 12px 2px 0; line-height: 1.45; }

      /* Hero: la respuesta a la pregunta de la sección, antes que cualquier desglose. */
      .hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 22px; margin-bottom: 22px; }
      .hero .q { font-size: 13px; color: var(--f-ink-mid); width: 100%; margin-bottom: 2px; }
      .hero .n { font-size: 46px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--f-ink); }
      .hero .n.neg { color: var(--f-coral); }
      .hero .d { font-size: 13px; color: var(--f-ink-mid); padding-bottom: 5px; }
      .hero .d b { color: var(--f-ink-soft); font-weight: 600; }

      /* Centinela del scroll infinito */
      .loadmore {
        display: flex; align-items: center; justify-content: center; gap: 9px;
        padding: 16px 10px; font-size: 12px; font-weight: 500; color: var(--f-ink-mid);
        border-top: 1px solid var(--f-hair);
      }
      .loadmore b { color: var(--f-ink-soft); font-weight: 600; }
      .loadmore .spin {
        width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--f-hair-strong);
        border-top-color: var(--f-brand); animation: gira 700ms linear infinite;
      }
      @keyframes gira { to { transform: rotate(360deg); } }

      .descrow { display: flex; gap: 10px; align-items: stretch; }
      .descrow input { flex: 1; min-width: 0; }
      .descrow .radios.sm { flex: 0 0 auto; }
      .descrow .radios.sm button { padding: 0 14px; font-size: 13px; }

      /* ---------- Barra de la tabla: buscador + conteo ---------- */
      .tsearch {
        display: flex; align-items: center; gap: 8px; flex: 0 1 320px; min-width: 0;
        background: var(--f-paper); border: 1px solid transparent; border-radius: var(--f-r-input);
        padding: 7px 10px; transition: all 140ms var(--f-ease);
      }
      .tsearch svg { width: 14px; height: 14px; flex: 0 0 14px; color: var(--f-ink-mid); }
      .tsearch input {
        flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
        font-family: inherit; font-size: 13px; font-weight: 500; color: var(--f-ink);
      }
      .tsearch input::placeholder { color: var(--f-ink-mid); font-weight: 500; }
      .tsearch:focus-within { background: var(--f-card); border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .tsearch:focus-within svg, .tsearch.on svg { color: var(--f-brand); }
      .tsearch.on { background: var(--f-brand-wash); border-color: rgba(0,114,251,.22); }
      .tsearch .tx { border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--f-ink-mid); display: grid; place-items: center; }
      .tsearch .tx svg { width: 12px; height: 12px; }
      .cp-q { padding: 10px; }
      .cp-q .tsearch { width: 100%; }

      /* ---------- Filtro en la cabecera de la columna ---------- */
      .tbl th.colf { cursor: pointer; user-select: none; padding: 14px 8px 10px; }
      .tbl th.colf.pl { padding-left: 18px; }
      .tbl th.colf .cf {
        display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
        border-radius: 999px; border: 1px solid var(--f-hair-strong); background: var(--f-paper);
        color: var(--f-ink-soft); transition: all 140ms var(--f-ease);
      }
      .tbl th.colf .cf .fi { width: 11px; height: 11px; opacity: .85; }
      .tbl th.colf .cf .ch { width: 10px; height: 10px; opacity: .55; margin-left: -2px; }
      .tbl th.colf:hover .cf { background: var(--f-card); border-color: var(--f-brand); color: var(--f-brand-deep); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .tbl th.colf:hover .cf .fi, .tbl th.colf:hover .cf .ch { opacity: 1; }
      .tbl th.colf.on .cf { background: var(--f-brand); border-color: var(--f-brand); color: #fff; }
      .tbl th.colf.on .cf .fi, .tbl th.colf.on .cf .ch { opacity: 1; }
      .tbl th.colf.on:hover .cf { background: var(--f-brand-deep); border-color: var(--f-brand-deep); color: #fff; }
      .tbl th.colf .cf em {
        font-style: normal; font-size: 9px; line-height: 1; letter-spacing: 0; padding: 3px 5px;
        border-radius: 999px; background: var(--f-brand); color: #fff;
      }
      .tbl th.colf.on .cf em { background: rgba(255,255,255,.28); }
      .colpop {
        position: fixed; z-index: 85; display: none; background: var(--f-card);
        border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-card); box-shadow: var(--f-shadow-lg);
        padding: 10px; max-height: 60vh; overflow: auto;
      }
      .colpop.on { display: block; }
      .cp-h {
        display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 8px 8px;
        font-size: 9.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--f-ink-mid);
      }
      .fopt-g {
        font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--f-ink-mid); padding: 12px 10px 5px; border-top: 1px solid var(--f-hair); margin-top: 4px;
      }
      .cp-b > .fopt-g:first-child { border-top: 0; margin-top: 0; padding-top: 4px; }
      .cp-x { border: 0; background: transparent; color: var(--f-brand-deep); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; }
      .cp-f { display: flex; justify-content: flex-end; padding: 8px 4px 2px; margin-top: 4px; border-top: 1px solid var(--f-hair); }

      /* ---------- Gráfico ---------- */
      .chart svg { width: 100%; height: auto; display: block; }
      .chart .ax { font-family: var(--mono); font-size: 10px; letter-spacing: -.01em; fill: var(--f-ink-mid); }
      .chart .axv { font-size: 17px; font-weight: 600; fill: var(--f-ink); font-family: inherit; font-variant-numeric: tabular-nums; }
      .chart .hz:hover { fill: rgba(0,114,251,.05); }
      .chartlegend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--f-hair); font-size: 12px; color: var(--f-ink-mid); }
      .chartlegend span { display: inline-flex; align-items: center; gap: 7px; }
      .chartlegend i { width: 14px; height: 3px; border-radius: 2px; }
      .chartlegend i.dot { width: 9px; height: 9px; border-radius: 50%; }
      .chartlegend .last { margin-left: auto; color: var(--f-ink-soft); font-weight: 500; }

      /* ---------- Comisiones: columna de totales + contenido ---------- */
      .colside { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 20px; align-items: start; }
      .cstats { display: grid; gap: 12px; position: sticky; top: 18px; }
      .cstats .stat .v { font-size: 26px; }
      .cstats .dpbar { flex-wrap: wrap; height: auto; padding: 13px 16px; gap: 4px 10px; }
      .cstats .dpbar .ch { flex: 0 0 14px; }
      .cstats .dppop { left: 0; }
      .cmain > .sec:first-child { margin-top: 0; }
      @media (max-width: 1100px) {
        .colside { grid-template-columns: minmax(0, 1fr); }
        .cstats { position: static; grid-template-columns: 1fr 1fr; }
        .cstats .dpwrap { grid-column: 1 / -1; }
      }
      @media (max-width: 620px) { .cstats { grid-template-columns: 1fr; } }

      .picklist { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
      .pickrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; text-align: left;
        background: var(--f-paper); border: 1px solid transparent; border-radius: var(--f-r-item); padding: 12px 14px; cursor: pointer; }
      .pickrow:hover { border-color: var(--f-brand); background: var(--f-brand-wash); }
      .pickrow .t b { display: block; font-size: 13.5px; color: var(--f-ink); }
      .pickrow .t span { display: block; font-size: 11.5px; color: var(--f-ink-mid); margin-top: 2px; }
      .pickrow .a { text-align: right; white-space: nowrap; }
      .pickrow .a b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--f-warning-text); }
      .pickrow .a span { display: block; font-size: 11px; color: var(--f-ink-mid); margin-top: 2px; }
      .ajtipo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .ajtipo button {
        height: 44px; border-radius: var(--f-r-input); border: 2px solid var(--f-hair-strong);
        background: var(--f-card); color: var(--f-ink-mid); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
        transition: all 160ms var(--f-ease);
      }
      .ajtipo button:first-child.on { border-color: var(--f-success); color: var(--f-success-text); }
      .ajtipo button:last-child.on { border-color: var(--f-coral); color: var(--f-coral-text); }
      .catlist { display: flex; flex-direction: column; }
      .catrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--f-hair); }
      .catrow:last-child { border-bottom: 0; }
      .catrow b { font-size: 13.5px; display: block; }
      .catrow span { font-size: 12px; color: var(--f-ink-mid); }
      .fnone { font-size: 12.5px; color: var(--f-ink-mid); margin: 0; line-height: 1.5; }

      /* Botón de filtros — mobile */
      /* Barra de acciones en mobile: las principales al alcance del pulgar, fijas abajo.
         La primaria (la última) queda a la derecha y ocupa más ancho. */
      .mbar {
        display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; gap: 10px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: var(--f-card); border-top: 1px solid var(--f-hair); box-shadow: 0 -6px 24px rgba(15,23,42,.07);
      }
      .mbar.on { display: flex; }
      .mbar .btn { flex: 1 1 0; min-width: 0; justify-content: center; height: 50px; font-size: 14px; }
      .mbar .btn.pri { flex: 1.4 1 0; }
      body.conbar .wrap { padding-bottom: 96px; }

      /* ==========================================================================
         SUPERFICIES
         ========================================================================== */
      .card {
        background: var(--f-card); border: 1px solid var(--f-hair); border-radius: var(--f-r-card);
        box-shadow: var(--f-shadow-sm); padding: 22px;
      }
      .card.tight { padding: 18px; }
      .card.clickable { cursor: pointer; transition: transform 180ms var(--f-ease), box-shadow 180ms var(--f-ease); }
      .card.clickable:hover { transform: translateY(-2px); box-shadow: var(--f-shadow-md); }
      .card > h3, .sec > h3 { margin: 0 0 4px; font-size: 16px; font-weight: 300; letter-spacing: -0.01em; }
      .card > h3 strong, .sec > h3 strong { font-weight: 600; }
      .card > .cap, .sec > .cap { font-size: 12.5px; color: var(--f-ink-mid); margin: 0 0 18px; }
      /* Acción de una card, anclada arriba a la derecha: el h3 y el .cap son hijos DIRECTOS
         de .card (los selectores usan `>`), así que envolverlos para hacer un header flex
         los dejaba sin estilo. */
      .card { position: relative; }
      .cardact { position: absolute; top: 18px; right: 18px; z-index: 1; }
      /* Cifra protagonista de una card, en la MISMA línea que su h3: colgada al final del
         gráfico se leía como un rótulo suelto del eje, no como el número del que habla el
         título (JP, 26/ago). */
      /* Flota arriba a la derecha del card; en mobile no hay lugar y pasa a fluir (ver
         el bloque responsive), porque encimado sobre el título es ilegible. */
      .cardnum {
        position: absolute; top: 18px; right: 22px; z-index: 1; font-size: 26px; font-weight: 200;
        letter-spacing: -0.035em; color: var(--f-ink); font-variant-numeric: tabular-nums;
        line-height: 1.05;
      }

      /* ---------- Gestor de categorías de gasto ---------- */
      .catmgr { display: flex; flex-direction: column; gap: 6px; }
      .catrow {
        display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--f-r-item);
        border: 1px solid transparent; background: var(--f-paper); transition: all 140ms var(--f-ease);
      }
      .catrow:hover { border-color: var(--f-hair-strong); background: var(--f-card); }
      .catrow.drag { opacity: .45; }
      .catrow.ghost { background: transparent; border-style: dashed; border-color: var(--f-hair-strong); }
      .catrow.auto { background: var(--f-brand-wash); border-color: rgba(0,114,251,.2); }
      .catrow.auto:hover { border-color: rgba(0,114,251,.2); background: var(--f-brand-wash); }
      .catrow .grip.lock { cursor: default; color: var(--f-brand); }
      .catrow.ghost .cname { color: var(--f-ink-mid); font-weight: 500; font-style: italic; }
      .catrow.over { border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      /* El grip va SIEMPRE visible: es la única señal de que la fila se arrastra
         (misma decisión que el organizador de servicios). */
      .catrow .grip {
        cursor: grab; color: var(--f-ink-whisper); display: flex; flex-shrink: 0;
        width: 22px; height: 22px; align-items: center; justify-content: center;
      }
      .catrow .grip:active { cursor: grabbing; }
      .catrow .grip svg { width: 15px; height: 15px; }
      .catrow .cname { font-size: 13px; font-weight: 600; color: var(--f-ink); flex: 1; min-width: 0; }
      .catrow .cmeta {
        font-size: 11.5px; color: var(--f-ink-mid); white-space: nowrap;
        font-variant-numeric: tabular-nums; flex-shrink: 0;
      }
      .catrow .cact {
        flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; display: flex;
        align-items: center; justify-content: center; color: var(--f-ink-whisper);
        border: 1px solid transparent; background: transparent; transition: all 140ms var(--f-ease);
      }
      .catrow .cact:hover { color: var(--f-ink); border-color: var(--f-hair-strong); background: var(--f-card); }
      .catrow .cact.del:hover { color: var(--f-coral-text); border-color: color-mix(in srgb, var(--f-coral) 30%, var(--f-hair-strong)); }
      .catrow .cact svg { width: 14px; height: 14px; }
      .catrow input.cedit {
        flex: 1; min-width: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--f-ink);
        padding: 5px 9px; border-radius: 8px; border: 1px solid var(--f-brand);
        box-shadow: 0 0 0 3px var(--f-brand-wash); background: var(--f-card);
      }
      .catnew {
        margin-top: 10px; width: 100%; padding: 11px; border-radius: var(--f-r-item);
        border: 1px dashed var(--f-hair-strong); background: transparent; color: var(--f-ink-mid);
        font-size: 12.5px; font-weight: 600; transition: all 140ms var(--f-ease);
      }
      .catnew:hover { border-color: var(--f-brand); color: var(--f-brand); background: var(--f-brand-wash); }

      .grid { display: grid; gap: 14px; }
      .g2 { grid-template-columns: 1fr 1fr; }
      .g3 { grid-template-columns: repeat(3, 1fr); }
      .g4 { grid-template-columns: repeat(4, 1fr); }
      .g5 { grid-template-columns: repeat(5, 1fr); }
      .grid.top { align-items: start; }
      .grid.top:has(.barsbox) { align-items: stretch; }
      .grid.top:has(.barsbox) > .card { display: flex; flex-direction: column; }
      .grid.top:has(.barsbox) > .card > .barsbox { flex: 1 1 auto; }
      .sec { margin-bottom: 26px; }
      .sec > h2 { font-size: 22px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 4px; }
      .sec > h2 strong { font-weight: 600; }
      .sec > .lede { font-size: 13px; color: var(--f-ink-mid); margin: 0 0 16px; max-width: 78ch; }
      .sec > .lede a { color: var(--f-brand-deep); font-weight: 600; text-decoration: none; }

      /* KPI */
      .stat .k {
        font-size: 9.5px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase;
        color: var(--f-ink-mid); display: flex; align-items: center; gap: 8px;
      }
      /* Sin ícono la tarjeta se compacta: el rótulo ya no tiene que alinearse contra un
         cuadrado de 28px, así que baja el padding y se acorta el aire sobre el número. */
      .stat.noico { padding: 14px 16px; }
      .stat.noico .v { margin-top: 6px; }
      .stat .v { font-size: 28px; font-weight: 200; letter-spacing: -0.035em; margin: 10px 0 3px; font-variant-numeric: tabular-nums; }
      .stat .s { font-size: 12px; color: var(--f-ink-mid); }
      .stat .s b { color: var(--f-ink); font-weight: 600; }
      /* Fila de KPIs del Resumen: las 5 cajas entran en una sola línea en desktop, así que
         el número y las etiquetas bajan un escalón para que el monto más largo no se corte. */
      .statrow { gap: 12px; }
      .statrow .stat { padding: 16px 14px; }
      .statrow .stat .k { font-size: 8.5px; letter-spacing: 0.10em; gap: 7px; white-space: nowrap; }
      .statrow .stat .v { font-size: clamp(19px, 1.5vw, 26px); margin: 9px 0 3px; white-space: nowrap; }
      .statrow .stat .s { font-size: 11.5px; }
      .statrow .stat .ico { width: 24px; height: 24px; flex: 0 0 24px; }
      .statrow .stat .ico svg { width: 13px; height: 13px; }

      /* Toggle sobre superficie clara */
      .lseg { display: inline-flex; background: var(--f-card); border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-chip); padding: 3px; box-shadow: var(--f-shadow-xs); }
      .lseg button {
        border: 0; background: transparent; color: var(--f-ink-mid); font-size: 13.5px; font-weight: 600;
        padding: 11px 22px; border-radius: var(--f-r-chip); white-space: nowrap; cursor: pointer;
        transition: all 160ms var(--f-ease);
      }
      .lseg button.on { background: var(--f-brand-wash); color: var(--f-brand-deep); }
      .dhead { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 14px; }
      .dhead .dh-t { font-size: 12.5px; color: var(--f-ink-mid); }
      .dhead .dh-t b { color: var(--f-ink); font-weight: 600; }
      .ico { width: 28px; height: 28px; border-radius: var(--f-r-item); display: grid; place-items: center; flex: 0 0 28px; }
      .ico svg { width: 15px; height: 15px; }

      /* Cascada */
      .cascade { display: flex; flex-direction: column; }
      .cascade .r { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; font-size: 13.5px; }
      .cascade .r .lbl { color: var(--f-ink-mid); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
      .cascade .r .amt { margin-left: auto; padding-left: 10px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .cascade .r.neg .amt { color: var(--f-coral-text); }
      /* Subfilas: hijas de la fila de arriba, no ítems del mismo nivel. Lo que más las
         hacía leer como pares era el NÚMERO —mismo peso y tinta que el total de Egresos—,
         así que baja a tamaño chico, peso normal y tinta media. La guía en L las cuelga
         visualmente de su padre. */
      .cascade .r.sub { padding: 5px 0; }
      .cascade .r.sub .lbl {
        position: relative; padding-left: 26px; font-size: 12.5px; color: var(--f-ink-mid);
      }
      .cascade .r.sub .lbl::before {
        content: ''; position: absolute; left: 9px; top: -11px; bottom: 50%; width: 9px;
        border-left: 1px solid var(--f-hair-strong); border-bottom: 1px solid var(--f-hair-strong);
        border-bottom-left-radius: 5px;
      }
      .cascade .r.sub .amt { font-size: 12.5px; font-weight: 500; color: var(--f-ink-mid); }
      .cascade .r.rule { border-top: 1px solid var(--f-hair); }
      .cascade .r.total { border-top: 1px solid var(--f-hair-strong); padding-top: 14px; }
      .cascade .r.total .lbl { color: var(--f-ink); font-weight: 600; }
      .cascade .r.total .amt { font-size: 22px; font-weight: 200; letter-spacing: -0.03em; }

      /* ==========================================================================
         PROPORCIONES — barra segmentada + filas rankeadas
         ========================================================================== */
      .propbar { display: flex; gap: 3px; height: 34px; margin-bottom: 18px; }
      .propbar span {
        display: block; border-radius: 0; position: relative; transition: opacity 150ms var(--f-ease);
      }
      .propbar span:hover { opacity: .82; }
      .propbar span:first-child { border-radius: 999px 0 0 999px; }
      .propbar span:last-child { border-radius: 0 999px 999px 0; }
      .propbar span:only-child { border-radius: 999px; }

      /* Alto fijo (5 filas) con scroll propio. Cuando queda contenido abajo aparece un
         degradado sobre la última fila y un contador: sin eso, una lista cortada se lee
         como una lista completa. */
      .barsbox { position: relative; min-height: 268px; }
      .barsbox .bars { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; }
      .barsbox .fade, .barsbox .more { opacity: 0; transition: opacity 160ms var(--f-ease); pointer-events: none; }
      .barsbox.hay-mas .fade, .barsbox.hay-mas .more { opacity: 1; }
      .barsbox .fade {
        position: absolute; left: 0; right: 0; bottom: 0; height: 62px;
        background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, var(--f-card) 78%);
      }
      .barsbox .more {
        position: absolute; right: 10px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px;
        background: var(--f-ink); color: #fff; border-radius: 999px; padding: 4px 10px;
        font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
      }
      .barsbox .more::after { content: '↓'; font-size: 11px; opacity: .75; }
      .bars { display: flex; flex-direction: column; }
      .bars .row {
        display: grid; grid-template-columns: 1fr 92px; gap: 16px; align-items: center;
        padding: 11px 10px; border-radius: var(--f-r-item); cursor: pointer;
        transition: background 140ms var(--f-ease); border-bottom: 1px solid var(--f-hair);
      }
      .bars .row:last-child { border-bottom: 0; }
      .bars .row:hover { background: var(--f-brand-wash); }
      .bars .name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 9px; color: var(--f-ink); }
      .bars .name i { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
      .bars .meter { flex: 1; }
      .bars .track { height: 6px; background: var(--f-paper-deep); border-radius: 999px; overflow: hidden; margin-top: 6px; }
      .bars .fill { height: 100%; border-radius: 999px; }
      .bars .val { text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .bars .val em { display: block; font-style: normal; font-size: 11px; font-weight: 500; color: var(--f-ink-mid); }

      /* Tarjeta por profesional — mismo diseño que TeamPayments en producción: grilla pareja
         de 2/3/4 columnas, avatar chico a la izquierda, nombre arriba en gris, el saldo como
         protagonista y el cobrado abajo. Seleccionada = borde de marca + check arriba a la
         derecha (no un borde solo, que se confundía con el hover). */
      .pcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
      @media (min-width: 760px) { .pcards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } }
      @media (min-width: 1280px) { .pcards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .pcard {
        position: relative; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
        background: var(--f-card); border: 1px solid var(--f-hair); border-radius: 16px;
        box-shadow: var(--f-shadow-xs); padding: 12px; transition: all 170ms var(--f-ease);
      }
      .pcard:hover { border-color: rgba(0,114,251,.35); }
      .pcard.on { border-color: var(--f-brand); background: var(--f-brand-wash); }
      .pcard .ck {
        position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; border-radius: 50%;
        background: var(--f-brand); color: #fff; display: grid; place-items: center;
      }
      .pcard .ck svg { width: 9px; height: 9px; }
      .pcard .t { min-width: 0; flex: 1; padding-right: 12px; }
      .pcard .nm { font-size: 12px; font-weight: 500; color: var(--f-ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pcard .vv { font-size: 18px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.25; font-variant-numeric: tabular-nums; color: var(--f-ink); }
      .pcard .ss { margin-top: 2px; font-size: 10px; font-weight: 500; line-height: 1.3; color: var(--f-ink-mid); }
      .pcard .ss b { display: block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--f-ink-soft); font-variant-numeric: tabular-nums; }
      .pcard .avp {
        width: 36px; height: 36px; flex: 0 0 36px; font-size: 13px;
        background: var(--f-brand-wash); color: var(--f-brand-deep); box-shadow: inset 0 0 0 1px var(--f-hair-strong);
      }

      /* Progreso pagado / total */
      .prog { height: 6px; background: var(--f-paper-deep); border-radius: 999px; overflow: hidden; min-width: 70px; }
      .prog i { display: block; height: 100%; border-radius: 999px; background: var(--f-brand); }

      /* ==========================================================================
         CHIPS
         ========================================================================== */
      .chip {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
        padding: 3px 10px; border-radius: var(--f-r-chip); border: 1px solid transparent; white-space: nowrap;
      }
      .chip svg { width: 11px; height: 11px; }
      .chip.ok { background: var(--f-success-wash); color: var(--f-success-text); border-color: rgba(16,185,129,.22); }
      .chip.pend { background: var(--f-warning-wash); color: var(--f-warning-text); border-color: rgba(245,158,11,.25); }
      .chip.bad { background: var(--f-coral-wash); color: var(--f-coral-text); border-color: rgba(255,70,88,.22); }
      .chip.mute { background: var(--f-paper); color: var(--f-ink-mid); border-color: var(--f-hair); }
      /* La categoría que escribe Ágora sola, no el dueño. */
      .chip.sys { background: var(--f-brand-wash); color: var(--f-brand-deep); border-color: rgba(0,114,251,.2); gap: 4px; }
      .chip.sys svg { width: 9px; height: 9px; flex: 0 0 9px; }
      .chip.brand { background: var(--f-brand-wash); color: var(--f-brand-deep); border-color: rgba(0,114,251,.2); }

      /* ==========================================================================
         TABLAS
         ========================================================================== */
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th {
        text-align: left; font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--f-ink-mid); padding: 16px 14px 12px; border-bottom: 1px solid var(--f-hair-strong); white-space: nowrap;
      }
      .tbl th.sortable { cursor: pointer; user-select: none; }
      .tbl th.sortable:hover { color: var(--f-ink); }
      .tbl th .ar { opacity: .3; }
      .tbl th.act { color: var(--f-brand-deep); }
      .tbl th.act .ar { opacity: 1; }
      .tbl td { padding: 13px 14px; border-bottom: 1px solid var(--f-hair); font-size: 13px; vertical-align: middle; color: var(--f-ink-soft); }
      /* Medio y destino se escanean como una unidad. El wrapper de Mercado Pago ya trae
         logo + texto; la celda fija su alineación para que no cambie la línea base frente
         a texto plano ni se pegue a la columna contigua. */
      .tbl td.paycell { min-width: 150px; padding-inline: 18px; }
      .tbl td.paycell > span { display: inline-flex; align-items: center; min-height: 24px; line-height: 1.25; }
      .tbl tbody tr { transition: background 130ms var(--f-ease); }
      .tbl tbody tr.hoverable:hover { background: var(--f-brand-wash); cursor: pointer; }
      .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
      .tbl .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--f-ink); }
      .tbl .amt.out { color: var(--f-coral-text); }
      .tbl tfoot td {
        border-bottom: 0; border-top: 1px solid var(--f-hair-strong); font-weight: 600;
        padding-top: 14px; color: var(--f-ink);
      }
      .tblwrap { overflow-x: auto; }
      /* Piso de ancho para las columnas de texto largo: sin esto el navegador las
         comprime hasta partirlas en 3+ renglones. Los datos cortos nunca se parten. */
      /* La columna de concepto pasó a tener filtro propio, y la cabecera del filtro suma su
         chrome (embudo + chevron + padding). Con el mínimo viejo de 230px las tablas de
         Cobros y Por cobrar se iban de ancho y recortaban la última columna (el botón de
         acción). El concepto puede envolver en dos líneas: es el campo largo, no el que se
         escanea de un vistazo. */
      .tbl th.cw, .tbl td.cw { min-width: 186px; }
      .tcard { padding: 0 8px; }
      .tcard.pt { padding-top: 8px; }
      /* Alto fijo e igual en todas las secciones: entran ~7 filas y la tabla scrollea
         adentro. La cabecera y el pie quedan anclados para no perder de vista qué se lee
         ni el total. */
      .tcard .tblwrap { max-height: 552px; overflow-y: auto; }
      .tcard .tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--f-card); }
      .tcard .tbl tfoot td { position: sticky; bottom: 0; background: var(--f-card); box-shadow: 0 -1px 0 var(--f-hair); }
      .tbl td.amt, .tbl td .mono, .tbl td.nw, .tbl th.nw { white-space: nowrap; }
      .who { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .av {
        width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px; display: grid; place-items: center;
        font-size: 12px; font-weight: 700;
      }
      .avp {
        width: 44px; height: 44px; border-radius: 50%; flex: 0 0 44px; display: grid; place-items: center;
        font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
        box-shadow: inset 0 0 0 1px rgba(15,23,42,.06), 0 0 0 3px var(--f-card), 0 0 0 4px var(--f-hair);
      }
      .who .t { min-width: 0; }
      .who .t b { display: block; font-weight: 600; font-size: 13px; color: var(--f-ink); }
      .who .t span { display: block; font-size: 11.5px; color: var(--f-ink-mid); }

      .empty { text-align: center; padding: 48px 20px; color: var(--f-ink-mid); font-size: 13px; }
      .empty b { display: block; color: var(--f-ink); font-size: 15px; font-weight: 600; margin-bottom: 6px; }

      /* ==========================================================================
         CHART
         ========================================================================== */
      .chart { position: relative; }
      .chart svg { width: 100%; height: auto; overflow: visible; }
      .chart .gl { stroke: var(--f-hair); stroke-width: 1; }
      .chart rect.bar { transition: opacity 120ms var(--f-ease); }
      .chart:hover rect.bar { opacity: .4; }
      .chart rect.bar:hover { opacity: 1 !important; }
      .legend { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 500; color: var(--f-ink-mid); }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .legend i { width: 9px; height: 9px; border-radius: 3px; display: block; }
      .tip {
        position: fixed; z-index: 95; pointer-events: none; background: var(--f-ink); color: #fff;
        padding: 9px 12px; border-radius: var(--f-r-item); font-size: 12px; box-shadow: var(--f-shadow-lg);
        opacity: 0; transition: opacity 60ms var(--f-ease); max-width: 260px; font-weight: 500;
      }
      .tip.on { opacity: 1; }
      .tip b { font-size: 9.5px; letter-spacing: 0.18em; color: #94A3B8; display: block; text-transform: uppercase; }
      .tip .l { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-variant-numeric: tabular-nums; }
      .tip .l i { width: 8px; height: 8px; border-radius: 2px; }
      .tip .l em { font-style: normal; margin-left: auto; font-weight: 600; padding-left: 14px; }

      /* ==========================================================================
         NOTAS
         ========================================================================== */
      .note {
        background: var(--f-brand-wash); border: 1px solid rgba(0,114,251,.14); border-radius: var(--f-r-card);
        padding: 14px 18px; font-size: 12.5px; color: var(--f-ink-soft);
      }
      .note b { color: var(--f-ink); font-weight: 600; }
      .note.warn { background: var(--f-coral-wash); border-color: rgba(255,70,88,.16); }
      .note a { color: var(--f-brand-deep); font-weight: 600; text-decoration: none; }

      .chg {
        display: flex; align-items: center; gap: 14px; background: var(--f-brand-wash);
        border: 1px solid rgba(0,114,251,.14); border-radius: var(--f-r-card); padding: 14px 18px;
        margin-bottom: 22px; font-size: 12.5px; color: var(--f-brand-deep); flex-wrap: wrap;
      }
      .chg > div { flex: 1; min-width: 300px; }
      .chg .tag {
        font-size: 9px; font-weight: 600; letter-spacing: 0.18em; background: var(--f-brand); color: #fff;
        padding: 3px 9px; border-radius: var(--f-r-chip); text-transform: uppercase;
      }
      .chg b { color: var(--f-ink); }
      .chg .go {
        margin-left: auto; border: 1px solid var(--f-brand); background: transparent; color: var(--f-brand-deep);
        font-weight: 600; font-size: 12px; padding: 6px 13px; border-radius: var(--f-r-item);
      }
      .chg .go:hover { background: var(--f-card); }
      .gonechip {
        display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500;
        color: var(--f-ink-mid); border: 1px dashed var(--f-hair-stronger); border-radius: var(--f-r-chip);
        padding: 6px 13px; text-decoration: line-through;
      }
      .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
      .pill {
        display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent;
        background: var(--f-card); border-radius: var(--f-r-chip); padding: 8px 15px; font-size: 12.5px;
        font-weight: 500; color: var(--f-ink-mid); box-shadow: var(--f-shadow-xs);
        transition: all 150ms var(--f-ease);
      }
      .pill:hover { color: var(--f-ink); }
      .pill.on { background: var(--f-brand); color: #fff; font-weight: 600; box-shadow: var(--f-shadow-glow); }

      /* ==========================================================================
         DRAWER · SHEET · TOAST
         ========================================================================== */
      .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 70; opacity: 0; pointer-events: none; transition: opacity 220ms var(--f-ease); }
      .scrim.on { opacity: 1; pointer-events: auto; }
      .drawer {
        position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 94vw; background: var(--f-card);
        z-index: 80; box-shadow: var(--f-shadow-lg); transform: translateX(102%);
        transition: transform 300ms var(--f-ease); display: flex; flex-direction: column;
      }
      .drawer.on { transform: none; }
      .drawer .dh { padding: 22px 26px; border-bottom: 1px solid var(--f-hair); display: flex; align-items: flex-start; gap: 14px; }
      .drawer .dh h3 { margin: 0; font-size: 19px; font-weight: 300; }
      .drawer .dh h3 strong { font-weight: 600; }
      .drawer .db { padding: 22px 26px; overflow-y: auto; flex: 1; }
      .drawer .df { padding: 16px 26px; border-top: 1px solid var(--f-hair); display: flex; gap: 10px; flex-wrap: wrap; }
      .x { border: 0; background: var(--f-paper); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; margin-left: auto; flex: 0 0 32px; color: var(--f-ink-soft); }
      .x:hover { background: var(--f-paper-deep); }
      .x svg { width: 15px; height: 15px; }

      .tl { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 1px solid var(--f-hair-strong); }
      .tl li { position: relative; padding: 0 0 18px 16px; font-size: 12.5px; color: var(--f-ink-mid); }
      .tl li::before { content: ''; position: absolute; left: -25px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--f-card); border: 2px solid var(--f-hair-stronger); }
      .tl li.now::before { border-color: var(--f-brand); background: var(--f-brand); }
      .tl li b { display: block; color: var(--f-ink); font-size: 13px; font-weight: 600; }
      .tl li .t { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--f-ink-mid); }

      .sheet {
        position: fixed; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(.97);
        width: 560px; max-width: 94vw; max-height: 88vh; overflow: hidden; background: var(--f-card);
        display: flex; flex-direction: column;
        border-radius: var(--f-r-shell); box-shadow: var(--f-shadow-lg); opacity: 0; pointer-events: none;
        transition: opacity 220ms var(--f-ease), transform 220ms var(--f-ease);
      }
      .sheet.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
      .sheet .sh { padding: 22px 26px 0; display: flex; align-items: flex-start; gap: 14px; }
      .sheet .sh h3 { margin: 0; font-size: 19px; font-weight: 300; }
      .sheet .sh h3 strong { font-weight: 600; }
      .sheet .sb { padding: 18px 26px 22px; flex: 1; min-height: 0; overflow-y: auto; }
      .sheet .sf { padding: 16px 26px 22px; display: flex; gap: 10px; border-top: 1px solid var(--f-hair); background: var(--f-card); }
      .fld { margin-bottom: 14px; }
      .fld label { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--f-ink-mid); margin-bottom: 7px; }
      .fld input, .fld select, .fld textarea {
        width: 100%; border: 1px solid var(--f-hair-strong); border-radius: var(--f-r-input); padding: 11px 13px;
        font-size: 14px; font-weight: 500; color: var(--f-ink); background: var(--f-card); outline: none;
      }
      .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--f-brand); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .fld .hint { font-size: 11.5px; color: var(--f-ink-mid); margin-top: 6px; }
      .radios { display: flex; gap: 8px; flex-wrap: wrap; }
      .radios button {
        border: 1px solid var(--f-hair-strong); background: var(--f-card); border-radius: var(--f-r-chip);
        padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--f-ink-mid);
      }
      .radios button.on { background: var(--f-brand); border-color: var(--f-brand); color: #fff; font-weight: 600; }

      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px); z-index: 95;
        background: var(--f-ink); color: #fff; padding: 12px 20px; border-radius: var(--f-r-chip);
        font-size: 13px; font-weight: 500; box-shadow: var(--f-shadow-lg); opacity: 0; pointer-events: none;
        transition: all 240ms var(--f-ease); display: flex; align-items: center; gap: 10px;
      }
      .toast.on { opacity: 1; transform: translate(-50%, 0); }
      .toast svg { width: 16px; height: 16px; color: var(--f-success); }

      /* ==========================================================================
         CAJA
         ========================================================================== */
      .arq { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
      .arq .side { position: sticky; top: 18px; }
      .contado { margin-top: 4px; }
      .contado label { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--f-ink-mid); margin-bottom: 10px; }
      .contado .cwrap {
        display: flex; align-items: baseline; gap: 6px; background: var(--f-paper);
        border: 1px solid transparent; border-radius: var(--f-r-input); padding: 14px 18px;
      }
      .contado .cwrap:focus-within { border-color: var(--f-brand); background: var(--f-card); box-shadow: 0 0 0 3px var(--f-brand-wash); }
      .contado .cwrap span { font-size: 26px; font-weight: 200; color: var(--f-ink-mid); }
      .contado input {
        flex: 1; border: 0; background: transparent; outline: 0; font-size: 34px; font-weight: 200;
        letter-spacing: -0.035em; color: var(--f-ink); font-variant-numeric: tabular-nums; padding: 0; min-width: 0;
      }
      .den {
        display: grid; grid-template-columns: 72px 1fr 92px; gap: 10px; align-items: center;
        background: var(--f-paper); border: 1px solid transparent; border-radius: var(--f-r-input); padding: 8px 12px;
      }
      .den:focus-within { border-color: var(--f-brand); background: var(--f-card); }
      .den .d { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--f-ink-soft); }
      .den input { width: 100%; border: 0; outline: 0; text-align: center; font-size: 15px; font-weight: 600; background: var(--f-card); border-radius: 8px; padding: 6px 0; color: var(--f-ink); }
      .den .st { text-align: right; font-size: 12px; font-weight: 600; color: var(--f-ink-mid); font-variant-numeric: tabular-nums; }
      .verdict { border-radius: var(--f-r-card); padding: 18px; text-align: center; border: 1px solid; }
      .verdict .n { font-size: 9.5px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; }
      .verdict .v { font-size: 32px; font-weight: 200; letter-spacing: -0.035em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
      .verdict .s { font-size: 12px; }
      .verdict.ok { background: var(--f-success-wash); border-color: rgba(16,185,129,.25); color: var(--f-success-text); }
      .verdict.bad { background: var(--f-coral-wash); border-color: rgba(255,70,88,.25); color: var(--f-coral-text); }
      .verdict.warn { background: var(--f-warning-wash); border-color: rgba(245,158,11,.28); color: var(--f-warning-text); }
      .kv { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; font-size: 13px; color: var(--f-ink-mid); }
      .kv + .kv { border-top: 1px solid var(--f-hair); }
      .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--f-ink); }

      /* ==========================================================================
         CONCEPTOS
         ========================================================================== */
      .split .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
      .split .head .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; color: var(--f-ink-mid); }
      .split .head .v { font-size: 32px; font-weight: 200; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
      .split .head .d { font-size: 13px; color: var(--f-ink-mid); }
      .split .bar { display: flex; gap: 4px; height: 30px; }
      .split .seg { border-radius: 8px; display: block; }
      .split .seg.pay { background: var(--f-brand); }
      .split .seg.owe { background: var(--f-coral-wash); border: 1.5px dashed var(--f-coral); }
      .split .legs { display: grid; gap: 4px; margin-top: 14px; align-items: start; }
      .split .leg { padding-right: 18px; }
      .split .leg .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
      .split .leg .k i { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; }
      .split .leg.pay .k { color: var(--f-brand-deep); }
      .split .leg.pay .k i { background: var(--f-brand); }
      .split .leg.owe .k { color: var(--f-coral-text); }
      .split .leg.owe .k i { background: var(--f-coral-wash); border: 1.5px dashed var(--f-coral); }
      .split .leg .v { font-size: 21px; font-weight: 200; letter-spacing: -0.03em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
      .split .leg .d { font-size: 12.5px; color: var(--f-ink-mid); }
      .split .then { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--f-hair); }
      .split .leg.owe .then .k { color: var(--f-brand-deep); }
      .split .leg.owe .then .k i { background: var(--f-brand); border: 0; }

      .gt { width: 100%; border-collapse: collapse; }
      .gt th {
        text-align: left; font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--f-ink-mid); padding: 0 16px 12px; border-bottom: 1px solid var(--f-hair-strong);
      }
      .gt td { padding: 17px 16px; border-bottom: 1px solid var(--f-hair); vertical-align: top; font-size: 13px; color: var(--f-ink-soft); }
      .gt td b { color: var(--f-ink); font-weight: 600; }
      .gt .cterm { font-size: 15px; font-weight: 600; color: var(--f-ink); }
      .gt .ctag { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--f-ink-mid); margin-top: 5px; }
      .gt .cno { border-left: 2px solid var(--f-coral); padding: 1px 0 1px 11px; margin-top: 11px; font-size: 12.5px; }
      .gt tr.grp td { padding-top: 32px; padding-bottom: 10px; border-bottom: 1px solid var(--f-hair-strong); color: var(--f-ink); }
      .gt tr.grp:first-child td { padding-top: 4px; }
      .gt tr.grp .gn { font-size: 9.5px; font-weight: 600; letter-spacing: 0.20em; color: var(--f-ink-mid); margin-bottom: 6px; }
      .gt tr.grp h3 { font-size: 19px; font-weight: 300; margin: 0 0 5px; }
      .gt tr.grp h3 strong { font-weight: 600; }
      .gt tr.grp p { margin: 0; font-size: 13px; max-width: 82ch; color: var(--f-ink-mid); }
      .gt .col1 { width: 190px; }
      .gt .col2 { width: 42%; }
      @media (max-width: 900px) { .gt { min-width: 820px; } }

      /* ==========================================================================
         RESPONSIVE
         ========================================================================== */
      @media (max-width: 1180px) {
        .content { grid-template-columns: 232px minmax(0, 1fr); }
        .arq { grid-template-columns: minmax(0, 1fr); }
        .arq .side { position: static; }
      }
      @media (max-width: 1100px) {
        .rail { display: none; }
        .wrap { padding: 0 20px; }
        .content { grid-template-columns: minmax(0, 1fr); }
        /* La tabla usa todo el ancho de la pantalla y como mucho el 60% del alto: scrollea
           adentro en vez de empujar el resto de la vista fuera del viewport. La cabecera y
           el pie quedan fijos para no perder de vista qué se está leyendo ni el total. */
        .tcard { margin-left: -20px; margin-right: -20px; border-left: 0; border-right: 0; border-radius: 0; }
        .tcard .tblwrap { max-height: 60vh; }
        .tcard .tbl th:first-child, .tcard .tbl td:first-child { padding-left: 20px; }
        .tcard .tbl th:last-child, .tcard .tbl td:last-child { padding-right: 20px; }

        .g4, .g3 { grid-template-columns: 1fr 1fr; }
        .g5 { grid-template-columns: repeat(3, 1fr); }
      }
      @media (max-width: 760px) {
        .cardnum { position: static; display: block; margin: 2px 0 10px; font-size: 30px; }
        .fbar { flex-wrap: wrap; }
        .fbar .fbx { width: 100%; }
        .fbar .ffield { flex: 1; min-width: 0; }
        .dppop { flex-direction: column; left: 0; right: 0; width: auto; }
        .dppresets { width: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--f-hair); display: flex; gap: 6px; overflow-x: auto; padding: 10px; }
        .dppresets .k { display: none; }
        .dppresets button { width: auto; white-space: nowrap; border: 1px solid var(--f-hair-strong); background: var(--f-card); }
        .dpcals { display: block; width: auto; }
        .dpcal { width: auto; }
        .dpcal + .dpcal { margin: 16px 0 0; padding: 16px 0 0; border-left: 0; border-top: 1px solid var(--f-hair); }
        .mhead { padding: 18px 0 14px; }
        /* Las acciones que crean algo viven en la barra de abajo: en el header solo queda
           Exportar, así que va chico y en línea con el título, no como una barra aparte. */
        .mhead .acts { margin-left: auto; width: auto; min-height: 0; flex-wrap: nowrap; }
        /* Solo el ícono: el título ya dice de qué sección se exporta. */
        .mhead .acts .btn { width: 42px; height: 42px; padding: 0; justify-content: center; }
        .mhead .acts .btn span { display: none; }
        .mhead .acts .btn { gap: 0; }
        .mhead .acts .btn svg { width: 19px; height: 19px; }
        .frost-h1 { font-size: 27px; }
        .g4, .g3, .g2, .g5 { grid-template-columns: 1fr; }
        /* Resumen en mobile: sin cards. Cada item es una fila separada por una línea,
           con el monto a la derecha, para que el bloque entero entre casi de una. */
        .statrow { gap: 0; }
        .statrow .stat {
          background: none; border: 0; box-shadow: none; border-radius: 0; padding: 13px 0;
          display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px;
          align-items: center; border-top: 1px solid var(--f-hair-strong);
        }
        .statrow .stat:first-child { border-top: 0; padding-top: 2px; }
        .statrow .stat:last-child { padding-bottom: 2px; }
        .statrow .stat .k { grid-column: 1; grid-row: 1; }
        .statrow .stat .s { grid-column: 1; grid-row: 2; margin-top: 3px; }
        .statrow .stat .v { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: 21px; text-align: right; }
        .statrow .stat.clickable:hover { transform: none; box-shadow: none; }
        /* Misma idea en la columna de Comisiones. */
        .cstats { gap: 0; }
        .cstats .stat {
          background: none; border: 0; box-shadow: none; border-radius: 0; padding: 13px 0;
          display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px;
          align-items: center; border-top: 1px solid var(--f-hair-strong);
        }
        .cstats .stat .k { grid-column: 1; grid-row: 1; font-size: 8.5px; letter-spacing: 0.10em; }
        .cstats .stat .s { grid-column: 1; grid-row: 2; margin-top: 3px; font-size: 11.5px; }
        .cstats .stat .v { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: clamp(17px, 5vw, 21px); text-align: right; }
        .cstats .statmark { display: none; }
        .cstats .dpwrap { margin-bottom: 8px; }
        .commission-chart { display: none; }
        .pcard .vv { font-size: clamp(15px, 4.4vw, 18px); white-space: nowrap; }
        .dhead { margin-bottom: 12px; }
        .split .legs { grid-template-columns: 1fr !important; }
        .card { padding: 18px; }
        .drawer .dh, .drawer .db, .drawer .df, .sheet .sh, .sheet .sb, .sheet .sf { padding-left: 20px; padding-right: 20px; }
        /* Full screen: en un teléfono un modal centrado con scroll propio pelea con el
           scroll de la página y deja los botones fuera de alcance. */
        .sheet {
          inset: 0; left: 0; top: 0; width: 100%; max-width: none; max-height: none;
          height: 100dvh; border-radius: 0; transform: translateY(16px);
        }
        .sheet.on { transform: none; }
        .sheet .sb { flex: 1; overflow-y: auto; }
        .sheet .sf { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--f-hair); }
        .sheet .sf .btn { height: 48px; }
      }

      /* ==========================================================================
         FINANZAS · VISUAL PASS 2026-08
         La estructura y el contenido se conservan. Esta capa recupera la jerarquía
         Frost, vuelve comparables los gráficos y concentra el énfasis en el neto.
         ========================================================================== */
      ::selection { background: var(--f-brand); color: #fff; }
      * { scrollbar-color: var(--f-hair-stronger) transparent; scrollbar-width: thin; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb { background: var(--f-hair-stronger); border: 3px solid transparent; border-radius: 999px; background-clip: padding-box; }
      input, textarea { caret-color: var(--f-brand); }

      body { background: #F3F6FB; }
      .app { min-height: 100vh; }
      main { position: relative; }
      .wrap { max-width: 1380px; padding: 0 42px; }

      .rail { width: 252px; flex-basis: 252px; background: rgba(255,255,255,.97); }
      .railin { padding: 24px 14px 30px; }
      .rail .brand { padding: 2px 12px 24px; }
      .rail .brand img { height: 22px; }
      .rail a { min-height: 42px; padding: 10px 12px; }
      .rail a.on {
        background: var(--f-card); color: var(--f-brand-deep);
        box-shadow: inset 0 0 0 1px rgba(0,114,251,.12), var(--f-shadow-xs);
      }
      .rail .kids { margin-left: 20px; padding-left: 8px; }
      .rail .kids a.on { background: var(--f-brand-wash); box-shadow: none; }

      .mhead { padding: 34px 0 22px; }
      .frost-kicker { display: none; }
      .frost-h1 { font-size: clamp(34px, 3vw, 48px); line-height: 1.02; letter-spacing: -.035em; }
      .mhead .acts .btn { min-width: 46px; }
      .btn { border-color: var(--f-hair-strong); box-shadow: var(--f-shadow-xs); }
      .btn:hover { transform: translateY(-1px); border-color: var(--f-hair-stronger); }
      .btn.pri:hover { box-shadow: 0 14px 28px -16px rgba(0,92,212,.72); }
      .dpbar { border-color: var(--f-hair-strong); box-shadow: 0 8px 24px -20px rgba(15,23,42,.30); }

      .card {
        border-color: rgba(15,23,42,.08);
        box-shadow: 0 18px 42px -34px rgba(15,23,42,.42), 0 1px 2px rgba(15,23,42,.03);
      }
