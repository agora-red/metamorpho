      /* ---------------- REGISTRAR COBRO ----------------
         Espeja CollectPaymentModal de producción: intención (seña / saldo / total), monto
         editable topeado al pendiente, detección de pago parcial, medio de cobro, descuento
         ad hoc (en $ o en %) y fecha y hora del cobro —este instante por default, editable
         para cargarlo atrasado—. El paso 1 lista las ventas por cobrar con buscador por
         cliente y, para servicios, ordenadas por fecha de turno ascendente: primero lo más
         viejo, que es lo que se reclama antes. */
      let COB_SEL = null, COB_Q = '', COB_DESC = { v: 0, unidad: '$' };

      function openCobrar(id) {
        const abiertos = activeRecv();
        if (!abiertos.length) { toast('No hay ventas con cobro pendiente'); return; }
        COB_SEL = id && abiertos.some((r) => r.id === id) ? id : null;
        COB_Q = ''; COB_DESC = { v: 0, unidad: '$' };
        pintarCobrar();
      }

      function listaCobrables() {
        const q = COB_Q.trim().toLowerCase();
        return activeRecv()
          .filter((r) => !q || (r.client + ' ' + r.concept).toLowerCase().includes(q))
          // Servicios primero, por fecha de turno ascendente; después el resto.
          .sort((a, b) => {
            const sa = a.origin === 'servicio' ? 0 : 1, sb = b.origin === 'servicio' ? 0 : 1;
            return sa !== sb ? sa - sb : a.date.localeCompare(b.date);
          });
      }

      function buscarCobrable(v) {
        COB_Q = v;
        const box = el('rcList');
        if (!box) return;
        box.innerHTML = filasCobrables();
        const inp = el('rcBuscar');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }

      function filasCobrables() {
        const rows = listaCobrables();
        if (!rows.length) return `<div class="empty"><b>Nada por acá</b>No hay ventas que coincidan con la búsqueda.</div>`;
        return rows.map((x) => `<button class="pickrow" onclick="COB_SEL='${x.id}';pintarCobrar()">
          <div class="t"><b>${esc(x.client)}</b><span>${esc(x.concept)} · ${x.origin === 'servicio' ? Z().turno + ' del ' : ''}${fD(x.date)}</span></div>
          <div class="a"><b>${$$(saldoOf(x))}</b><span>${x.paid ? 'de ' + $$(x.total) : 'sin seña'}</span></div>
        </button>`).join('');
      }

      function setDescuento(v, unidad) {
        COB_DESC = { v: Math.max(0, Number(v) || 0), unidad: unidad || COB_DESC.unidad };
        const r = activeRecv().find((x) => x.id === COB_SEL);
        if (r) pintarTotalCobro(r);
      }
      function descuentoDe(r) {
        const bruto = Number(el('rcAmt') ? el('rcAmt').value : 0) || 0;
        return COB_DESC.unidad === '%' ? Math.round(bruto * (Math.min(100, COB_DESC.v) / 100)) : Math.min(bruto, COB_DESC.v);
      }
      function pintarTotalCobro(r) {
        const bruto = Number(el('rcAmt').value || 0);
        const desc = descuentoDe(r);
        const neto = Math.max(0, bruto - desc);
        const parcial = neto > 0 && neto < saldoOf(r);
        el('rcTotal').innerHTML = `
          <div class="adtr"><span class="k">Cobra</span><span class="v">${$$(bruto)}</span></div>
          ${desc ? `<div class="adtr"><span class="k">Descuento${COB_DESC.unidad === '%' ? ` (${COB_DESC.v}%)` : ''}</span><span class="v" style="color:var(--f-coral-text)">−${$$(desc)}</span></div>` : ''}
          <div class="adtr tot"><span class="k">Entra ahora</span><span class="v">${$$(neto)}</span></div>
          <p class="hint" style="margin:8px 0 0">${neto > saldoOf(r) ? `<b style="color:var(--f-coral-text)">Supera el saldo de ${$$(saldoOf(r))}.</b>`
            : parcial ? `<b>Pago parcial.</b> Queda ${$$(saldoOf(r) - neto)} abierto.` : 'Cancela el saldo por completo.'}</p>`;
      }

      function pintarCobrar() {
        const abiertos = activeRecv();
        const r = COB_SEL ? abiertos.find((x) => x.id === COB_SEL) : null;
        if (!r) {
          sheet({
            title: 'Ventas por cobrar',
            body: `<div class="tsearch" style="margin:-2px 0 12px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                <input id="rcBuscar" type="text" value="${esc(COB_Q)}" placeholder="Buscar ${Z().cliente}" oninput="buscarCobrable(this.value)" />
              </div>
              <p class="hint" style="margin:0 0 10px">Los ${Z().turnos} primero, del más viejo al más nuevo.</p>
              <div class="picklist" id="rcList">${filasCobrables()}</div>`,
            ok: null,
          });
          return;
        }
        const saldo = saldoOf(r);
        sheet({
          title: `Cobrar · ${r.client}`,
          body: `<div class="adtr" style="padding-top:0"><span class="k">${esc(r.concept)}</span><span class="v">${$$(r.total)}</span></div>
            <div class="adtr"><span class="k">Ya cobrado</span><span class="v" style="color:var(--f-success-text)">${r.paid ? '−' + $$(r.paid) : '$0'}</span></div>
            <div class="adtr tot" style="margin-bottom:16px"><span class="k">Falta cobrar</span><span class="v">${$$(saldo)}</span></div>

            <div class="fld"><label>¿Qué estás cobrando?</label>
              <div class="radios" id="rcIntent">
                ${r.paid ? '' : `<button data-i="sena" data-m="${Math.round(r.total * 0.4)}">Seña</button>`}
                <button class="on" data-i="saldo" data-m="${saldo}">${r.paid ? 'Saldo' : 'Total'}</button>
                <button data-i="parcial" data-m="">Un monto</button>
              </div></div>

            <div class="fld"><label>Monto</label><input type="number" id="rcAmt" value="${saldo}" oninput="pintarTotalCobro(activeRecv().find((x)=>x.id===COB_SEL))" /></div>

            <div class="fld"><label>Medio de cobro</label>
              <div class="radios" id="rcMet">
                <button class="on" data-m="ef">Efectivo</button>
                <button data-m="tr">Transferencia</button>
                <button data-m="mp">${mpTag('Mercado Pago')}</button>
                <button data-m="cr">Tarjeta</button>
              </div></div>

            <div class="fld"><label>Descuento (opcional)</label>
              <div class="descrow">
                <input type="number" id="rcDesc" placeholder="0" value="${COB_DESC.v || ''}" oninput="setDescuento(this.value)" />
                <div class="radios sm" id="rcUnid">
                  <button class="${COB_DESC.unidad === '$' ? 'on' : ''}" data-u="$">$</button>
                  <button class="${COB_DESC.unidad === '%' ? 'on' : ''}" data-u="%">%</button>
                </div>
              </div>
              <div class="hint">Un ajuste puntual sobre este cobro. No cambia el precio de la venta.</div></div>

            <div class="fld"><label>Fecha y hora del cobro</label>
              <div class="descrow">
                <input type="date" id="rcFecha" value="${TODAY}" max="${TODAY}" />
                <input type="time" id="rcHora" value="${AHORA}" />
              </div>
              <div class="hint">Por default, este instante. Cambialo si lo estás cargando atrasado.</div></div>

            <div id="rcTotal" class="cascade" style="margin-top:4px"></div>
            <button class="btn ghost sm" style="margin-top:14px" onclick="COB_SEL=null;pintarCobrar()">← Elegir otra venta</button>`,
          ok: 'Registrar cobro',
          onOk: () => {
            const bruto = Number(el('rcAmt').value || 0);
            if (!bruto) { toast('Poné un monto'); return false; }
            const desc = descuentoDe(r);
            const neto = Math.max(0, bruto - desc);
            if (neto > saldoOf(r)) { toast(`No podés cobrar más que el saldo (${$$(saldoOf(r))})`); return false; }
            const m = $('#rcMet button.on').dataset.m;
            const fecha = el('rcFecha').value || TODAY;
            r.paid += neto;
            MOVS.unshift({ id: ++_id, date: fecha, time: el('rcHora').value || AHORA, dir: 'in', amount: neto, method: m,
              asset: r.origin, concept: r.concept, client: r.client, staff: r.staff, st: 'ok', recv: r.id,
              account: m === 'ef' ? 'caja' : m === 'mp' ? 'mp' : 'banco', src: 'local', desc: desc || undefined });
            COB_SEL = null;
            toast(saldoOf(r) > 0 ? `Cobro registrado · queda ${$$(saldoOf(r))}` : `Venta cobrada por completo · ${$$(neto)}`);
          },
          after: () => {
            const seg = (sel2, cb) => $(sel2).addEventListener('click', (e2) => {
              const b2 = e2.target.closest('button'); if (!b2) return;
              $(sel2 + ' button.on').classList.remove('on'); b2.classList.add('on'); cb(b2);
            });
            seg('#rcIntent', (b2) => { if (b2.dataset.m) el('rcAmt').value = b2.dataset.m; el('rcAmt').focus(); pintarTotalCobro(r); });
            seg('#rcMet', () => {});
            seg('#rcUnid', (b2) => setDescuento(el('rcDesc').value, b2.dataset.u));
            pintarTotalCobro(r);
          },
        });
      }

      /* Antes de cargar plata, hay que decir DE QUÉ venta viene. Todo lo que entra sale de
         una venta: de una reserva ya agendada o de una venta de mostrador. No existe el
         "ingreso suelto" — si no hay venta detrás, no hay cobro que registrar. */
      function openIngreso() {
        sheet({
          title: '¿Qué estás registrando?',
          body: `<div class="picklist">
              <button class="pickrow" onclick="closeAll();openCobrar()">
                <div class="t"><b>Cobro de ${Z().unTurno} agendado</b><span>Elegís la reserva y cargás cuánto entra, con qué medio y si hubo descuento.</span></div>
                <div class="a"><b>${activeRecv().length}</b><span>por cobrar</span></div>
              </button>
              <button class="pickrow" onclick="closeAll();openVenta()">
                <div class="t"><b>Venta de mostrador</b><span>Un producto o servicio que no venía de una reserva. Podés dejar saldo pendiente.</span></div>
              </button>
            </div>`,
          ok: null,
        });
      }

      /* ---------------- SIDE MENU DE LA TRANSACCIÓN ----------------
         Espeja el ActionDialog de producción: mismas cards (Venta · Resumen de la
         transacción · Estado del pago · Historial), mismos títulos y las reglas de
         `ActionDialog/ui.tsx` — el estado es un StatusLabel (punto + texto de color,
         sin cápsula) porque las pills quedan reservadas para los botones de acción. */
      const adStat = (tone, txt) => `<span class="adstat ${tone}"><i></i>${txt}</span>`;
      const AD_IC = {
        cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
        user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
        tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9-9-9Z"/><circle cx="8" cy="8" r="1.2"/></svg>',
        card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19"/></svg>',
        bank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6M5 10v9M19 10v9M3 19h18"/></svg>',
      };
      const adX = `<button class="x" onclick="closeAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;

      /* El mensaje cambia según de qué se trate el saldo: si no pagó nada se pide la SEÑA
         para reservar el turno; si ya dejó algo, se pide el SALDO. Nunca nombra a Ágora y
         lleva al frente la página del vendor (regla de copy de cara al cliente). */
      function textoRecordatorio(r) {
        const z = Z();
        const falta = saldoOf(r);
        if (!r.paid) {
          const sena = Math.round(r.total * 0.4);
          return `Hola ${r.client.split(' ')[0]}, ¿cómo estás? Te escribo por ${r.concept}. `
            + `Para reservar tu ${z.turno} hace falta una seña de ${$$(sena)}, y el resto lo abonás el día. `
            + `Podés pagarla por transferencia o desde www.agora.red/estudio-bloom. ¡Gracias!`;
        }
        return `Hola ${r.client.split(' ')[0]}, ¿cómo estás? Te paso el detalle de ${r.concept}: `
          + `de ${$$(r.total)} ya abonaste ${$$(r.paid)}, así que queda un saldo de ${$$(falta)}. `
          + `Podés abonarlo por transferencia o cuando vengas. ¡Gracias!`;
      }

      function openRecordatorio(id) {
        const r = RECV.find((x) => x.id === id); if (!r) return;
        const txt = textoRecordatorio(r);
        sheet({
          title: 'Recordatorio por WhatsApp',
          body: `<div class="adtr" style="padding-top:0"><span class="k">${esc(r.client)} · ${r.phone}</span><span class="v">${$$(saldoOf(r))}</span></div>
            <p class="hint" style="margin:10px 0 12px">${r.paid ? 'Ya dejó seña: el mensaje pide el saldo.' : `Todavía no pagó nada: el mensaje pide la seña para reservar ${Z().unTurno}.`}</p>
            <div class="fld"><label>Mensaje</label><textarea id="waTxt" rows="6">${esc(txt)}</textarea>
              <div class="hint">Editalo antes de mandarlo si querés.</div></div>
            <div class="note">Se abre WhatsApp con el mensaje cargado. Todavía no hay recordatorios automáticos: esto es un envío manual.</div>`,
          ok: 'Abrir WhatsApp',
          onOk: () => { toast(`Se abriría WhatsApp con ${r.client}`); },
        });
      }

      function openRecv(id) {
        const r = RECV.find((x) => x.id === id); if (!r) return;
        const cobros = MOVS.filter((m) => m.recv === r.id).sort((a, b) => (a.date < b.date ? -1 : 1));
        el('drawer').innerHTML = `
          <div class="dh">
            ${avatarFor(r.client, r.paid > 0 ? '#0072FB' : '#475569')}
            <div><h3>${esc(r.client)}</h3><div class="mono" style="font-size:11.5px;color:var(--f-ink-mid);margin-top:3px">${r.phone} · ${r.id}</div></div>
            ${adX}
          </div>
          <div class="db">
            <div class="adcard">
              <div class="adhead"><h4>Venta</h4>${r.paid > 0 ? adStat('warn', 'Cobro parcial') : adStat('bad', 'Sin cobrar')}</div>
              <div class="adrow">${AD_IC.cal}<span>${fDL(r.date)}</span></div>
              <div class="adrow">${AD_IC.tag}<span>${ORIGIN_LABEL[r.origin]} · ${esc(r.concept)}</span></div>
              <div class="adrow">${AD_IC.user}<span>${esc(r.client)}</span></div>
              ${r.staff ? `<div class="adrow">${AD_IC.user}<span>${esc(r.staff)}</span></div>` : ''}
            </div>
            <div class="adcard">
              <div class="adhead"><h4>Resumen de la transacción</h4></div>
              <div class="adtr"><span class="k">${esc(r.concept)}</span><span class="v">${$$(r.total)}</span></div>
              <div class="adtr"><span class="k">Cobrado hasta ahora</span><span class="v" style="color:var(--f-success-text)">${r.paid ? '−' + $$(r.paid) : '$0'}</span></div>
              <div class="adtr tot"><span class="k">Falta cobrar</span><span class="v">${$$(saldoOf(r))}</span></div>
            </div>
            <div class="adcard">
              <div class="adhead"><h4>Estado del pago</h4>${adStat('warn', 'Falta el saldo')}</div>
              ${cobros.length ? cobros.map((m, i) => `<div class="adsub">
                <div class="adkick" style="margin-bottom:10px">${i === 0 ? 'Seña' : 'Cobro'}</div>
                <div class="adtr"><span class="k">${fDL(m.date)}</span><span class="v">${$$(m.amount)}</span></div>
                <div class="adrow" style="margin-top:6px">${AD_IC.card}<span>${METHODS[m.method].label}</span></div>
              </div>`).join('') : `<p class="adnote" style="margin-top:0">Todavía no entró nada de esta venta.</p>`}
              <div class="adsub">
                <div class="adkick" style="margin-bottom:10px">Saldo</div>
                <div class="adtr"><span class="k">Falta cobrar</span><span class="v" style="color:var(--f-warning-text)">${$$(saldoOf(r))}</span></div>
              </div>
            </div>
            <div class="adcard">
              <div class="adhead bare"><h4>Historial</h4></div>
              <ul class="tl">
                <li><span class="t">${fDL(r.date)}</span><b>Se entregó el trabajo</b>${esc(r.concept)}</li>
                ${cobros.map((m) => `<li><span class="t">${fD(m.date)}</span><b>${$$(m.amount)} cobrado</b>${METHODS[m.method].label}</li>`).join('')}
                <li class="now"><span class="t">Hoy</span><b>${$$(saldoOf(r))} sin cobrar</b>Cuando entre, se registra como un cobro nuevo</li>
              </ul>
              <p class="adnote">Todavía no hay recordatorios automáticos: cuando te paguen, registrás el cobro y la fila desaparece.</p>
            </div>
          </div>
          <div class="df">
            <button class="btn pri" onclick="closeAll();openCobrar('${r.id}')">Registrar cobro de ${$$(saldoOf(r))}</button>
            <button class="btn" onclick="closeAll();openRecordatorio('${r.id}')">${ICO.wa || ''}Recordar por WhatsApp</button>
          </div>`;
        el('drawer').classList.add('on'); el('scrim').classList.add('on');
      }

      function openMov(id) {
        const m = MOVS.find((x) => x.id === id); if (!m) return;
        const meth = METHODS[m.method];
        const r = recvOf(m);
        const pend = r ? saldoOf(r) : 0;
        const esGasto = m.dir === 'out';
        const tipo = esGasto
          ? (m.asset === 'gasto' ? 'Gasto · ' + catLabel(m.cat) : 'Devolución')
          : (ASSETS[m.asset] ? ASSETS[m.asset].label : m.asset);
        const acc = { caja: 'Caja (efectivo)', banco: 'Tu cuenta', mp: mpTag('Billetera Mercado Pago') }[m.account];
        const auto = m.src === 'online' || m.method === 'mp';
        el('drawer').innerHTML = `
          <div class="dh">
            ${avatarFor(m.client || m.concept, meth.hex)}
            <div><h3>${esc(m.concept)}</h3><div class="mono" style="font-size:11.5px;color:var(--f-ink-mid);margin-top:3px">MOV-${m.id} · ${fDL(m.date)} ${m.time}</div></div>
            ${adX}
          </div>
          <div class="db">
            <div class="adcard">
              <div class="adhead"><h4>${esGasto ? (m.asset === 'refund' ? 'Devolución' : 'Gasto') : 'Venta'}</h4>
                ${esGasto ? adStat('bad', m.asset === 'refund' ? 'Devuelta' : 'Pagado') : pend ? adStat('warn', 'Cobro parcial') : adStat('ok', 'Cobrada')}</div>
              <div class="adrow">${AD_IC.cal}<span>${fDL(m.date)} · ${m.time}</span></div>
              <div class="adrow">${AD_IC.tag}<span>${esc(tipo)}</span></div>
              ${m.client ? `<div class="adrow">${AD_IC.user}<span>${esc(m.client)}</span></div>` : ''}
              ${m.staff || m.staffPay ? `<div class="adrow">${AD_IC.user}<span>${esc(m.staff || m.staffPay)}${m.staffPay ? ' · liquidación' : ''}</span></div>` : ''}
            </div>
            <div class="adcard">
              <div class="adhead"><h4>Resumen de la transacción</h4></div>
              ${r ? `
                <div class="adtr"><span class="k">${esc(r.concept)}</span><span class="v">${$$(r.total)}</span></div>
                <div class="adtr"><span class="k">Cobrado hasta ahora</span><span class="v" style="color:var(--f-success-text)">−${$$(r.paid)}</span></div>
                <div class="adtr tot"><span class="k">Falta cobrar</span><span class="v">${$$(pend)}</span></div>`
              : `
                <div class="adtr"><span class="k">${esc(m.concept)}</span><span class="v">${$$(m.amount)}</span></div>
                <div class="adtr tot"><span class="k">${esGasto ? 'Total pagado' : 'Total cobrado'}</span><span class="v">${esGasto ? '−' : ''}${$$(m.amount)}</span></div>`}
            </div>
            <div class="adcard">
              <div class="adhead"><h4>Estado del pago</h4>${adStat(esGasto ? 'mute' : pend ? 'warn' : 'ok', esGasto ? 'Salida registrada' : pend ? 'Falta el saldo' : 'Cobrado')}</div>
              <div class="adsub">
                <div class="adkick" style="margin-bottom:10px">${esGasto ? 'Pago' : 'Cobro'}</div>
                <div class="adrow">${AD_IC.card}<span>${meth.label}</span></div>
                <div class="adrow">${AD_IC.bank}<span>${esGasto ? 'Sale de ' : 'Entra a '}${acc}</span></div>
                <div class="adrow">${AD_IC.tag}<span>${auto ? 'Lo registró Ágora' : 'Lo registraste vos'}</span></div>
              </div>
              ${pend ? `<div class="adsub">
                <div class="adkick" style="margin-bottom:10px">Saldo</div>
                <div class="adtr"><span class="k">Falta cobrar</span><span class="v" style="color:var(--f-warning-text)">${$$(pend)}</span></div>
                <button class="btn pri sm" style="margin-top:12px" onclick="closeAll();openCobrar('${r.id}')">Registrar cobro del saldo</button>
              </div>` : ''}
              <p class="adnote">Corregir el <b>medio</b> no mueve plata: cambia con qué entró. El monto y el total quedan igual, y el arqueo se reacomoda solo.</p>
            </div>
            <div class="adcard">
              <div class="adhead bare"><h4>Historial</h4></div>
              <ul class="tl">
                <li><span class="t">${fDL(m.date)}</span><b>${esGasto ? 'Se registró la salida' : 'Entró el pago'}</b>${$$(m.amount)} · ${meth.label}</li>
                ${pend ? `<li class="now"><span class="t">Hoy</span><b>${$$(pend)} sin cobrar</b>Cuando entre, se registra como un cobro nuevo</li>` : ''}
              </ul>
            </div>
          </div>
          <div class="df">
            <button class="btn" onclick="toast('Se abriría la corrección del medio de cobro')">Corregir medio</button>
            <button class="btn ghost" onclick="toast('Se abriría la reserva asociada')">Ver origen</button>
          </div>`;
        el('drawer').classList.add('on'); el('scrim').classList.add('on');
      }
      const CHEV = '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';

      // El grupo de un concepto es su tipo de venta; para gastos, su categoría.
      const etiquetaAsset = (m) => m.asset === 'gasto'
        ? ((ECATS.find((c) => c.k === m.cat) || {}).label || 'Otros')
        : m.asset === 'refund' ? 'Devoluciones'
        : ((ASSETS[m.asset] || {}).label || m.asset);
      const ORDEN_GRUPO = (g) => {
        const orden = [...Object.values(ORIGIN_LABEL), ...Object.values(ASSETS).map((a) => a.label),
          'Devoluciones', ...ECATS.map((c) => c.label), 'Venta', 'Pago', 'Ajuste'];
        const i = orden.indexOf(g);
        return i < 0 ? 999 : i;
      };

      function fieldDefs() {
        const r = RANGES[S.range];
        const venue = S.persona === 'venue';
        // Los conceptos que existen en el rango, ordenados por plata: un filtro con 200
        // opciones alfabéticas no se usa; con las que de verdad movieron algo, sí.
        /* Cada opción es [valor, etiqueta, grupo]: el popover corta con un título cada vez
           que cambia el grupo. Adentro de cada grupo van por plata, no alfabéticos — así lo
           que más movió queda arriba de su bloque. */
        const agrupar = (by, grupo) => Object.entries(by)
          .map(([k, v]) => [k, v, grupo[k]])
          .sort((a, b) => (a[2] === b[2] ? b[1] - a[1] : ORDEN_GRUPO(a[2]) - ORDEN_GRUPO(b[2])))
          .map(([k, , g]) => [k, k, g]);
        const conceptosDe = (pred) => {
          const by = {}, grupo = {};
          scope().filter(pred).forEach((m) => { by[m.concept] = (by[m.concept] || 0) + m.amount; grupo[m.concept] = etiquetaAsset(m); });
          return agrupar(by, grupo);
        };
        const conceptos = conceptosDe((m) => m.dir === 'in');
        const conceptosGasto = conceptosDe((m) => m.dir === 'out' && m.asset === 'gasto');
        // Por cobrar no sale del ledger: sus conceptos son los de los saldos abiertos.
        const conceptosRecv = (() => {
          const by = {}, grupo = {};
          activeRecv().forEach((r) => { by[r.concept] = (by[r.concept] || 0) + saldoOf(r); grupo[r.concept] = ORIGIN_LABEL[r.origin]; });
          return agrupar(by, grupo);
        })();
        const conceptosCom = (() => {
          const by = {}, grupo = {};
          comisEntries().forEach((x) => { by[x.m.concept] = (by[x.m.concept] || 0) + x.comision; grupo[x.m.concept] = TIPO_COM[x.tipo]; });
          return agrupar(by, grupo);
        })();
        return {
          rango: {
            l: 'Período', v: S.range, hint: `${fD(r.from)} — ${fD(r.to)}`,
            o: Object.entries(RANGES).map(([k, x]) => [k, x.label]),
            set: (v) => { S.range = v; S.movPage = 1; S.cobPage = 1; }, act: S.range !== 'd30',
          },
          staff: !venue ? null : {
            l: 'Profesional', v: S.staff, multi: true, allLabel: 'Todos',
            o: STAFF.map((x) => [x, x]),
            set: (v) => { S.staff = v; }, act: S.staff !== 'all',
          },
          buscarMov: {
            l: 'Buscar', type: 'text', v: S.movF.q, ph: 'Buscar por nombre',
            set: (v) => { S.movF.q = v; S.movPage = 1; }, act: !!S.movF.q,
          },
          method: {
            l: 'Medio', v: S.movF.method, multi: true, allLabel: 'Todos',
            o: Object.entries(METHODS).map(([k, m]) => [k, m.label]),
            set: (v) => { S.movF.method = v; S.movPage = 1; }, act: S.movF.method !== 'all',
          },
          cobMethod: {
            l: 'Medio', v: S.cobMethod, multi: true, allLabel: 'Todos',
            o: Object.entries(METHODS).map(([k, m]) => [k, m.label]),
            set: (v) => { S.cobMethod = v; S.cobPage = 1; }, act: S.cobMethod !== 'all',
          },
          concepto: {
            l: 'Concepto', v: S.movF.concepto, multi: true, allLabel: 'Todos',
            o: conceptos,
            set: (v) => { S.movF.concepto = v; S.movPage = 1; }, act: S.movF.concepto !== 'all',
          },
          asset: {
            l: 'Tipo de venta', v: S.movF.asset, multi: true, allLabel: 'Todas',
            o: [...Object.entries(ASSETS).map(([k, a]) => [k, a.label]), ['refund', 'Devoluciones']],
            set: (v) => { S.movF.asset = v; S.movPage = 1; }, act: S.movF.asset !== 'all',
          },
          comTipo: {
            l: 'Tipo', v: S.comF.tipo, multi: true, allLabel: 'Todos',
            o: [['venta', 'Venta'], ['pago', 'Pago'], ['ajuste', 'Ajuste']],
            set: (v) => { S.comF.tipo = v; S.movPage = 1; }, act: S.comF.tipo !== 'all',
          },
          buscarCob: {
            l: 'Buscar', type: 'text', v: S.cobQ, ph: 'Buscar por nombre',
            set: (v) => { S.cobQ = v; S.cobPage = 1; }, act: !!S.cobQ,
          },
          buscarRecv: {
            l: 'Buscar', type: 'text', v: S.cobF.q, ph: 'Buscar por nombre',
            set: (v) => { S.cobF.q = v; }, act: !!S.cobF.q,
          },
          cobConcepto: {
            l: 'Concepto', v: S.cobConcepto, multi: true, allLabel: 'Todos',
            o: conceptos,
            set: (v) => { S.cobConcepto = v; S.cobPage = 1; }, act: S.cobConcepto !== 'all',
          },
          gasConcepto: {
            l: 'Concepto', v: S.gasConcepto, multi: true, allLabel: 'Todos',
            o: conceptosGasto,
            set: (v) => { S.gasConcepto = v; }, act: S.gasConcepto !== 'all',
          },
          recvConcepto: {
            l: 'Concepto', v: S.cobF.concepto, multi: true, allLabel: 'Todos',
            o: conceptosRecv,
            set: (v) => { S.cobF.concepto = v; }, act: S.cobF.concepto !== 'all',
          },
          comConcepto: {
            l: 'Concepto', v: S.comF.concepto, multi: true, allLabel: 'Todos',
            o: conceptosCom,
            set: (v) => { S.comF.concepto = v; }, act: S.comF.concepto !== 'all',
          },
          origin: {
            l: 'Tipo', v: S.cobF.origin, multi: true, allLabel: 'Todos',
            o: Object.entries(ORIGIN_LABEL),
            set: (v) => { S.cobF.origin = v; }, act: S.cobF.origin !== 'all',
          },
        };
      }

      // Qué campos usa cada vista, y qué número se resume abajo del panel.
      function panelSpec() {
        const ms = scope();
        const r = RANGES[S.range];
        // El Resumen es la foto del negocio entero: recortarlo por profesional o sucursal
        // lo convierte en otra cosa. Esos cortes viven en las secciones que los usan.
        if (S.tab === 'resumen') return { f: ['rango'] };
        if (S.tab === 'movimientos') {
          const rows = filterMovs();
          return {
            f: ['buscarMov', 'rango', 'asset', 'concepto', 'method', 'staff'],
            cols: ['asset', 'concepto', 'method', 'staff'],
            search: 'buscarMov',
          };
        }
        // Por cobrar no filtra por período: se muestran todos los saldos abiertos. Lo que
        // queda para filtrar vive en la tabla (buscador y cabeceras), así que no hay panel.
        if (S.tab === 'cobranzas') return null;
        // El período arriba; tipo, profesional y estado viven en la cabecera de la tabla.
        if (S.tab === 'comisiones') return {
          f: ['rango', 'staff', 'comTipo', 'comConcepto'],
          cols: ['staff', 'comTipo', 'comConcepto'],
        };
        if (S.tab === 'cobros') return {
          f: ['rango', 'staff', 'asset', 'cobConcepto', 'cobMethod', 'buscarCob'],
          cols: ['staff', 'asset', 'cobConcepto', 'cobMethod'],
          search: 'buscarCob',
        };
        // Un gasto del negocio no es de nadie en particular: filtrar por profesional acá
        // no significa nada (decisión JP, 25/ago).
        if (S.tab === 'gastos') return { f: ['rango', 'gasConcepto'], cols: ['gasConcepto'] };
        // El resultado del negocio no se recorta por profesional: un gasto de alquiler no es
        // de nadie, así que filtrar dejaría un neto que no cierra.
        if (S.tab === 'resultado') return { f: ['rango'] };
        return null; // Caja no filtra: el arqueo del día es un estado, no un período
      }

      // Un campo abierto por vez. `S.open` guarda la clave; el popover se expande debajo del
      // campo (no flota) para que funcione igual en el panel y adentro del modal full screen.
      function labelOf(d) {
        if (d.type === 'text') return d.v;
        if (!d.multi) { const hit = d.o.find(([v]) => v === d.v); return hit ? hit[1] : d.v; }
        if (d.v === 'all' || !d.v.length) return d.allLabel;
        if (d.v.length === 1) { const hit = d.o.find(([v]) => v === d.v[0]); return hit ? hit[1] : d.v[0]; }
        return `${d.v.length} seleccionados`;
      }

      function fieldsHTML(scope2, lista) {
        const D = fieldDefs(), spec = panelSpec();
        if (!spec) return '';
        if (lista) return lista.map((k) => campoHTML(k, D[k], scope2)).join('');
        // Los filtros de columna y el buscador viven en la cabecera de la tabla, no en el
        // panel de arriba: se filtra donde se lee. Acá quedan solo los que no son de columna.
        const fuera = (spec.cols || []).concat(spec.search || []);
        const campos = spec.f.filter((k) => !fuera.includes(k));
        return campos.map((k) => campoHTML(k, D[k], scope2)).join('');
      }

      function campoHTML(k, d, scope2) {
        {
          if (!d) return '';
          const dot = d.act ? '<i></i>' : '';
          if (d.type === 'text') {
            return `<div class="ffield"><label>${dot}${d.l}</label>
              <input type="text" value="${esc(d.v)}" placeholder="${esc(d.ph || '')}" oninput="setFiltro('${k}', this.value)" /></div>`;
          }
          const abierto = S.open === scope2 + ':' + k;
          const opts = (d.multi ? [['all', d.allLabel], ...d.o] : d.o).map(([v, l]) => {
            const on = d.multi ? (v === 'all' ? d.v === 'all' : inSel(d.v, v) && d.v !== 'all') : d.v === v;
            return `<button class="fopt ${on ? 'on' : ''}" onclick="pickFiltro('${k}', ${jsStr(v)}, ${!!d.multi})">
              <span>${esc(l)}</span>${on ? ICO.check : ''}</button>`;
          }).join('');
          return `<div class="ffield ${abierto ? 'open' : ''}">
            <button class="fhead" onclick="abrirCampo('${scope2}:${k}')">
              <label>${dot}${d.l}</label>
              <div class="fval">${esc(labelOf(d))}</div>
              ${d.hint ? `<div class="hintline">${d.hint}</div>` : ''}
              <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
            </button>
            ${abierto ? `<div class="fdrop">${opts}${d.multi ? `<div class="fdrop-f"><button class="btn pri sm" onclick="abrirCampo(null)">Aplicar</button></div>` : ''}</div>` : ''}
          </div>`;
        }
      }

      function abrirCampo(key) { S.open = S.open === key ? null : key; render(); }

      function pickFiltro(k, v, multi) {
        const d = fieldDefs()[k];
        if (!d) return;
        if (!multi) { d.set(v); S.open = null; render(); return; }
        if (v === 'all') { d.set('all'); render(); return; }
        const cur = d.v === 'all' ? [] : d.v.slice();
        const i2 = cur.indexOf(v);
        if (i2 >= 0) cur.splice(i2, 1); else cur.push(v);
        d.set(cur.length ? cur : 'all');
        render();
      }

      function setFiltro(k, v) {
        const d = fieldDefs()[k];
        if (!d) return;
        const foco = document.activeElement;
        const eraTexto = d.type === 'text';
        d.set(v);
        render();
        if (eraTexto && foco) {
          const nuevo = document.querySelector(`[data-tsearch="${k}"]`);
          if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
        }
      }

      function filtrosActivos() {
        const D = fieldDefs(), spec = panelSpec();
        return spec ? spec.f.filter((k) => D[k] && D[k].act).length : 0;
      }
      function limpiarFiltros() {
        S.range = 'd30'; S.staff = 'all'; S.open = null;
        S.movF = { q: '', method: 'all', asset: 'all', concepto: 'all' };
        S.cobQ = ''; S.cobMethod = 'all'; S.cobConcepto = 'all'; S.gasConcepto = 'all';
        S.comF = { q: '', tipo: 'all', concepto: 'all' };
        S.cobF = { q: '', origin: 'all', concepto: 'all' };
        S.movPage = 1; render();
      }
      function renderPanel() {
        const spec = panelSpec();
        // Caja y Por cobrar no se filtran por período: son estados, no flujos del rango.
        // Comisiones lo lleva adentro de su columna izquierda, no en la barra de arriba.
        if (!spec || !spec.f.includes('rango') || S.tab === 'comisiones') { el('fbar').innerHTML = ''; return; }
        const otros = spec.f.filter((k) => k !== 'rango'
          && !(spec.cols || []).includes(k) && k !== (spec.search || ''));
        el('fbar').innerHTML = dateBar() + (otros.length ? `<div class="fbx">${fieldsHTML('d', otros)}</div>` : '');
      }

      function sheet(o) {
        el('sheet').innerHTML = `
          <div class="sh"><h3>${o.title}</h3>
            <button class="x" onclick="closeAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <div class="sb">${o.body}</div>
          <div class="sf">${o.extra || ''}${o.ok
            ? `<button class="btn pri" id="sheetOk" style="flex:1;justify-content:center">${o.ok}</button>
               <button class="btn ghost" onclick="closeAll()">Cancelar</button>`
            : `<button class="btn" style="flex:1;justify-content:center" onclick="closeAll()">Cerrar</button>`}</div>`;
        el('sheet').classList.add('on'); el('scrim').classList.add('on');
        if (o.ok) el('sheetOk').onclick = () => { if (o.onOk() !== false) { closeAll(); render(); } };
        if (o.after) o.after();
      }
      /* ---------------- ADMINISTRAR CATEGORÍAS DE GASTO ----------------
         Espeja el organizador de categorías de servicios de Flash: grip SIEMPRE visible
         (es la única señal de que la fila se arrastra), drag & drop para ordenar, renombrar
         en la misma fila, y borrar pidiendo destino cuando la categoría tiene gastos adentro.
         Se guarda solo — no hay botón "Guardar orden": si te vas sin apretarlo, perdés el
         trabajo. Cada cambio repinta también la vista de atrás, así el desglose y el total
         se actualizan mientras el gestor sigue abierto. */
      let _catDrag = null;
      let _catEdit = null;

      // Gastos de una categoría EN EL RANGO (lo que muestra la fila) y en TODO el ledger
      // (lo que decide si al borrarla hay que reubicar algo).
      const catEnRango = (k) => expenses(scope()).filter((m) => m.cat === k);
      const catEnLedger = (k) => MOVS.filter((m) => m.asset === 'gasto' && m.cat === k);

      const CAT_ICO = {
        grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.7"/><circle cx="15" cy="5" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="19" r="1.7"/><circle cx="15" cy="19" r="1.7"/></svg>',
        pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9L17.5 7"/></svg>',
        bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.6h6L9.5 22 20 10.2h-6.6z"/></svg>',
      };

      function openCats() {
        _catEdit = null;
        sheet({
          title: 'Categorías de <strong>gastos</strong>',
          // Sin categorías propias todavía no hay nada que ordenar: la bajada explica el
          // estado en vez de dar una instrucción que no aplica.
          body: `<p class="cap" id="catCap" style="margin:-6px 0 14px"></p>
            <div class="catmgr" id="catList"></div>`,
          // Crear y cerrar quedan anclados abajo: con 10 categorías el botón de crear se iba
          // de pantalla justo cuando lo necesitás.
          extra: `<button class="btn" style="flex:1;justify-content:center" onclick="catAdd()">＋ Nueva categoría</button>`,
          after: renderCats,
        });
      }

      const CAT_CAP = () => (ECATS.some((c) => !c.auto)
        ? 'Arrastrá para ordenar. Este orden manda en el desglose por categoría y en el selector al registrar un gasto.'
        : 'Todavía no creaste ninguna: hasta que lo hagas, tus gastos figuran <b>sin categoría</b>.');

      function renderCats() {
        const box = el('catList');
        if (!box) return;
        if (el('catCap')) el('catCap').innerHTML = CAT_CAP();
        const huerfanos = catEnLedger(SIN_CAT).length;
        box.innerHTML = ECATS.map((c, i) => {
          const editing = _catEdit === c.k;
          // La automática no se arrastra ni se edita: es de Ágora, no del dueño.
          if (c.auto) {
            return `<div class="catrow auto" data-k="${c.k}" data-i="${i}">
              <span class="grip lock" aria-hidden="true">${CAT_ICO.bolt}</span>
              <span class="cname">${esc(c.label)}</span>
              <span class="cmeta">Automática</span>
            </div>`;
          }
          return `<div class="catrow${editing ? ' editing' : ''}" ${editing ? '' : 'draggable="true"'} data-k="${c.k}" data-i="${i}">
            <span class="grip" aria-hidden="true">${CAT_ICO.grip}</span>
            ${editing
              ? `<input class="cedit" id="catEdit" value="${esc(c.label)}" maxlength="40" />`
              : `<span class="cname">${esc(c.label)}</span>
                 <button class="cact" onclick="catRename('${c.k}')" title="Renombrar" aria-label="Renombrar ${esc(c.label)}">${CAT_ICO.pencil}</button>
                 <button class="cact del" onclick="catDelete('${c.k}')" title="Eliminar" aria-label="Eliminar ${esc(c.label)}">${CAT_ICO.trash}</button>`}
          </div>`;
        }).join('')
        // El cajón de los gastos que quedaron sueltos al borrar una categoría. No se
        // arrastra, no se renombra y no se borra: no es una categoría, es dónde caen.
        + (huerfanos
          ? `<div class="catrow ghost"><span class="grip" aria-hidden="true"></span>
               <span class="cname">${SIN_CAT_LABEL}</span></div>`
          : '');

        if (_catEdit) {
          const inp = el('catEdit');
          inp.focus(); inp.select();
          inp.onblur = () => catRenameCommit(inp.value);
          inp.onkeydown = (e) => {
            if (e.key === 'Enter') { inp.blur(); }
            if (e.key === 'Escape') { _catEdit = null; renderCats(); }
          };
        }

        box.querySelectorAll('.catrow[draggable]').forEach((row) => {
          row.addEventListener('dragstart', (e) => {
            _catDrag = row.dataset.k;
            row.classList.add('drag');
            e.dataTransfer.effectAllowed = 'move';
            // Firefox no dispara drag sin payload.
            e.dataTransfer.setData('text/plain', row.dataset.k);
          });
          row.addEventListener('dragend', () => { _catDrag = null; renderCats(); });
          row.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (_catDrag && _catDrag !== row.dataset.k) row.classList.add('over');
          });
          row.addEventListener('dragleave', () => row.classList.remove('over'));
          row.addEventListener('drop', (e) => {
            e.preventDefault(); row.classList.remove('over');
            catMove(_catDrag, row.dataset.k);
          });
        });
      }

      // Reordena moviendo la arrastrada a la posición de la soltada (splice, no swap: cambiar
      // dos de lugar rompe el orden del resto cuando el salto es largo).
      function catMove(fromK, toK) {
        if (!fromK || fromK === toK || esAuto(fromK) || esAuto(toK)) return;
        const from = ECATS.findIndex((c) => c.k === fromK);
        const to = ECATS.findIndex((c) => c.k === toK);
        if (from < 0 || to < 0) return;
        ECATS.splice(to, 0, ECATS.splice(from, 1)[0]);
        renderCats(); render();
      }

      function catRename(k) { if (esAuto(k)) return; _catEdit = k; renderCats(); }

      function catRenameCommit(value) {
        const k = _catEdit;
        _catEdit = null;
        const label = (value || '').trim();
        const cat = ECATS.find((c) => c.k === k);
        if (cat && label && label !== cat.label) {
          cat.label = label;
          toast('Categoría renombrada');
          render();
        }
        renderCats();
      }

      function catAdd() {
        // La clave se deriva del nombre (como el slug del backend) y se desambigua con un
        // sufijo: dos categorías distintas con la misma clave se pisarían los gastos.
        const label = (prompt('Nombre de la nueva categoría') || '').trim();
        if (!label) return;
        let k = label.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'cat';
        if (ECATS.some((c) => c.k === k)) k = `${k}_${ECATS.length}`;
        // Entra arriba de la automática, que va siempre última: no es una categoría del
        // dueño y no tiene por qué competir por el primer lugar de la lista.
        const i = ECATS.findIndex((c) => c.auto);
        ECATS.splice(i >= 0 ? i : ECATS.length, 0, { k, label });
        toast(`Categoría "${label}" creada`);
        renderCats(); render();
      }

      function catDelete(k) {
        const cat = ECATS.find((c) => c.k === k);
        if (!cat || cat.auto) return;

        const usados = catEnLedger(k);

        // Sin gastos adentro no hay nada que decidir: se borra y listo.
        if (!usados.length) {
          ECATS.splice(ECATS.indexOf(cat), 1);
          toast(`Categoría "${cat.label}" eliminada`);
          renderCats(); render();
          return;
        }

        // Con gastos adentro NO se pide destino (JP, 26/ago): elegir a mano a cuál de las
        // otras pasan 17 gastos es una decisión que el dueño no tiene por qué tomar en ese
        // momento, y cualquier destino que elija es mentira. Quedan sin categoría —
        // siguen sumando al total y al desglose, en su propia barra— y se recategorizan
        // después, uno por uno o creando la categoría de nuevo. Igual se avisa antes:
        // es plata de 17 filas que cambia de lugar en el desglose.
        sheet({
          title: `Eliminar <strong>${esc(cat.label)}</strong>`,
          body: `<div class="note">Sus <b>${usados.length} gasto${usados.length === 1 ? '' : 's'}</b> quedan <b>sin categoría</b>. Siguen contando en el total y podés volver a categorizarlos cuando quieras.</div>`,
          ok: 'Eliminar categoría',
          onOk: () => {
            usados.forEach((m) => { m.cat = SIN_CAT; });
            ECATS.splice(ECATS.indexOf(cat), 1);
            toast(`"${cat.label}" eliminada · ${usados.length} gasto${usados.length === 1 ? '' : 's'} sin categoría`);
            // sheet() cierra y renderiza al confirmar; se reabre el gestor para seguir.
            setTimeout(openCats, 240);
          },
        });
      }

      function closeAll() {
        el('sheet').classList.remove('on'); el('drawer').classList.remove('on'); el('scrim').classList.remove('on');
      }
      let toastT;
      function toast(msg) {
        el('toast').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>${esc(msg)}`;
        el('toast').classList.add('on');
        clearTimeout(toastT); toastT = setTimeout(() => el('toast').classList.remove('on'), 3200);
      }

      /* ---- Navegación / drill-down ---- */
      const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let ROUTE_TRANSITION = null;
      function renderRoute(change) {
        change();
        const paint = () => { render(); window.scrollTo({ top: 0, behavior: 'instant' }); };
        if (reduceMotion() || ROUTE_TRANSITION) { paint(); return; }
        if (!document.startViewTransition) {
          paint();
          requestAnimationFrame(() => {
            const main = document.querySelector('main');
            if (main && main.animate) main.animate([
              { opacity: .01, filter: 'blur(10px)', clipPath: 'inset(7% 0 0 0 round 28px 28px 0 0)' },
              { opacity: 1, filter: 'blur(0)', clipPath: 'inset(0 round 0)' },
            ], { duration: 460, easing: 'cubic-bezier(.22,1,.36,1)' });
          });
          return;
        }
        document.documentElement.dataset.routeTransition = 'on';
        try {
          ROUTE_TRANSITION = document.startViewTransition(paint);
          ROUTE_TRANSITION.finished.catch(() => {}).finally(() => {
            delete document.documentElement.dataset.routeTransition;
            ROUTE_TRANSITION = null;
          });
        } catch (_) {
          delete document.documentElement.dataset.routeTransition;
          ROUTE_TRANSITION = null;
          paint();
        }
      }
      function go(tab) { renderRoute(() => { S.container = 'finanzas'; S.tab = tab; }); }
      const goTab = go;
      function goCont(c) { renderRoute(() => { S.container = c; }); }
      function goMov(preset) {
        S.movF = Object.assign({ q: '', method: 'all', asset: 'all' }, preset);
        S.movPage = 1; go('movimientos');
      }
      function goMovStaff(k) { S.staff = [k]; goMov({}); }
      // Toggle de las 3 tablas de distribución del Resumen: todo lo vendido vs solo lo cobrado.
      function setDist(v) { S.dist = v; renderFinanceUpdate('distribution'); }
      function sortMov(k) { if (S.movSort.k === k) S.movSort.dir *= -1; else S.movSort = { k, dir: k === 'amount' || k === 'date' ? -1 : 1 }; render(); }

      /* =====================================================================
         8 · RENDER
      ===================================================================== */
      // Marca de qué lado queda contenido, y desplaza de a una pantalla.
      function marcarTabs() {
        const n = el('tabs'), w = el('tabswrap');
        if (!n || !w) return;
        w.classList.toggle('mas-izq', n.scrollLeft > 6);
        w.classList.toggle('mas-der', n.scrollLeft + n.clientWidth < n.scrollWidth - 6);
      }
      function deslizarTabs(dir) {
        const n = el('tabs');
        n.scrollBy({ left: dir * Math.round(n.clientWidth * 0.7), behavior: 'smooth' });
        setTimeout(marcarTabs, 350);
      }

      let _rz;
      window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(renderHead, 120); });

      // Continuidad de datos: conserva las cifras y longitudes anteriores, repinta con el
      // estado nuevo y las interpola. No depende de una API experimental y no bloquea inputs.
      function financeSnapshot() {
        const metrics = {};
        document.querySelectorAll('.summary-cockpit [data-metric]').forEach((n) => { metrics[n.dataset.metric] = Number(n.dataset.money); });
        const bars = {};
        document.querySelectorAll('.summary-charts').forEach((group, gi) => {
          group.querySelectorAll('.card').forEach((card, ci) => {
            card.querySelectorAll('[data-bar-key]').forEach((row) => {
              const fill = row.querySelector('.fill[data-rank]');
              if (fill) bars[`${gi}:${ci}:${row.dataset.barKey}`] = Number(fill.dataset.rank);
            });
          });
        });
        return { metrics, bars };
      }

      function animateFinanceUpdate(previous, kind) {
        if (reduceMotion()) return;
        const cockpit = document.querySelector('.summary-cockpit');
        if (cockpit) {
          cockpit.animate([
            { boxShadow: '0 34px 72px -42px rgba(5,13,30,.78), 0 1px 2px rgba(15,23,42,.18)', filter: 'brightness(1)' },
            { offset: .34, boxShadow: '0 40px 86px -34px rgba(0,114,251,.52), 0 1px 2px rgba(15,23,42,.18)', filter: 'brightness(1.08)' },
            { boxShadow: '0 34px 72px -42px rgba(5,13,30,.78), 0 1px 2px rgba(15,23,42,.18)', filter: 'brightness(1)' },
          ], { duration: 760, easing: 'cubic-bezier(.22,1,.36,1)' });
        }

        document.querySelectorAll('.summary-cockpit [data-metric]').forEach((node) => {
          const target = Number(node.dataset.money);
          const start = previous.metrics[node.dataset.metric];
          if (!Number.isFinite(start) || start === target) return;
          const began = performance.now();
          const duration = 720;
          node.animate([
            { filter: 'blur(4px)', transform: 'translateY(7px)' },
            { filter: 'blur(0)', transform: 'translateY(0)' },
          ], { duration, easing: 'cubic-bezier(.22,1,.36,1)' });
          const tick = (now) => {
            const t = Math.min(1, (now - began) / duration);
            const eased = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
            node.textContent = $$(start + (target - start) * eased);
            if (t < 1) requestAnimationFrame(tick);
            else node.textContent = $$(target);
          };
          requestAnimationFrame(tick);
        });

        document.querySelectorAll('.summary-charts').forEach((group, gi) => {
          group.querySelectorAll('.card').forEach((card, ci) => {
            card.querySelectorAll('[data-bar-key]').forEach((row) => {
              const fill = row.querySelector('.fill[data-rank]');
              if (!fill) return;
              const target = Number(fill.dataset.rank);
              const start = previous.bars[`${gi}:${ci}:${row.dataset.barKey}`];
              const ratio = Number.isFinite(start) ? Math.max(.015, start / target) : .08;
              fill.animate([
                { transform: `scaleX(${ratio})`, filter: 'saturate(.7)' },
                { transform: 'scaleX(1)', filter: 'saturate(1)' },
              ], { duration: kind === 'distribution' ? 620 : 760, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'both' });
            });
          });
        });

        const date = document.querySelector('.fbar .dpbar');
        if (kind === 'period' && date) date.animate([
          { borderColor: 'var(--f-brand)', boxShadow: '0 0 0 0 rgba(0,114,251,0)' },
          { offset: .35, borderColor: 'var(--f-brand)', boxShadow: '0 0 0 5px rgba(0,114,251,.10)' },
          { borderColor: 'var(--f-hair-strong)', boxShadow: '0 8px 24px -20px rgba(15,23,42,.30)' },
        ], { duration: 700, easing: 'cubic-bezier(.22,1,.36,1)' });
      }

      function renderFinanceUpdate(kind) {
        const previous = financeSnapshot();
        render();
        requestAnimationFrame(() => animateFinanceUpdate(previous, kind));
      }

      function render() {
        document.body.classList.toggle('is-summary', S.container === 'finanzas' && S.tab === 'resumen');
        renderRail();
        renderHead();

        // Tabs — solo Finanzas las usa; los otros dos containers son mockups de un nivel.
        el('tabs').classList.toggle('hide', S.container !== 'finanzas');
        if (S.container === 'finanzas') {
          el('tabs').innerHTML = tabsVisibles().map((t) => `<button class="${S.tab === t.k ? 'on' : ''}" onclick="go('${t.k}')">${t.l}</button>`).join('');
          // La sección activa siempre a la vista, aunque esté fuera de pantalla.
          const act = el('tabs').querySelector('button.on');
          if (act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          marcarTabs();
        }

        const V = { resumen: vResumen, cobranzas: vCobranzas, movimientos: vMovimientos, cobros: vCobros,
          gastos: vGastos, resultado: vResultado, comisiones: vComisiones, arqueo: vArqueo };
        el('view').innerHTML =
          S.container === 'actividad' ? vActividad() :
          S.container === 'analitica' ? vAnalitica() :
          V[S.tab]();

        renderPanel();
        bindTips();
        marcarScrolls();
        bindInfinito();
      }

      /* ---- Rail: la navegación real de Flash con la propuesta aplicada ---- */
      const RAIL_IC = {
        inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
        pagina: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
        agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
        finanzas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/></svg>',
        catalogo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h16l-1.4 12H5.4z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
        negocio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10M9 20V4M15 20v-7M21 20V7"/></svg>',
        equipo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.4 3.2-5.2 6.5-5.2s5.9 1.8 6.5 5.2"/><path d="M17 9a2.8 2.8 0 1 0 0-.2M18 14.6c2 .7 3.2 2.4 3.5 5.2"/></svg>',
        medios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="7.5" width="18" height="12" rx="2.5"/></svg>',
      };
      function renderRail() {
        const fin = S.container === 'finanzas';
        const kid = (label, on, onclick, moved) =>
          `<a href="#" class="${on ? 'on' : ''}" onclick="${onclick};return false"><i></i>${label}${moved ? `<span class="moved">${moved}</span>` : ''}</a>`;
        el('rail').innerHTML = `
          <div class="brand"><img src="assets/agora-horizontal.png" alt="Ágora" /></div>
          <a href="#" onclick="return false">${RAIL_IC.inicio}Inicio</a>
          <a href="#" onclick="return false">${RAIL_IC.pagina}Mi página</a>
          <a href="#" onclick="return false">${RAIL_IC.agenda}Agenda</a>
          <a href="#" class="${fin ? 'on' : ''}" onclick="goCont('finanzas');return false">${RAIL_IC.finanzas}Finanzas<span class="car">▾</span></a>
          <div class="kids">
            ${tabsVisibles().map((t) => kid(t.l, fin && S.tab === t.k, `goTab('${t.k}')`, t.k === 'movimientos' ? 'movida' : t.k === 'arqueo' ? 'movida' : '')).join('')}
          </div>
          <a href="#" onclick="return false">${RAIL_IC.catalogo}Catálogo<span class="car">▾</span></a>
          <a href="#" onclick="return false">${RAIL_IC.negocio}Mi negocio<span class="car">▾</span></a>
          <div class="kids">
            ${kid('Actividad', S.container === 'actividad', `goCont('actividad')`, 'cambia')}
            ${kid('Clientes', false, `return false`)}
            ${kid('Analítica', S.container === 'analitica', `goCont('analitica')`, 'cambia')}
            ${kid('Resúmenes', false, `return false`)}
          </div>
          <a href="#" onclick="return false">${RAIL_IC.equipo}Equipo<span class="car">▾</span></a>
          <a href="#" onclick="return false">${RAIL_IC.medios}Medios de cobro</a>`;
      }

      /* ---- Header del container activo ---- */
      // Acciones por vista: exportar no aplica en Caja ni en Conceptos, y registrar
      // cobro/gasto no aplica en Resumen ni en Conceptos (decisión JP, 20/ago).
      const BTN_EXPORT = `<button class="btn ghost" aria-label="Exportar" onclick="toast('Exportado: 1 archivo .csv con lo que estás viendo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Exportar</span></button>`;
      const ic = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const I_PLUS = ic('<path d="M12 5v14M5 12h14"/>');
      const I_UP = ic('<path d="M12 19V5M6 11l6-6 6 6"/>');
      const I_DOWN = ic('<path d="M12 5v14M6 13l6 6 6-6"/>');
      const I_OUT = ic('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>');
      const I_TEAM = ic('<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>');

      // Registrar venta y Registrar cobro NO son la misma acción: la primera da de alta una venta,
      // la segunda cierra un saldo que ya existe. Por eso cada una vive en una sección distinta.
      const BTN_VENTA = `<button class="btn pri" onclick="openVenta()">${I_PLUS}Registrar venta</button>`;
      const BTN_COBRO = `<button class="btn pri" onclick="openCobrar()">${I_PLUS}Registrar cobro</button>`;
      // Cada una en su sección: el ingreso en Ventas cobradas, el gasto en Gastos.
      const BTN_INGRESO = `<button class="btn pri" onclick="openIngreso()">${I_PLUS}Registrar cobro</button>`;
      const BTN_GASTO = `<button class="btn pri neg" onclick="openGasto()">${I_DOWN}Registrar gasto</button>`;
      const BTN_LIQUIDAR = `<button class="btn pri" onclick="openLiquidar(null)">${I_TEAM}Registrar pago</button>`;
      const BTN_AJUSTE = `<button class="btn" onclick="openAjuste()">${I_PLUS}Ajuste manual</button>`;
      // Solo en Caja: son las únicas dos que mueven el cajón sin tocar el resultado.
      const BTN_REPO = `<button class="btn" onclick="openMovCaja('in')">${I_PLUS}Ingreso de efectivo</button>`;
      const BTN_RETIRO = `<button class="btn neg" onclick="openMovCaja('out')">${I_OUT}Retiro de efectivo</button>`;
      // Con la caja cerrada, abrirla es LA acción de la vista: sube a la cabecera como
      // primaria, a la altura del título, y no solo como CTA enterrado abajo del explicativo.
      const I_CAJA = ic('<path d="M3 10 5.5 4h13L21 10"/><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M10 14h4"/>');
      const BTN_ABRIR_CAJA = `<button class="btn pri" onclick="openAbrirCaja()">${I_CAJA}Abrir la caja del día</button>`;

      // Acciones que CREAN algo: en desktop van en el header, en mobile en la barra inferior.
      const ACTS = {
        resumen: () => '',
        movimientos: () => BTN_VENTA,
        cobranzas: () => BTN_COBRO,
        cobros: () => BTN_INGRESO,
        gastos: () => BTN_GASTO,
        resultado: () => '',
        comisiones: () => BTN_AJUSTE + BTN_LIQUIDAR,
        // Con la caja cerrada no hay cajón que mover: la única acción posible es abrirla.
        arqueo: () => (CAJA_ABIERTA ? BTN_REPO + BTN_RETIRO : BTN_ABRIR_CAJA),
      };
      // Exportar no crea nada: se queda arriba siempre.
      const CON_EXPORT = ['movimientos', 'cobros', 'gastos'];
      const TITLES = {
        comisiones: ['Comisiones del ', 'equipo'], resumen: ['Tu ', 'resumen'], movimientos: ['Todas las ', 'ventas'], cobranzas: ['Lo que falta ', 'cobrar'],
        cobros: ['Ventas ', 'cobradas'], gastos: ['Todos los ', 'gastos'], resultado: ['Tu ', 'resultado'],
        arqueo: ['Cierre de ', 'caja'],
      };

      function renderHead() {
        const fin = S.container === 'finanzas';
        const t = fin ? (TITLES[S.tab] || ['Tu ', 'resumen']) : (S.container === 'actividad' ? ['Toda la ', 'actividad'] : ['Tu ', 'analítica']);
        el('mKick').textContent = fin ? 'Finanzas' : 'Mi negocio';
        el('mTitle').innerHTML = `${t[0]}<strong>${t[1]}</strong><span class="dot">.</span>`;
        const filtros = '';
        const acciones = fin ? (ACTS[S.tab] || (() => ''))() : '';
        const exportar = fin ? (CON_EXPORT.includes(S.tab) ? BTN_EXPORT : '') : BTN_EXPORT;
        const chico = window.innerWidth <= 1100;
        el('mActs').innerHTML = filtros + exportar + (chico ? '' : acciones);
        el('mbar').innerHTML = chico ? acciones : '';
        el('mbar').classList.toggle('on', chico && !!acciones);
        document.body.classList.toggle('conbar', chico && !!acciones);
      }

      /* ---- Tooltip de charts ---- */
      function tipOn(e, txt) { const t = el('tip'); t.textContent = txt; t.classList.add('on'); tipMove(e); }
      function tipMove(e) {
        const t = el('tip'), w = t.offsetWidth, h = t.offsetHeight;
        t.style.left = Math.min(window.innerWidth - w - 12, Math.max(12, e.clientX - w / 2)) + 'px';
        t.style.top = Math.max(12, e.clientY - h - 14) + 'px';
      }
      function tipOff() { el('tip').classList.remove('on'); }

      function bindTips() {
        const tip = el('tip');
        document.querySelectorAll('.chart rect.bar').forEach((b) => {
          b.addEventListener('mousemove', (e) => {
            tip.innerHTML = b.dataset.t;
            tip.classList.add('on');
            const w = tip.offsetWidth, h = tip.offsetHeight;
            tip.style.left = Math.min(window.innerWidth - w - 12, Math.max(12, e.clientX - w / 2)) + 'px';
            tip.style.top = Math.max(12, e.clientY - h - 14) + 'px';
          });
          b.addEventListener('mouseleave', () => tip.classList.remove('on'));
        });
      }

      // El rubro y la persona ya no tienen switch en pantalla: se fijan acá.
      // setRubro('salud') / setPersona('solo') desde la consola siguen funcionando.
      function setRubro(v) { applyVertical(v); S.staff = 'all'; render(); }
      function setPersona(v) { S.persona = v; S.staff = 'all'; render(); }
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (DP) { DP = false; render(); } closeAll(); } });

      applyVertical('beauty');
      render();
    </script>
  </body>
</html>
