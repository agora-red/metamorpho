      .card.clickable:hover { transform: translateY(-3px); border-color: rgba(0,114,251,.20); box-shadow: 0 24px 48px -32px rgba(15,23,42,.38); }
      .card > h3, .sec > h3 { font-size: 17px; line-height: 1.25; }
      .sec { margin-bottom: 30px; }

      /* KPIs generales: semántica visible y ritmo editorial. El Resumen toma este
         vocabulario y lo recompone abajo como una sola lectura financiera. */
      .stat { min-height: 146px; overflow: hidden; }
      button.stat { width: 100%; text-align: left; color: inherit; font-family: inherit; }
      .statmark {
        position: absolute; top: 14px; right: 14px; width: 34px; height: 34px;
        border-radius: 11px; display: grid; place-items: center;
      }
      .statmark svg { width: 17px; height: 17px; }
      .statrow { grid-template-columns: 1.08fr 1.08fr .92fr .92fr 1.18fr; gap: 14px; }
      .statrow .stat { min-height: 152px; padding: 20px 18px; }
      .statrow .stat .k { max-width: calc(100% - 42px); font-size: 9px; letter-spacing: .13em; }
      .statrow .stat .v { font-size: clamp(22px, 1.65vw, 29px); margin-top: 25px; }
      .statrow .stat .s { line-height: 1.45; }
      .statrow .stat:last-child { background: var(--f-ink); border-color: var(--f-ink); }
      .statrow .stat:last-child .k { color: rgba(255,255,255,.68); }
      .statrow .stat:last-child .v { color: #fff; }
      .statrow .stat:last-child .s { color: rgba(255,255,255,.68); }
      .statrow .stat:last-child .s b { color: #fff; }
      .statrow .stat:last-child .statmark { background: rgba(255,255,255,.12) !important; color: #fff !important; }
      .statrow .stat:last-child::after {
        content: '→'; position: absolute; right: 18px; bottom: 15px;
        color: rgba(255,255,255,.52); font-size: 18px;
      }

      /* Resumen: un cockpit, no cinco tarjetas hermanas. Los dos balances de contexto
         viven en una columna tranquila; los tres flujos forman la ecuación del período. */
      body.is-summary .fbar { justify-content: flex-end; }
      body.is-summary .fbar .dpwrap { flex: 0 1 540px; }
      .summary-cockpit {
        position: relative; isolation: isolate; overflow: hidden;
        grid-template-columns: minmax(170px,.76fr) minmax(205px,1fr) minmax(190px,.92fr) minmax(245px,1.2fr);
        grid-template-rows: repeat(2, minmax(126px,1fr));
        grid-template-areas: 'ventas cobrado gastos neto' 'cobrar cobrado gastos neto';
        gap: 12px 36px; padding: 18px;
        border: 1px solid rgba(255,255,255,.08); border-radius: var(--f-r-shell);
        background:
          radial-gradient(circle at 78% 18%, rgba(0,114,251,.20), transparent 31%),
          radial-gradient(circle at 17% 92%, rgba(16,185,129,.10), transparent 28%),
          #0B1427;
        box-shadow: 0 34px 72px -42px rgba(5,13,30,.78), 0 1px 2px rgba(15,23,42,.18);
      }
      .summary-cockpit::before {
        content: ''; position: absolute; z-index: -1; inset: 0; opacity: .34; pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 100% 25%; mask-image: linear-gradient(to right, transparent, #000 28%, #000);
      }
      .summary-cockpit .stat {
        z-index: 1; min-width: 0; min-height: 0; overflow: visible; margin: 0;
        color: #fff; border-color: rgba(255,255,255,.09);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 34px -28px rgba(0,0,0,.88);
      }
      .summary-cockpit .stat:nth-child(1) { grid-area: ventas; }
      .summary-cockpit .stat:nth-child(2) { grid-area: cobrado; }
      .summary-cockpit .stat:nth-child(3) { grid-area: cobrar; }
      .summary-cockpit .stat:nth-child(4) { grid-area: gastos; }
      .summary-cockpit .stat:nth-child(5) { grid-area: neto; }
      .summary-cockpit .stat:nth-child(1),
      .summary-cockpit .stat:nth-child(3) {
        display: flex; flex-direction: column; justify-content: center; padding: 18px 16px;
        background: transparent; border: 0; border-radius: 0; box-shadow: none;
      }
      .summary-cockpit .stat:nth-child(1) { border-bottom: 1px solid rgba(255,255,255,.10); }
      .summary-cockpit .stat:nth-child(2),
      .summary-cockpit .stat:nth-child(4),
      .summary-cockpit .stat:nth-child(5) {
        display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 20px;
        background: rgba(255,255,255,.055); backdrop-filter: blur(14px);
      }
      .summary-cockpit .stat:nth-child(5) {
        background: #fff; color: var(--f-ink); border-color: #fff;
        box-shadow: 0 24px 48px -28px rgba(0,114,251,.72), inset 0 0 0 1px rgba(255,255,255,.7);
      }
      .summary-cockpit .stat .k { color: rgba(255,255,255,.62); }
      .summary-cockpit .stat .s { color: rgba(226,232,240,.72); }
      .summary-cockpit .stat .s b { color: #fff; }
      .summary-cockpit .stat .v {
        color: #fff; font-size: clamp(27px,2vw,36px); margin: 16px 0 6px;
        letter-spacing: -.045em;
      }
      .summary-cockpit .stat:nth-child(1) .v,
      .summary-cockpit .stat:nth-child(3) .v { font-size: clamp(21px,1.55vw,27px); margin: 10px 0 3px; }
      .summary-cockpit .stat:nth-child(5) .k,
      .summary-cockpit .stat:nth-child(5) .s { color: var(--f-ink-mid); }
      .summary-cockpit .stat:nth-child(5) .s b { color: var(--f-ink); }
      .summary-cockpit .stat:nth-child(5) .v { color: var(--f-ink); font-size: clamp(34px,2.7vw,46px); }
      .summary-cockpit .stat:nth-child(5) .statmark { background: var(--f-brand-wash-strong) !important; color: var(--f-brand-deep) !important; }
      .summary-cockpit .stat:nth-child(5)::after { display: none; }
      .summary-cockpit .stat:nth-child(1) .statmark,
      .summary-cockpit .stat:nth-child(3) .statmark {
        display: none;
      }
      .summary-cockpit .stat:nth-child(2)::after,
      .summary-cockpit .stat:nth-child(4)::after {
        content: ''; position: absolute; z-index: 3; top: 50%; right: -27px;
        width: 18px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.48);
      }
      .summary-cockpit .stat:nth-child(4)::after { box-shadow: 0 7px 0 rgba(255,255,255,.48); transform: translateY(-3.5px); }
      .summary-cockpit .stat.clickable:hover {
        transform: translateY(-3px); border-color: rgba(255,255,255,.19);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 25px 38px -28px rgba(0,0,0,.95);
      }
      .summary-cockpit .stat:nth-child(1):hover,
      .summary-cockpit .stat:nth-child(3):hover { transform: translateX(3px); background: rgba(255,255,255,.035); }
      .summary-cockpit .stat:nth-child(5):hover { border-color: #fff; box-shadow: 0 30px 56px -28px rgba(0,114,251,.88); }

      /* El reparto deja de usar dos mitades intercambiables: cada lectura recibe el ancho
         que necesita según densidad y capacidad de decisión. */
      .summary-primary { grid-template-columns: minmax(340px,.82fr) minmax(0,1.18fr); }
      .summary-secondary { grid-template-columns: minmax(0,1.28fr) minmax(320px,.72fr); }

      /* Rank bars: la barra segmentada muestra participación; cada fila se normaliza
         contra el líder para que las diferencias sean comparables de verdad. */
      .propbar { height: 18px; gap: 4px; padding: 2px; margin-bottom: 20px; background: var(--f-paper); border-radius: 999px; }
      .propbar span { min-width: 3px; }
      .barsbox { min-height: 302px; }
      .bars .row { grid-template-columns: minmax(0,1fr) 108px; gap: 20px; padding: 13px 11px; }
      button.row { width: 100%; text-align: left; color: inherit; font: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--f-hair); }
      .bars .name { font-weight: 600; }
      .bars .track { height: 9px; margin-top: 8px; background: #E7ECF3; }
      .bars .fill { transform-origin: left center; }
      .bars .val { font-size: 14px; }
      .bars .val em { margin-top: 2px; }
      @keyframes financeBarIn { from { transform: scaleX(.08); opacity: .55; } to { transform: scaleX(1); opacity: 1; } }

      /* Resultado: una cascada espacial —entra, sale, queda— usando la misma aritmética. */
      .result-hero { margin: 2px 0 30px; padding: 8px 0 2px; }
      .result-hero .q { font-size: 14px; }
      .result-hero .n { font-size: clamp(54px, 6vw, 84px); font-weight: 300; }
      .result-hero .d { max-width: 54ch; padding-bottom: 8px; }
      .result-card { padding: clamp(22px, 3vw, 34px); }
      .result-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr); gap: 34px; align-items: stretch; }
      .waterfall {
        position: relative; display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
        gap: clamp(14px, 3vw, 34px); min-height: 320px; padding: 42px 16px 50px;
        border-bottom: 1px solid var(--f-hair-strong);
      }
      .waterfall::before, .waterfall::after {
        content: ''; position: absolute; left: 16px; right: 16px; border-top: 1px dashed var(--f-hair-strong);
      }
      .waterfall::before { top: 33%; }
      .waterfall::after { top: 63%; }
      .wfcol { position: relative; min-width: 0; }
      .wfbar {
        position: absolute; left: 8%; right: 8%; bottom: var(--bottom); height: var(--height);
        min-height: 4px; border-radius: 12px 12px 4px 4px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 14px 24px -18px currentColor;
        transform-origin: bottom center; animation: waterfallIn 720ms var(--f-ease) both;
      }
      .wfcol.in .wfbar { background: var(--f-brand); color: var(--f-brand); }
      .wfcol.out .wfbar { background: var(--f-coral); color: var(--f-coral); border-radius: 4px 4px 12px 12px; }
      .wfcol.net .wfbar { background: var(--f-success); color: var(--f-success); }
      .wfcol.net.negative .wfbar { background: var(--f-coral); color: var(--f-coral); }
      .wfvalue { position: absolute; left: 0; right: 0; bottom: calc(var(--bottom) + var(--height) + 10px); text-align: center; font-size: clamp(14px, 1.4vw, 20px); font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .wflabel { position: absolute; left: -6px; right: -6px; bottom: -36px; text-align: center; font-size: 11px; font-weight: 700; color: var(--f-ink-mid); }
      @keyframes waterfallIn { from { transform: scaleY(.08); opacity: .55; } to { transform: scaleY(1); opacity: 1; } }
      .result-grid .cascade { align-self: center; padding: 8px 0; }
      .result-grid .cascade .r { padding: 12px 0; }
      .result-grid .cascade .r.total { margin-top: 10px; padding-top: 18px; }
      .result-grid .cascade .r.total .amt { font-size: 28px; }

      /* Tablas y caja: lectura operativa más nítida sin convertirlas en decoración. */
      .tcard { overflow: hidden; }
      .tcard .tbl thead th { background: rgba(255,255,255,.96); backdrop-filter: blur(10px); }
      .tbl td { padding-top: 14px; padding-bottom: 14px; }
      .tbl tbody tr.hoverable:hover { background: rgba(0,114,251,.055); }
      .arq { grid-template-columns: minmax(0,1fr) 350px; gap: 22px; }
      .arq > div { min-width: 0; }
      .arq > div:first-child { display: grid; grid-template-columns: minmax(0,1fr); gap: 20px; }
      .arq > div:first-child > .card { margin-bottom: 0 !important; }
      .arq .card > h3 { font-size: 19px; }
      .contado .cwrap { background: var(--f-card); border-color: var(--f-hair-strong); box-shadow: inset 0 0 0 1px rgba(15,23,42,.015); }
      .contado input { font-size: 42px; }
      .verdict { padding: 24px 18px; }
      .verdict .v { font-size: 42px; font-weight: 300; }

      /* Cambio de vista: mejora progresiva. Sin View Transitions la navegación sigue
         siendo inmediata; con soporte, el shell permanece estable y cambia solo el main. */
      @supports (view-transition-name: none) {
        html[data-route-transition] main { view-transition-name: finance-main; }
        ::view-transition-group(finance-main) { animation-duration: 460ms; animation-timing-function: var(--f-ease); }
        ::view-transition-old(finance-main) { animation: financeViewOut 180ms ease-in both; }
        ::view-transition-new(finance-main) { animation: financeViewIn 460ms var(--f-ease) both; }
      }
      @keyframes financeViewOut {
        to { opacity: 0; filter: blur(5px); clip-path: inset(0 0 8% 0 round 0 0 28px 28px); }
      }
      @keyframes financeViewIn {
        from { opacity: 0; filter: blur(10px); clip-path: inset(7% 0 0 0 round 28px 28px 0 0); }
        to { opacity: 1; filter: blur(0); clip-path: inset(0 round 0); }
      }

        .wrap { padding: 0 30px; }

        }
        .result-grid { grid-template-columns: 1fr; }
        .result-grid .cascade { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
        .result-grid .cascade .r.total { grid-column: 1 / -1; }
        .arq { grid-template-columns: minmax(0,1fr); }
      }

        .statrow:not(.summary-cockpit) .stat:last-child .s { color: var(--f-ink-mid); }
        .statrow:not(.summary-cockpit) .stat:last-child::after { display: none; }
        .summary-cockpit {
          grid-template-columns: 1fr; grid-template-rows: auto;
          grid-template-areas: 'ventas' 'cobrar' 'cobrado' 'gastos' 'neto';

        .waterfall::before, .waterfall::after { left: 2px; right: 2px; }

        .wflabel { font-size: 10px; }

        .result-grid .cascade { display: flex; }
        .arq .card > h3 { font-size: 17px; }
        .tcard { margin-left: -18px; margin-right: -18px; }
      }

      const METHODS = {

      let STAFF = [];
      const CLIENTS = ['Camila Ferrari', 'Julieta Roldán', 'Martina Sosa', 'Agustina Paz', 'Lucía Benítez', 'Florencia Ríos', 'Delfina Álvarez', 'Micaela Torres', 'Rocío Medina', 'Brenda Cabrera', 'Ana Laura Gómez', 'Sol Miranda', 'Victoria Peralta', 'Belén Ortiz', 'Carla Domínguez', 'Malena Ibarra', 'Guadalupe Ponce', 'Paula Ledesma', 'Antonella Vera', 'Nicolás Arrieta', 'Federico Luna', 'Matías Herrera', 'Joaquín Sánchez', 'Ramiro Costa', 'Valeria Nieto', 'Sabrina Quiroga', 'Emilia Castro', 'Abril Godoy', 'Renata Silva', 'Bautista Molina'];
      // La categoría automática: no la crea ni la toca el dueño, la escribe Ágora cada vez

      const AUTO_CAT = 'sueldos';
      const ECATS = [
        { k: 'sueldos', label: 'Liquidación de comisiones', auto: true },

      const esAuto = (k) => k === AUTO_CAT;
      // Los gastos de una categoría eliminada caen acá. NO es una categoría: no se crea, no

      const SIN_CAT = '__sin__';
      const SIN_CAT_LABEL = 'Sin categoría';
      const catLabel = (k) => (!k || k === SIN_CAT)
        ? SIN_CAT_LABEL

      /* ---- Comisiones al equipo ----
         Cada profesional tiene un esquema (% sobre servicios y sobre productos). La comisión se
         DEVENGA con cada cobro y se PAGA en una liquidación, que entra al ledger como un gasto de
         categoría "Liquidación de comisiones". Así el resultado deja de tener un monto inventado. */
      const RATE_SET = [
        { svc: 0.45, prod: 0.10 }, { svc: 0.40, prod: 0.10 }, { svc: 0.50, prod: 0.12 },
        { svc: 0.40, prod: 0.08 }, { svc: 0.35, prod: 0.10 },
      ];
      const rateOf = (st) => RATE_SET[Math.max(0, STAFF.indexOf(st)) % RATE_SET.length];
      // Solo devenga lo que hace una persona: servicios, más la venta de producto a una tasa menor.
      // Cursos, capacitaciones, descargables y gift cards no tienen profesional asignado.
      function comisionDe(m) {
        if (m.dir !== 'in' || m.st !== 'ok' || !m.staff) return 0;
        const r = rateOf(m.staff);
        if (m.asset === 'servicio') return m.amount * r.svc;
        if (m.asset === 'producto') return m.amount * r.prod;
        return 0;
      }
      const devengado = (st, from, to) => MOVS
        .filter((m) => m.staff === st && m.date >= from && m.date <= to)
        .reduce((s2, m) => s2 + comisionDe(m), 0);
      const pagado = (st) => MOVS.filter((m) => m.staffPay === st).reduce((s2, m) => s2 + m.amount, 0);
      const AJUSTES = []; // { staff, amount (con signo), motivo, date }
      const ajustes = (st, from, to) => AJUSTES
        .filter((a) => a.staff === st && (!from || (a.date >= from && a.date <= to)))
        .reduce((s2, a) => s2 + a.amount, 0);
      const saldoComision = (st) => Math.round(devengado(st, FROM, TODAY) + ajustes(st) - pagado(st));

      // Comisión de cobro POR MEDIO. Solo la de Mercado Pago: viene en el `fee_details` de la
      // respuesta de pago de MP, así que es un dato real, no una estimación.
      // Efectivo y transferencia no tienen costo. Las de tarjeta van en 0 a propósito: el posnet es
      // del negocio, Ágora no procesa esos cobros y no tiene forma de saber qué le cobra su proveedor —
      // inventar un porcentaje ahí sería ensuciar el neto con un número que nadie puede auditar.
      // Sin comisión de cobro: no tenemos el dato con certeza (decisión JP, 18/ago). MP la informa en
      // `fee_details` pero Cyclone todavía no la persiste, y la del posnet propio no la vemos nunca.
      // Antes que mostrar un porcentaje inventado, el módulo no descuenta nada y lo dice.
      const COMM = { ef: 0, tr: 0, mp: 0, cr: 0, de: 0 };

      /* ---- PRNG sembrado: mismo dataset en cada carga ---- */
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      let rnd = mulberry32(20260804);
      const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
      const pick = (a) => a[Math.floor(rnd() * a.length)];
      const wpick = (p) => { let r = rnd() * p.reduce((s, x) => s + x[1], 0); for (const [v, w] of p) { r -= w; if (r <= 0) return v; } return p[0][0]; };
      const round100 = (n) => Math.round(n / 100) * 100;

      const FROM = '2026-06-01';
      const MOVS = [];
      let _id = 1000;

      // Cambiar de rubro reconstruye el dataset entero desde el mismo seed: los conceptos de
      // servicio y producto salen del catálogo del negocio, no de una lista fija.
      function applyVertical(v) {
        VERTICAL = v;
        CONCEPTS.servicio = V_().servicios.slice();
        CONCEPTS.producto = V_().productos.slice();
        CONCEPTS.capacitacion = V_().capacitaciones.slice();
        CONCEPTS.descargable = V_().descargables.slice();
        STAFF = V_().staff.slice();
        RECV = RECV_BASE.map((r) => ({
          ...r,
          concept: r.concept || (
            r.cap != null ? V_().capacitaciones[r.cap % V_().capacitaciones.length]
            : r.svc === 'largo' ? V_().largo
            : typeof r.svc === 'string' && r.svc.startsWith('caro') ? V_().caros[Number(r.svc.slice(4)) % V_().caros.length]
            : r.svc != null ? V_().servicios[r.svc % V_().servicios.length]
            : V_().productos[(r.prod || 0) % V_().productos.length] + ' (entregado a cuenta)'),
          staff: r.staff == null ? null : STAFF[r.staff % STAFF.length],
        }));
        rnd = mulberry32(20260804);
        MOVS.length = 0;
        _id = 1000;
        build();
        RECV.forEach((r) => {
          if (!r.paid) return;
          MOVS.push({ id: ++_id, date: r.date, time: '11:20', dir: 'in', amount: r.paid,
            method: r.origin === 'producto' ? 'ef' : 'tr', asset: r.origin, concept: r.concept,
            client: r.client, staff: r.staff, st: 'ok', recv: r.id,
            account: r.origin === 'producto' ? 'caja' : 'banco', src: 'local' });
        });
        CONTADO = null;
      }

      // Ningún egreso en efectivo puede dejar un cajón físico por debajo de cero. El
      // prototipo conserva el gasto y su fecha, pero usa la cuenta bancaria si la caja no
      // alcanza; así el resultado no cambia y el historial de cierres sigue siendo posible.
      function disponibleEnCaja(date) {
        const day = MOVS.filter((m) => m.date === date);
        const inn = day.filter((m) => m.dir === 'in' && m.method === 'ef' && m.st === 'ok')
          .reduce((s, m) => s + m.amount, 0);
        const out = day.filter((m) => m.dir === 'out' && m.account === 'caja')
          .reduce((s, m) => s + m.amount, 0);
        return OPENING + inn - out;
      }

      function build() {
        let day = FROM;
        while (dDiff(day, TODAY) >= 0) {
          const dow = parse(day).getDay();
          const closed = dow === 0;
          const n = closed ? rint(2, 5) : dow === 6 ? rint(19, 28) : rint(14, 24);
          for (let i = 0; i < n; i++) {
            const asset = closed
              ? wpick([['curso', 46], ['giftcard', 26], ['capacitacion', 16], ['descargable', 12]])
              : wpick([['servicio', 62], ['producto', 18], ['curso', 8], ['giftcard', 5], ['descargable', 4], ['capacitacion', 3]]);
            const cfg = ASSETS[asset];
            let amount, concept;
            if (asset === 'giftcard') { amount = pick([30000, 50000, 80000, 100000]); concept = 'Gift card ' + $$(amount); }
            else { amount = round100(cfg.min + rnd() * (cfg.max - cfg.min)); concept = pick(CONCEPTS[asset]); }
            let method;
            if (cfg.online) method = 'mp';
            else if (asset === 'capacitacion') method = wpick([['tr', 60], ['mp', 28], ['ef', 12]]);
            else method = wpick([['ef', 28], ['tr', 22], ['mp', 24], ['cr', 18], ['de', 8]]);

            const st = 'ok'; // los "sin cerrar" se marcan abajo, fuera del PRNG (ver nota)
            const hora = `${String(closed ? rint(9, 22) : rint(9, 20)).padStart(2, '0')}:${String(rint(0, 59)).padStart(2, '0')}`;

            const quien = cfg.staff ? pick(STAFF) : null;
            const base = { date: day, time: hora, dir: 'in', method, asset, client: cli, staff: quien,
              st, account: METHODS[method].account, cat: null, src: cfg.online ? 'online' : 'local' };
            // Un tercio de los turnos lleva un adicional. Se le descuenta al servicio en vez
            // de sumarse: la venta vale lo mismo y se reparte en dos conceptos.
            const conAdic = asset === 'servicio' && rnd() < 0.34;
            const adic = conAdic ? round100(amount * (0.12 + rnd() * 0.16)) : 0;
            MOVS.push({ ...base, id: ++_id, amount: amount - adic, concept });
            if (adic) MOVS.push({ ...base, id: ++_id, amount: adic, concept: pick(V_().adicionales), addon: true });
          }
          // Devolución ocasional
          if (!closed && rnd() < 0.09) {
            let m = wpick([['ef', 40], ['tr', 25], ['mp', 35]]);
            const time = `${String(rint(11, 19)).padStart(2, '0')}:${String(rint(0, 59)).padStart(2, '0')}`;
            const amount = round100(12000 + rnd() * 55000);
            if (m === 'ef' && amount > disponibleEnCaja(day)) m = 'tr';
            MOVS.push({ id: ++_id, date: day, time, dir: 'out', amount, method: m, asset: 'refund', concept: 'Devolución a clienta', client: pick(CLIENTS), staff: null, st: 'refund', account: METHODS[m].account, cat: SIN_CAT, src: 'local' });
          }
          // Gastos
          const dn = parse(day).getDate();
          const fixed = [];
          if (dn === 5) fixed.push(['alquiler', 980000, 'banco']);
          if (dn === 20) fixed.push(['impuestos', 286000, 'banco']);
          if (dn === 12) fixed.push(['servicios', 168000, 'banco']);
          fixed.forEach(([c, amt, acc]) => MOVS.push({ id: ++_id, date: day, time: '10:' + String(rint(0, 59)).padStart(2, '0'), dir: 'out', amount: amt, method: 'tr', asset: 'gasto', concept: pick(ECONCEPT[c]), client: null, staff: null, st: 'ok', account: acc, cat: SIN_CAT, src: 'local' }));
          const ng = closed ? 0 : rint(0, 2);
          for (let i = 0; i < ng; i++) {
            const c = wpick([['insumos', 34], ['reventa', 14], ['marketing', 12], ['mantenimiento', 10],
              ['equipos', 9], ['otros', 12], ['servicios', 5], ['impuestos', 4]]);
            let acc = wpick([['caja', 55], ['banco', 32], ['mp', 13]]);
            const time = `${String(rint(9, 19)).padStart(2, '0')}:${String(rint(0, 59)).padStart(2, '0')}`;
            const amount = round100(9000 + rnd() * 160000);
            if (acc === 'caja' && amount > disponibleEnCaja(day)) acc = 'banco';
            MOVS.push({ id: ++_id, date: day, time, dir: 'out', amount, method: acc === 'caja' ? 'ef' : acc === 'mp' ? 'mp' : 'tr', asset: 'gasto', concept: pick(ECONCEPT[c]), client: null, staff: null, st: 'ok', account: acc, cat: SIN_CAT, src: 'local' });
          }
          day = addD(day, 1);
        }
        MOVS.sort((a, b) => (a.date === b.date ? b.time.localeCompare(a.time) : b.date.localeCompare(a.date)));


        // Liquidaciones semanales: cada lunes se paga lo devengado de la semana cerrada
        // (lunes a domingo anteriores). Es el ritmo real de un salón, y hace que el saldo
        // pendiente nunca se acumule más allá de los días corridos de la semana en curso.
        let lun = LUNES;
        while (dDiff(FROM, lun) >= 0) lun = addD(lun, -7);
        lun = addD(lun, 7);
        while (dDiff(lun, TODAY) >= 0) {
          const desde = addD(lun, -7), hasta = addD(lun, -1);
          STAFF.forEach((st, i) => {
            const monto = Math.round(MOVS.filter((m) => m.staff === st && m.date >= desde && m.date <= hasta)
              .reduce((s2, m) => s2 + comisionDe(m), 0));
            if (monto <= 0) return;
            const pagaEnCaja = i % 3 === 0 && monto <= disponibleEnCaja(lun);
            MOVS.push({
              id: ++_id, date: lun, time: '10:' + String(10 + i * 3).padStart(2, '0'), dir: 'out',
              amount: monto, method: pagaEnCaja ? 'ef' : 'tr', asset: 'gasto',
              concept: `Comisiones de ${st} · semana del ${fD(desde)}`,
              client: null, staff: null, staffPay: st, periodo: `${fD(desde)} — ${fD(hasta)}`, st: 'ok',
              account: pagaEnCaja ? 'caja' : 'banco', cat: 'sueldos', src: 'local',
            });
          });
          lun = addD(lun, 7);
        }

        MOVS.sort((a2, b2) => (a2.date === b2.date ? b2.time.localeCompare(a2.time) : b2.date.localeCompare(a2.date)));
      }

      /* ---- Cobrables (escritos a mano: necesitan especificidad narrativa) ---- */
      // Cobrables: plata de algo ya entregado que quedó sin cobrar. Solo servicios y productos:

      // estados de seguimiento (decisión JP, 18/ago): V1 solo muestra cuánto falta, no persigue.

      const RECV_BASE = [

        { id: 'R-160', client: 'Matías Herrera', phone: '11 3771-9008', origin: 'producto', prod: 0, total: 61000, paid: 20000, staff: 2, date: '2026-08-02' },
        { id: 'R-161', client: 'Valeria Nieto', phone: '11 2098-4416', origin: 'servicio', svc: 1, total: 74000, paid: 30000, staff: 1, date: '2026-08-04' },
        { id: 'R-101', client: 'Micaela Torres', phone: '11 3345-0091', origin: 'servicio', svc: 'caro1', total: 156000, paid: 56000, staff: 0, date: '2026-06-18' },
        // Con seña y turno todavía por venir: el saldo entra el día del turno, no hay que perseguirlo.
        { id: 'R-170', client: 'Emilia Castro', phone: '11 6014-2277', origin: 'servicio', svc: 'caro0', total: 138000, paid: 55000, staff: 2, date: '2026-08-07' },
        { id: 'R-171', client: 'Julián Sosa', phone: '11 4489-3310', origin: 'servicio', svc: 'largo', total: 96000, paid: 38000, staff: 3, date: '2026-08-12' },
        { id: 'R-172', client: 'Renata Aguirre', phone: '11 2233-7781', origin: 'servicio', svc: 2, total: 68000, paid: 27000, staff: 1, date: '2026-08-19' },
      ];
      let RECV = [];
      // Orígenes que PUEDEN dejar saldo. Cursos online y gift cards no están: se cobran 100% por
      // adelantado, así que no generan cobrable (regla JP 17/ago).
      const ORIGIN_LABEL = { servicio: 'Servicio', producto: 'Producto' };

      /* ---- Historial de cierres de caja ----
         Se deriva del ledger (efectivo esperado de cada día cerrado) en vez de ser una lista
         fija, para que el rango de fechas de arriba tenga de dónde agarrar en cualquier período.
         Las diferencias son las pocas escritas a mano: necesitan un motivo con sentido. */
      const SESSION_DIFFS = {
        '2026-08-02': [-2500, 'Vuelto mal dado en el último turno'],
        '2026-07-31': [3500, 'Sobró: una propina que entró a la caja'],
        '2026-07-28': [-6400, 'Faltante · no se identificó el motivo'],
        '2026-07-18': [-1900, 'Diferencia menor, no se identificó'],
        '2026-07-09': [2100, 'Sobró: la clienta redondeó para arriba'],
        '2026-06-26': [-4300, 'Compra de insumos sin ticket, cargada al otro día'],
        '2026-06-13': [1800, 'Sobró: vuelto que la clienta no se llevó'],
      };
      const CLOSED_TODAY = []; // cierres hechos en vivo desde el prototipo
      function sessionsIn(range) {
        const out = [];
        let d = range.from;
        while (dDiff(d, range.to) >= 0) {
          if (dDiff(d, TODAY) > 0 && parse(d).getDay() !== 0) {
            const day = MOVS.filter((m) => m.date === d);
            const inn = sum(day.filter((m) => m.dir === 'in' && m.method === 'ef' && m.st === 'ok'));
            const out_ = sum(day.filter((m) => m.dir === 'out' && m.account === 'caja'));
            const exp = OPENING + inn - out_;
            const df = SESSION_DIFFS[d];
            const n = parse(d).getDate();
            out.push({
              date: d, exp, cnt: exp + (df ? df[0] : 0), why: df ? df[1] : undefined,
              from: '08:' + String(35 + (n % 5) * 5).padStart(2, '0'),
              to: (19 + (n % 2)) + ':' + String((n * 7) % 60).padStart(2, '0'),
            });
          }
          d = addD(d, 1);
        }
        CLOSED_TODAY.forEach((c) => { if (c.date >= range.from && c.date <= range.to) out.push(c); });
        return out.reverse();
      }


      /* =====================================================================
         3 · ESTADO + DERIVACIONES
      ===================================================================== */
      // Mismos presets que el CalendarDatePicker de producción, más el rango a medida.
      // La semana arranca el lunes (locale AR), igual que el MONDAY_THIS_WEEK de Flash.
      const LUNES = addD(TODAY, -((parse(TODAY).getDay() + 6) % 7));
      const RANGES = {
        hoy: { label: 'Hoy', from: TODAY, to: TODAY },
        ayer: { label: 'Ayer', from: addD(TODAY, -1), to: addD(TODAY, -1) },
        d7: { label: 'Últimos 7 días', from: addD(TODAY, -6), to: TODAY },
        d30: { label: 'Últimos 30 días', from: addD(TODAY, -29), to: TODAY },
        mes: { label: 'Mes actual', from: '2026-08-01', to: TODAY },
        jul: { label: 'Mes anterior', from: '2026-07-01', to: '2026-07-31' },
        semana: { label: 'Semana actual', from: LUNES, to: TODAY },
        semanaAnt: { label: 'Semana anterior', from: addD(LUNES, -7), to: addD(LUNES, -1) },
        custom: { label: 'Personalizado', from: addD(TODAY, -29), to: TODAY },
      };
      const PRESETS = ['hoy', 'ayer', 'd7', 'd30', 'semana', 'semanaAnt', 'mes', 'jul'];
      const S = { container: 'finanzas', tab: 'resumen', range: 'd30', persona: 'venue', staff: 'all', dist: 'cobrado', sub: {}, cobPage: 1, cobQ: '', cobMethod: 'all', comF: { q: '', tipo: 'all', concepto: 'all' }, movF: { q: '', method: 'all', asset: 'all', concepto: 'all' }, movSort: { k: 'date', dir: -1 }, movPage: 1, cobF: { q: '', origin: 'all', concepto: 'all' }, cobConcepto: 'all', gasConcepto: 'all', open: null };

      const inRange = (m, r) => m.date >= r.from && m.date <= r.to;
      // Los filtros de medio, tipo de venta, profesional y origen son multi-select: el valor es
      // 'all' o un array de claves elegidas.
      const inSel = (sel, v) => sel === 'all' || (Array.isArray(sel) && sel.includes(v));
      function scope() {
        const r = RANGES[S.range];
        // Resumen, Gastos y Resultado son vistas del negocio entero. Si alguien llega desde
        // una tabla filtrada por profesional, ese filtro puede seguir en el estado pero no
        // debe contaminar vistas que ni siquiera lo exponen.
        const ignoraProfesional = ['resumen', 'gastos', 'resultado'].includes(S.tab);
        return MOVS.filter((m) => inRange(m, r) && (ignoraProfesional || inSel(S.staff, m.staff)));
      }
      // Un movimiento existe solo si la plata se movió: en Ágora un pago está confirmado o
      // devuelto. Los estados que NO mueven plata (pendiente, no pagado, cancelado) no generan fila.
      const income = (ms) => ms.filter((m) => m.dir === 'in' && m.st === 'ok');
      const refunds = (ms) => ms.filter((m) => m.dir === 'out' && m.asset === 'refund');
      const expenses = (ms) => ms.filter((m) => m.dir === 'out' && m.asset === 'gasto');
      const sum = (ms) => ms.reduce((s, m) => s + m.amount, 0);

      function byKey(ms, k) {
        const o = {};
        ms.forEach((m) => { const v = m[k] || '—'; o[v] = (o[v] || 0) + m.amount; });
        return Object.entries(o).sort((a, b) => b[1] - a[1]);
      }

      /* ---- Cobranzas derivadas ---- */
      const saldoOf = (r) => r.total - r.paid;
      // V1 no da seguimiento de cobranzas (decisión JP, 18/ago): no hay fecha de vencimiento,
      // ni estados, ni recordatorios. Un cobrable es simplemente plata que falta entrar.
      // Solo estos dos pueden dejar saldo. Cursos, capacitaciones, descargables y gift cards se
      // cobran 100% online por adelantado: sin pago no hay acceso, así que nunca quedan a medias.
      const ORIGENES_CON_SALDO = ['servicio', 'producto'];
      const activeRecv = () => RECV.filter((r) => saldoOf(r) > 0 && ORIGENES_CON_SALDO.includes(r.origin));
      // Índice cobrable → venta: la fila de Ventas muestra cuánto falta de ESA venta.
      const recvOf = (m) => (m.recv ? RECV.find((r) => r.id === m.recv) : null);
      const pendDe = (m) => { const r = recvOf(m); return r ? saldoOf(r) : 0; };
      // Lo que falta cobrar de ventas HECHAS en el período, como pseudo-movimientos. Es la
      // diferencia entre "todo lo vendido" y "solo lo cobrado": misma venta, plata que todavía
      // no entró. No tiene medio de pago todavía, por eso va a un bucket propio ('pend').
      const pendRows = () => activeRecv()
        .filter((r) => inRange(r, RANGES[S.range]))
        .map((r) => ({ amount: saldoOf(r), method: 'pend', asset: r.origin, staff: r.staff,
          concept: r.concept, client: r.client, dir: 'in', st: 'ok' }));


      /* ---- Sesión de caja de hoy ---- */
      // La caja tiene dos estados. Arranca abierta para que se vea el flujo completo, pero al
      // cerrarla la vista pasa al estado "cerrada", que explica qué implica volver a abrirla.
      let CAJA_ABIERTA = true;
      let APERTURA = { hora: '08:45' };
      let OPENING = 60000;
      const sessionStart = TODAY;
      const EXTRA = []; // paid-in / paid-out cargados en vivo desde el prototipo
      const extraIn = () => EXTRA.filter((e) => e.dir === 'in').reduce((s, e) => s + e.amount, 0);
      const extraOut = () => EXTRA.filter((e) => e.dir === 'out').reduce((s, e) => s + e.amount, 0);
      function arqueo() {
        const today = MOVS.filter((m) => m.date === TODAY);
        const cobrosEf = sum(today.filter((m) => m.dir === 'in' && m.method === 'ef' && m.st === 'ok'));
        const gastosEf = sum(today.filter((m) => m.dir === 'out' && m.account === 'caja'));
        const esperado = OPENING + cobrosEf + extraIn() - gastosEf - extraOut();
        return { cobrosEf, gastosEf, esperado, today };
      }

      // Parte un rango en columnas mensuales, recortadas al rango en las puntas.
      // `full` marca si la columna cubre el mes calendario entero.
      function monthCols(r) {
        const out = [];
        let d = r.from;
        while (dDiff(d, r.to) >= 0) {
          const dt = parse(d), y = dt.getFullYear(), mo = dt.getMonth();
          const mStart = `${y}-${String(mo + 1).padStart(2, '0')}-01`;
          const last = new Date(y, mo + 1, 0).getDate();
          const mEnd = `${y}-${String(mo + 1).padStart(2, '0')}-${String(last).padStart(2, '0')}`;
          const from = mStart < r.from ? r.from : mStart;
          const to = mEnd > r.to ? r.to : mEnd;
          const full = from === mStart && to === mEnd;
          const l = from === to ? fD(from) : full ? MESL[mo] : `${MESL[mo]} (${parse(from).getDate()}–${parse(to).getDate()})`;
          out.push({ from, to, full, l });
          d = addD(mEnd, 1);
        }
        return out;
      }

      /* =====================================================================
         4 · CHARTS
      ===================================================================== */
      function groupedBars(days, opts) {
        // viewBox escalado uniformemente (nada de preserveAspectRatio="none": deformaba los
        // labels de los ejes). Unidades pensadas para renderizar ~1:1.4 respecto del ancho real.
        // opts.single = una sola serie (sin comparación ni neto). opts.fmt = formateador de valor:
        // el chart también lo usa Analítica, donde el eje son reservas, no pesos.
        const fmt = opts.fmt || $$;
        const fmtAx = opts.fmtAx || $k;
        const W = 1000, H = 300, PL = opts.single ? 52 : 74, PR = 10, PT = 14, PB = 34;
        const max = Math.max(1, ...days.map((d) => Math.max(d.a, d.b)));
        const step = Math.pow(10, Math.floor(Math.log10(max)));
        const top = Math.ceil(max / (step / 2)) * (step / 2);
        const iw = W - PL - PR, ih = H - PT - PB;
        const bw = iw / days.length;
        const gap = Math.min(3, bw * 0.12);
        const barW = opts.single ? Math.max(2, bw - gap * 2) : Math.max(2, (bw - gap * 3) / 2);
        let g = '';
        for (let i = 0; i <= 4; i++) {
          const y = PT + ih - (ih * i) / 4;
          g += `<line class="gl" x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}"/><text class="ax" x="${PL - 12}" y="${y + 6}" text-anchor="end">${fmtAx((top * i) / 4)}</text>`;
        }
        let b = '';
        days.forEach((d, i) => {
          const x = PL + i * bw + gap;
          const ha = (d.a / top) * ih, hb = (d.b / top) * ih;
          const tip = opts.single
            ? `<b>${fDL(d.date)}</b><div class="l"><i style="background:${opts.ca}"></i>${opts.la}<em>${fmt(d.a)}</em></div>`
            : `<b>${fDL(d.date)}</b><div class="l"><i style="background:${opts.ca}"></i>${opts.la}<em>${fmt(d.a)}</em></div><div class="l"><i style="background:${opts.cb}"></i>${opts.lb}<em>${fmt(d.b)}</em></div><div class="l" style="border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:6px">Neto<em>${fmt(d.a - d.b)}</em></div>`;
          const t = esc(tip);
          if (d.a > 0) b += `<rect class="bar" x="${x}" y="${PT + ih - ha}" width="${barW}" height="${Math.max(1.5, ha)}" rx="${Math.min(3, barW / 2)}" fill="${opts.ca}" data-t="${t}"/>`;
          if (d.b > 0) b += `<rect class="bar" x="${x + barW + gap}" y="${PT + ih - hb}" width="${barW}" height="${Math.max(1.5, hb)}" rx="${Math.min(3, barW / 2)}" fill="${opts.cb}" data-t="${t}"/>`;
          const dt = parse(d.date);
          const showLbl = days.length <= 10 || dt.getDate() === 1 || dt.getDate() % (days.length > 40 ? 10 : 5) === 0;
          if (showLbl) b += `<text class="ax" x="${x + bw / 2 - gap}" y="${H - 8}" text-anchor="middle">${dt.getDate()} ${MES[dt.getMonth()]}</text>`;
        });
        return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${b}</svg></div>`;
      }


      /* =====================================================================
         5 · COMPONENTES REUTILIZABLES
      ===================================================================== */
      const avatarFor = (name, hex) => `<div class="av" style="background:color-mix(in srgb, ${hex} 16%, #fff);color:color-mix(in srgb, ${hex} 78%, #0F172A)">${esc((name || '—').trim()[0] || '—')}</div>`;
      const iniciales = (n) => (n || '—').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      // El ícono vuelve como clave semántica compacta —no como decoración— y toma los tonos
      // que cada llamador ya definía para ingreso, alerta, gasto y resultado.
      function statTile(o) {
        const tag = o.go ? 'button' : 'div';
        return `<${tag} ${o.go ? 'type="button"' : ''} class="card tight stat noico ${o.go ? 'clickable' : ''}" ${o.go ? `onclick="${o.go}"` : ''}>
          ${o.ic ? `<span class="statmark" aria-hidden="true" style="background:${o.bg};color:${o.fg}">${o.ic}</span>` : ''}
          <div class="k">${o.k}</div>
          <div class="v"${o.metric ? ` data-metric="${esc(o.metric)}" data-money="${Number(o.raw) || 0}"` : ''}>${o.v}</div><div class="s">${o.s}</div></${tag}>`;
      }


      function methodTag(k) {
        const m = METHODS[k];
        if (k === 'mp') return `<span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;color:var(--f-ink)">${MP_LOGO}Mercado Pago</span>`;
        return `<span style="display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;color:var(--f-ink)"><i style="width:8px;height:8px;border-radius:3px;background:${m.color};display:block;flex:0 0 8px"></i>${m.short}</span>`;
      }

      // Barra segmentada de proporción + filas rankeadas. La barra de arriba muestra el reparto
      // completo de un vistazo; las filas, el detalle ordenado.
      function propBar(rows, colorOf) {
        const tot = rows.reduce((s2, r) => s2 + r[1], 0) || 1;
        return `<div class="propbar">${rows.map((r) => {
          const w = (r[1] / tot) * 100;
          return w < 0.6 ? '' : `<span style="width:${w}%;background:${colorOf ? colorOf(r[0]) : 'var(--f-brand)'}" title="${esc(String(r[0]))}"></span>`;
        }).join('')}</div>`;
      }

      /* REGLA — El agrupamiento POR SUCURSAL solo aplica con MÁS DE UNA sede activa.
         Con un solo local el corte devuelve una fila con el 100% y una segunda de lo vendido
         online: no dice nada que no diga el total. La sucursal sale del profesional que
         atendió, porque cada uno trabaja en una sede; lo que se vende online (cursos, gift
         cards, descargables) no pasa por ninguna y va a su propio bucket. */
      const variasSedes = () => V_().sedes.length > 1;
      const SIN_SEDE = 'Online · sin sucursal';
      function sedeDe(st) {
        if (!st) return SIN_SEDE;
        const sedes = V_().sedes;
        const i = Math.max(0, STAFF.indexOf(st));
        return sedes[Math.min(sedes.length - 1, Math.floor(i / Math.ceil(STAFF.length / sedes.length)))];
      }
      function bySede(rows) {
        const by = {};
        rows.forEach((m) => { const k = sedeDe(m.staff); by[k] = (by[k] || 0) + m.amount; });
        return Object.entries(by).sort((a, b) => b[1] - a[1]);
      }

      // Ranking completo por concepto. El corte por tipo de venta dice "Servicios 63%"; este
      // dice CUÁL servicio, que es lo que se puede accionar (precio, agenda, promo). No se
      // recorta: la card scrollea, así que los adicionales quedan alcanzables.
      function concentracion(inc) {
        const by = {};
        inc.forEach((m) => { by[m.concept] = (by[m.concept] || 0) + m.amount; });
        return Object.entries(by).sort((a, b) => b[1] - a[1]);
      }

      function barsList(rows, opts) {
        const tot = rows.reduce((s2, r) => s2 + r[1], 0) || 1;
        const max = Math.max(1, ...rows.map((r) => r[1]));
        const colorOf = opts.colorOf || (() => 'var(--f-brand)');
        return `${opts.prop ? propBar(rows, opts.colorOf) : ''}<div class="barsbox"><div class="bars" onscroll="marcarScroll(this)">${rows.map((r) => {
          const color = colorOf(r[0]);
          const pct = (r[1] / tot) * 100;
          const rank = (r[1] / max) * 100;
          const action = opts.go ? opts.go(r[0]) : '';
          const tag = action ? 'button' : 'div';
          return `<${tag} ${action ? 'type="button"' : ''} class="row" data-bar-key="${esc(String(r[0]))}" ${action ? `onclick="${action}"` : ''}>
            <div class="meter">
              <div class="name">${opts.dot ? `<i style="background:${color}"></i>` : ''}${esc(opts.labelOf ? opts.labelOf(r[0]) : r[0])}</div>
              <div class="track"><div class="fill" data-rank="${Math.max(1.5, rank)}" style="width:${Math.max(1.5, rank)}%;background:${color}"></div></div>
            </div>
            <div class="val">${$$(r[1])}<em>${pc(r[1], tot)}%</em></div></${tag}>`;
        }).join('')}</div><span class="fade"></span><span class="more"></span></div>`;
      }

      /* ---------------- SCROLL INFINITO EN TABLAS ----------------
         Un centinela al final de la lista: cuando entra en el viewport del contenedor que
         scrollea, se carga el siguiente tramo. Sin botón, y sin traer todo de una. */
      function masFilas(mostradas, total, campo) {
        if (mostradas >= total) return '';
        return `<div class="loadmore" data-page="${campo}">
          <span class="spin"></span>Cargando más… <b>${mostradas}</b> de ${total}
        </div>`;
      }
      let IO = null;
      function bindInfinito() {
        if (IO) IO.disconnect();
        const sent = document.querySelector('.loadmore');
        if (!sent) return;
        const root = sent.closest('.tblwrap') || null;
        IO = new IntersectionObserver((ents) => {
          ents.forEach((e2) => {
            if (!e2.isIntersecting) return;
            const campo = sent.dataset.page;
            S[campo]++;
            IO.disconnect();
            render();
          });
        }, { root, rootMargin: '80px' });
        IO.observe(sent);
      }

      // El degradado y el contador solo aparecen si de verdad quedó contenido abajo.
      function marcarScroll(bars) {
        const box = bars.parentElement;
        const oculto = bars.scrollHeight - bars.clientHeight - bars.scrollTop;
        box.classList.toggle('hay-mas', oculto > 8);
        const more = box.querySelector('.more');
        if (!more) return;
        const alto = bars.firstElementChild ? bars.firstElementChild.offsetHeight : 1;
        const faltan = Math.round(oculto / alto);
        more.textContent = faltan > 0 ? `${faltan} más` : '';
      }
      function marcarScrolls() { document.querySelectorAll('.barsbox .bars').forEach(marcarScroll); }

      /* =====================================================================
         6 · VISTAS
      ===================================================================== */
      const TABS = [
        { k: 'resumen', l: 'Resumen' },
        { k: 'movimientos', l: 'Ventas' },
        { k: 'cobranzas', l: 'Ventas por cobrar' },
        { k: 'cobros', l: 'Ventas cobradas' },
        { k: 'gastos', l: 'Gastos' },
        { k: 'comisiones', l: 'Comisiones del equipo' },
        { k: 'resultado', l: 'Resultado' },
        { k: 'arqueo', l: 'Gestión de caja' },
      ];
      /* REGLA — Comisiones es una sección de EQUIPO.
         Existe solo si el negocio tiene profesionales cargados: un profesional independiente
         se cobra a sí mismo, no liquida a nadie. Lo mismo vale para todo agrupamiento POR
         PROFESIONAL (la columna en las tablas, el corte del Resumen, las tarjetas): sin
         equipo hay una sola persona y el corte no informa nada.
         En producción esto se resuelve con `is_venue` + el add-on `revenue_share_enabled`;
         acá lo aproxima `S.persona === 'venue'`. */
      const conEquipo = () => S.persona === 'venue' && STAFF.length > 1;

      /* REGLA — EMPAQUETADO (decisión JP, 26/ago).
         El add-on que hoy se vende como "Comisiones de equipo" pasa a incluir TRES secciones:
         Gastos · Comisiones del equipo · Resultado. Sin el add-on, Finanzas queda en lo que
         entra —Resumen, Ventas, Ventas por cobrar, Cobros—; con el add-on suma lo que sale y
         lo que queda. **Gestión de caja sigue siendo un add-on aparte.**
         `conAddon()` es el gate comercial y `conEquipo()` el estructural: Comisiones necesita
         los dos (podés pagar el add-on y no tener equipo), Gastos y Resultado solo el primero.
         OJO: el gate NO cuelga de la persona. Un profesional independiente también puede
         comprar el add-on —tiene gastos y tiene resultado—, solo que no liquida a nadie. Acá
         el prototipo muestra el add-on activo (es lo que se está diseñando); el día que haya
         que mostrar la versión sin add-on, `conAddon()` es el único lugar a tocar. */
      const PACK = ['gastos', 'comisiones', 'resultado'];
      const conAddon = () => true;
      const tabsVisibles = () => TABS.filter((t) => {
        if (t.k === 'comisiones') return conAddon() && conEquipo();
        if (PACK.includes(t.k)) return conAddon();
        return true;
      });
      // Tabs de los otros dos containers tocados por la propuesta (mockups, no navegables por dentro).
      const TABS_ACT = [
        { k: 'reservas', l: 'Reservas' },
        { k: 'entradas', l: 'Entradas' },
        { k: 'cursos', l: 'Cursos online' },
        { k: 'productos', l: 'Productos' },
      ];

      /* ---------------- CURVA DEL SALDO DE COMISIONES ----------------
         Un solo trazo: el saldo pendiente día a día. Sube con lo que se devenga y cae de
         golpe en cada liquidación, que es justo el impacto que se quiere ver. Una sola
         serie ⇒ sin caja de leyenda para la línea; los puntos de liquidación sí se rotulan.
         Nada de doble eje: todo está en pesos. */
      function curvaComisiones(r, sel) {
        const quienes = sel === 'all' ? STAFF : STAFF.filter((st) => inSel(sel, st));
        if (!quienes.length) return null;

        // Saldo al arrancar el período: todo lo devengado antes menos todo lo pagado antes.
        let saldo = quienes.reduce((acc, st) => acc
          + devengado(st, FROM, addD(r.from, -1)) + ajustes(st, FROM, addD(r.from, -1))
          - sum(MOVS.filter((m) => m.staffPay === st && m.date < r.from)), 0);

        const dias = [];
        let d = r.from;
        while (dDiff(d, r.to) >= 0) { dias.push(d); d = addD(d, 1); }
        if (dias.length < 2) return null;

        const pts = dias.map((day) => {
          const dev = quienes.reduce((acc, st) => acc + devengado(st, day, day) + ajustes(st, day, day), 0);
          const pag = sum(MOVS.filter((m) => m.date === day && quienes.includes(m.staffPay)));
          saldo = saldo + dev - pag;
          return { day, v: Math.max(0, Math.round(saldo)), pag };
        });

        // Sin columna de valores a la izquierda: el número que importa está rotulado sobre
        // el último punto y el resto sale del tooltip. Las guías solas ya dan la escala.
        // En un teléfono el mismo viewBox deja la curva aplastada y los rótulos ilegibles:
        // más alto relativo, menos rótulos y trazos más gruesos.
        const angosto = window.innerWidth <= 760;
        const W = angosto ? 380 : 960, H = angosto ? 250 : 210;
        const PL = angosto ? 4 : 10, PR = angosto ? 6 : 16, PT = angosto ? 14 : 28, PB = angosto ? 30 : 28;
        const max = Math.max(...pts.map((p) => p.v)) || 1;
        const tope = Math.ceil(max / 1e6) * 1e6 || max;
        const x = (i) => PL + (i / (pts.length - 1)) * (W - PL - PR);
        const y = (v) => PT + (1 - v / tope) * (H - PT - PB);

        const linea = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
        const area = `${linea} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;

        // Ejes: 4 líneas de referencia, recesivas, con el valor a la izquierda.
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => {
          const v = tope * f;
          return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" stroke="var(--f-hair)" stroke-width="1"/>`;
        }).join('');

        const cadaX = Math.max(1, Math.round(pts.length / (angosto ? 4 : 7)));
        // El último siempre se rotula, pero si el anterior le queda encima, ese se saltea.
        const ultimoRot = pts.length - 1;
        const chocan = ultimoRot % cadaX !== 0 && (ultimoRot - Math.floor(ultimoRot / cadaX) * cadaX) < cadaX * 0.55;
        const xlab = pts.map((p, i) => ((i % cadaX === 0 && !(chocan && i === Math.floor(ultimoRot / cadaX) * cadaX)) || i === ultimoRot)
          ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}" class="ax" style="font-size:${angosto ? 11 : 10}px">${fD(p.day)}</text>` : '').join('');

        const liqs = pts.map((p, i) => p.pag > 0
          ? `<g><line x1="${x(i).toFixed(1)}" y1="${PT}" x2="${x(i).toFixed(1)}" y2="${y(0)}" stroke="var(--f-coral)" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
             <circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${angosto ? 5 : 5}" fill="var(--f-coral)" stroke="var(--f-card)" stroke-width="2"/></g>` : '').join('');

        const hover = pts.map((p, i) => {
          const w = (W - PL - PR) / (pts.length - 1);
          const txt = `${fDL(p.day)} · saldo ${$$(p.v)}${p.pag ? ` · liquidaste ${$$(p.pag)}` : ''}`;
          return `<rect x="${(x(i) - w / 2).toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${(y(0) - PT).toFixed(1)}" fill="transparent" class="hz"
            onmouseenter="tipOn(event, ${jsStr(txt)})" onmousemove="tipMove(event)" onmouseleave="tipOff()"></rect>`;
        }).join('');

        const ult = pts[pts.length - 1];
        return {
          saldo: ult.v,
          pagos: pts.filter((p) => p.pag > 0).length,
          totalPagado: pts.reduce((a2, p) => a2 + p.pag, 0),
          svg: `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Evolución del saldo de comisiones sin liquidar">
            <defs><linearGradient id="gcom" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--f-brand)" stop-opacity=".18"/>
              <stop offset="100%" stop-color="var(--f-brand)" stop-opacity="0"/></linearGradient></defs>
            ${ticks}
            <path d="${area}" fill="url(#gcom)"/>
            <path d="${linea}" fill="none" stroke="var(--f-brand)" stroke-width="${angosto ? 2.2 : 2}" stroke-linejoin="round" stroke-linecap="round"/>
            ${liqs}
            <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(ult.v).toFixed(1)}" r="4" fill="var(--f-brand)" stroke="var(--f-card)" stroke-width="2"/>
            ${xlab}${hover}
          </svg></div>`,
        };
      }

      /* ---------------- FILTROS EN LA CABECERA DE LA TABLA ----------------
         Las dimensiones categóricas (tipo, medio, profesional, origen) se filtran donde se
         leen: en la columna. El popover es uno solo, `position:fixed` y colgado del body,
         porque la tabla vive dentro de un contenedor con overflow que lo recortaría.
         Ordenar queda para las columnas donde ordenar sirve (fecha, cliente, monto). */
      let COLF = null;

      function thF(k, label, extra) {
        const d = fieldDefs()[k];
        if (!d) return '';
        const n = d.v === 'all' || !Array.isArray(d.v) ? 0 : d.v.length;
        return `<th class="colf ${extra || ''} ${n ? 'on' : ''}" data-colf="${k}" onclick="toggleColF('${k}')" title="Filtrar por ${esc(d.l.toLowerCase())}">
          <span class="cf">
            <svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.4V19l-3.6-2v-4.6z"/></svg>
            ${esc(label)}${n ? `<em>${n}</em>` : ''}
            <svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </th>`;
      }

      /* El buscador por cliente es un filtro más de la tabla, así que vive donde se lee:
         en la cabecera de la columna Cliente, con el mismo popover que el resto. */
      function thS(k, label, extra) {
        const d = fieldDefs()[k];
        if (!d) return '';
        return `<th class="colf ${extra || ''} ${d.v ? 'on' : ''}" data-colf="${k}" onclick="toggleColF('${k}')" title="Buscar por ${esc(label.toLowerCase())}">
          <span class="cf">
            <svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            ${esc(label)}${d.v ? '<em>1</em>' : ''}
            <svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </th>`;
      }

      // Cada tecla re-renderiza la tabla, así que hay que devolverle el foco y el cursor
      // al input nuevo para poder seguir escribiendo.
      function buscarColF(k, v) {
        const viejo = document.querySelector('#colpop input');
        const pos = viejo ? viejo.selectionStart : null;
        fieldDefs()[k].set(v);
        render(); pintarColF();
        const nuevo = document.querySelector('#colpop input');
        if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(pos == null ? nuevo.value.length : pos, pos == null ? nuevo.value.length : pos); }
      }

      function toggleColF(k) { COLF = COLF === k ? null : k; pintarColF(); }

      function pickColF(k, v) {
        const d = fieldDefs()[k];
        if (!d.multi) { d.set(v); COLF = null; render(); pintarColF(); return; }
        if (v === 'all') { d.set('all'); render(); pintarColF(); return; }
        const cur = d.v === 'all' ? [] : d.v.slice();
        const i = cur.indexOf(v);
        if (i >= 0) cur.splice(i, 1); else cur.push(v);
        d.set(cur.length ? cur : 'all');
        render(); pintarColF();
      }

      function colPos(anchor, box, w) {
        const r = anchor.getBoundingClientRect();
        box.style.width = w + 'px';
        box.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)) + 'px';
        // La dirección es parte de la afordancia: siempre baja desde la cabecera. Si el
        // listado es largo, scrollea adentro en el espacio disponible en vez de saltar hacia
        // arriba y quedar cortado por el borde del viewport.
        box.style.top = (r.bottom + 6) + 'px';
        box.style.maxHeight = Math.max(72, window.innerHeight - r.bottom - 18) + 'px';
      }

      function pintarColF() {
        const box = el('colpop');
        const anchor = COLF && document.querySelector(`[data-colf="${COLF}"]`);
        if (!COLF || !anchor) { box.classList.remove('on'); COLF = null; return; }
        const d = fieldDefs()[COLF];
        if (d.type === 'text') {
          box.innerHTML = `<div class="cp-q">
            <div class="tsearch ${d.v ? 'on' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
              <input type="text" value="${esc(d.v)}" placeholder="${esc(d.ph || 'Buscar')}" oninput="event.stopPropagation();buscarColF('${COLF}', this.value)" onclick="event.stopPropagation()" />
              ${d.v ? `<button class="tx" title="Limpiar" onclick="event.stopPropagation();buscarColF('${COLF}', '')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>` : ''}
            </div></div>`;
          box.classList.add('on');
          colPos(anchor, box, 268);
          const inp = box.querySelector('input');
          if (inp && document.activeElement !== inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
          return;
        }
        const activo = d.v !== 'all' && Array.isArray(d.v) && d.v.length;
        box.innerHTML = `
          <div class="cp-h">${esc(d.l)}${activo ? `<button class="cp-x" onclick="event.stopPropagation();pickColF('${COLF}','all')">Limpiar</button>` : ''}</div>
          <div class="cp-b">${(() => {
            let ult = null;
            return (d.multi ? [['all', d.allLabel]] : []).concat(d.o).map(([v, l, g]) => {
              const on = d.multi ? (v === 'all' ? d.v === 'all' : inSel(d.v, v) && d.v !== 'all') : d.v === v;
              const cab = g && g !== ult ? `<div class="fopt-g">${esc(g)}</div>` : '';
              ult = g || ult;
              return cab + `<button class="fopt ${on ? 'on' : ''}" onclick="event.stopPropagation();pickColF('${COLF}', ${jsStr(v)})"><span>${l}</span>${on ? ICO.check : ''}</button>`;
            }).join('');
          })()}</div>
          ${d.multi ? `<div class="cp-f"><button class="btn pri sm" onclick="event.stopPropagation();COLF=null;pintarColF()">Listo</button></div>` : ''}`;
        box.classList.add('on');
        colPos(anchor, box, Math.max(210, Math.min(280, box.offsetWidth || 240)));
      }
      window.addEventListener('scroll', () => { if (COLF) pintarColF(); }, true);
      window.addEventListener('resize', () => { if (COLF) pintarColF(); });
      document.addEventListener('click', (e) => {
        if (DP && !e.target.closest('.dpwrap')) { DP = false; render(); }
        if (!COLF) return;
        if (e.target.closest('#colpop') || e.target.closest('[data-colf]')) return;
        COLF = null; pintarColF();
      });

      /* ---------------- SELECTOR DE FECHAS ----------------
         Espeja el CalendarDatePicker de producción: barra ancha con el rango elegido y,
         al abrirla, atajos a la izquierda y calendario a la derecha. El rango a medida se
         arma con dos clicks (desde / hasta) y queda guardado en RANGES.custom. */
      let DP = false, DPMES = TODAY.slice(0, 7), DPINI = null;

      function toggleDP() {
        DP = !DP;
        if (DP) { DPMES = mesMas(RANGES[S.range].to.slice(0, 7), -1); DPINI = null; if (chico()) abrirPickerFull(); }
        render();
      }
      function pickPreset(k) { S.range = k; S.movPage = 1; S.cobPage = 1; DP = false; renderFinanceUpdate('period'); }
      function mesDP(n) {
        const [y, m] = DPMES.split('-').map(Number);
        const d = new Date(Date.UTC(y, m - 1 + n, 1));
        DPMES = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
        render();
      }
      function pickDia(day) {
        if (!DPINI || day < DPINI) { DPINI = day; render(); return; }
        RANGES.custom = { label: 'Personalizado', from: DPINI, to: day };
        S.range = 'custom'; S.movPage = 1; S.cobPage = 1; DPINI = null; DP = false; renderFinanceUpdate('period');
      }

      // Dos meses juntos: armar un rango que cruza el cambio de mes no debería obligar
      // a navegar en el medio de la selección.
      const mesMas = (mes, n) => {
        const [y2, m2] = mes.split('-').map(Number);
        const d = new Date(Date.UTC(y2, m2 - 1 + n, 1));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
      };
      function calendarioDP() {
        return `<div class="dpcals">
          ${mesDPHTML(DPMES, 'izq')}${mesDPHTML(mesMas(DPMES, 1), 'der')}
          <p class="dphint">${DPINI ? `Desde el <b>${fDL(DPINI)}</b> — elegí el día de cierre.` : 'Clickeá el primer día y después el último para armar un rango a medida.'}</p>
        </div>`;
      }
      function mesDPHTML(DPMES, lado) {
        const [y, m] = DPMES.split('-').map(Number);
        const primero = new Date(Date.UTC(y, m - 1, 1));
        const dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const offset = (primero.getUTCDay() + 6) % 7; // lunes primero
        const r = RANGES[S.range];
        const celdas = [];
        for (let i = 0; i < offset; i++) celdas.push('<span></span>');
        for (let d = 1; d <= dias; d++) {
          const day = `${DPMES}-${String(d).padStart(2, '0')}`;
          const futuro = day > TODAY;
          const enRango = !DPINI && day >= r.from && day <= r.to;
          const esIni = DPINI === day;
          celdas.push(`<button class="dpd ${enRango ? 'in' : ''} ${esIni ? 'ini' : ''} ${day === r.from || day === r.to ? 'bd' : ''}"
            ${futuro ? 'disabled' : `onclick="event.stopPropagation();pickDia('${day}')"`}>${d}</button>`);
        }
        const mesRaw = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        const nombreMes = mesRaw[0].toUpperCase() + mesRaw.slice(1);
        const flecha = (n, dis, lbl) => `<button ${dis ? 'disabled' : `onclick="event.stopPropagation();mesDP(${n})"`} aria-label="${lbl}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${n < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6'}"/></svg></button>`;
        return `<div class="dpcal">
          <div class="dpnav">
            ${lado === 'izq' ? flecha(-1, false, 'Mes anterior') : '<span></span>'}
            <b>${nombreMes}</b>
            ${lado === 'der' ? flecha(1, DPMES >= TODAY.slice(0, 7), 'Mes siguiente') : '<span></span>'}
          </div>
          <div class="dpdow">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div>
          <div class="dpgrid">${celdas.join('')}</div>
        </div>`;
      }

      function dateBar() {
        const r = RANGES[S.range];
        const nombre = PRESETS.includes(S.range) ? r.label : 'Rango a medida';
        return `<div class="dpwrap ${DP ? 'open' : ''}">
          <button class="dpbar" onclick="event.stopPropagation();toggleDP()">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span class="lb">${esc(nombre)}</span>
            <span class="rg">${fD(r.from)} <i>→</i> ${fD(r.to)}</span>
            <svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          ${DP && chico() ? pickerFull() : ''}
          ${DP && !chico() ? `<div class="dppop" onclick="event.stopPropagation()">
            <div class="dppresets">
              <p class="k">Atajos</p>
              ${PRESETS.map((k) => `<button class="${S.range === k ? 'on' : ''}" onclick="pickPreset('${k}')">${RANGES[k].label}</button>`).join('')}
            </div>
            ${calendarioDP()}
          </div>` : ''}
        </div>`;
      }

      /* ---------------- PICKER FULL SCREEN (mobile) ----------------
         En un teléfono el popover no entra: pasa a ser una hoja completa con los dos
         extremos del rango arriba, los atajos en una fila que scrollea y el footer con el
         resumen y las acciones. Acá los cambios se ACUMULAN y recién se aplican con el
         botón: tocar un día en un popover que se cierra solo es imposible de corregir. */
      const chico = () => window.innerWidth <= 760;
      let DPSEL = null;

      function abrirPickerFull() {
        const r = RANGES[S.range];
        DPSEL = { from: r.from, to: r.to };
        DPMES = mesMas(r.to.slice(0, 7), -1);
      }
      function pickDiaFull(day) {
        if (!DPSEL.from || DPSEL.to || day < DPSEL.from) DPSEL = { from: day, to: null };
        else DPSEL.to = day;
        render();
      }
      function presetFull(k) { const r = RANGES[k]; DPSEL = { from: r.from, to: r.to }; DPMES = mesMas(r.to.slice(0, 7), -1); render(); }
      function limpiarFecha() { presetFull('d30'); }
      function aplicarFecha() {
        if (!DPSEL.from) { toast('Elegí al menos un día'); return; }
        const from = DPSEL.from, to = DPSEL.to || DPSEL.from;
        const preset = PRESETS.find((k) => RANGES[k].from === from && RANGES[k].to === to);
        if (preset) S.range = preset;
        else { RANGES.custom = { label: 'Personalizado', from, to }; S.range = 'custom'; }
        S.movPage = 1; S.cobPage = 1; DP = false; renderFinanceUpdate('period');
      }

      function pickerFull() {
        if (!DPSEL) abrirPickerFull();
        const { from, to } = DPSEL;
        const dias = to ? dDiff(from, to) + 1 : 1;
        return `<div class="dpfull" onclick="event.stopPropagation()">
          <div class="dpf-h">
            <h3>Filtrar por fecha</h3>
            <button class="x" onclick="DP=false;render()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
          <div class="dpf-rango">
            <div class="dpf-campo ${!to ? 'on' : ''}"><span>Inicio</span><b>${fDL(from)}</b></div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
            <div class="dpf-campo ${to ? 'on' : ''}"><span>Fin</span><b>${to ? fDL(to) : '—'}</b></div>
          </div>
          <div class="dpf-presets">
            ${PRESETS.map((k) => `<button class="${RANGES[k].from === from && RANGES[k].to === to ? 'on' : ''}" onclick="presetFull('${k}')">${RANGES[k].label}</button>`).join('')}
          </div>
          <div class="dpf-cals">
            ${mesFullHTML(DPMES, 'izq')}${mesFullHTML(mesMas(DPMES, 1), 'der')}
          </div>
          <div class="dpf-f">
            <p class="dpf-res"><b>${dias} día${dias === 1 ? '' : 's'}</b> · del ${fDL(from)}${to && to !== from ? ` al ${fDL(to)}` : ''}</p>
            <div class="dpf-btns">
              <button class="btn" onclick="limpiarFecha()">Limpiar</button>
              <button class="btn pri" onclick="aplicarFecha()">Aplicar</button>
            </div>
          </div>
        </div>`;
      }

      function mesFullHTML(mes, lado) {
        const [y, m] = mes.split('-').map(Number);
        const primero = new Date(Date.UTC(y, m - 1, 1));
        const total = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const offset = (primero.getUTCDay() + 6) % 7;
        const { from, to } = DPSEL;
        const celdas = [];
        for (let i = 0; i < offset; i++) celdas.push('<span></span>');
        for (let d = 1; d <= total; d++) {
          const day = `${mes}-${String(d).padStart(2, '0')}`;
          const futuro = day > TODAY;
          const dentro = to ? day >= from && day <= to : day === from;
          const punta = day === from || day === to;
          celdas.push(`<button class="dpd ${dentro && !punta ? 'in' : ''} ${punta ? 'bd' : ''}"
            ${futuro ? 'disabled' : `onclick="event.stopPropagation();pickDiaFull('${day}')"`}>${d}</button>`);
        }
        const raw = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        const flecha = (n, dis, lbl) => `<button ${dis ? 'disabled' : `onclick="event.stopPropagation();mesDP(${n})"`} aria-label="${lbl}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${n < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6'}"/></svg></button>`;
        return `<div class="dpcal">
          <div class="dpnav">
            ${lado === 'izq' ? flecha(-1, false, 'Mes anterior') : '<span></span>'}
            <b>${raw[0].toUpperCase() + raw.slice(1)}</b>
            ${lado === 'der' ? flecha(1, mes >= TODAY.slice(0, 7), 'Mes siguiente') : '<span></span>'}
          </div>
          <div class="dpdow">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div>
          <div class="dpgrid">${celdas.join('')}</div>
        </div>`;
      }

      // String seguro para meter dentro de un onclick="..." del HTML.
      const jsStr = (v) => esc("'" + String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'");
      /* ---------------- RESUMEN ---------------- */
      function vResumen() {
        const ms = scope(), r = RANGES[S.range];
        const inc = income(ms), exp = expenses(ms), ref = refunds(ms);
        const bruto = sum(inc), gast = sum(exp), dev = sum(ref);
        const neto = bruto - dev - gast;
        // "Por cobrar" es el saldo abierto TOTAL (un balance, no un flujo), mientras que el
        // "sin cobrar" de Ventas totales es solo el de las ventas hechas EN el período. Los dos
        // números son correctos y distintos: acá se explicita la relación para que se vea la resta.
        const abiertos = activeRecv();
        const porCobrar = abiertos.reduce((s2, x) => s2 + saldoOf(x), 0);
        const pcAntes = abiertos.filter((x) => !inRange(x, r)).reduce((s2, x) => s2 + saldoOf(x), 0);

        // Ventas del período: lo que entró + lo que quedó abierto de esas mismas ventas.
        const pend = pendRows();
        const pendTot = sum(pend);
        const vendido = bruto + pendTot;

        // Las 3 tablas de distribución miran el mismo universo, elegido con el toggle.
        const vend = S.dist === 'vendido';
        const dist = vend ? inc.concat(pend) : inc;
        const dl = vend ? 'Ventas' : 'Cobros';
        const byMethod = byKey(dist, 'method');
        const byAsset = byKey(dist, 'asset');
        const byStaff = byKey(dist.filter((m) => m.staff), 'staff');
        const top = concentracion(dist);
        const bySed = conEquipo() && variasSedes() ? bySede(dist) : [];

        return `


        <div class="grid g5 statrow summary-cockpit sec" aria-label="Ventas totales y por cobrar como contexto. Cobrado menos gastos da el neto del período.">
          ${statTile({ k: 'Ventas totales', v: $$(vendido), raw: vendido, metric: 'vendido', s: pendTot ? `<b>${$$(pendTot)}</b> todavía sin cobrar` : 'Todo cobrado', ic: ICO.bag, bg: '#eef0ff', fg: '#4338ca', go: `go('movimientos')` })}
          ${statTile({ k: 'Cobrado', v: $$(bruto), raw: bruto, metric: 'cobrado', s: `<b>${inc.length}</b> cobro${inc.length === 1 ? '' : 's'} en el período`, ic: ICO.down, bg: '#e8fbf5', fg: '#07806a', go: `go('cobros')` })}
          ${statTile({ k: 'Por cobrar', v: $$(porCobrar), raw: porCobrar, metric: 'por-cobrar', s: pcAntes
            ? `<b>${$$(pendTot)}</b> de este período`
            : `${abiertos.length} cobrable${abiertos.length === 1 ? '' : 's'} abierto${abiertos.length === 1 ? '' : 's'}`, ic: ICO.alert, bg: '#fff2f3', fg: '#b3162a', go: `go('cobranzas')` })}
          ${statTile({ k: 'Gastos', v: $$(gast), raw: gast, metric: 'gastos', s: `<b>${exp.length}</b> gasto${exp.length === 1 ? '' : 's'} registrado${exp.length === 1 ? '' : 's'}`, ic: ICO.up, bg: '#fff2f3', fg: '#b3162a', go: `go('gastos')` })}
          ${statTile({ k: 'Neto del período', v: $$(neto), raw: neto, metric: 'neto', s: 'Cobrado menos gastos', ic: ICO.wallet, bg: '#eef6ff', fg: '#005cd4', go: `go('resultado')` })}
        </div>

        <div class="dhead">
          <div class="dh-t">Distribución de <b>${vend ? 'todo lo vendido' : 'solo lo cobrado'}</b>${vend && pendTot ? ` — incluye ${$$(pendTot)} que todavía no entraron` : ''}</div>
          <div class="lseg">
            <button class="${vend ? 'on' : ''}" onclick="setDist('vendido')">Todo lo vendido</button>
            <button class="${vend ? '' : 'on'}" onclick="setDist('cobrado')">Solo lo cobrado</button>
          </div>
        </div>

        <div class="grid g2 top sec summary-charts summary-primary">
          <div class="card">
            <h3>${dl} por medio</h3>
            <p class="cap">Qué medios de pago eligen tus clientes.</p>
            ${barsList(byMethod, { prop: true, colorOf: (k) => (METHODS[k] ? METHODS[k].color : 'var(--f-ink-whisper)'), labelOf: (k) => (METHODS[k] ? METHODS[k].label : 'Sin cobrar'), go: (k) => (METHODS[k] ? `goMov({method:['${k}']})` : `go('cobranzas')`) })}
          </div>
          <div class="card">
            <h3>${dl} por tipo de venta</h3>
            <p class="cap">${vend ? 'Qué vendiste en el período, esté cobrado o no.' : 'De qué tipo de venta vino la plata que entró. Solo lo cobrado.'}</p>
            ${barsList(byAsset, { labelOf: (k) => (ASSETS[k] ? ASSETS[k].label : k), go: (k) => `goMov({asset:['${k}']})` })}
          </div>
        </div>

        <div class="grid g2 top sec summary-charts summary-secondary">
          ${top.length ? `<div class="card">
            <h3>${dl} por concepto</h3>
            <p class="cap">${vend ? 'Todo lo vendido' : 'Solo lo cobrado'} del período por concepto.</p>
            ${barsList(top, { labelOf: (k) => k, go: (k) => `goMov({q:${jsStr(k)}})` })}
          </div>` : ''}
          ${conEquipo() && byStaff.length ? `<div class="card">
            <h3>${dl} por profesional</h3>
            <p class="cap">Cursos, capacitaciones, descargables y gift cards no cuentan acá.</p>
            ${barsList(byStaff, { go: (k) => `goMovStaff('${k}')` })}
          </div>` : ''}
        </div>

        ${bySed.length > 1 ? `<div class="sec"><div class="card">
          <h3>${dl} por sucursal</h3>
          <p class="cap">Lo que se vende online no pasa por ninguna sucursal.</p>
          ${barsList(bySed, { labelOf: (k) => k })}
        </div></div>` : ''}


`;
      }

      /* ---------------- POR COBRAR ----------------
         Sin fechas de vencimiento ni seguimiento: una lista de lo que falta entrar, nada más. */
      function vCobranzas() {
        const act = activeRecv();
        const total = act.reduce((s, r) => s + saldoOf(r), 0);
        // Lo que se debe por un turno que todavía no pasó no es una cobranza a perseguir:
        // entra solo el día que el cliente viene. Separarlo dice cuánto hay que reclamar.
        const futuros = act.filter((r) => r.origin === 'servicio' && r.date > TODAY);
        const sumFut = futuros.reduce((s2, r) => s2 + saldoOf(r), 0);
        const filtered = filterRecv();
        return `
        <div class="grid g2 sec">
          ${statTile({ k: 'Total por cobrar', v: $$(total), s: sumFut
            ? `<b>${$$(total - sumFut)}</b> de trabajo ya entregado`
            : `${act.length} cobrable${act.length === 1 ? '' : 's'} abierto${act.length === 1 ? '' : 's'}`, ic: ICO.doc, bg: '#eef6ff', fg: '#005cd4' })}
          ${statTile({ k: 'De turnos por venir', v: $$(sumFut), s: futuros.length
            ? `<b>${futuros.length}</b> ${futuros.length === 1 ? Z().turno + ' agendado' : Z().turnos + ' agendados'} · se cobra el día`
            : `Ningún ${Z().turno} agendado con saldo`, ic: ICO.clock, bg: '#e8fbf5', fg: '#07806a' })}
        </div>

        <div class="sec">
          <div class="card tcard">
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                ${thS('buscarRecv', Z().Cliente, 'pl')}
                ${thF('origin', 'Tipo')}
                ${thF('recvConcepto', 'Concepto', 'cw')}
                ${S.persona === 'venue' ? thF('staff', 'Profesional') : ''}
                <th class="r">Total</th><th class="r">Cobrado</th><th class="r">Falta cobrar</th>
                <th style="padding-right:18px"></th>
              </tr></thead>
              <tbody>${filtered.length ? filtered.map(rowRecv).join('') : `<tr><td colspan="${S.persona === 'venue' ? 8 : 7}"><div class="empty"><b>Nada por acá</b>No hay cobrables que cumplan con este filtro.</div></td></tr>`}</tbody>
            </table></div>
          </div>
        </div>

`;
      }

      // Sin recorte por período: el saldo abierto es un balance, no un flujo del rango.
      function filterRecv() {
        let rows = activeRecv();
        rows = rows.filter((r) => inSel(S.cobF.origin, r.origin));
        if (S.persona === 'venue') rows = rows.filter((r) => inSel(S.staff, r.staff));
        rows = rows.filter((r) => inSel(S.cobF.concepto, r.concept));
        const q = S.cobF.q.trim().toLowerCase();
        if (q) rows = rows.filter((r) => r.client.toLowerCase().includes(q));
        return rows.sort((a, b) => saldoOf(b) - saldoOf(a));
      }

      function rowRecv(r) {
        return `<tr class="hoverable" onclick="openRecv('${r.id}')">
