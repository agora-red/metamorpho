      // Qué campos usa cada vista, y qué número se resume abajo del panel.
      function panelSpec() {
        const ms = scope();
        const r = RANGES[S.range];
        // El Resumen es la foto del negocio entero: recortarlo por profesional o sucursal
        // lo convierte en otra cosa. Esos cortes viven en las secciones que los usan.
        if (S.tab === 'resumen') return { f: ['rango'] };
        if (S.tab === 'movimientos') {
          const rows = filterMovs();
          return {
            f: ['buscarMov', 'rango', 'asset', 'method', 'staff'],
            cols: ['asset', 'method', 'staff'],
            search: 'buscarMov',
          };
        }
        // Por cobrar no filtra por período: se muestran todos los saldos abiertos. Lo que
        // queda para filtrar vive en la tabla (buscador y cabeceras), así que no hay panel.
        if (S.tab === 'cobranzas') return null;
        // El período arriba; tipo, profesional y estado viven en la cabecera de la tabla.
        if (S.tab === 'comisiones') return {
          f: ['rango', 'staff', 'comTipo', 'comEstado', 'buscarCom'],
          cols: ['staff', 'comTipo', 'comEstado'],
          search: 'buscarCom',
        };
        if (S.tab === 'cobros') return {
          f: ['rango', 'staff', 'buscarCob'],
          cols: ['staff'],
          search: 'buscarCob',
        };
        // Un gasto del negocio no es de nadie en particular: filtrar por profesional acá
        // no significa nada (decisión JP, 25/ago).
        if (S.tab === 'gastos') return { f: ['rango'] };
        // El resultado del negocio no se recorta por profesional: un gasto de alquiler no es
        // de nadie, así que filtrar dejaría un neto que no cierra.
        if (S.tab === 'resultado') return { f: ['rango'] };
        return null; // Caja no filtra: el arqueo del día es un estado, no un período
      }

      // Un campo abierto por vez. `S.open` guarda la clave; el popover se expande debajo del
      // campo (no flota) para que funcione igual en el panel y adentro del modal full screen.
      function labelOf(d) {
        if (d.type === 'text') return d.v;
        if (!d.multi) { const hit = d.o.find(([v]) => v === d.v); return hit ? hit[1] : d.v; }
        if (d.v === 'all' || !d.v.length) return d.allLabel;
        if (d.v.length === 1) { const hit = d.o.find(([v]) => v === d.v[0]); return hit ? hit[1] : d.v[0]; }
        return `${d.v.length} seleccionados`;
      }

      // Barra de la tabla: el buscador es una acción de la tabla, como los filtros de
      // columna, no un campo apartado en el panel. Mismo componente en desktop y mobile.
      function tbar(k, resumen) {
        const d = fieldDefs()[k];
        if (!d) return '';
        return `<div class="tbar">
          <div class="tsearch ${d.v ? 'on' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input type="text" data-tsearch="${k}" value="${esc(d.v)}" placeholder="${esc(d.ph || 'Buscar')}" oninput="setFiltro('${k}', this.value)" />
            ${d.v ? `<button class="tx" title="Limpiar" onclick="setFiltro('${k}', '')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>` : ''}
          </div>
          ${resumen ? `<span class="tcount">${resumen}</span>` : ''}
        </div>`;
      }

      function fieldsHTML(scope2, lista) {
        const D = fieldDefs(), spec = panelSpec();
        if (!spec) return '';
        if (lista) return lista.map((k) => campoHTML(k, D[k], scope2)).join('');
        // En desktop los filtros de columna viven en la cabecera; en mobile la tabla scrollea
        // de costado, así que se quedan en el modal. El buscador nunca está acá: es una
        // acción de la tabla, en las dos pantallas.
        const fuera = (scope2 === 'd' ? (spec.cols || []) : []).concat(spec.search || []);
        const campos = spec.f.filter((k) => !fuera.includes(k));
        return campos.map((k) => campoHTML(k, D[k], scope2)).join('');
      }

      function campoHTML(k, d, scope2) {
        {
          if (!d) return '';
          const dot = d.act ? '<i></i>' : '';
          if (d.type === 'text') {
            return `<div class="ffield"><label>${dot}${d.l}</label>
              <input type="text" value="${esc(d.v)}" placeholder="${esc(d.ph || '')}" oninput="setFiltro('${k}', this.value)" /></div>`;
          }
          const abierto = S.open === scope2 + ':' + k;
          const opts = (d.multi ? [['all', d.allLabel], ...d.o] : d.o).map(([v, l]) => {
            const on = d.multi ? (v === 'all' ? d.v === 'all' : inSel(d.v, v) && d.v !== 'all') : d.v === v;
            return `<button class="fopt ${on ? 'on' : ''}" onclick="pickFiltro('${k}', ${jsStr(v)}, ${!!d.multi})">
              <span>${esc(l)}</span>${on ? ICO.check : ''}</button>`;
          }).join('');
          return `<div class="ffield ${abierto ? 'open' : ''}">
            <button class="fhead" onclick="abrirCampo('${scope2}:${k}')">
              <label>${dot}${d.l}</label>
              <div class="fval">${esc(labelOf(d))}</div>
              ${d.hint ? `<div class="hintline">${d.hint}</div>` : ''}
              <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
            </button>
            ${abierto ? `<div class="fdrop">${opts}${d.multi ? `<div class="fdrop-f"><button class="btn pri sm" onclick="abrirCampo(null)">Aplicar</button></div>` : ''}</div>` : ''}
          </div>`;
        }
      }

      function abrirCampo(key) { S.open = S.open === key ? null : key; render(); }

      function pickFiltro(k, v, multi) {
        const d = fieldDefs()[k];
        if (!d) return;
        if (!multi) { d.set(v); S.open = null; render(); return; }
        if (v === 'all') { d.set('all'); render(); return; }
        const cur = d.v === 'all' ? [] : d.v.slice();
        const i2 = cur.indexOf(v);
        if (i2 >= 0) cur.splice(i2, 1); else cur.push(v);
        d.set(cur.length ? cur : 'all');
        render();
      }

      function setFiltro(k, v) {
        const d = fieldDefs()[k];
        if (!d) return;
        const foco = document.activeElement;
        const eraTexto = d.type === 'text';
        d.set(v);
        render();
        if (eraTexto && foco) {
          const nuevo = document.querySelector(`[data-tsearch="${k}"]`);
          if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
        }
      }

      function filtrosActivos() {
        const D = fieldDefs(), spec = panelSpec();
        return spec ? spec.f.filter((k) => D[k] && D[k].act).length : 0;
      }
      function limpiarFiltros() {
        S.range = 'd30'; S.staff = 'all'; S.open = null;
        S.movF = { q: '', method: 'all', asset: 'all' }; S.cobQ = '';
        S.comF = { q: '', tipo: 'all', estado: 'all' };
        S.cobF = { q: '', origin: 'all' };
        S.movPage = 1; render();
      }
      function renderPanel() {
        const spec = panelSpec();
        // Caja y Por cobrar no se filtran por período: son estados, no flujos del rango.
        // Comisiones lo lleva adentro de su columna izquierda, no en la barra de arriba.
        if (!spec || !spec.f.includes('rango') || S.tab === 'comisiones') { el('fbar').innerHTML = ''; return; }
        const otros = spec.f.filter((k) => k !== 'rango'
          && !(spec.cols || []).includes(k) && k !== (spec.search || ''));
        el('fbar').innerHTML = dateBar() + (otros.length ? `<div class="fbx">${fieldsHTML('d', otros)}</div>` : '');
      }

      function sheet(o) {
        el('sheet').innerHTML = `
          <div class="sh"><h3>${o.title}</h3>
            <button class="x" onclick="closeAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <div class="sb">${o.body}</div>
          <div class="sf">${o.ok
            ? `<button class="btn pri" id="sheetOk" style="flex:1;justify-content:center">${o.ok}</button>
               <button class="btn ghost" onclick="closeAll()">Cancelar</button>`
            : `<button class="btn" style="flex:1;justify-content:center" onclick="closeAll()">Cerrar</button>`}</div>`;
        el('sheet').classList.add('on'); el('scrim').classList.add('on');
        if (o.ok) el('sheetOk').onclick = () => { if (o.onOk() !== false) { closeAll(); render(); } };
        if (o.after) o.after();
      }
      function closeAll() {
        el('sheet').classList.remove('on'); el('drawer').classList.remove('on'); el('scrim').classList.remove('on');
      }
      let toastT;
      function toast(msg) {
        el('toast').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>${esc(msg)}`;
        el('toast').classList.add('on');
        clearTimeout(toastT); toastT = setTimeout(() => el('toast').classList.remove('on'), 3200);
      }

      /* ---- Navegación / drill-down ---- */
      function go(tab) { S.container = 'finanzas'; S.tab = tab; render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
      const goTab = go;
      function goCont(c) { S.container = c; render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
      function goMov(preset) {
        S.movF = Object.assign({ q: '', method: 'all', asset: 'all' }, preset);
        S.movPage = 1; go('movimientos');
      }
      function goMovStaff(k) { S.staff = [k]; goMov({}); }
      // Toggle de las 3 tablas de distribución del Resumen: todo lo vendido vs solo lo cobrado.
      function setDist(v) { S.dist = v; render(); }
      function sortMov(k) { if (S.movSort.k === k) S.movSort.dir *= -1; else S.movSort = { k, dir: k === 'amount' || k === 'date' ? -1 : 1 }; render(); }

      /* =====================================================================
         8 · RENDER
      ===================================================================== */
      let _rz;
      window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(renderHead, 120); });
      function render() {
        renderRail();
        renderHead();

        // Tabs — solo Finanzas las usa; los otros dos containers son mockups de un nivel.
        el('tabs').classList.toggle('hide', S.container !== 'finanzas');
        if (S.container === 'finanzas') {
          el('tabs').innerHTML = tabsVisibles().map((t) => `<button class="${S.tab === t.k ? 'on' : ''}" onclick="go('${t.k}')">${t.l}</button>`).join('');
        }

        const V = { resumen: vResumen, cobranzas: vCobranzas, movimientos: vMovimientos, cobros: vCobros,
          gastos: vGastos, resultado: vResultado, comisiones: vComisiones, arqueo: vArqueo };
        el('view').innerHTML =
          S.container === 'actividad' ? vActividad() :
          S.container === 'analitica' ? vAnalitica() :
          V[S.tab]();

        renderPanel();
        bindTips();
        marcarScrolls();
      }

      /* ---- Rail: la navegación real de Flash con la propuesta aplicada ---- */
      const RAIL_IC = {
        inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
        pagina: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
        agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
        finanzas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/></svg>',
        catalogo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h16l-1.4 12H5.4z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
        negocio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10M9 20V4M15 20v-7M21 20V7"/></svg>',
        equipo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.4 3.2-5.2 6.5-5.2s5.9 1.8 6.5 5.2"/><path d="M17 9a2.8 2.8 0 1 0 0-.2M18 14.6c2 .7 3.2 2.4 3.5 5.2"/></svg>',
        medios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="7.5" width="18" height="12" rx="2.5"/></svg>',
      };
      function renderRail() {
        const fin = S.container === 'finanzas';
        const kid = (label, on, onclick, moved) =>
          `<a href="#" class="${on ? 'on' : ''}" onclick="${onclick};return false"><i></i>${label}${moved ? `<span class="moved">${moved}</span>` : ''}</a>`;
        el('rail').innerHTML = `
          <div class="brand"><img src="assets/agora-horizontal.png" alt="Ágora" /></div>
          <a href="#" onclick="return false">${RAIL_IC.inicio}Inicio</a>
          <a href="#" onclick="return false">${RAIL_IC.pagina}Mi página</a>
          <a href="#" onclick="return false">${RAIL_IC.agenda}Agenda</a>
          <a href="#" class="${fin ? 'on' : ''}" onclick="goCont('finanzas');return false">${RAIL_IC.finanzas}Finanzas<span class="car">▾</span></a>
          <div class="kids">
            ${tabsVisibles().map((t) => kid(t.l, fin && S.tab === t.k, `goTab('${t.k}')`, t.k === 'movimientos' ? 'movida' : t.k === 'arqueo' ? 'movida' : '')).join('')}
          </div>
          <a href="#" onclick="return false">${RAIL_IC.catalogo}Catálogo<span class="car">▾</span></a>
          <a href="#" onclick="return false">${RAIL_IC.negocio}Mi negocio<span class="car">▾</span></a>
          <div class="kids">
            ${kid('Actividad', S.container === 'actividad', `goCont('actividad')`, 'cambia')}
            ${kid('Clientes', false, `return false`)}
            ${kid('Analítica', S.container === 'analitica', `goCont('analitica')`, 'cambia')}
            ${kid('Resúmenes', false, `return false`)}
          </div>
          <a href="#" onclick="return false">${RAIL_IC.equipo}Equipo<span class="car">▾</span></a>
          <a href="#" onclick="return false">${RAIL_IC.medios}Medios de cobro</a>`;
      }

      /* ---- Header del container activo ---- */
      // Acciones por vista: exportar no aplica en Caja ni en Conceptos, y registrar
      // cobro/gasto no aplica en Resumen ni en Conceptos (decisión JP, 20/ago).
      const BTN_EXPORT = `<button class="btn ghost" onclick="toast('Exportado: 1 archivo .csv con lo que estás viendo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Exportar</button>`;
      const ic = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const I_PLUS = ic('<path d="M12 5v14M5 12h14"/>');
      const I_UP = ic('<path d="M12 19V5M6 11l6-6 6 6"/>');
      const I_DOWN = ic('<path d="M12 5v14M6 13l6 6 6-6"/>');
      const I_OUT = ic('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>');
      const I_TEAM = ic('<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>');

      // Registrar venta y Registrar cobro NO son la misma acción: la primera da de alta una venta,
      // la segunda cierra un saldo que ya existe. Por eso cada una vive en una sección distinta.
      const BTN_VENTA = `<button class="btn pri" onclick="openVenta()">${I_PLUS}Registrar venta</button>`;
      const BTN_COBRO = `<button class="btn pri" onclick="openCobrar()">${I_PLUS}Registrar cobro</button>`;
      // Cada una en su sección: el ingreso en Cobros, el gasto en Gastos.
      const BTN_INGRESO = `<button class="btn pri" onclick="openIngreso()">${I_UP}Registrar ingreso</button>`;
      const BTN_GASTO = `<button class="btn pri neg" onclick="openGasto()">${I_DOWN}Registrar gasto</button>`;
      const BTN_LIQUIDAR = `<button class="btn pri" onclick="openLiquidar(null)">${I_TEAM}Registrar pago</button>`;
      const BTN_AJUSTE = `<button class="btn" onclick="openAjuste()">${I_PLUS}Ajuste manual</button>`;
      // Solo en Caja: son las únicas dos que mueven el cajón sin tocar el resultado.
      const BTN_REPO = `<button class="btn" onclick="openMovCaja('in')">${I_PLUS}Ingreso de efectivo</button>`;
      const BTN_RETIRO = `<button class="btn neg" onclick="openMovCaja('out')">${I_OUT}Retiro de efectivo</button>`;

      // Acciones que CREAN algo: en desktop van en el header, en mobile en la barra inferior.
      const ACTS = {
        resumen: () => '',
        movimientos: () => BTN_VENTA,
        cobranzas: () => BTN_COBRO,
        cobros: () => BTN_INGRESO + BTN_COBRO,
        gastos: () => BTN_GASTO,
        resultado: () => '',
        comisiones: () => BTN_AJUSTE + BTN_LIQUIDAR,
        // Con la caja cerrada no hay cajón que mover: abrir se hace desde la vista.
        arqueo: () => (CAJA_ABIERTA ? BTN_REPO + BTN_RETIRO : ''),
      };
      // Exportar no crea nada: se queda arriba siempre.
      const CON_EXPORT = ['movimientos', 'cobros', 'gastos'];
      const TITLES = {
        comisiones: ['Comisiones del ', 'equipo'], resumen: ['Tu ', 'resumen'], movimientos: ['Todas las ', 'ventas'], cobranzas: ['Lo que falta ', 'cobrar'],
        cobros: ['Todo lo ', 'cobrado'], gastos: ['Todos los ', 'gastos'], resultado: ['Tu ', 'resultado'],
        arqueo: ['Cierre de ', 'caja'],
      };

      function renderHead() {
        const fin = S.container === 'finanzas';
        const t = fin ? (TITLES[S.tab] || ['Tu ', 'resumen']) : (S.container === 'actividad' ? ['Toda la ', 'actividad'] : ['Tu ', 'analítica']);
        el('mKick').textContent = fin ? 'Finanzas' : 'Mi negocio';
        el('mTitle').innerHTML = `${t[0]}<strong>${t[1]}</strong><span class="dot">.</span>`;
        const filtros = '';
        const acciones = fin ? (ACTS[S.tab] || (() => ''))() : '';
        const exportar = fin ? (CON_EXPORT.includes(S.tab) ? BTN_EXPORT : '') : BTN_EXPORT;
        const chico = window.innerWidth <= 1100;
        el('mActs').innerHTML = filtros + exportar + (chico ? '' : acciones);
        el('mbar').innerHTML = chico ? acciones : '';
        el('mbar').classList.toggle('on', chico && !!acciones);
        document.body.classList.toggle('conbar', chico && !!acciones);
      }

      /* ---- Tooltip de charts ---- */
      function tipOn(e, txt) { const t = el('tip'); t.textContent = txt; t.classList.add('on'); tipMove(e); }
      function tipMove(e) {
        const t = el('tip'), w = t.offsetWidth, h = t.offsetHeight;
        t.style.left = Math.min(window.innerWidth - w - 12, Math.max(12, e.clientX - w / 2)) + 'px';
        t.style.top = Math.max(12, e.clientY - h - 14) + 'px';
      }
      function tipOff() { el('tip').classList.remove('on'); }

      function bindTips() {
        const tip = el('tip');
        document.querySelectorAll('.chart rect.bar').forEach((b) => {
          b.addEventListener('mousemove', (e) => {
            tip.innerHTML = b.dataset.t;
            tip.classList.add('on');
            const w = tip.offsetWidth, h = tip.offsetHeight;
            tip.style.left = Math.min(window.innerWidth - w - 12, Math.max(12, e.clientX - w / 2)) + 'px';
            tip.style.top = Math.max(12, e.clientY - h - 14) + 'px';
          });
          b.addEventListener('mouseleave', () => tip.classList.remove('on'));
        });
      }

      // El rubro y la persona ya no tienen switch en pantalla: se fijan acá.
      // setRubro('salud') / setPersona('solo') desde la consola siguen funcionando.
      function setRubro(v) { applyVertical(v); S.staff = 'all'; render(); }
      function setPersona(v) { S.persona = v; S.staff = 'all'; render(); }
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (DP) { DP = false; render(); } closeAll(); } });

      applyVertical('beauty');
      render();
    </script>
  </body>
</html>
