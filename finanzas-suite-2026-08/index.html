          <td class="nw" style="padding-left:18px"><div class="who"><div class="t"><b>${esc(r.client)}</b><span class="mono">${r.phone}</span></div></div></td>
          <td><span class="chip mute">${ORIGIN_LABEL[r.origin]}</span></td>
          <td class="cw" style="font-weight:600">${esc(r.concept)}</td>
          ${S.persona === 'venue' ? `<td style="font-size:12.5px;color:${r.staff ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${r.staff || '—'}</td>` : ''}
          <td class="r amt" style="font-weight:600;color:var(--f-ink-mid)">${$$(r.total)}</td>
          <td class="r amt" style="font-weight:600;color:var(--f-ink-mid)">${r.paid ? $$(r.paid) : '—'}</td>
          <td class="r amt">${$$(saldoOf(r))}</td>
          <td style="padding-right:18px" onclick="event.stopPropagation()">
            <div style="display:flex;gap:6px;justify-content:flex-end">
              <button class="btn sm wa" onclick="event.stopPropagation();openRecordatorio('${r.id}')" title="Recordar por WhatsApp" aria-label="Recordar por WhatsApp">${ICO.wa}</button>
              <button class="btn sm" onclick="openCobrar('${r.id}')">Registrar cobro</button>
            </div></td></tr>`;
      }

      /* ---------------- MOVIMIENTOS ---------------- */
      function filterMovs() {
        const f = S.movF;
        // Ventas es la lista de lo que se vendió y cobró, más lo que se ató a esas ventas
        // (devoluciones). Los gastos y las liquidaciones al equipo NO entran acá: viven en
        // la sección Gastos, que es su lugar (decisión JP, 20/ago).
        // Un ingreso manual entra al resultado pero no es una venta: no va en esta lista.
        let rows = scope().filter((m) => m.dir === 'in' || m.asset === 'refund');
        rows = rows.filter((m) => inSel(f.method, m.method));
        rows = rows.filter((m) => inSel(f.asset, m.asset));
        const q = f.q.trim().toLowerCase();
        rows = rows.filter((m) => inSel(f.concepto, m.concept));
        // El buscador es SOLO por cliente. Concepto tiene su filtro de columna, el
        // profesional el suyo, y el número interno no es algo que nadie busque (JP, 26/ago).
        if (q) rows = rows.filter((m) => (m.client || '').toLowerCase().includes(q));
        const k = S.movSort.k, dir = S.movSort.dir;
        rows.sort((a, b) => {
          let va = a[k], vb = b[k];
          if (k === 'date') { va = a.date + a.time; vb = b.date + b.time; }
          if (k === 'asset') { va = (ASSETS[a.asset] || {}).label || a.asset; vb = (ASSETS[b.asset] || {}).label || b.asset; }
          if (k === 'client') { va = a.client || 'zzz'; vb = b.client || 'zzz'; }
          if (k === 'amount') return (va - vb) * dir;
          return String(va || '').localeCompare(String(vb || '')) * dir;
        });
        return rows;
      }

      function vMovimientos() {
        const rows = filterMovs();
        const shown = rows.slice(0, S.movPage * 25);
        const tin = sum(rows.filter((m) => m.dir === 'in' && m.st === 'ok'));
        const tout = sum(rows.filter((m) => m.dir === 'out'));
        const ventas = rows.filter((m) => m.dir === 'in').length;
        const th = (k, l, cls) => `<th class="sortable ${cls || ''} ${S.movSort.k === k ? 'act' : ''}" onclick="sortMov('${k}')">${l} <span class="ar">${S.movSort.k === k ? (S.movSort.dir === 1 ? '↑' : '↓') : '↕'}</span></th>`;

        return `
        <div class="sec">
          <div class="hero">
            <span class="n">${$$(tin - tout)}</span>
            <span class="d">en <b>${ventas}</b> venta${ventas === 1 ? '' : 's'}${tout ? ` · <b>${$$(tout)}</b> devueltos` : ''}</span>
          </div>
          <p class="lede">Cada venta cobrada, una por una — las que entran solas y las que registrás a mano.</p>
          <div class="card tcard">
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                ${th('date', 'Fecha', '')}
                ${thF('asset', 'Tipo')}
                ${thF('concepto', 'Concepto', 'cw')}
                ${thS('buscarMov', Z().Cliente, 'nw')}
                ${S.persona === 'venue' ? thF('staff', 'Profesional') : ''}
                ${thF('method', 'Medio')}
                <th>Cuenta</th>
                ${th('amount', 'Monto', 'r')}
                <th class="r" style="padding-right:18px">Cobro pendiente</th>
              </tr></thead>
              <tbody>${shown.length ? shown.map(rowMov).join('') : `<tr><td colspan="${S.persona === 'venue' ? 9 : 8}"><div class="empty"><b>Sin ventas</b>Probá ampliar el rango o limpiar los filtros.</div></td></tr>`}</tbody>
              <tfoot><tr>
                <td colspan="${S.persona === 'venue' ? 8 : 7}" style="padding-left:18px">
                  ${rows.length} venta${rows.length === 1 ? '' : 's'} · mostrando ${shown.length}
                </td>
                <td class="r amt" style="padding-right:18px;color:var(--f-warning-text)">${(() => { const t = shown.reduce((s2, m) => s2 + pendDe(m), 0); return t ? $$(t) : '—'; })()}</td>
              </tr></tfoot>
            </table>${masFilas(shown.length, rows.length, 'movPage')}</div>
          </div>
        </div>`;
      }

      function rowMov(m) {
        const meth = METHODS[m.method];
        const label = m.dir === 'out' ? (m.asset === 'gasto' ? catLabel(m.cat) : 'Devolución') : ASSETS[m.asset] ? ASSETS[m.asset].label : m.asset;
        const acc = { caja: 'Caja', banco: 'Tu cuenta', mp: mpTag() }[m.account];
        const pend = pendDe(m);
        return `<tr class="hoverable" onclick="openMov(${m.id})">
          <td><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
          <td><span class="chip ${m.dir === 'out' ? 'bad' : 'mute'}">${esc(label || '—')}</span></td>
          <td class="cw" style="font-weight:600;font-size:13px;color:var(--f-ink)">${esc(m.concept)}</td>
          <td class="nw" style="font-size:12.5px;color:${m.client ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.client ? esc(m.client) : '—'}</td>
          ${S.persona === 'venue' ? `<td style="font-weight:600;color:${m.staff || m.staffPay ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.staff || m.staffPay || '—'}</td>` : ''}
          <td>${methodTag(m.method)}</td>
          <td style="font-size:12.5px;white-space:nowrap">${m.dir === 'out' ? 'Sale de ' + acc : acc}</td>
          <td class="r amt ${m.dir === 'out' ? 'out' : ''}">${m.dir === 'out' ? '−' : '+'}${$$(m.amount)}</td>
          <td class="r amt" style="padding-right:18px;color:${pend ? 'var(--f-warning-text)' : 'var(--f-ink-mid)'}">${pend ? $$(pend) : '—'}</td></tr>`;
      }

      /* ---------------- COBROS ---------------- */
      function vCobros() {
        let body = '';

          const q = S.cobQ.trim().toLowerCase();
          const ms = income(scope())
            .filter((m) => inSel(S.cobMethod, m.method))
            .filter((m) => inSel(S.cobConcepto, m.concept))
            // Buscador solo por cliente: concepto y profesional tienen filtro propio.
            .filter((m) => !q || (m.client || '').toLowerCase().includes(q))
            .slice().sort((a, b) => (a.date === b.date ? b.id - a.id : a.date < b.date ? 1 : -1));
          const refs = refunds(scope()).filter((m) => inSel(S.cobMethod, m.method));
          const shown = ms.slice(0, S.cobPage * 25);
          const venue = S.persona === 'venue';
          const cols = venue ? 9 : 8;
          const ACC = { caja: 'Caja', banco: 'Tu cuenta', mp: mpTag('Billetera') };
          body = `
          <div class="hero">
            <span class="n">${$$(sum(ms))}</span>
            <span class="d">en <b>${ms.length}</b> cobro${ms.length === 1 ? '' : 's'}${refs.length ? ` · <b>${$$(sum(refs))}</b> devueltos` : ''}</span>
          </div>
          <div class="card tcard">
            <div class="tblwrap"><table class="tbl">
              <thead><tr>
                <th class="nw" style="padding-left:18px">Fecha</th>${thF('cobConcepto', 'Concepto', 'cw')}${thS('buscarCob', Z().Cliente, 'nw')}${thF('asset', 'Tipo')}
                ${venue ? thF('staff', 'Profesional') : ''}
                ${thF('cobMethod', 'Medio')}<th>Entra a</th><th title="Automático: lo capturó Ágora. A mano: lo cargaste vos.">Cómo se registró</th>
                <th class="r" style="padding-right:18px">Monto</th>
              </tr></thead>
              <tbody>${shown.map((m) => `<tr class="hoverable" onclick="openMov(${m.id})">
                <td style="padding-left:18px"><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
                <td class="cw" style="font-weight:600">${esc(m.concept)}</td>
                <td class="nw" style="font-size:12.5px;color:${m.client ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.client ? esc(m.client) : '—'}</td>
                <td><span class="chip mute">${(ASSETS[m.asset] || { label: '—' }).label}</span></td>
                ${venue ? `<td style="font-size:12.5px;color:${m.staff ? 'var(--f-ink)' : 'var(--f-ink-mid)'}">${m.staff || '—'}</td>` : ''}
                <td class="paycell" style="font-size:12.5px">${METHODS[m.method] ? (m.method === 'mp' ? mpTag() : `<span>${METHODS[m.method].label}</span>`) : '—'}</td>
                <td class="paycell" style="font-size:12.5px">${ACC[m.account] || '—'}</td>
                <td><span class="chip ${m.src === 'online' || m.method === 'mp' ? 'ok' : 'mute'}">${m.src === 'online' || m.method === 'mp' ? 'Automático' : 'A mano'}</span></td>
                <td class="r amt" style="padding-right:18px">${$$(m.amount)}</td></tr>`).join('') || `<tr><td colspan="${cols}"><div class="empty"><b>Sin cobros</b>No entró plata en este período.</div></td></tr>`}</tbody>
              ${shown.length ? `<tfoot><tr><td colspan="${cols - 1}" style="padding-left:18px">${shown.length < ms.length ? `${shown.length} de ${ms.length} cobros` : `${ms.length} cobro${ms.length === 1 ? '' : 's'}`}</td><td class="r">${$$(sum(shown))}</td></tr></tfoot>` : ''}
            </table>${masFilas(shown.length, ms.length, 'cobPage')}</div>
          </div>`;
        return `<div class="sec">
          <p class="lede">Una venta cobrada parcialmente suma la parte cobrada, y lo pendiente vive en <a href="#" onclick="go('cobranzas');return false">Por cobrar</a>.</p>
          ${body}</div>`;
      }

      /* ---------------- GASTOS ---------------- */
      function vGastos() {
        let body = '';

          const ms = expenses(scope()).filter((m) => inSel(S.gasConcepto, m.concept));
          const byCat = byKey(ms, 'cat');
          body = `
          <div class="hero">
            <span class="n">${$$(sum(ms))}</span>
            <span class="d">en <b>${ms.length}</b> gasto${ms.length === 1 ? '' : 's'}</span>
          </div>
          <div class="grid g2 top" style="margin-bottom:24px">
            <div class="card"><h3>Gastos por categoría</h3>
              <p class="cap">${RANGES[S.range].label}</p>
              <button class="btn sm cardact" onclick="openCats()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h9"/><circle cx="19" cy="18" r="2.4"/></svg>
                Categorías</button>
              ${byCat.length ? barsList(byCat, { labelOf: catLabel, go: () => '' }) : '<div class="empty">Sin gastos en el período</div>'}</div>
            <div class="card"><h3>De dónde sale la plata</h3><p class="cap">Distribución según origen de los pagos.</p>
              ${barsList(byKey(ms, 'account'), { prop: true, dot: true, colorOf: (k) => ({ caja: 'var(--m-ef)', banco: 'var(--m-tr)', mp: 'var(--m-mp)' }[k]), labelOf: (k) => ({ caja: 'Caja (efectivo)', banco: 'Tu cuenta', mp: 'Billetera Mercado Pago' }[k] || k), go: () => '' })}</div>
          </div>
          <div class="card tcard pt">
            <div class="tblwrap"><table class="tbl">
              <thead><tr><th class="nw" style="padding-left:18px">Fecha</th>${thF('gasConcepto', 'Concepto', 'cw')}<th>Categoría</th><th class="nw">Sale de</th><th class="r" style="padding-right:18px">Monto</th></tr></thead>
              <tbody>${ms.map((m) => `<tr class="hoverable" onclick="openMov(${m.id})">
                <td style="padding-left:18px"><div style="font-weight:600">${fD(m.date)}</div><div class="mono" style="font-size:11px;color:var(--f-ink-mid)">${m.time}</div></td>
                <td class="cw" style="font-weight:600">${esc(m.concept)}</td>
                <td><span class="chip ${esAuto(m.cat) ? 'sys' : 'mute'}">${esAuto(m.cat) ? CAT_ICO.bolt : ''}${catLabel(m.cat)}</span></td>
                <td style="font-size:12.5px">${{ caja: 'Caja (efectivo)', banco: 'Tu cuenta', mp: mpTag('Billetera') }[m.account]}</td>
                <td class="r amt out" style="padding-right:18px">−${$$(m.amount)}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty"><b>Sin gastos</b>No hay gastos registrados en este período.</div></td></tr>`}</tbody>
            </table></div>
          </div>`;
        return `<div class="sec">${body}</div>`;
      }

      /* ---------------- RESULTADO ---------------- */
      function vResultado() {
        // Un solo período, el elegido arriba: la aritmética se hace sobre el rango, sin
        // columnas por mes. Los egresos se abren en gastos y comisiones liquidadas, que son
        // las dos formas en que sale plata (las comisiones ya son un gasto de "sueldos":
        // acá se separan para verlas, no se suman dos veces).
        const ms = scope();
        const inc = income(ms), exp = expenses(ms), ref = refunds(ms);
        const cobrado = sum(inc), dev = sum(ref);
        const comis = sum(exp.filter((m) => m.staffPay));
        const otros = sum(exp.filter((m) => !m.staffPay));
        const egresos = comis + otros;
        const neto = cobrado - dev - egresos;
        const totalSale = egresos + dev;
        const escala = Math.max(1, cobrado, totalSale, Math.abs(neto));
        const wf = (n) => `${Math.max(1.5, (Math.abs(n) / escala) * 100).toFixed(2)}%`;
        // `sub` cuelga la fila de la de arriba (guía en L + número chico y en tinta media).
        // Antes era solo una sangría en el label: los números quedaban con el mismo peso que
        // el de Egresos y las tres filas se leían como hermanas.
        const fila = (lbl, val, o) => `<div class="r ${(o && o.cls) || ''} ${o && o.sub ? 'sub' : ''}">
          <span class="lbl">${lbl}</span>
          <span class="amt">${o && o.neg && val ? '−' : ''}${$$(val)}</span></div>`;

        const body = `
          <div class="sec" style="margin-bottom:24px">
            <div class="card result-card">
              <h3>Cómo se compone tu <strong>neto</strong></h3>
              <p class="cap">${RANGES[S.range].label} · ${fD(RANGES[S.range].from)} — ${fD(RANGES[S.range].to)}. Lo que entró menos lo que salió.</p>
              <div class="result-grid">
                <div class="waterfall" role="img" aria-label="Cobrado menos egresos da el neto del período">
                  <div class="wfcol in" style="--bottom:0%;--height:${wf(cobrado)}">
                    <span class="wfvalue">${$$(cobrado)}</span><span class="wfbar"></span><span class="wflabel">Cobrado</span>
                  </div>
                  <div class="wfcol out" style="--bottom:${neto > 0 ? wf(neto) : '0%'};--height:${wf(totalSale)}">
                    <span class="wfvalue">−${$$(totalSale)}</span><span class="wfbar"></span><span class="wflabel">Egresos</span>
                  </div>
                  <div class="wfcol net ${neto < 0 ? 'negative' : ''}" style="--bottom:0%;--height:${wf(neto)}">
                    <span class="wfvalue">${neto < 0 ? '−' : ''}${$$(Math.abs(neto))}</span><span class="wfbar"></span><span class="wflabel">Neto del período</span>
                  </div>
                </div>
                <div class="cascade">
                  ${fila('Cobrado', cobrado)}
                  ${dev ? fila('Devoluciones', dev, { cls: 'neg', neg: true }) : ''}
                  ${fila('Egresos', egresos, { cls: 'neg', neg: true })}
                  ${fila('Gastos', otros, { sub: true, neg: true })}
                  ${fila('Comisiones liquidadas', comis, { sub: true, neg: true })}
                  <div class="r total"><span class="lbl">Neto del período</span><span class="amt">${neto < 0 ? '−' : ''}${$$(Math.abs(neto))}</span></div>
                </div>
              </div>
            </div>
          </div>

`;

        return `<div class="sec">
          <div class="hero result-hero">
            <span class="q">¿Cuál fue mi resultado en este período?</span>
            <span class="n ${neto < 0 ? 'neg' : ''}">${neto < 0 ? '−' : ''}${$$(Math.abs(neto))}</span>
            <span class="d"><b>${$$(cobrado)}</b> cobrado − <b>${$$(totalSale)}</b> entre egresos y devoluciones</span>
          </div>
          <p class="lede"><b>Solo cuenta lo que efectivamente entró y salió</b> — no las ventas totales.</p>
          ${body}</div>`;
      }

      // isCost invierte el semáforo: en una fila de gasto o devolución, subir es malo.
      function deltaOf(vals, isCost) {
        if (vals.length < 2) return '';
        const a = vals[vals.length - 2], b = vals[vals.length - 1];
        if (!a) return '—';
        const d = Math.round(((b - a) / Math.abs(a)) * 100);
        const good = isCost ? d <= 0 : d >= 0;
        return `<span style="font-weight:700;color:${good ? 'var(--success-ink)' : 'var(--accent)'}">${d >= 0 ? '+' : ''}${d}%</span>`;
      }

      /* ---------------- ARQUEO ---------------- */
      // El total contado se carga a mano, como en producción. Se siembra la primera vez que
      // alguien lo necesita (Conceptos también lo usa para su ejemplo).
      let CONTADO = null;
      function countTotal() {
        if (CONTADO === null) CONTADO = arqueo().esperado - 3200;
        return CONTADO;
      }

      const UMBRAL = 2000; // diferencia máxima que se acepta sin motivo escrito

      // El panel de veredicto se re-renderiza solo (sin tocar el resto de la vista) mientras contás:
      // si re-renderizáramos todo en cada tecla, el input perdería el foco.
      function arqSideHTML() {
        const a = arqueo();
        const contado = countTotal();
        const dif = contado - a.esperado;
        const verdict = dif === 0 ? 'ok' : Math.abs(dif) <= UMBRAL ? 'warn' : 'bad';
        const prev = el('difWhy') ? el('difWhy').value : '';
        return `<div class="verdict ${verdict}">
            <div class="n">${dif === 0 ? 'Coincide' : dif > 0 ? 'Sobra' : 'Falta'}</div>
            <div class="v">${dif === 0 ? '$0' : (dif > 0 ? '+' : '−') + $$(Math.abs(dif))}</div>
            <div class="s">${dif === 0 ? 'La caja cierra exacta'
              : Math.abs(dif) <= UMBRAL ? 'Dentro del margen de $' + nf.format(UMBRAL)
              : dif > 0 ? 'Hay más de lo esperado' : 'Hay menos de lo esperado'}</div>
          </div>
          <div style="margin-top:18px">
            <div class="kv"><span class="k">Esperado</span><span class="v">${$$(a.esperado)}</span></div>
            <div class="kv"><span class="k">Contado</span><span class="v">${$$(contado)}</span></div>
          </div>
          ${Math.abs(dif) > UMBRAL ? `<div class="fld" style="margin-top:18px"><label>Motivo de la diferencia · obligatorio</label>
            <textarea rows="3" id="difWhy" placeholder="Ej: vuelto mal dado en el turno de las 17hs">${esc(prev)}</textarea></div>` : ''}
          <button class="btn pri" style="width:100%;justify-content:center;margin-top:18px" onclick="cerrarCaja(${dif})">Cerrar caja del día</button>
          <p style="font-size:11.5px;color:var(--f-ink-mid);text-align:center;margin:12px 0 0">El cierre guarda su propio snapshot. Si después corregís un movimiento, los totales del día se reacomodan pero este registro queda intacto.</p>`;
      }

      function histTabla(HIST) {
        return `<div class="card tcard pt">
          <div class="tblwrap"><table class="tbl">
            <thead><tr><th class="nw" style="padding-left:18px">Día</th><th class="nw">Horario</th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Diferencia</th><th style="padding-right:18px">Estado</th></tr></thead>
            <tbody>${HIST.length ? HIST.map((x) => {
              const d = x.cnt - x.exp;
              return `<tr>
                <td class="nw" style="padding-left:18px;font-weight:600;color:var(--f-ink)">${fDL(x.date)}</td>
                <td class="mono nw" style="font-size:11.5px;color:var(--f-ink-mid)">${x.from} – ${x.to}</td>
                <td class="r amt" style="font-weight:500;color:var(--f-ink-mid)">${$$(x.exp)}</td>
                <td class="r amt">${$$(x.cnt)}</td>
                <td class="r amt" style="color:${d === 0 ? 'var(--f-ink-mid)' : d > 0 ? 'var(--f-warning-text)' : 'var(--f-coral-text)'}">${d === 0 ? '—' : (d > 0 ? '+' : '−') + $$(Math.abs(d))}</td>
                <td style="padding-right:18px">${d === 0 ? `<span class="chip ok">${ICO.check} Coincide</span>` : `<span class="chip ${d > 0 ? 'pend' : 'bad'}" title="${esc(x.why || '')}">${d > 0 ? 'Sobró' : 'Faltó'} · con motivo</span>`}</td></tr>`;
            }).join('') : `<tr><td colspan="6"><div class="empty"><b>Sin cierres en el período</b>Todavía no cerraste ninguna caja.</div></td></tr>`}</tbody>
          </table></div>
        </div>`;
      }

      function vArqueo() {
        const a = arqueo();
        const contado = countTotal();
        const HIST = sessionsIn({ from: '2026-01-01', to: TODAY });

        if (!CAJA_ABIERTA) return `
        <div class="sec">
          <p class="lede">Abrís la caja al empezar el día, se van registrando los cobros en efectivo, y al cerrar contás lo que hay. Solo se arquea el efectivo: lo demás no pasa por la caja.</p>
        </div>

        <div class="sec"><div class="card" style="text-align:center;padding:40px 26px">
          <div class="ico" style="background:var(--f-paper);color:var(--f-ink-mid);width:52px;height:52px;margin:0 auto 16px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px"><path d="M3 10 5.5 4h13L21 10"/><rect x="3" y="10" width="18" height="10" rx="2"/><path d="M10 14h4"/></svg>
          </div>
          <h2 style="font-size:22px;font-weight:300;margin:0 0 8px">La caja está <strong>cerrada</strong></h2>
          <p style="margin:0 auto 24px;max-width:52ch;color:var(--f-ink-mid);font-size:13.5px">
            Hasta que la abras, los cobros en efectivo se siguen registrando pero <b>no hay un total que contar al final del día</b>.
          </p>
          <div class="grid g3" style="text-align:left;max-width:760px;margin:0 auto 26px">
            ${[
              ['1', 'Declarás con cuánto arrancás', 'El fondo inicial: la plata que dejás en la caja para dar vuelto.'],
              ['2', 'Se registra todo el día', 'Cada cobro en efectivo suma, cada gasto pagado de la caja resta.'],
              ['3', 'Contás y cerrás', 'Cargás el total contado; si no coincide con lo esperado, explicás por qué.'],
            ].map(([n, t, d]) => `<div class="col" style="border:1px solid var(--f-hair);border-radius:var(--f-r-card);padding:18px">
              <div style="font-size:9.5px;font-weight:600;letter-spacing:.2em;color:var(--f-ink-mid);margin-bottom:8px">PASO ${n}</div>
              <b style="display:block;font-size:14px;margin-bottom:5px">${t}</b>
              <span style="font-size:12.5px;color:var(--f-ink-mid)">${d}</span></div>`).join('')}
          </div>
          <button class="btn pri" onclick="openAbrirCaja()">Abrir la caja del día</button>
          <p style="margin:14px auto 0;max-width:52ch;font-size:12px;color:var(--f-ink-mid)">
            Abrir la caja no mueve plata: solo deja registrado con cuánto empezás y desde qué momento se cuenta.
          </p>
        </div></div>

        ${HIST.length ? `<div class="sec">
          <h3 style="font-size:16px;font-weight:300;margin:0 0 4px">Cierres <strong>anteriores</strong></h3>
          <p class="cap" style="margin-bottom:14px">Todos los cierres, del más reciente al más viejo.</p>
          ${histTabla(HIST)}
        </div>` : ''}`;

        return `
        <div class="sec">
          <p class="lede">Abrís, contás y cerrás la caja del día. Solo se arquea el efectivo.</p>
        </div>

        <div class="arq sec">
          <div>
            <div class="card" style="margin-bottom:20px">
              <h3>1 · Lo que debería haber</h3>
              <div class="cascade">
                <div class="r"><span class="lbl">Fondo de apertura · ${fDL(TODAY)} ${APERTURA.hora}</span><span class="amt">${$$(OPENING)}</span></div>
                <div class="r"><span class="lbl">Cobros en efectivo <span class="chip mute">${a.today.filter((m) => m.dir === 'in' && m.method === 'ef' && m.st === 'ok').length}</span></span><span class="amt">+${$$(a.cobrosEf)}</span></div>
                ${extraIn() ? `<div class="r"><span class="lbl">Ingresos de efectivo cargados hoy</span><span class="amt">+${$$(extraIn())}</span></div>` : ''}
                <div class="r neg"><span class="lbl">Gastos pagados de la caja</span><span class="amt">−${$$(a.gastosEf)}</span></div>
                ${extraOut() ? `<div class="r neg"><span class="lbl">Retiros de efectivo</span><span class="amt">−${$$(extraOut())}</span></div>` : ''}
                <div class="r total"><span class="lbl">Efectivo esperado</span><span class="amt">${$$(a.esperado)}</span></div>
              </div>
              <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
                <span class="cap">¿Sacaste o ingresaste efectivo? Usá <b>Ingreso</b> o <b>Retiro de efectivo</b> arriba, sin tocar el resultado.</span>
                <button class="btn ghost sm" onclick="goMov({method:['ef']})">Ver los movimientos del día</button>
              </div>
            </div>

            <div class="card">
              <h3>2 · Contá el <strong>efectivo</strong></h3>
              <p class="cap">Contá lo que hay y cargá el total. La diferencia se calcula sola.</p>
              <div class="contado">
                <label for="contadoInput">Total contado</label>
                <div class="cwrap"><span>$</span><input id="contadoInput" type="text" inputmode="numeric" value="${nf.format(contado)}" oninput="setContado(this.value)" /></div>
              </div>
            </div>
          </div>

          <div class="side">
            <div class="card" style="margin-bottom:16px" id="arqSide">${arqSideHTML()}</div>

          </div>
        </div>

        <div class="sec">
          ${histTabla(HIST)}
        </div>`;
      }

      /* ---------------- COMISIONES ----------------
         Sección propia, con el patrón de producción: una tarjeta clickeable por profesional que
         filtra el listado de ventas que generan comisión. */
      function vComisiones() {
        const r = RANGES[S.range];
        const sel = S.staff;
        // scope() ya recorta por el profesional elegido, así que las tres cifras siguen el
        // filtro solas. Solo cuenta lo que tiene profesional asignado: el resto no devenga.
        const conPro = income(scope()).filter((m) => m.staff);
        const pendPro = pendRows().filter((m) => m.staff);
        const cobrado = sum(conPro);
        const vendido = cobrado + sum(pendPro);
        const devPeriodo = Math.round(conPro.reduce((s2, m) => s2 + comisionDe(m), 0));
        const nPro = sel === 'all' ? STAFF.length : sel.length;
        const curva = curvaComisiones(r, sel);
        const filas = STAFF.map((st) => {
          const ms = MOVS.filter((m) => m.staff === st && m.date >= r.from && m.date <= r.to && m.dir === 'in');
          return { st, cobrado: sum(ms), saldo: saldoComision(st) };
        }).sort((x, y) => y.saldo - x.saldo);
        const mov = filterComis();
        const shown = mov.slice(0, S.movPage * 25);

        return `
        <div class="colside sec">
          <aside class="cstats">
            ${dateBar()}
            ${statTile({ k: 'Comisiones del período', v: $$(devPeriodo), s: 'Sobre lo cobrado en el período', ic: ICO.up, bg: '#eef6ff', fg: '#005cd4' })}
            ${statTile({ k: 'Total cobrado', v: $$(cobrado), s: `${conPro.length} cobro${conPro.length === 1 ? '' : 's'} en el período`, ic: ICO.down, bg: '#e8fbf5', fg: '#07806a' })}
            ${statTile({ k: 'Ventas totales', v: $$(vendido), s: vendido - cobrado ? `<b>${$$(vendido - cobrado)}</b> todavía sin cobrar` : 'Todo cobrado', ic: ICO.bag, bg: '#eef0ff', fg: '#4338ca' })}
          </aside>
          <div class="cmain">

            <div class="sec">
              <h3 style="font-size:16px;font-weight:300;margin:0 0 12px">Pendiente de liquidación <strong>por profesional</strong></h3>
              <div class="pcards">
                ${filas.map((f) => { const on = sel !== 'all' && inSel(sel, f.st); return `<button class="pcard ${on ? 'on' : ''}" onclick="pickProfesional(${jsStr(f.st)})" title="Sumar o sacar del filtro">
                  ${on ? `<span class="ck">${ICO.check}</span>` : ''}
                  <div class="avp">${esc(iniciales(f.st))}</div>
                  <div class="t">
                    <div class="nm">${esc(f.st)}</div>
                    <div class="vv"${f.saldo < 0 ? ' style="color:var(--f-coral-text)"' : ''}>${$$(f.saldo)}</div>
                    <div class="ss">Cobros<b>${$$(f.cobrado)}</b></div>
                  </div>
                </button>`; }).join('')}
              </div>
            </div>

            ${curva ? `<div class="sec commission-chart"><div class="card">
              <h3>Comisiones <strong>pendientes de liquidar</strong></h3>
              <span class="cardnum">${$$(curva.saldo)}</span>
              ${curva.svg}
              <div class="chartlegend">
                <span><i style="background:var(--f-brand)"></i>Saldo pendiente</span>
                <span><i class="dot" style="background:var(--f-coral)"></i>Liquidación</span>
                <span class="last">${curva.pagos ? `${curva.pagos} ${curva.pagos === 1 ? 'liquidación' : 'liquidaciones'} por ${$$(curva.totalPagado)} en el período` : 'Sin liquidaciones en el período'}</span>
              </div>
            </div></div>` : ''}

            <div class="sec">
              <h3 style="font-size:16px;font-weight:300;margin:0 0 4px">Todo el <strong>movimiento</strong></h3>
              <p class="cap" style="margin-bottom:14px">Las ventas que devengan y los pagos que las cancelan, en una sola lista.</p>
              <div class="card tcard">
                <div class="tblwrap"><table class="tbl">
                  <thead><tr>
                    <th class="nw" style="padding-left:18px">Fecha</th>
                    ${thF('comTipo', 'Tipo')}
                    ${thF('staff', 'Profesional')}
                    ${thF('comConcepto', 'Concepto', 'cw')}
                    <th class="r">Cobro</th>
                    <th class="r" style="padding-right:18px">Comisión</th>
                  </tr></thead>
                  <tbody>${shown.length ? shown.map((x) => `<tr class="hoverable" onclick="openMov(${x.m.id})">
                    <td class="nw" style="padding-left:18px"><div style="font-weight:600;color:var(--f-ink)">${fD(x.m.date)}</div><div class="mono" style="font-size:11px">${x.m.time}</div></td>
                    <td><span class="chip ${x.tipo === 'venta' ? 'mute' : x.tipo === 'ajuste' ? 'pend' : 'brand'}">${TIPO_COM[x.tipo]}</span></td>
                    <td class="nw" style="font-weight:600">${esc(x.quien)}</td>
                    <td class="cw" style="font-weight:600">${esc(x.m.concept)}</td>
                    <td class="r amt" style="color:var(--f-ink-mid)">${x.tipo === 'venta' ? $$(x.m.amount) : '—'}</td>
                    <td class="r amt" style="padding-right:18px;color:${x.tipo === 'venta' ? 'var(--f-ink)' : 'var(--f-coral-text)'}">${x.tipo === 'venta' ? '' : '−'}${$$(x.comision)}</td></tr>`).join('')
                    : `<tr><td colspan="6"><div class="empty"><b>Sin movimientos</b>Probá ampliar el período o quitar los filtros.</div></td></tr>`}</tbody>
                  ${shown.length ? `<tfoot><tr><td colspan="6" style="padding-left:18px">${mov.length} movimiento${mov.length === 1 ? '' : 's'} · mostrando ${shown.length}</td></tr></tfoot>` : ''}
                </table>${masFilas(shown.length, mov.length, 'movPage')}</div>
              </div>
            </div>

            <div class="sec"><div class="note">
              La comisión se <b>devenga</b> cuando la venta se cobra.
              Los porcentajes de cada uno se configuran en
              <a href="#" onclick="toast('Se abriría la configuración de comisiones del equipo');return false">Equipo</a>.
            </div></div>

          </div>
        </div>`;
      }

      const TIPO_COM = { venta: 'Venta', pago: 'Pago', ajuste: 'Ajuste' };

      /* Una sola lista: las ventas que devengan, los pagos que las cancelan y los ajustes
         manuales. Las entries NO llevan estado de liquidación: no se liquida venta por venta
         sino contra el SALDO ACUMULADO del profesional, así que marcar una fila como
         "liquidada" sería inventar una relación que el negocio no tiene. */
      // Las entries SIN filtrar. Separado de filterComis para que el filtro de concepto
      // pueda leer de acá sus opciones sin morderse la cola.
      function comisEntries() {
        const r = RANGES[S.range];
        const out = [];
        MOVS.filter((m) => m.date >= r.from && m.date <= r.to).forEach((m) => {
          if (comisionDe(m) > 0) {
            out.push({ m, tipo: 'venta', quien: m.staff, comision: Math.round(comisionDe(m)) });
          } else if (m.staffPay) {
            out.push({ m, tipo: 'pago', quien: m.staffPay, comision: m.amount });
          }
        });
        AJUSTES.filter((a) => a.date >= r.from && a.date <= r.to).forEach((a) => {
          out.push({ m: { id: 0, date: a.date, time: '12:00', concept: a.motivo, amount: Math.abs(a.amount) },
            tipo: 'ajuste', quien: a.staff, comision: Math.abs(a.amount), signo: a.amount > 0 ? 1 : -1 });
        });
        return out;
      }

      function filterComis() {
        const out = comisEntries();
        const f = S.comF;
        let rows = out
          .filter((x) => inSel(S.staff, x.quien))
          .filter((x) => inSel(f.tipo, x.tipo))
          .filter((x) => inSel(f.concepto, x.m.concept));
        const q = f.q.trim().toLowerCase();
        // Buscador solo por profesional: el concepto tiene filtro de columna propio.
        if (q) rows = rows.filter((x) => (x.quien || '').toLowerCase().includes(q));
        return rows.sort((a, b) => (a.m.date === b.m.date ? (b.m.time || '').localeCompare(a.m.time || '') : b.m.date.localeCompare(a.m.date)));
      }

      // Click = sumar o sacar del filtro. Sin nadie elegido vuelve a "todo el equipo".
      function pickProfesional(st) {

      /* ---------------- ANALÍTICA (mockup del container ya limpio) ----------------

      function vAnalitica() {
        const ms = scope();
